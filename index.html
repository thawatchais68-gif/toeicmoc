towels ที่อยู่บนรถเข็นแต่ไม่ได้แขวนที่ระเบียง ส่วน D ผิดเพราะประตูเปิดอยู่"},{"scene":"A laboratory technician wearing gloves is using a pipette to transfer liquid into a row of test tubes.","svg":"lab","opts":["A technician is removing her gloves.","Some test tubes are being washed in a sink.","A technician is handling some laboratory equipment.","Some liquid has spilled on the floor."],"answer":2,"exp":"เจ้าหน้าที่แล็บกำลังใช้ปิเปตถ่ายของเหลว handling laboratory equipment เป็นการถอดความแบบกว้าง จึงตอบ C ตัวลวง A ใช้คำว่า gloves แต่เธอสวมอยู่ ไม่ได้ถอด (removing) และ B ผิดเพราะไม่มีการล้างหลอดทดลอง"},{"scene":"In a distribution center, a worker is scanning a barcode on a parcel with a handheld device. Other parcels are lined up on a conveyor beside him.","svg":"warehouse","opts":["Parcels are being wrapped in plastic.","A worker is scanning a package.","A worker is stacking boxes on a pallet.","The conveyor is being taken apart."],"answer":1,"exp":"พนักงานกำลังสแกนบาร์โค้ดบนพัสดุด้วยเครื่องมือถือ package = parcel จึงตอบ B ตัวลวง C ผิดเพราะพัสดุเรียงอยู่บนสายพาน ไม่ได้ถูกวางซ้อนบนพาเลท และ D ไม่มีการถอดสายพาน"}],"p2":[{"q":"What time does the inventory audit begin?","opts":["Right after the warehouse closes.","The auditors are from Lima.","Twice a year."],"answer":0,"exp":"What time ถามเวลา A ตอบว่าหลังคลังสินค้าปิด ตัวลวง C ตอบความถี่ (How often) B ใช้ auditors ล่อจาก audit"},{"q":"Who's in charge of the hotel's banquet bookings?","opts":["Ms. Duarte in the events office.","For two hundred guests.","Yes, it's fully booked."],"answer":0,"exp":"Who ถามบุคคลที่รับผิดชอบ A ระบุ Ms. Duarte ตัวลวง C ตอบ Yes และใช้ booked ซ้ำ B ตอบจำนวนแขก"},{"q":"Where do I drop off these blood samples?","opts":["Only a few drops.","At the lab window down the hall.","Before nine A.M."],"answer":1,"exp":"Where ถามสถานที่ B ตอบช่องรับของห้องแล็บ ตัวลวง A ใช้ drops ที่เสียงคล้าย drop off C ตอบเวลา"},{"q":"Isn't the factory tour scheduled for Wednesday?","opts":["No, it's a short tour.","In the factory.","It was moved to Thursday."],"answer":2,"exp":"คำถามปฏิเสธเรื่องวัน C ตอบว่าเลื่อนเป็นวันพฤหัส ตัวลวง A ขึ้นด้วย No แต่พูดถึงความยาวทัวร์ B ซ้ำคำ factory"},{"q":"Would you mind covering the front desk for an hour?","opts":["It's a large desk.","Cover it with a cloth.","Not at all. Go ahead."],"answer":2,"exp":"Would you mind...? ถ้ายินดีช่วยต้องตอบปฏิเสธ (Not at all) C จึงถูก ตัวลวง B ใช้ cover คนละความหมาย A ซ้ำ desk"},{"q":"Why hasn't the patient's file been updated?","opts":["The system was down this morning.","Update it weekly.","On the second floor."],"answer":0,"exp":"Why ถามเหตุผล A บอกว่าระบบล่มเมื่อเช้า (was down) ตัวลวง B ซ้ำ update C ตอบสถานที่"},{"q":"Which software version are the clients using?","opts":["A software engineer.","Most of them haven't upgraded yet.","Yes, it's very useful."],"answer":1,"exp":"Which version ถามรุ่นของซอฟต์แวร์ B ตอบอ้อมว่าส่วนใหญ่ยังไม่อัปเกรด (นัยคือยังใช้รุ่นเก่า) ตัวลวง A ซ้ำ software C ตอบ Yes กับคำถาม WH"},{"q":"When does the new printing press arrive?","opts":["A press conference.","By the main gate.","The supplier hasn't confirmed yet."],"answer":2,"exp":"When ถามเวลา C ตอบอ้อมว่าผู้จำหน่ายยังไม่ยืนยัน ซึ่งเป็นคำตอบที่เป็นธรรมชาติ ตัวลวง A ใช้ press คนละความหมาย B ตอบสถานที่"},{"q":"How do I reset my company e-mail password?","opts":["It's the same e-mail.","There's a link on the login page.","At the front office."],"answer":1,"exp":"How ถามวิธีการ B บอกว่ามีลิงก์ที่หน้าล็อกอิน ตัวลวง A ซ้ำ e-mail C ตอบสถานที่"},{"q":"Where are the spare parts for the packaging machine?","opts":["Part of the package.","Ask Victor in maintenance.","It's working fine."],"answer":1,"exp":"Where ถามสถานที่ B ตอบอ้อมให้ถาม Victor ฝ่ายซ่อมบำรุง ตัวลวง A ใช้ part และ package เสียงซ้ำ C พูดถึงเครื่องแต่ไม่ตอบคำถาม"},{"q":"The editor wants the article cut by three hundred words.","opts":["Three hundred copies.","She wrote it.","That'll be hard without losing key points."],"answer":2,"exp":"ประโยคบอกเล่า C แสดงความเห็นต่อคำขอว่าต ere is closed for repairs\" = มีงานซ่อมแซม/ก่อสร้าง (B) ส่วนเรื่องระยะทางพูดถึง Saltmere ซึ่งไกลกว่าเพียงหนึ่งชั่วโมง"},{"q":"What does the woman ask the man to send?","opts":["The cost of renting equipment","A draft of the article","Some sample photographs","A signed contract"],"answer":0,"exp":"ผู้หญิงบอกว่า \"Just send me the rental cost\" ค่าเช่าโดรน = equipment (A) ส่วน draft เป็นของนักเขียน"}]},{"lines":[{"sp":"M","t":"Speedline Couriers, customer service. This is Omar."},{"sp":"W","t":"Hi, I'm expecting a package today, but I just found out I have to work late. Could it be delivered to my office instead of my home?"},{"sp":"M","t":"Let me check. Could you give me the tracking number?"},{"sp":"W","t":"Sure, it's S-L-four-seven-two-nine-one."},{"sp":"M","t":"Thank you. I'm afraid the package is already on the truck for delivery, so I can't change the address today."},{"sp":"W","t":"Oh. Is there any other option?"},{"sp":"M","t":"If the driver can't deliver it, you can pick it up at our service center on Elm Street after seven P.M. It's open until ten."},{"sp":"W","t":"That's actually close to my office. I'll do that. Do I need to bring anything?"},{"sp":"M","t":"Just a photo ID and the tracking number."}],"graphic":null,"qs":[{"q":"Why is the woman calling?","opts":["To ask about shipping rates","To complain about a late delivery","To change a delivery location","To report a damaged package"],"answer":2,"exp":"ผู้หญิงขอให้ส่งพัสดุ \"to my office instead of my home\" = เปลี่ยนสถานที่ส่ง (C)"},{"q":"Why is the man unable to fulfill the woman's request?","opts":["The service center is closed.","The office address is incomplete.","The tracking number is incorrect.","The package is already out for delivery."],"answer":3,"exp":"ผู้ชายบอกว่า \"the package is already on the truck for delivery\" (D) ส่วนศูนย์บริการเปิดถึงสี่ทุ่ม จึงไม่ได้ปิด"},{"q":"What will the woman most likely do this evening?","opts":["Call the driver directly","Go to a service center","Send a package","Wait at home for the driver"],"answer":1,"exp":"ผู้หญิงบอกว่าศูนย์บริการอยู่ใกล้ที่ทำงานและ \"I'll do that\" คือจะไปรับพัสดุที่ service center (B)"}]},{"lines":[{"sp":"W","t":"Hi, Mr. Lambert. Your project management workshop starts in fifteen minutes, doesn't it?"},{"sp":"M","t":"Yes, but the projector in Room 204 won't turn on, and my whole presentation is on slides."},{"sp":"W","t":"Oh, I'm sorry about that. I can call a technician, but they usually take at least half an hour to get here."},{"sp":"M","t":"Twenty participants are already sitting in the room."},{"sp":"W","t":"I understand. Room 210 is free this morning, and its equipment was checked yesterday."},{"sp":"M","t":"That would solve it. Could someone help direct people there?"},{"sp":"W","t":"I'll put a sign on the door of 204 and walk over with the group. In the meantime, you can go and set up."},{"sp":"M","t":"Thanks. I'll start about five minutes late, but that should be fine."}],"graphic":null,"qs":[{"q":"What problem does the man mention?","opts":["Some participants are late.","His presentation file is missing.","A room has been double-booked.","A device will not turn on."],"answer":3,"exp":"ผู้ชายบอกว่า \"the projector in Room 204 won't turn on\" (D) ส่วนไฟล์สไลด์ยังอยู่ครบ ปัญหาคือเครื่องฉาย"},{"q":"What does the man mean when he says, \"Twenty participants are already sitting in the room\"?","opts":["More participants are expected.","He cannot wait for a repair.","He needs more handouts.","The room is too small."],"answer":1,"exp":"หลังผู้หญิงบอกว่าช่างต้องใช้เวลาอย่างน้อยครึ่งชั่วโมง ผู้ชายพูดว่าผู้เข้าอบรมนั่งรออยู่แล้ว หมายถึงรอการซ่อมไม่ได้ ผู้หญิงจึงเสนอห้องอื่น (B)"},{"q":"What does the woman say she will do?","opts":["Print copies of the slides","Postpone the workshop","Guide participants to another room","Repair the projector herself"],"answer":2,"exp":"ผู้หญิงบอกว่า \"I'll put a sign on the door of 204 and walk over with the group\" = พาผู้เข้าอบรมไปอีกห้อง (C) ส่วน postpone ผิด เพราะจะเริ่มช้าเพียงห้านาที"}]},{"lines":[{"sp":"W","t":"Good afternoon, Elmwood Family Clinic."},{"sp":"M","t":"Hi, this is Peter Chu. I'm calling to request a refill of my blood pressure medication. I'm almost out."},{"sp":"W","t":"Let me look at your file, Mr. Chu. It says Dr. Morgan wants to see you before she renews it. Your last checkup was over a year ago."},{"sp":"M","t":"I see. The problem is, I'm leaving on a business trip on Wednesday."},{"sp":"W","t":"Dr. Morgan does have video appointments available. There's one tomorrow at four-fifteen."},{"sp":"M","t":"That would work. I can do it from my office."},{"sp":"W","t":"Great. I'll send you a link by text message. If she approves the refill, she'll send it straight to your pharmacy."},{"sp":"M","t":"Perfect. It's the one on Grove Street."}],"graphic":null,"qs":[{"q":"Why is the man calling?","opts":["To request more medicine","To change pharmacies","To cancel an appointment","To ask about test results"],"answer":0,"exp":"ผู้ชายบอกว่า \"I'm calling to request a refill of my blood pressure medication\" refill = ขอยาเพิ่ม (A) ส่วน pharmacy ถูกพูดถึงแต่ไม่ได้ขอเปลี่ยน"},{"q":"What does the woman suggest?","opts":["Meeting with a doctor online","Buying medicine at the airport","Visiting a different clinic","Postponing a business trip"],"answer":0,"exp":"ผู้หญิงเสนอ \"video appointments\" = พบแพทย์ทางออนไลน์ (A) ไม่ได้ให้เลื่อนการเดินทาง"},{"q":"What will the woman send the man?","opts":["A bill","A prescription","A map","A link"],"answer":3,"exp":"ผู้หญิงบอกว่า \"I'll send you a link by text message\" (D) ส่วน prescription แพทย์จะส่งไปที่ร้านขายยาโดยตรง ไม่ใช่ส่งให้ผู้ชาย"}]},{"lines":[{"sp":"W","t":"Okay, the renovation of our Maple Avenue branch starts on June third. Let's talk about how to keep customers informed."},{"sp":"M","t":"The drive-through will be closed for the whole month. That's the biggest change for our customers."},{"sp":"W2","t":"I can design a flyer to hand out at the counter, and we should post ery day a container stays there beyond the first forty-eight hours. So the sooner we sort this out, the better. You can reach me directly at 555-0193. Thanks.","qs":[{"q":"What problem does the speaker mention?","opts":["A container was damaged.","A ship arrived late.","A document is incomplete.","Some equipment is defective."],"answer":2,"exp":"สินค้าถูกกักเพราะ the commercial invoice is missing the product codes คือเอกสารไม่ครบ ส่วนเรือมาช้าเป็นตัวลวงเพราะบทพูดบอกว่า arrived on schedule"},{"q":"What does the speaker ask the listener to do?","opts":["Pay a customs fee","Send a revised invoice","Visit the port","Change a delivery date"],"answer":1,"exp":"ผู้พูดขอ If you could e-mail the revised document to me today คือส่งใบแจ้งหนี้ฉบับแก้ไข ส่วน fee เป็นตัวลวงเพราะผู้พูดแค่เตือนเรื่องค่าเก็บรักษา ไม่ได้ขอให้จ่าย"},{"q":"What does the speaker mention about the port?","opts":["It is closed on weekends.","It has changed its customs rules.","It is experiencing heavy delays.","It charges a daily storage fee."],"answer":3,"exp":"ผู้พูดบอกว่า the port charges a storage fee for every day a container stays there beyond the first forty-eight hours คือคิดค่าเก็บรักษารายวัน ส่วนเรื่องความล่าช้าเป็นตัวลวงเพราะตู้สินค้ามาถึงตรงเวลา"}]},{"kind":"announcement","sp":"W","graphic":null,"t":"Attention, all production staff. This is Joanne Mills from the plant manager's office. As you know, inspectors from the regional safety board will be visiting our factory tomorrow morning. To allow them to examine the equipment, Assembly Lines Two and Three will be shut down from eight A.M. until noon. Workers assigned to those lines should report to the main training room at eight instead, where the quality-control team will be leading a session on our updated packaging standards. Line One will run as usual. Also, please remember that safety glasses and steel-toed boots must be worn at all times on the factory floor. The inspectors will be checking this, and anyone without the proper gear will be asked to leave the area. If you need replacement equipment, you can get it from the supply room before the end of today's shift.","qs":[{"q":"What will happen at the factory tomorrow?","opts":["A new line will be installed.","A product will be launched.","A shipment will arrive.","An inspection will take place."],"answer":3,"exp":"ผู้พูดบอกว่า inspectors from the regional safety board will be visiting คือจะมีการตรวจสอบ ตัวเลือกอื่นไม่ได้กล่าวถึง"},{"q":"What are some workers asked to do tomorrow morning?","opts":["Work an extra shift","Clean their work areas","Attend a training session","Move to Line One"],"answer":2,"exp":"พนักงานสาย 2 และ 3 ต้อง report to the main training room เพื่อเข้าร่วม session เรื่องมาตรฐานบรรจุภัณฑ์ ส่วน Line One เป็นตัวลวงเพราะสายนั้นทำงานตามปกติ ไม่ได้ให้ย้ายไป"},{"q":"According to the speaker, where can workers get replacement gear?","opts":["From the inspectors","From the training room","From a supply room","From the plant manager"],"answer":2,"exp":"ผู้พูดบอกว่า you can get it from the supply room ส่วน training room เป็นคำซ้ำจากบทพูดที่ใช้ในบริบทอื่น"}]},{"kind":"radio broadcast","sp":"M","graphic":null,"t":"Good evening, and welcome to Market Watch on KLMV. Our top story tonight: Pinecrest Savings Bank and Harmon Community Bank have announced plans to merge. The combined bank will operate under the name Pinecrest Harmon Financial and will have more than sixty branches across the state, making it the region's third-largest lender. Executives from both banks say customers will not need to open new accounts, and existing debit cards and checkbooks will continue to work normally. However, about a dozen branches located close to one another are expected to close over the next year. The banks say affected employees will be offered positions at other locations. The merger still needs approval from federal regulators, which is expected by early spring. After a short commercial break, we'll be speaking with an economist about what the deal could mean for local interest rates.","qs":[{"q":"What is the broadcast mainly about?","opts":["A merger of two banks","The opening of new branches","A change in interest rates","The hiring of a new executive"],"answer":0,"exp":"ข่าวหลักคือ Pinecrest Savings Bank and Harmon Community Bank have announced plans to merge ส่วน interest rates เป็นตัวลวงเพราะเป็นหัวข้อที่จะคุยหลังพักโฆษณา"},{"q":"What does the speaker say about current customers?","opts":["They will receive new debit cards.","They must visit a branch.","They can keep their accounts.","They will pay lower fees."],"answer":2,"exp":"ผู้บริหารบอกว่า customers will not need to open new accounts และบัตรเดิมใช้ได้ตามปกติ ดังนั้นตัวเลือกเรื่องได้รับบัตรใหม่จึงผิด"},{"q":"What will listeners hear after the break?","opts":["An interview with an expert","A weather forecast","A traffic report","A statement from regulators"],"answer":0,"exp":"ผู้พูดบอกว่า we'll be speaking with an economist คือสัมภาษณ์ผู้เชี่ยวชาญ ส่วน regulators เป็นตัวลวงเพราะถูกกล่าวถึงเรื่องการอนุมัติเท่านั้น"}]},{"kind":"meeting excerpt","sp":"W","graphic":null,"t":"All right, let's get started. I've just received the results of last month's guest satisfaction survey for the hotel. Overall, our scores went up in almost every area, especially room cleanliness, so please pass on my thanks to the housekeeping staff. The one area where we did poorly was check-in. Several guests wrote that they waited more than twenty minutes at the front desk on busy evenings. Now, I know we're short two receptionists right now. But the Grandview across the street has the same number of staff, and their guests don't seem to have this problem. So starting next week, we'll try something they do: guests who book directly through our website will be able to check in online and pick up their keys from a separate express counter. I'll need someone to make signs for that counter. Any volunteers?","qs":[{"q":"What does the speaker thank the housekeeping staff for?","opts":["Working extra hours","Completing a survey","Keeping rooms clean","Training new employees"],"answer":2,"exp":"คะแนนสูงขึ้นโดยเฉพาะ room cleanliness ผู้พูดจึงฝากขอบคุณพนักงานทำความสะอาด ส่วน survey เป็นตัวลวงเพราะแขกเป็นผู้ตอบแบบสอบถาม"},{"q":"What does the speaker imply when she says, \"the Grandview across the street has the same number of staff\"?","opts":["She plans to hire employees from a competitor.","A staff shortage is not a valid excuse.","The two hotels may cooperate on a project.","Her hotel should reduce its staff."],"answer":1,"exp":"ผู้พูดยอมรับว่าขาดพนักงานต้อนรับ แต่ชี้ว่าโรงแรมคู่แข่งมีพนักงานเท่ากันแต่ไม่มีปัญหา จึงสื่อว่าการขาดพนักงานไม่ใช่ข้ออ้างที่ฟังขึ้น"},{"q":"What will be introduced next week?","opts":["A new website design","A guest loyalty program","An express check-in service","Extended front desk hours"],"answer":2,"exp":"ผู้พูดบอกว่าแขกที่จองผ่านเว็บไซต์จะ check in online และรับกุญแจที่ separate express counter คือบริการเช็กอินด่วน ส่วน website เป็นคำซ้ำแต่ไม่ได้ออกแบบเว็บใหม่"}]},{"kind":"introduction","sp":"M","graphic":null,"t":"Good evening, everyone, and thank you for coming to Thornfield Publishing's annual authors' reception. Tonight, I'm delighted to introduce one of our most successful writers, Amelia Rhodes. Amelia worked as a hospital nurse for twenty years before she began writing, and her experiences on the night shift inspired her first novel, Quiet Hours. That book has now been translated into fourteen languages, and just last month it was chosen as the winner of the National Fiction Prize. Tonight, Amelia will be reading a chapter from her upcoming novel, which won't be in bookstores until next spring, so you'll be among the very first to hear it. Afterward, she'll be happy to answer a few questions from the audience. Copies of Quiet Hours are available at the table near the entrance, and Amelia has kindly agreed to sign them at the end of the evening.","qs":[{"q":"What did Amelia Rhodes do before she became a writer?","opts":["She was a nurse.","She was a translator.","She was a bookstore owner.","She was an editor."],"answer":0,"exp":"ผู้พูดบอกว่า Amelia worked as a hospital nurse for twenty years ส่วน translator เป็นตัวลวงจากคำว่า translated into fourteen languages"},{"q":"What recent achievement does the speaker mention?","opts":["A book was made into a film.","A book sold out in stores.","A new publisher was founded.","A book won an award."],"answer":3,"exp":"ผู้พูดบอกว่า last month it was chosen as the winner of the National Fiction Prize คือหนังสือได้รับรางวัล"},{"q":"What will Amelia Rhodes do first tonight?","opts":["Read from an unpublished book","Sign copies of her novel","Talk about her nursing career","Announce a new prize"],"answer":0,"exp":"Amelia จะ reading a chapter from her upcoming novel ซึ่งยังไม่วางขาย ส่วนการเซ็นหนังสือเป็นตัวลวงเพราะจะทำ at the end of the evening"}]},{"kind":"talk","sp":"W","graphic":null,"t":"Good afternoon, everyone. As most of you know, next Monday, Riverside Medical Center will switch from paper patient charts to a fully electronic records system. This means that all of you on the nursing staff will record medications, test results, and patient notes on the tablets that will be mounted outside each patient room. I understand that some of you are concerned about how much time this will take during busy shifts. That's why the hospital has arranged for technical specialists from the software company to be on every ward for the first two weeks. If you have a problem, they'll be right there to help. You're also required to complete a one-hour online training module before Monday. You'll find the link in the e-mail I sent this morning. Once you've finished it, please print the completion certificate and hand it to your ward supervisor.","qs":[{"q":"Who most likely are the listeners?","opts":["Software developers","Nurses","Patients","Pharmacists"],"answer":1,"exp":"ผู้พูดกล่าวว่า all of you on the nursing staff จึงเป็นพยาบาล ส่วน software developers เป็นตัวลวงเพราะผู้เชี่ยวชาญจากบริษัทซอฟต์แวร์เป็นคนที่จะมาช่วย"},{"q":"What will be available for the first two weeks?","opts":["On-site technical support","Extra tablets","Additional staff for night shifts","Printed instruction manuals"],"answer":0,"exp":"ผู้เชี่ยวชาญด้านเทคนิคจะ be on every ward for the first two weeks คือมีการสนับสนุนทางเทคนิคในพื้นที่ ส่วน tablets เป็นคำซ้ำจากบทพูดแต่ไม่ได้บอกว่าจะมีเพิ่ม"},{"q":"What should listeners give to their supervisors?","opts":["A training certificate","A completed patient chart","A list of questions","A signed contract"],"answer":0,"exp":"หลังทำ online training module เสร็จ ให้ print the completion certificate and hand it to your ward supervisor ส่วน patient chart เป็นตัวลวงเพราะระบบใหม่เลิกใช้ชาร์ตกระดาษ"}]},{"kind":"advertisement","sp":"M","graphic":null,"t":"Running a small business means wearing a lot of hats. But should accounting be one of them? With LedgerLeaf, the cloud-based bookkeeping software, you can send invoices, track expenses, and prepare tax reports in just a few clicks. LedgerLeaf connects automatically to more than two hundred banks, so your transactions are imported every day without any manual data entry. And unlike other accounting programs, LedgerLeaf includes unlimited phone support from certified accountants at no extra charge. Plans start at just fifteen dollars a month, and you can cancel anytime. Still not sure? Try LedgerLeaf free for sixty days. That's twice as long as most competitors offer. Just download the app or sign up at ledgerleaf.com. Use the promo code GROW when you register, and we'll also give you a free one-hour consultation to help you set up your account.","qs":[{"q":"What is being advertised?","opts":["A banking service","Accounting software","A tax consulting firm","An office supply store"],"answer":1,"exp":"โฆษณานี้คือ LedgerLeaf, the cloud-based bookkeeping software ส่วน banking service เป็นตัวลวงเพราะซอฟต์แวร์แค่เชื่อมต่อกับธนาคาร"},{"q":"According to the speaker, what makes LedgerLeaf different from other programs?","opts":["It is the cheapest on the market.","It was designed by tax officials.","It provides free expert support.","It can be used without the Internet."],"answer":2,"exp":"ผู้พูดใช้ unlike other accounting programs แล้วบอกว่ามี unlimited phone support from certified accountants at no extra charge คือการสนับสนุนจากผู้เชี่ยวชาญฟรี"},{"q":"How can listeners receive a free consultation?","opts":["By calling a phone number","By using a promotional code","By subscribing for a year","By referring a friend"],"answer":1,"exp":"ผู้พูดบอก Use the promo code GROW when you register แล้วจะได้ free one-hour consultation ตัวเลือกอื่นไม่ได้กล่าวถึง"}]},{"kind":"instructions","sp":"W","graphic":null,"t":"Welcome to day one of the Customer Care Excellence workshop here at the Bayside Training Institute. I'm Rosa, and I'll be your facilitator for the next three days. Over the course of the program, you'll practice handling difficult calls, writing clear e-mail responses, and using our customer database. Most of our time will be spent in role-play exercises, where you'll work in pairs, with one person playing the customer. Before we begin, please take a look at the folder on your desk. Inside, you'll find a schedule and a short questionnaire about your current job. Please fill that out now, because I'll use your answers to put you into groups. Oh, and about lunch, the cafeteria is on the first floor. Last time, it ran out of food by twelve-fifteen. Our lunch break today starts at noon, by the way. All right, let's get started.","qs":[{"q":"Who most likely are the listeners?","opts":["Cafeteria workers","Workshop participants","Database programmers","Job applicants"],"answer":1,"exp":"ผู้พูดต้อนรับเข้าสู่ day one of the Customer Care Excellence workshop และตนเป็น facilitator จึงผู้ฟังเป็นผู้เข้าอบรม ส่วน database เป็นคำที่ได้ยินในบทพูด"},{"q":"What are the listeners asked to do now?","opts":["Choose a partner","Read a schedule aloud","Introduce themselves","Complete a questionnaire"],"answer":3,"exp":"ผู้พูดบอก Please fill that out now หมายถึง questionnaire ในแฟ้ม ส่วน partner เป็นตัวลวงเพราะผู้พูดจะเป็นคนจัดกลุ่มให้เอง"},{"q":"What does the speaker imply when she says, \"Last time, it ran out of food by twelve-fifteen\"?","opts":["The cafeteria needs a new supplier.","The lunch break will be shortened.","Listeners should go to lunch promptly.","Listeners should bring their own meals."],"answer":2,"exp":"ผู้พูดบอกว่าครั้งก่อนอาหารหมดตอน 12:15 และพักเที่ยงเริ่ม 12:00 จึงสื่อว่าควรรีบไปทานอาหารตรงเวลา ตัวเลือกเรื่องเอาอาหารมาเองไม่ได้ถูกแนะนำ"}]},{"kind":"telephone message","sp":"W","graphic":{"title":"Lakeshore Hotel - Banquet Rooms","rows":[["Room","Capacity"],["Maple Room","40"],["Cedar Room","80"],["Birch Hall","150"],["Grand Ballroom","300"]]},"t":"Hello, Mr. Tanaka, this is Olivia Grant from the events office at the Lakeshore Hotel. I'm calling about the retirement dinner you've booked for the evening of October twelfth. When you made the reservation, you mentioned you were expecting about seventy guests, so we reserved a room for that size. But your assistant called this morning to say the guest list has grown to around one hundred and twenty people. Fortunately, our next-largest room is still available that night, so I've moved your event there. The price per person stays the same, but there will be a small additional charge for extra tables and a second serving station. I've e-mailed you an updated contract with the details. If everything looks correct, please sign it and send it back to me by Friday so we can finalize the menu with our kitchen.","qs":[{"q":"What event is the listener planning?","opts":["A retirement dinner","A wedding reception","A company conference","An awards ceremony"],"answer":0,"exp":"ผู้พูดบอกว่า the retirement dinner you've booked ตัวเลือกอื่นเป็นงานประเภทอื่นที่มักจัดในโรงแรมแต่ไม่ได้กล่าวถึง"},{"q":"Look at the graphic. Which room will the event most likely be held in now?","opts":["Birch Hall","Cedar Room","Grand Ballroom","Maple Room"],"answer":0,"exp":"เดิมจองห้องสำหรับ 70 คน (Cedar Room จุ 80) เมื่อแขกเพิ่มเป็น 120 คน จึงย้ายไป our next-largest room คือ Birch Hall (150) ส่วน Cedar Room เป็นห้องเดิม"},{"q":"What is the listener asked to do by Friday?","opts":["Choose menu items","Pay a deposit","Confirm the number of guests","Return a signed document"],"answer":3,"exp":"ผู้พูดขอให้ sign it and send it back to me by Friday หมายถึงสัญญาฉบับแก้ไข ส่วน menu เป็นตัวลวงเพราะโรงแรมจะเป็นผู้สรุปเมนูกับครัวหลังได้รับสัญญา"}]},{"kind":"meeting excerpt","sp":"M","graphic":{"title":"Spring Catalog - Production Schedule","rows":[["Stage","Deadline"],["Manuscript editing","January 10"],["Cover design","January 24"],["Proofreading","February 7"],["Printing","February 21"]]},"t":"Let's turn now to the production schedule for our spring catalog of children's books. Editing was completed on time, which is great news. Unfortunately, we've run into a problem at the next stage. Our usual illustrator for the covers had a family emergency and won't be able to finish the artwork by the deadline. I've spoken with a freelance designer, Carla Benson, who has done excellent work for other publishers, and she can deliver the covers about one week late. To make up for that, I've asked our proofreaders whether they could work a few extra hours, and they've agreed, so the proofreading deadline won't change. That means the printer should still receive the files on schedule. Now, since Carla is new to us, I'd like someone from the design department to meet with her this week to go over our style guidelines. Daniel, could you handle that?","qs":[{"q":"What type of company do the speakers most likely work for?","opts":["A toy manufacturer","A publishing company","A printing shop","An advertising agency"],"answer":1,"exp":"บทพูดกล่าวถึง spring catalog of children's books, editing, proofreading จึงเป็นสำนักพิมพ์ ส่วน printing shop เป็นตัวลวงเพราะโรงพิมพ์เป es.","opts":["diversity","diverse","diversely","diversify"],"answer":1,"exp":"หน้าคำนาม backgrounds ต้องใช้ adjective คือ diverse (หลากหลาย) ส่วน diversify เป็นกริยา และ diversity เป็นคำนาม"},{"q":"The clinic's patient ------- rate has risen steadily over the past three years.","opts":["satisfy","satisfaction","satisfied","satisfying"],"answer":1,"exp":"patient satisfaction rate (อัตราความพึงพอใจของผู้ป่วย) เป็นคำนามประสม ต้องใช้คำนาม satisfaction ส่วน satisfied เป็น adjective ใช้กับคนที่รู้สึกพอใจ ไม่ใช้ขยาย rate"},{"q":"Forklift operators must wear ------- clothing at all times while on the warehouse floor.","opts":["protect","protection","protective","protectively"],"answer":2,"exp":"หน้าคำนาม clothing ต้องใช้ adjective คือ protective (ที่ใช้ป้องกัน) ส่วน protection เป็นคำนาม ซึ่งเป็นตัวลวงเพราะคล้ายคำนามประสม แต่ protective clothing คือ collocation ที่ถูกต้อง"},{"q":"The new invoicing software is ------- compatible with most accounting programs.","opts":["fully","full","fullness","fuller"],"answer":0,"exp":"ขยาย adjective compatible ต้องใช้ adverb คือ fully (อย่างสมบูรณ์) ส่วน full เป็น adjective ขยาย adjective ด้วยกันไม่ได้"},{"q":"The plant manager requested a ------- explanation of the cause of the equipment failure.","opts":["detailed","detail","detailing","details"],"answer":0,"exp":"หน้าคำนาม explanation ต้องใช้ adjective คือ detailed (ละเอียด) ส่วน detailing เป็น V-ing ที่ไม่ให้ความหมายเชิงคุณลักษณะ"},{"q":"Mr. Barros is ------- for coordinating the delivery schedules of all regional drivers.","opts":["responsibly","responsible","responsibility","respond"],"answer":1,"exp":"be responsible for (รับผิดชอบ) ต้องใช้ adjective หลัง is ส่วน responsibility เป็นคำนามที่ไม่เข้ากับประธาน Mr. Barros"},{"q":"By the time the auditors arrived, the bank's accounting team ------- all the necessary documents.","opts":["has prepared","prepares","will prepare","had prepared"],"answer":3,"exp":"By the time + past simple (arrived) แสดงว่าการเตรียมเอกสารเสร็จก่อนเหตุการณ์ในอดีต จึงใช้ past perfect (had prepared) ส่วน has prepared เป็น present perfect ไม่เข้ากับอดีต"},{"q":"The hospital board recommends that every visitor ------- hands before entering the intensive care unit.","opts":["wash","washes","washed","is washing"],"answer":0,"exp":"หลัง recommend that ใช้ subjunctive คือกริยารูปฐาน (base form) ไม่ว่าประธานจะเป็นเอกพจน์ จึงตอบ wash ส่วน washes เป็นตัวลวงเพราะ every visitor เป็นเอกพจน์"},{"q":"The east wing of the hotel ------- at the moment, so guests are being placed in the west wing.","opts":["is being painted","is painting","has painted","paints"],"answer":0,"exp":"at the moment บอก present continuous และตึกถูกทาสี (passive) จึงใช้ is being painted ส่วน is painting เป็น active ทำให้ตึกเป็นผู้ทาสีเอง"},{"q":"Our technicians ------- the server upgrade overnight, so the system may be unavailable until 6 A.M.","opts":["performed","had performed","will be performing","being performed"],"answer":2,"exp":"เหตุการณ์ที่จะกำลังดำเนินอยู่ในช่วงเวลาหนึ่งในอนาคต (overnight ก่อน 6 A.M. และ may be unavailable) ใช้ future continuous คือ will be performing ส่วน being performed ไม่ใช่กริยาแท้"},{"q":"If the printer delivers the proofs on Monday, the editors ------- them by Wednesday.","opts":["reviewed","would have reviewed","will review","reviewing"],"answer":2,"exp":"conditional แบบที่ 1: If + present simple (delivers), ประโยคหลักใช้ will + V1 จึงตอบ will review ส่วน would have reviewed ใช้กับ conditional แบบที่ 3"},{"q":"Employees may work from home on Fridays ------- they remain available by phone during office hours.","opts":["in case of","as though","even so","provided that"],"answer":3,"exp":"provided that (โดยมีเงื่อนไขว่า) ตามด้วยอนุประโยคบอกเงื่อนไข ส่วน in case of เป็นบุพบทต้องตามด้วยคำนาม และ even so เป็นคำเชื่อมประโยคไม่ใช่คำสันธาน"},{"q":"------- the new conveyor system is fully operational, the plant can ship orders twice as fast.","opts":["As if","Now that","So that","Rather than"],"answer":1,"exp":"Now that (เพราะตอนนี้...แล้ว) บอกสาเหตุจากสถานการณ์ใหม่ ซึ่งเข้ากับความหมาย ส่วน So that บอกจุดประสงค์ ไม่ใช่เหตุ"},{"q":"Trainees must decide ------- to take the advanced course in March or wait until September.","opts":["either","unless","whether","both"],"answer":2,"exp":"decide whether to + V ... or ... (ตัดสินใจว่าจะ...หรือ...) ใช้ whether ตามด้วย to-infinitive ได้ ส่วน either เป็นตัวลวงเพราะเห็น or แต่ไม่ใช้หลัง decide ตามด้วย to"},{"q":"Ms. Lindgren accepted the award ------- the entire editorial staff of Harlow Press.","opts":["in terms of","on behalf of","as well","regardless"],"answer":1,"exp":"on behalf of (ในนามของ) ใช้เมื่อรับรางวัลแทนกลุ่มคน ส่วน in terms of (ในแง่ของ) ไม่เข้ากับความหมาย และ as well, regardless ต้องมีบุพบท as/of ตามจึงจะตามด้วยคำนามได้"},{"q":"All damaged parcels must be reported to the shipping supervisor ------- 24 hours of delivery.","opts":["within","during","among","since"],"answer":0,"exp":"within + ช่วงเวลา + of (ภายใน 24 ชั่วโมงหลังการส่ง) เป็นโครงสร้างที่ถูกต้อง ส่วน during ใช้กับช่วงเหตุการณ์ ไม่ใช้กับกำหนดเวลาแบบ ... of delivery"},{"q":"The clinic's new location, ------- its extended evening hours, has attracted many working professionals.","opts":["as well","together","along with","in addition"],"answer":2,"exp":"along with (พร้อมกับ) เป็นบุพบทที่ตามด้วยคำนามได้ทันที ส่วน together ต้องใช้ together with และ in addition ต้องใช้ in addition to"},{"q":"The two software teams meet weekly to share updates with ------- on their progress.","opts":["each","one another","other","themselves"],"answer":1,"exp":"share with one another (แบ่งปันกันและกัน) ใช้สรรพนามแสดงความสัมพันธ์ซึ่งกันและกัน ส่วน themselves เป็นสรรพนามสะท้อนที่หมายถึงทำกับตัวเอง ไม่ใช่ทำต่อกัน"},{"q":"Corland Bank merged its customer database with ------- of its partner firm, Asterly Finance.","opts":["those","them","its","that"],"answer":3,"exp":"ใช้ that แทนคำนามเอกพจน์ที่กล่าวไปแล้ว (database) เพื่อเลี่ยงการซ้ำคำ ส่วน those ใช้แทนคำนามพหูพจน์ และ them ใช้กับ of ในความหมายนี้ไม่ได้"},{"q":"The publishing company has decided to ------- its contract with the printing firm for another three years.","opts":["resume","recall","renew","remind"],"answer":2,"exp":"renew a contract (ต่อสัญญา) สอดคล้องกับ for another three years ส่วน resume (กลับมาทำต่อ) ใช้กับกิจกรรมที่หยุดไป ไม่ใช้กับสัญญา"},{"q":"Patients are asked to arrive fifteen minutes early to complete the necessary -------.","opts":["workplace","paperwork","homework","framework"],"answer":1,"exp":"paperwork (เอกสารที่ต้องกรอก) เหมาะกับการมาถึงคลินิกก่อนเวลา ส่วน homework (การบ้าน) และ framework (โครงสร้าง) ไม่เข้ากับบริบท"},{"q":"The factory has received ------- for its efforts to reduce water consumption.","opts":["recognition","admission","reservation","inspection"],"answer":0,"exp":"receive recognition for (ได้รับการยกย่องในเรื่อง) เป็น collocation ที่ถูกต้อง ส่วน inspection (การตรวจสอบ) ไม่ได้มาเป็นผลจากความพยายามที่ดี"},{"q":"Online banking customers are notified by text message whenever a large ------- is made from their account.","opts":["deposit","statement","withdrawal","balance"],"answer":2,"exp":"a withdrawal is made from an account (มีการถอนเงินจากบัญชี) ส่วน deposit เป็นตัวลวงเพราะเป็นศัพท์ธนาคาร แต่การฝากใช้ into ไม่ใช่ from"},{"q":"The software firm offers a thirty-day free ------- so that clients can test the product before purchasing it.","opts":["attempt","trial","effort","sample"],"answer":1,"exp":"free trial (ทดลองใช้ฟรี) เป็นคำที่ใช้กับซอฟต์แวร์และสอดคล้องกับ test before purchasing ส่วน attempt และ effort แปลว่าความพยายาม ไม่ใช่บริการทดลองใช้"},{"q":"Due to a scheduling -------, the leadership seminar has been moved to Room 210.","opts":["contrast","conflict","contest","contact"],"answer":1,"exp":"scheduling conflict (ตารางเวลาทับซ้อนกัน) เป็นเหตุผลในการย้ายห้อง ส่วน contrast, contest, contact เป็นคำที่สะกดคล้ายกันแต่ความหมายไม่เข้ากับบริบท"},{"q":"The hotel's main ballroom can ------- up to 500 guests for banquets and conferences.","opts":["attend","occupy","accommodate","approve"],"answer":2,"exp":"accommodate (รองรับได้) ใช้บอกความจุของสถานที่ ส่วน attend (เข้าร่วม) ต้องมีประธานเป็นคน และ occupy (ครอบครองพื้นที่) ไม่ใช้กับจำนวนแขก"}],"p6":[{"kind":"letter","head":"Mr. Tomas Rivera\n58 Larkin Street\nSpringfield, IL 62704\n\nSeptember 12","t":"Dear Mr. Rivera,\n\nYour new Corland Bank debit card is enclosed. For your security, the card will not work [[1]] you have activated it. To do so, please call the number printed on the sticker attached to the front of the card.\n\nYour old card will remain [[2]] until September 30. After that date, please cut it in half and dispose of it safely.\n\nThe new card includes a contactless payment feature, [[3]] allows you to pay for purchases simply by tapping the card on a reader. [[4]]\n\nSincerely,\nAngela Moss\nCustomer Accounts Department","qs":[{"opts":["while","during","so","until"],"answer":3,"exp":"not ... until (จะไม่...จนกว่า) บอกว่าบัตรจะใช้ได้หลังเปิดใช้งาน ส่วน during เป็นบุพบทตามด้วยอนุประโยคไม่ได้ และ while ให้ความหมายผิด"},{"opts":["active","activity","actively","activate"],"answer":0,"exp":"remain เป็น linking verb ต้องตามด้วย adjective คือ active (ยังใช้งานได้) ส่วน actively เป็น adverb และ activate เป็นกริยา"},{"opts":["who","it","what","which"],"answer":3,"exp":"หลังเครื่องหมายจุลภาคใช้ which ขึ้นต้น non-defining relative clause ขยาย feature ส่วน it จะทำให้เกิดสองประโยคเชื่อมด้วยจุลภาคโดยไม่มีคำเชื่อม และ who ใช้กับคน"},{"opts":["Your loan application has been rejected.","If you have any questions about this feature, please visit any of our branches.","We regret that your account has been closed.","Thank you for applying for a position at Corland Bank."],"answer":1,"exp":"ประโยคนี้ต่อจากการอธิบายฟีเจอร์ contactless (this feature) และเป็นการปิดจดหมายอย่างเหมาะสม ส่วนประโยคที่บอกว่าบัญชีถูกปิดขัดแย้งกับการส่งบัตรใหม่ให้"}]},{"kind":"notice","head":"NOTICE TO ALL PRODUCTION STAFF","t":"Please be advised that the annual maintenance shutdown of the Delford plant will take place from December 20 to January 3. During this period, all production lines will be [[1]] down so that engineers can inspect and repair the equipment.\n\nEmployees who are not involved in the maintenance work are required to take their annual leave during the shutdown. [[2]] Those who have already used all of their leave for the year should speak with their supervisor as [[3]] as possible.\n\nNormal operations will [[4]] on January 4. Thank you for your cooperation.","qs":[{"opts":["shut","shuts","shutting","to shut"],"answer":0,"exp":"will be + past participle เป็น passive (สายการผลิตถูกปิด) และกริยาช่อง 3 ของ shut คือ shut จึงตอบ shut ส่วน shutting จะเป็น active continuous ซึ่งผิดความหมาย"},{"opts":["Leave requests for these dates will be approved automatically.","The cafeteria will offer a new lunch menu starting next week.","All employees must work overtime during this period.","The engineers will arrive on February 15."],"answer":0,"exp":"ประโยคนี้ต่อจากเรื่องการบังคับลาพักร้อนในช่วงปิดโรงงาน (these dates) ส่วนประโยคที่บอกว่าทุกคนต้องทำงานล่วงเวลาขัดแย้งกับการให้พนักงานลาพัก"},{"opts":["well","far","much","soon"],"answer":3,"exp":"as soon as possible (โดยเร็วที่สุด) เป็นสำนวนตายตัว ส่วน as well as แปลว่า และ/รวมทั้ง ซึ่งไม่เข้ากับ possible"},{"opts":["assume","consume","presume","resume"],"answer":3,"exp":"resume (กลับมาดำเนินการต่อ) ใช้กับ operations หลังการหยุดชั่วคราว ส่วน assume, consume, presume เป็นคำที่ลงท้ายคล้ายกันแต่ความหมายไม่เข้ากับบริบท"}]},{"kind":"e-mail","head":"To: Mariko Hayes <mhayes@brightpathsoft.com>\nFrom: Oliver Grant <ogrant@brightpathsoft.com>\nDate: February 2\nSubject: Beta testing volunteers","t":"Hi Mariko,\n\nAs you know, we are planning to release version 4.0 of our scheduling application in April. Before then, we need volunteers from outside the development team to test the beta version and [[1]] any problems they encounter.\n\n[[2]] Ideally, the testers would be staff members who use the current version daily, such as those in Customer Support.\n\nCould you ask your team whether anyone would be willing to help? Testing will take [[3]] two hours per week over a four-week period. Participants will receive a gift card as a token of our [[4]].\n\nBest regards,\nOliver","qs":[{"opts":["report","reporting","reported","reports"],"answer":0,"exp":"โครงสร้างคู่ขนาน (parallel structure) to test ... and report ต้องใช้กริยารูปฐานเหมือน test ส่วน reporting และ reports ไม่สอดคล้องกับ to test"},{"opts":["The release has been postponed indefinitely.","Customer Support will be moving to the fifth floor.","We are hoping to recruit about ten people for this task.","Version 3.0 was never released to the public."],"answer":2,"exp":"ประโยคนี้บอกจำนวนอาสาสมัครที่ต้องการ และเชื่อมกับประโยคถัดไปเรื่องคุณสมบัติของผู้ทดสอบ ส่วนประโยคที่บอกว่าเลื่อนการเปิดตัวไม่มีกำหนดขัดแย้งกับแผนเปิดตัวในเดือนเมษายน"},{"opts":["approximate","approximation","approximated","approximately"],"answer":3,"exp":"ขยายตัวเลข two hours ต้องใช้ adverb คือ approximately (ประมาณ) ส่วน approximate เป็น adjective ซึ่งใช้ขยายตัวเลขในตำแหน่งนี้ไม่ได้"},{"opts":["request","gratitude","apology","opinion"],"answer":1,"exp":"as a token of our gratitude (เป็นการแสดงความขอบคุณ) เข้ากับการให้บัตรของขวัญแก่อาสาสมัคร ส่วน apology (คำขอโทษ) ไม่เหมาะเพราะไม่ได้ทำผิด"}]},{"kind":"article","head":"Local Publisher Goes Digital","t":"OAKFIELD (November 18) — Pemberton Books, one of the oldest independent publishers in the region, will begin offering [[1]] entire catalog in electronic format next month. The company's director, Ruth Okafor, said the decision was driven by changing reader habits.\n\n\"More and more of our readers are buying books on tablets and phones,\" Ms. Okafor explained. \"We want to make sure our titles are [[2]] wherever people prefer to read.\"\n\nPemberton will continue to print physical copies of all new releases. [[3]] The company also plans to hire two digital production specialists [[4]] the transition.","qs":[{"opts":["it's","his","theirs","its"],"answer":3,"exp":"สรรพนามแสดงความเป็นเจ้าของหน้าคำนาม catalog ที่หมายถึงบริษัท Pemberton Books ใช้ its ส่วน it's ย่อมาจาก it is และ theirs ใช้หน้าคำนามไม่ได้"},{"opts":["accessibly","access","accessible","accessibility"],"answer":2,"exp":"หลัง are ต้องใช้ adjective คือ accessible (เข้าถึงได้) ส่วน accessibility เป็นคำนามและ accessibly เป็น adverb"},{"opts":["As a result, the company will stop printing books entirely.","Ms. Okafor joined the company as an intern.","Tablets are expensive to repair.","In fact, print sales still account for most of its revenue."],"answer":3,"exp":"ประโยคนี้สนับสนุนประโยคก่อนหน้าที่ว่ายังคงพิมพ์หนังสือเล่มต่อไป ส่วนประโยคที่บอกว่าจะหยุดพิมพ์หนังสือทั้งหมดขัดแย้งกับข้อความก่อนหน้า"},{"opts":["oversaw","overseen","oversees","to oversee"],"answer":3,"exp":"hire + คน + to-infinitive บอกจุดประสงค์ (จ้างมาเพื่อดูแล) จึงใช้ to oversee ส่วน oversaw และ oversees เป็นกริยาแท้ซึ่งซ้อนกับกริยา plans ไม่ได้"}]}],"p7":[{"passages":[{"kind":"text message chain","head":"","t":"Luis Moreno (4:05 P.M.): Hi Karen, I'm at the Dalton Hardware loading dock, but nobody here is expecting a delivery today.\n\nKaren Holt (4:07 P.M.): That's strange. The order shows 12 pallets for Dalton, scheduled for this afternoon.\n\nLuis Moreno (4:08 P.M.): The manager says their order was for Thursday, not Tuesday.\n\nKaren Holt (4:10 P.M.): You're right. I just checked the original request. Someone entered the wrong day in our system.\n\nLuis Moreno (4:11 P.M.): So what should I do? I still have two more stops on my route.\n\nKaren Holt (4:13 P.M.): Bring the pallets back to the warehouse after your last stop. I'll reschedule the delivery and let Dalton know."}],"qs":[{"q":"What caused the problem?","opts":["A truck broke down on the way.","A delivery date was recorded incorrectly.","The manager canceled an order.","Some pallets were damaged."],"answer":1,"exp":"Ms. Holt ตรวจสอบแล้วพบว่า Someone entered the wrong day in our system = มีคนบันทึกวันส่งผิด ตัวเลือก C ผิดเพราะผู้จัดการไม่ได้ยกเลิก แต่สั่งไว้สำหรับวันพฤหัสบดี"},{"q":"At 4:11 P.M., what does Mr. Moreno most likely mean when he writes, \"I still have two more stops on my route\"?","opts":["He wants to know how to handle the shipment.","He will be late for his next delivery.","He needs help unloading the pallets.","He has already finished his work for the day."],"answer":0,"exp":"เขาถามว่า So what should I do? ก่อนบอกว่ายังเหลืออีก 2 จุดส่ง แสดงว่าต้องการรู้ว่าจะจัดการสินค้าที่ส่งไม่ได้อย่างไรโดยไม่กระทบงานที่เหลือ ตัวเลือก D กลับความหมาย"}]},{"passages":[{"kind":"notice","head":"Riverbend Medical Clinic — Patient Notice","t":"Beginning Monday, February 3, Riverbend Medical Clinic will introduce self-service check-in kiosks in the main lobby. Patients with scheduled appointments can use the kiosks to confirm their personal details, update insurance information, and sign consent forms electronically.\n\nTo check in, simply enter your date of birth and the last four digits of your phone number. The process takes about two minutes. Patients who prefer to check in with a receptionist may continue to do so at the front desk.\n\nPlease arrive at least ten minutes before your appointment time. Staff members will be available near the kiosks throughout February to assist anyone who needs help."}],"qs":[{"q":"What is the purpose of the notice?","opts":["To announce new clinic hours","To introduce a new check-in system","To explain changes to insurance coverage","To request that patients update their phone numbers"],"answer":1,"exp":"ประกาศแจ้งว่าคลินิกจะเริ่มใช้ self-service check-in kiosks ตั้งแต่ 3 กุมภาพันธ์ ตัวเลือก C และ D เป็นกับดักเพราะ insurance และ phone number เป็นเพียงรายละเอียดของการใช้งานตู้"},{"q":"What is indicated about the front desk?","opts":["It will be moved to another floor.","It will close in February.","Patients can still use it to check in.","It will handle only insurance questions."],"answer":2,"exp":"ประกาศระบุว่า Patients who prefer to check in with a receptionist may continue to do so at the front desk = ผู้ป่วยยังเช็กอินที่เคาน์เตอร์ได้ตามเดิม"}]},{"passages":[{"kind":"invoice","head":"Inkwell Printing Services\n71 Carroway Lane, Leeds\nInvoice No. 20984    Date: 9 October\n\nBill to: Ashgrove Press, Attn: Nadia Fenwick","t":"Project: \"Coastal Walks of Yorkshire\" (paperback, 240 pages)\n\nPrinting, 1,500 copies .......... £3,600.00\nFull-colour cover upgrade ....... £450.00\nProof copies (3) ................ £60.00\nDelivery to Ashgrove warehouse ... £120.00\n\nSubtotal ........................ £4,230.00\nReturning-customer discount (5%) . -£211.50\nTotal due ....................... £4,018.50\n\nPayment is due within 30 days of the invoice date. Please quote the invoice number with your payment. A second print run at the same rate is available until 31 December."}],"qs":[{"q":"What does Ashgrove Press most likely do?","opts":["Publish books","Sell printing equipment","Organize walking tours","Design websites"],"answer":0,"exp":"ใบแจ้งหนี้เป็นค่าพิมพ์หนังสือปกอ่อน 240 หน้า จำนวน 1,500 เล่ม ให้ Ashgrove Press ซึ่งมีคำว่า Press แสดงว่าเป็นสำนักพิมพ์ ตัวเลือก C เป็นกับดักจากชื่อหนังสือ Coastal Walks"},{"q":"Why was a discount applied?","opts":["The order was placed early.","More than 1,000 copies were ordered.","Ashgrove Press has ordered from Inkwell before.","The delivery was late."],"answer":2,"exp":"ส่วนลดระบุว่า Returning-customer discount (5%) = ส่วนลดสำหรับลูกค้าที่เคยใช้บริการมาก่อน ตัวเลือก B เป็นกับดักจากจำนวน 1,500 เล่ม"}]},{"passages":[{"kind":"schedule","head":"Northgate Skills Institute\nLeadership Workshop Series — Autumn Schedule\nAll sessions held in Room 210, 6:00-8:30 P.M.","t":"Week 1 (Oct. 6): Communicating with Confidence — Instructor: Paula Rios\nWeek 2 (Oct. 13): Managing Remote Teams — Instructor: Henry Cho\nWeek 3 (Oct. 20): Resolving Workplace Conflict — Instructor: Paula Rios\nWeek 4 (Oct. 27): Budget Planning for New Managers — Instructor: Ama Mensah\n\nParticipants who attend all four sessions will receive a Certificate in Team Leadership. Individual sessions may be booked for $45 each; the full series costs $150. Light refreshments are provided. *Please note: the October 13 session will be held in Room 305 due to building maintenance."}],"qs":[{"q":"Who will lead more than one workshop?","opts":["Henry Cho","Ama Mensah","A guest speaker","Paula Rios"],"answer":3,"exp":"ตารางแสดงว่า Paula Rios สอนทั้งสัปดาห์ที่ 1 และสัปดาห์ที่ 3 ส่วนคนอื่นสอนคนละครั้ง"},{"q":"What is indicated about the session on Managing Remote Teams?","opts":["It will take place in a different room.","It costs more than the other sessions.","It will be offered online.","It has been rescheduled to October 27."],"answer":0,"exp":"Managing Remote Teams จัดวันที่ 13 ต.ค. และหมายเหตุบอกว่า session วันที่ 13 ต.ค. จะย้ายไปห้อง 305 แทนห้อง 210 ตัวเลือก C เป็นกับดักจากคำว่า Remote"}]},{"passages":[{"kind":"e-mail","head":"To: Mr. Daniel Ferreira <dferreira@altoconsult.com>\nFrom: Reservations <reservations@meridianparkhotel.com>\nDate: November 8\nSubject: Your reservation, Confirmation No. MPH-55120","t":"Dear Mr. Ferreira,\n\nThank you for booking with the Meridian Park Hotel. This e-mail confirms your stay in a Deluxe King Room from November 21 to November 24 (three nights) at a rate of $189 per night, breakfast included. [1]\n\nCheck-in begins at 3:00 P.M., and check-out is at 11:00 A.M. [2] If you expect to arrive after 10:00 P.M., please let us know so that we can hold your room. As a member of our Meridian Rewards program, you are also entitled to a late check-out until 1:00 P.M. at no extra charge.\n\nFree parking is available in our underground garage for registered guests. [3] Our airport shuttle departs from Terminal B every hour between 6:00 A.M. and 11:00 P.M.\n\nReservations may be canceled without penalty up to 48 hours before arrival. [4] We look forward to welcoming you.\n\nMeridian Park Hotel Reservations Team"}],"qs":[{"q":"What is the purpose of the e-mail?","opts":["To advertise a rewards program","To confirm a hotel booking","To respond to a complaint","To offer a room upgrade"],"answer":1,"exp":"อีเมลมีหัวเรื่อง Your reservation และบอกว่า This e-mail confirms your stay = ยืนยันการจองห้องพัก ตัวเลือก A เป็นกับดักเพราะ Meridian Rewards ถูกกล่าวถึงเพียงรายละเอียด"},{"q":"What is suggested about Mr. Ferreira?","opts":["He will arrive by car.","He has stayed at the hotel many times.","He belongs to the hotel's membership program.","He has requested an airport shuttle."],"answer":2,"exp":"อีเมลระบุว่า As a member of our Meridian Rewards program แสดงว่าเขาเป็นสมาชิกโปรแกรมของโรงแรม ตัวเลือก B อนุมานเกินจากข้อมูล เพราะไม่ได้บอกว่าเคยพักกี่ครั้ง"},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"After that time, the first night's charge will be applied.\"","opts":["[1]","[2]","[3]","[4]"],"answer":3,"exp":"After that time หมายถึงหลังช่วงเวลา 48 ชั่วโมงก่อนเข้าพักที่ยกเลิกได้ฟรี ประโยคนี้จึงต้องตามหลังประโยคเรื่องการยกเลิก คือตำแหน่ง [4] ตำแหน่ง [2] ผิดเพราะเรื่องเวลา check-out ไม่เกี่ยวกับค่าปรับ"}]},{"passages":[{"kind":"advertisement","head":"TaskHarbor — Project Management Made Simple","t":"Is your team still tracking projects with spreadsheets and endless e-mail threads? TaskHarbor brings everything together in one easy-to-use platform. Assign tasks, set deadlines, share files, and see your team's progress at a glance.\n\nTaskHarbor connects with the calendar and messaging tools you already use, and our mobile app lets you stay up to date even when you're away from your desk. Data is stored on secure servers and backed up every hour.\n\nPlans start at just $8 per user per month. Try TaskHarbor free for 30 days, with no credit card required. Teams of 50 or more can request a live demonstration from one of our product specialists at www.taskharbor.com/demo."}],"qs":[{"q":"What is being advertised?","opts":["A file storage device","A software application for organizing work","A training course on project management","A messaging service for customers"],"answer":1,"exp":"โฆษณาอธิบาย TaskHarbor ว่าเป็น platform ใช้มอบหมายงาน กำหนด deadline และติดตามความคืบหน้า จึงเป็นซอฟต์แวร์จัดการงาน ตัวเลือก C เป็นกับดักจากคำว่า Project Management"},{"q":"What is mentioned as a feature of TaskHarbor?","opts":["It can be used on mobile devices.","It replaces existing calendar tools.","It includes free hardware.","It translates documents automatically."],"answer":0,"exp":"โฆษณาระบุว่า our mobile app lets you stay up to date = ใช้ผ่านอุปกรณ์มือถือได้ ตัวเลือก B ผิดเพราะ TaskHarbor connects with ปฏิทินเดิม ไม่ได้แทนที่"},{"q":"According to the advertisement, how can large teams receive a demonstration?","opts":["By calling a sales office","By visiting a store","By attending a trade show","By making a request online"],"answer":3,"exp":"โฆษณาบอกว่าทีมที่มี 50 คนขึ้นไป can request a live demonstration ... at www.taskharbor.com/demo = ขอผ่านเว็บไซต์"}]},{"passages":[{"kind":"memo","head":"MEMO\nTo: All Staff, Harrington Street Branch\nFrom: Celia Ward, Branch Manager\nDate: July 15\nSubject: Branch renovation","t":"As you know, our branch will be renovated this summer to create a larger customer waiting area and two private consultation rooms for loan and investment discussions. Work will begin on Monday, August 4, and is expected to take five weeks.\n\nDuring the renovation, the branch will remain open, but the main entrance on Harrington Street will be closed. Customers and staff should use the side entrance on Pell Avenue. Two of the four teller windows will also be unavailable, so please expect longer lines, especially at lunchtime.\n\nTo reduce crowding, we will encourage customers to use our mobile banking app and the ATMs outside the building for simple transactions. Flyers explaining these options will be placed at each teller window next week. Thank you for your patience."}],"qs":[{"q":"What is one purpose of the renovation?","opts":["To add more ATMs","To build rooms for private meetings","To expand the staff break room","To install new teller windows"],"answer":1,"exp":"memo ระบุว่าการปรับปรุงจะสร้าง two private consultation rooms for loan and investment discussions = ห้องสำหรับประชุมส่วนตัว ตัวเลือก D ผิดเพราะช่องบริการจะใช้ไม่ได้ชั่วคราว ไม่ได้ติดตั้งใหม่"},{"q":"What will happen during the renovation?","opts":["The branch will close at lunchtime.","The mobile banking app will be unavailable.","Staff will work at another branch.","Customers will enter from a different street."],"answer":3,"exp":"memo บอกว่าทางเข้าหลักบน Harrington Street ปิด ให้ใช้ทางเข้าด้านข้างบน Pell Avenue = เข้าจากถนนอีกเส้น ตัวเลือก A เป็นกับดักเพราะ lunchtime ถูกพูดถึงเรื่องคิวยาวเท่านั้น"},{"q":"What will be placed at the teller windows?","opts":["Customer feedback forms","New account applications","Information about alternative banking methods","Maps of the renovated branch"],"answer":2,"exp":"memo ระบุว่าจะวาง Flyers explaining these options ซึ่ง these options หมายถึง mobile banking app และ ATM = ข้อมูลเกี่ยวกับช่องทางการทำธุรกรรมอื่น"}]},{"passages":[{"kind":"online chat","head":"","t":"Brian Kowalski (8:15 A.M.): Morning, team. Line 2 stopped twenty minutes ago. The labeling machine keeps jamming.\n\nAnita Desai (8:17 A.M.): Is it the same problem we had last week?\n\nBrian Kowalski (8:18 A.M.): Looks like it. The roller is wearing out again.\n\nAnita Desai (8:19 A.M.): We ordered two replacement rollers on Friday. Jun, have they arrived?\n\nJun Tanaka (8:21 A.M.): They came in yesterday afternoon. They're on the shelf in the maintenance room, second row.\n\nBrian Kowalski (8:22 A.M.): Great. I'll have one of my technicians install it right away. It should take about 45 minutes.\n\nAnita Desai (8:24 A.M.): In the meantime, can we move the Line 2 orders over to Line 3? We need to ship the Meridian Foods order by noon.\n\nJun Tanaka (8:25 A.M.): Line 3 is running at full capacity until 10:00.\n\nAnita Desai (8:26 A.M.): Understood. Then let's focus on getting Line 2 back up. Brian, please update us as soon as it's running."}],"qs":[{"q":"What problem is being discussed?","opts":["A shipment was sent to the wrong customer.","A machine is not working properly.","A production line has too few workers.","An order of parts was lost."],"answer":1,"exp":"Mr. Kowalski แจ้งว่า Line 2 หยุดเพราะ The labeling machine keeps jamming = เครื่องติดฉลากติดขัด ตัวเลือก D ผิดเพราะชิ้นส่วนมาถึงแล้วเมื่อวาน"},{"q":"What does Mr. Tanaka indicate about the replacement rollers?","opts":["They were delivered yesterday.","They need to be reordered.","They are the wrong size.","They were installed last week."],"answer":0,"exp":"Mr. Tanaka เขียนว่า They came in yesterday afternoon = มาถึงเมื่อวานบ่าย และอยู่ในห้องซ่อมบำรุง"},{"q":"At 8:25 A.M., what does Mr. Tanaka most likely mean when he writes, \"Line 3 is running at full capacity until 10:00\"?","opts":["Line 3 will need maintenance after 10:00.","Line 3 can produce the Meridian Foods order quickly.","Line 3 cannot take on the extra work now.","Line 3 will be shut down for the day."],"answer":2,"exp":"Ms. Desai ถามว่าจะย้ายงานจาก Line 2 ไป Line 3 ได้หรือไม่ การตอบว่า Line 3 เดินเครื่องเต็มกำลังถึง 10 โมง หมายความว่ารับงานเพิ่มตอนนี้ไม่ได้ และเธอจึงตอบว่า Then let's focus on getting Line 2 back up"},{"q":"What will Mr. Kowalski most likely do next?","opts":["Contact Meridian Foods","Order more rollers","Move orders to another line","Have a part replaced"],"answer":3,"exp":"Mr. Kowalski บอกว่า I'll have one of my technicians install it right away = จะให้ช่างเปลี่ยนลูกกลิ้ง (roller) ทันที ตัวเลือก C ถูกเสนอแต่ไม่ได้ทำเพราะ Line 3 เต็ม"}]},{"passages":[{"kind":"article","head":"Two Regional Publishers Join Forces\nBy Marcus Leung, Book Trade Weekly","t":"HALIFAX (March 2) — Bluewater Books and Tidemark Publishing announced yesterday that they will merge into a single company, to be called Bluewater Tidemark Media, by the end of the year. The combined firm will employ about 140 people and release more than 200 titles annually.\n\nBluewater, founded in 1987, is best known for its children's picture books, while Tidemark has built a strong reputation for travel guides and cookbooks. Executives from both companies said the merger would allow them to share distribution networks and reach readers in markets that neither could serve effectively alone.\n\n\"Our catalogs complement each other very well,\" said Tidemark president Elaine Durand, who will become chief executive of the new company. \"There is almost no overlap in what we publish.\"\n\nBluewater's current headquarters in Halifax will become the main office, while Tidemark's office in Moncton will continue to operate as an editorial center. No job cuts are planned. Both companies' imprints will keep their existing names for at least two years."}],"qs":[{"q":"What is the article mainly about?","opts":["The combining of two companies","The launch of a new book series","The opening of a bookstore","The retirement of a company president"],"answer":0,"exp":"บทความรายงานว่า Bluewater Books และ Tidemark Publishing will merge into a single company = การรวมสองบริษัทเข้าด้วยกัน"},{"q":"What is indicated about Tidemark Publishing?","opts":["It specializes in children's books.","It was founded in 1987.","It will close its Moncton office.","It publishes travel and cooking books."],"answer":3,"exp":"บทความระบุว่า Tidemark has built a strong reputation for travel guides and cookbooks ตัวเลือก A และ B เป็นข้อมูลของ Bluewater ส่วน C ผิดเพราะสำนักงาน Moncton ยังดำเนินการต่อเป็น editorial center"},{"q":"In paragraph 3, line 1, the word \"complement\" is closest in meaning to","opts":["praise","complete","copy","compete"],"answer":1,"exp":"Our catalogs complement each other หมายถึงรายการหนังสือของสองบริษัท \"เติมเต็ม/เสริมกัน\" เพราะแทบไม่ซ้ำกัน จึงใกล้เคียงกับ complete ระวังสับสนกับ compliment (ชมเชย = praise) ซึ่งออกเสียงเหมือนกัน"},{"q":"According to the article, what will happen after the merger?","opts":["Some employees will lose their jobs.","The company will move to Moncton.","Ms. Durand will lead the new company.","The imprints will be renamed immediately."],"answer":2,"exp":"บทความระบุว่า Elaine Durand will become chief executive of the new company = จะเป็นผู้นำบริษัทใหม่ ตัวเลือก A ผิดเพราะ No job cuts are planned และ D ผิดเพราะชื่อ imprint จะคงไว้อย่างน้อย 2 ปี"}]},{"passages":[{"kind":"web page","head":"www.stclairehospital.org/volunteer","t":"Volunteer at St. Claire Community Hospital\n\nOur volunteers play an important role in making patients and visitors feel welcome. [1] Volunteers greet visitors at the information desk, guide patients to appointments, deliver books and magazines to patient rooms, and help out in the gift shop.\n\nApplicants must be at least 18 years old and able to commit to one four-hour shift per week for a minimum of six months. [2] All new volunteers attend a three-hour orientation session, which covers patient privacy, hospital safety procedures, and the layout of the building.\n\nBefore starting, volunteers must also provide proof of a recent flu vaccination. [3] Volunteers receive a free meal voucher for the hospital cafeteria for every shift worked, as well as free parking in Lot C.\n\nTo apply, complete the online application form below. Our volunteer coordinator, Grace Mbeki, reviews applications every two weeks and will contact you to arrange a short interview. [4]"}],"qs":[{"q":"What is the purpose of the web page?","opts":["To recruit people for unpaid positions","To announce a hospital's new location","To advertise a gift shop sale","To describe medical services for patients"],"answer":0,"exp":"หน้าเว็บมีหัวข้อ Volunteer at St. Claire Community Hospital และอธิบายคุณสมบัติและวิธีสมัคร จึงเป็นการรับสมัครอาสาสมัคร (unpaid positions) ตัวเลือก C เป็นกับดักเพราะ gift shop เป็นเพียงงานหนึ่งของอาสาสมัคร"},{"q":"What is a requirement for volunteers?","opts":["Previous hospital experience","A medical certificate in first aid","A commitment of at least six months","Availability on weekends"],"answer":2,"exp":"หน้าเว็บระบุว่าต้อง commit to one four-hour shift per week for a minimum of six months = ทำงานอย่างน้อย 6 เดือน ตัวเลือกอื่นไม่ได้ระบุไว้"},{"q":"What is NOT mentioned as a benefit for volunteers?","opts":["Meals","Parking","Training","Transportation"],"answer":3,"exp":"หน้าเว็บกล่าวถึง meal voucher, free parking และ orientation session (training) แต่ไม่ได้กล่าวถึงการเดินทาง/รถรับส่ง (transportation)"},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"This vaccination may be received free of charge at the hospital's staff health office.\"","opts":["[1]","[2]","[3]","[4]"],"answer":2,"exp":"ประโยคนี้อ้างถึง This vaccination จึงต้องอยู่หลังประโยคที่กล่าวถึง proof of a recent flu vaccination คือตำแหน่ง [3]"}]},{"passages":[{"kind":"web page","head":"www.taskgrid.io/pricing\nTaskGrid — Plans and Pricing","t":"TaskGrid helps teams plan projects, assign tasks, and track deadlines in one place. Every plan begins with a free 30-day trial, and no credit card is needed to sign up.\n\nStarter — $8 per user per month — for teams of up to 10 users. Includes unlimited projects and file sharing. Support by e-mail.\n\nTeam — $14 per user per month — for teams of up to 50 users. Includes everything in Starter, plus integrations with popular accounting and calendar software and access to our API. Support by e-mail and live chat.\n\nEnterprise — custom pricing — for organizations of any size. Includes everything in Team, plus a dedicated account manager and 24-hour telephone support.\n\nCustomers who choose annual billing instead of monthly billing save 20 percent on any plan."},{"kind":"e-mail","head":"To: sales@taskgrid.io\nFrom: Naomi Fischer <nfischer@holtarchitects.com>\nDate: August 18\nSubject: Questions before our trial ends","t":"Hello,\n\nI am the office manager at Holt Architects, and our 18 employees have been using TaskGrid for the past four weeks as part of your free trial. Overall, the staff are very happy with it, and we would like to purchase a subscription before the trial ends next week.\n\nThe most important feature for us is the ability to link TaskGrid with the accounting program we use to bill clients. However, some of our senior architects are not comfortable with online chat and would prefer to call someone when they have a problem. Is telephone support available with your mid-priced plan, perhaps for an additional fee?\n\nAlso, since we expect to use TaskGrid for the long term, we are thinking of paying for a full year at once. Please let me know how that would affect the price.\n\nBest regards,\nNaomi Fischer"}],"qs":[{"q":"What is indicated about TaskGrid?","opts":["It charges a setup fee for new customers.","It can be tested without payment details.","It is designed only for large organizations.","It offers telephone support on every plan."],"answer":1,"exp":"เว็บไซต์ระบุว่า Every plan begins with a free 30-day trial, and no credit card is needed จึงทดลองใช้ได้โดยไม่ต้องให้ข้อมูลการชำระเงิน ตอบ B ส่วน D ผิดเพราะ telephone support มีเฉพาะ Enterprise"},{"q":"Why did Ms. Fischer write the e-mail?","opts":["To complain about a software error","To cancel a subscription","To ask for information before making a purchase","To request an extension of a trial period"],"answer":2,"exp":"เธอบอกว่า we would like to purchase a subscription before the trial ends และถามคำถามเรื่องบริการกับราคา จึงตอบ C ส่วน D เป็นกับดักเพราะเธอพูดถึง trial ends แต่ไม่ได้ขอขยายเวลา"},{"q":"Which plan will Holt Architects most likely choose?","opts":["Starter","Enterprise","A free plan","Team"],"answer":3,"exp":"Holt Architects มีพนักงาน 18 คน (เกิน 10 คนของ Starter) และต้องการเชื่อมกับโปรแกรมบัญชี (integrations) ซึ่งมีใน Team และเธอกล่าวถึง mid-priced plan จึงตอบ D ต้องเชื่อมสองข้อความ"},{"q":"What feature that Ms. Fischer asks about is NOT included in the plan she mentions?","opts":["Telephone support","Live chat support","Unlimited projects","File sharing"],"answer":0,"exp":"แผน Team (mid-priced plan) มี support by e-mail and live chat แต่ telephone support มีเฉพาะ Enterprise จึงตอบ A ส่วน B, C, D ล้วนรวมอยู่ในแผน Team"},{"q":"What will Holt Architects receive if it pays for a full year at once?","opts":["A dedicated account manager","An extra month of service","A 20 percent discount","Free access to the API"],"answer":2,"exp":"เธอบอกว่าคิดจะ paying for a full year at once ซึ่งเว็บไซต์ระบุว่า annual billing ... save 20 percent on any plan จึงตอบ C; A ผิดเพราะ account manager เป็นสิทธิ์ของ Enterprise"}]},{"passages":[{"kind":"advertisement","head":"Westbrook Professional Training Centre\nSpring Course Schedule","t":"Build the skills your career demands with our practical, instructor-led courses.\n\nProject Management Fundamentals — six Tuesday evenings, starting April 7 — in person — $480\nAdvanced Spreadsheet Skills — four Saturday mornings, starting April 11 — in person — $360\nBusiness Writing for Professionals — five weeks, starting April 14 — online only — $300\nConfident Public Speaking — two full days, May 2 and 3 — in person — $420\n\nRegistration for each course closes one week before its start date. Employers who enroll three or more employees in the same course receive 10 percent off the total fee. Full refunds are given for cancellations made at least five business days before a course begins.\n\nTo register, e-mail registrar@westbrooktraining.com."},{"kind":"e-mail","head":"To: registrar@westbrooktraining.com\nFrom: Colin Hayes <c.hayes@marlowehospital.org>\nDate: March 30\nSubject: Group registration","t":"Dear Registrar,\n\nI work in the human resources department at Marlowe General Hospital. I would like to register three members of our administrative staff — Amira Said, Joel Burke, and Tessa Lin — for Business Writing for Professionals. All three prepare reports and correspondence for the hospital's senior management.\n\nMs. Lin has mentioned that she learns best in a classroom setting, so I would be grateful if you could tell me whether she might attend the sessions at your centre instead.\n\nPlease send the invoice directly to our finance office at accounts@marlowehospital.org rather than to me, as they will process the payment.\n\nKind regards,\nColin Hayes"}],"qs":[{"q":"What is true about Advanced Spreadsheet Skills?","opts":["It is held on weekends.","It is the most expensive course.","It is offered online.","It lasts six weeks."],"answer":0,"exp":"โฆษณาระบุว่า Advanced Spreadsheet Skills จัด four Saturday mornings คือวันหยุดสุดสัปดาห์ ตอบ A ส่วน B ผิดเพราะแพงที่สุดคือ Project Management ($480) และ D ผิดเพราะหกสัปดาห์คือ Project Management"},{"q":"What is the purpose of Mr. Hayes's e-mail?","opts":["To request a refund for a course","To enroll employees in a course","To apply for a teaching position","To ask about a course's start date"],"answer":1,"exp":"Mr. Hayes เขียนว่า I would like to register three members of our administrative staff จึงเป็นการลงทะเบียนพนักงาน ตอบ B (enroll = ลงทะเบียนเรียน)"},{"q":"What is suggested about Mr. Hayes's registration?","opts":["It was submitted after the registration deadline.","It must be paid by credit card.","It includes a certificate of completion.","It qualifies for a reduced fee."],"answer":3,"exp":"เขาลงทะเบียนพนักงาน 3 คนในคอร์สเดียวกัน และโฆษณาระบุว่า three or more employees in the same course ได้ส่วนลด 10 percent จึงตอบ D; A ผิดเพราะคอร์สเริ่ม April 14 และเขาส่งอีเมล March 30 ซึ่งยังก่อนปิดรับสมัครหนึ่งสัปดาห์"},{"q":"Why will Mr. Hayes's request concerning Ms. Lin most likely be declined?","opts":["She has not paid the course fee.","The course is not taught in a classroom.","She is not a member of the administrative staff.","The course is already full."],"answer":1,"exp":"Mr. Hayes ถามว่า Ms. Lin จะเข้าเรียนที่ศูนย์ได้หรือไม่ แต่โฆษณาระบุว่า Business Writing for Professionals เป็น online only จึงตอบ B ต้องเชื่อมสองข้อความ"},{"q":"What does Mr. Hayes ask the registrar to do?","opts":["Mail course materials to the hospital","Call him to confirm the registration","Send a bill to a different department","Change the course start date"],"answer":2,"exp":"เขาขอว่า Please send the invoice directly to our finance office ... rather than to me จึงตอบ C (bill = invoice, a different department = finance office) ส่วน B ผิดเพราะไม่ได้ขอให้โทรกลับ"}]},{"passages":[{"kind":"e-mail","head":"To: All Business Customers\nFrom: Trans-Meridian Freight <updates@transmeridian.com>\nDate: August 20\nSubject: Improved service to the Northern Region","t":"Dear Valued Customer,\n\nWe are pleased to announce that, beginning September 1, all shipments to the Northern Region will be handled through our new distribution hub in Cedar Falls. As a result, standard delivery times to the region will be reduced from four business days to two.\n\nTo make this possible, the daily cutoff time for same-day pickups will change from 5:00 P.M. to 3:00 P.M. Packages collected after 3:00 P.M. will be processed on the following business day. Our express service, which guarantees next-day delivery, will continue to be available for an additional fee.\n\nThank you for choosing Trans-Meridian Freight."},{"kind":"form","head":"Trans-Meridian Freight — Shipment Tracking\nTracking No. TMF-448120","t":"Sender: Pellham Medical Supply, Riverton\nRecipient: Northbrook Community Clinic, Ashcombe (Northern Region)\nService: Standard\nContents: Diagnostic test kits (4 boxes)\n\nSept. 8, 4:20 P.M. — Picked up from sender\nSept. 9, 7:45 A.M. — Departed Cedar Falls hub\nSept. 10, 6:10 A.M. — Out for delivery: delayed (road closure)\nEstimated delivery: Sept. 11"},{"kind":"e-mail","head":"To: support@transmeridian.com\nFrom: Hannah Okoye <h.okoye@pellhammedical.com>\nDate: September 10\nSubject: Shipment TMF-448120","t":"Hello,\n\nI am writing about a shipment of test kits that we sent to Northbrook Community Clinic. When I arranged the pickup on September 8, I expected the package to arrive by September 10 because of your new two-day service. The clinic has now told me that it has not received the kits, and they need them for a screening event on the morning of September 11.\n\nI would like to know why the shipment was not processed on the day it was collected. In addition, please confirm that the delivery will be made before 9:00 A.M. tomorrow. If that cannot be guaranteed, I will need to send replacement kits by courier today.\n\nHannah Okoye\nShipping Coordinator, Pellham Medical Supply"}],"qs":[{"q":"What is the main purpose of the first e-mail?","opts":["To announce a change in a company's operations","To introduce a new express delivery service","To apologize for late deliveries","To request feedback from customers"],"answer":0,"exp":"อีเมลแรกแจ้งว่าตั้งแต่ September 1 การขนส่งไปภูมิภาคเหนือจะผ่าน hub ใหม่ และเปลี่ยน cutoff time จึงเป็นการแจ้งการเปลี่ยนแปลงการดำเนินงาน ตอบ A ส่วน B ผิดเพราะ express service มีอยู่แล้ว (continue to be available)"},{"q":"Why was the shipment most likely not processed on September 8?","opts":["The recipient's address was incorrect.","The Cedar Falls hub was not yet open.","The package was collected after the cutoff time.","The sender requested express service."],"answer":2,"exp":"ใบติดตามพัสดุแสดงว่าเก็บพัสดุเวลา 4:20 P.M. ซึ่งเลย cutoff ใหม่ 3:00 P.M. ที่ระบุในอีเมลแรก จึงถูกดำเนินการในวันทำการถัดไป ตอบ C; D ผิดเพราะในฟอร์มระบุ Service: Standard"},{"q":"According to the tracking form, what caused a delay on September 10?","opts":["Bad weather","A road closure","A missing signature","A vehicle breakdown"],"answer":1,"exp":"ใบติดตามระบุว่า Out for delivery: delayed (road closure) จึงตอบ B คำถามรายละเอียดที่ตอบได้จากข้อความที่ 2 โดยตรง"},{"q":"What is suggested about Ms. Okoye?","opts":["She works at Northbrook Community Clinic.","She chose the most expensive shipping option.","She has already sent replacement kits.","She was unaware of the new pickup schedule."],"answer":3,"exp":"Ms. Okoye ถามว่า why the shipment was not processed on the day it was collected แสดงว่าเธอไม่รู้เรื่อง cutoff time ใหม่ 3:00 P.M. จึงตอบ D; A ผิดเพราะเธอทำงานที่ Pellham Medical Supply และ C ผิดเพราะเธอเพียงบอกว่าอาจต้องส่งชุดทดแทน"},{"q":"What does Ms. Okoye want to confirm?","opts":["That the shipment will arrive before a scheduled event","That her company will receive a refund","That the clinic has paid for the test kits","That a courier will pick up the package"],"answer":0,"exp":"เธอขอว่า please confirm that the delivery will be made before 9:00 A.M. tomorrow เพราะคลินิกต้องใช้ในงาน screening event ตอนเช้า September 11 จึงตอบ A"}]},{"passages":[{"kind":"notice","head":"Greenfield General Hospital\nVolunteer Program — Join Our Team","t":"Greenfield General Hospital is looking for friendly, reliable volunteers to support patients, visitors, and staff. Volunteers may serve in one of the following roles:\n\nInformation Desk — greet visitors and give directions. Minimum commitment: four hours per week.\nPatient Escort — accompany patients to appointments within the hospital. Minimum commitment: four hours per week. Completion of a two-day training course is required.\nGift Shop — assist customers and restock merchandise. Minimum commitment: three hours per week.\n\nAll volunteers must be at least 18 years old, attend a general orientation session (held on the first Saturday of each month), and complete a health screening at the hospital's Employee Health Office before their first shift."},{"kind":"form","head":"Greenfield General Hospital — Volunteer Application\nReceived: January 14","t":"Name: Hiroshi Kato\nAge group: 65 or older\nPreferred role: Patient Escort\nAvailability: Tuesdays, 1:00–3:00 P.M.; Thursdays, 1:00–3:00 P.M.\nRelevant experience: Retired pharmacist (worked at Lakeview Pharmacy for 31 years)\nWhy do you want to volunteer? Having spent my career helping patients, I would like to continue to be useful to my community. I also enjoy walking and meeting new people."},{"kind":"e-mail","head":"To: Hiroshi Kato <hkato@fastmail.net>\nFrom: Beatriz Moreno <bmoreno@greenfieldgeneral.org>\nDate: January 17\nSubject: Your volunteer application","t":"Dear Mr. Kato,\n\nThank you for applying to volunteer at Greenfield General Hospital. Your background in health care will be very valuable to us, and the hours you have offered meet our requirements for the role you selected.\n\nYou are scheduled to attend our next orientation session on February 1 from 9:00 A.M. to noon. In addition, because of the position you chose, you will need to attend sessions on February 8 and 9. Before your first shift, please call the Employee Health Office at extension 4410 to make an appointment.\n\nI look forward to meeting you.\n\nBest regards,\nBeatriz Moreno\nVolunteer Coordinator"}],"qs":[{"q":"What is indicated about all volunteers at the hospital?","opts":["They must have medical experience.","They must attend an orientation session.","They must work at least five hours a week.","They must be available on weekends."],"answer":1,"exp":"ประกาศระบุว่า All volunteers must ... attend a general orientation session จึงตอบ B ส่วน A ผิดเพราะไม่ได้กำหนดให้มีประสบการณ์ทางการแพทย์ และ C ผิดเพราะขั้นต่ำคือ 3–4 ชั่วโมงต่อสัปดาห์"},{"q":"What is suggested about Mr. Kato's availability?","opts":["It meets the minimum weekly commitment for his chosen role.","It is limited to weekend mornings.","It will change after February 9.","It does not meet the requirements of any role."],"answer":0,"exp":"Mr. Kato ว่างวันอังคารและพฤหัส วันละ 2 ชั่วโมง รวม 4 ชั่วโมงต่อสัปดาห์ ตรงกับขั้นต่ำของ Patient Escort และ Ms. Moreno ยืนยันว่า the hours ... meet our requirements จึงตอบ A ต้องเชื่อมทั้งสามข้อความ"},{"q":"What is true about Mr. Kato?","opts":["He currently works at Lakeview Pharmacy.","He has volunteered at the hospital before.","He used to work in a health-related field.","He prefers to work at the information desk."],"answer":2,"exp":"ใบสมัครระบุว่า Retired pharmacist ... for 31 years แสดงว่าเคยทำงานด้านสุขภาพ จึงตอบ C; A ผิดเพราะเขาเกษียณแล้ว (retired) ไม่ได้ทำงานอยู่ และ D ผิดเพราะเขาเลือก Patient Escort"},{"q":"Why will Mr. Kato attend sessions on February 8 and 9?","opts":["To lead a training course for new volunteers","To complete a requirement for patient escorts","To make up for a missed orientation","To undergo a health screening"],"answer":1,"exp":"ประกาศระบุว่า Patient Escort ต้อง Completion of a two-day training course และอีเมลบอกว่า because of the position you chose ต้องเข้าเรียนสองวันคือ February 8 และ 9 จึงตอบ B; D ผิดเพราะการตรวจสุขภาพต้องโทรนัดที่ Employee Health Office แยกต่างหาก"},{"q":"What is Mr. Kato asked to do?","opts":["Submit a reference letter","Visit the gift shop","Confirm his orientation date by e-mail","Schedule an appointment by telephone"],"answer":3,"exp":"Ms. Moreno ขอให้ please call the Employee Health Office at extension 4410 to make an appointment จึงตอบ D (schedule = make an appointment) เพื่อตรวจสุขภาพตามที่ประกาศกำหนด"}]},{"passages":[{"kind":"form","head":"Larkspur Printing Co.\nPRICE QUOTATION — Q-7735\nPrepared for: Fieldstone Media (publisher of Modern Warehouse Quarterly)\nDate: October 2","t":"Item: Modern Warehouse Quarterly, Winter issue\nQuantity: 2,000 copies\nFormat: 48 pages, full color, matte cover\nBase price: $5,400\n\nOptional upgrades:\n— Glossy cover: add $300\n— Rush production (5 business days instead of the standard 10): add 15 percent to the base price\n\nDelivery is free to addresses within 50 kilometers of our plant in Dalton. A flat fee of $120 applies to deliveries beyond that distance. This quotation is valid for 30 days."},{"kind":"e-mail","head":"To: Peter Sung <psung@larkspurprinting.com>\nFrom: Alicia Romero <aromero@fieldstonemedia.com>\nDate: October 9\nSubject: Quotation Q-7735","t":"Dear Mr. Sung,\n\nThank you for the quotation for the Winter issue of Modern Warehouse Quarterly. We would like to proceed, with one change: our art director has asked for a glossy cover this time, as the issue feat
