่าเที่ยวบิน SP 218 ถูกเลื่อนเวลาออกจาก 11:20 A.M. เป็น 4:50 P.M. จึงเป็นการแจ้งการเปลี่ยนแปลงตารางเวลา ตัวเลือกเรื่อง seat upgrade ผิดเพราะที่นั่งยังเป็นที่เดิม (remains unchanged)"},{"q":"What is Ms. Raman allowed to do without paying extra?","opts":["Take a different flight within a limited period","Choose a different seat","Fly to a different destination","Bring additional luggage"],"answer":0,"exp":"อีเมลระบุว่าสามารถเปลี่ยนไปเที่ยวบินอื่นในเส้นทางเดียวกันภายใน 3 วันจากวันเดินทางเดิมได้โดยไม่มีค่าใช้จ่ายเพิ่ม (at no additional charge) ไม่ได้อนุญาตให้เปลี่ยนจุดหมายปลายทาง"}]},{"passages":[{"kind":"review","head":"Customer Reviews: Coastal Trails Kayak Tours\nRating: 4 out of 5 stars\nPosted by: Henrik Sorensen, June 30","t":"My colleagues and I booked the half-day sea kayak tour as part of a team-building trip, and overall it was an excellent experience. Our guide, Leilani, gave a thorough safety briefing and was patient with the members of our group who had never paddled before.\n\nThe route along the cliffs was spectacular, and we stopped at a small beach where the company provided sandwiches and fruit. The equipment was clean and in good condition, and the waterproof bags they lent us kept our phones dry.\n\nMy only complaint concerns the check-in process. The booking confirmation told us to arrive at the harbor office, but the tours actually leave from a dock about a kilometer away. We nearly missed our departure. The company should make the meeting point clearer on its Web site."}],"qs":[{"q":"Why did Mr. Sorensen take the tour?","opts":["He was training to become a guide.","He wanted to write a travel article.","He won the tour in a contest.","He was participating in a work-related activity."],"answer":3,"exp":"Mr. Sorensen เขียนว่าเขาและเพื่อนร่วมงาน (colleagues) จองทัวร์เป็นส่วนหนึ่งของ team-building trip จึงเป็นกิจกรรมที่เกี่ยวกับงาน ไม่มีข้อมูลว่าเขาเขียนบทความหรือได้รางวัล"},{"q":"What is NOT mentioned as something provided by the tour company?","opts":["A meal","Transportation from the hotel","Waterproof bags","Safety instructions"],"answer":1,"exp":"รีวิวกล่าวถึง safety briefing, sandwiches and fruit และ waterproof bags แต่ไม่ได้พูดถึงการรับส่งจากโรงแรม คำถาม NOT ต้องเลือกสิ่งที่ไม่ปรากฏในข้อความ"},{"q":"What does Mr. Sorensen suggest the company do?","opts":["Offer tours for beginners","Provide clearer directions to the departure location","Shorten the safety briefing","Replace some of its equipment"],"answer":1,"exp":"เขาบ่นว่าจุดนัดพบในอีเมลยืนยันไม่ตรงกับท่าเรือจริง และเสนอให้บริษัททำให้ meeting point ชัดเจนขึ้นบนเว็บไซต์ ตัวเลือกเรื่องเปลี่ยนอุปกรณ์ผิดเพราะเขาชมว่าอุปกรณ์สะอาดและอยู่ในสภาพดี"}]},{"passages":[{"kind":"memo","head":"MEMO\nTo: All Production Staff, Plant 2\nFrom: Gloria Vasquez, Quality Assurance Manager\nDate: February 10\nRe: Updated sanitation procedures","t":"Following last month's inspection by the regional food safety office, Brookfield Foods will introduce several changes to sanitation procedures on the packaging lines, effective Monday, February 24. — [1] —\n\nFirst, the cleaning of conveyor belts will move from the end of each shift to a dedicated 30-minute window at 2:00 P.M. and 10:00 P.M. Production will pause during these periods. — [2] — Second, all staff entering the packaging area must now pass through the new hand-washing station installed beside Door C. The old station near the break room will be removed.\n\nSupervisors will lead short training sessions on the new procedures during the week of February 17. — [3] — Attendance is required for everyone working on the packaging lines. — [4] — Questions may be directed to me at extension 4415."}],"qs":[{"q":"What is the main purpose of the memo?","opts":["To announce the results of a hiring process","To report damage to a conveyor belt","To explain new cleaning rules","To schedule a visit from an inspector"],"answer":2,"exp":"บันทึกแจ้งการเปลี่ยนแปลงขั้นตอนการทำความสะอาด (sanitation procedures) ในสายบรรจุภัณฑ์ ตัวเลือกเรื่องตารางการตรวจผิดเพราะการตรวจเกิดขึ้นไปแล้วเมื่อเดือนที่แล้ว (last month's inspection)"},{"q":"What will happen at 2:00 P.M. and 10:00 P.M.?","opts":["A new shift will begin.","Training sessions will be held.","Staff will take their meal breaks.","Production will temporarily stop."],"answer":3,"exp":"บันทึกระบุว่าจะทำความสะอาดสายพานในช่วง 30 นาทีเวลา 2:00 P.M. และ 10:00 P.M. และ Production will pause ซึ่งถอดความเป็น temporarily stop ส่วนการอบรมจัดในสัปดาห์ 17 กุมภาพันธ์ ไม่ใช่เวลาดังกล่าว"},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"Each session will last approximately 45 minutes and will be held in Training Room 1.\"","opts":["[1]","[2]","[3]","[4]"],"answer":2,"exp":"ประโยคนี้พูดถึง \"Each session\" จึงต้องตามหลังประโยคที่กล่าวถึง training sessions เป็นครั้งแรก คือตำแหน่ง [3] ซึ่งอยู่หลังประโยคว่าหัวหน้างานจะจัดอบรมสั้น ๆ ในสัปดาห์ 17 กุมภาพันธ์"}]},{"passages":[{"kind":"web page","head":"www.ashworthmuseum.org/evenings","t":"Ashworth Museum of Natural History — Thursday Evenings\n\nOn the first Thursday of every month, the Ashworth Museum stays open until 9:00 P.M. for Thursday Evenings, a series of talks, live music, and hands-on activities for adults. Admission after 5:00 P.M. is $12, or free for museum members.\n\nThis season's highlights:\nOctober 2 — \"Fossils Under the City\": Dr. Amara Nwosu describes the dinosaur bones found during the construction of the Lindell Street subway station.\nNovember 6 — Night at the Minerals Hall: Guests can test their skills at identifying gemstones and enjoy a jazz trio.\nDecember 4 — Winter Market: Local artists sell handmade gifts inspired by the museum's collections.\n\nFood and drinks are available for purchase in the Atrium Café. Because space is limited, guests are encouraged to reserve tickets online at least one week in advance."}],"qs":[{"q":"What is suggested about Thursday Evenings?","opts":["It is intended for adult visitors.","It takes place every Thursday.","It is free for all guests.","It is held outside the museum."],"answer":0,"exp":"เว็บเพจระบุว่าเป็นกิจกรรม \"for adults\" ตัวเลือก every Thursday ผิดเพราะจัดเฉพาะวันพฤหัสแรกของเดือน (first Thursday of every month) และไม่ได้ฟรีสำหรับทุกคน ฟรีเฉพาะสมาชิก"},{"q":"According to the Web page, what will happen on October 2?","opts":["A subway station will be opened.","Gemstones will be sold.","Local artists will display their work.","A scientist will discuss a discovery."],"answer":3,"exp":"วันที่ 2 ตุลาคม Dr. Amara Nwosu จะบรรยายเรื่องกระดูกไดโนเสาร์ที่พบระหว่างการก่อสร้างสถานีรถไฟใต้ดิน จึงเป็นนักวิทยาศาสตร์พูดถึงการค้นพบ ตัวเลือกเรื่องเปิดสถานีเป็นกับดักที่ใช้คำซ้ำจากข้อความ"},{"q":"What are visitors advised to do?","opts":["Book tickets ahead of time","Bring their own food","Arrive before 5:00 P.M.","Become museum members"],"answer":0,"exp":"เว็บเพจแนะนำให้จองตั๋วออนไลน์ล่วงหน้าอย่างน้อยหนึ่งสัปดาห์ เพราะที่นั่งมีจำกัด ตัวเลือกให้นำอาหารมาเองผิดเพราะมีอาหารขายที่ Atrium Café"}]},{"passages":[{"kind":"online chat","head":"","t":"Mateo Ruiz (8:32 A.M.): Good morning. I just got to the Fairmont Tower site. The crane operator says winds are expected to reach 50 kilometers per hour by noon.\n\nHannah Cole (8:34 A.M.): That's above our safety limit for lifting. Can we get the steel beams for the ninth floor up before then?\n\nMateo Ruiz (8:35 A.M.): Maybe half of them. The second truck isn't due until 10:30.\n\nDerek Osei (8:37 A.M.): I can call the supplier and ask whether they can send it earlier. Their yard is only 20 minutes away.\n\nHannah Cole (8:38 A.M.): Please do. If the beams don't get up today, we'll lose at least two days. The forecast for tomorrow is even worse.\n\nDerek Osei (8:46 A.M.): Just spoke to them. The driver is already on the road.\n\nHannah Cole (8:47 A.M.): Excellent. Mateo, have the crew ready to unload as soon as it arrives. And let the electrical subcontractor know they'll need to wait until the lifting is finished before they start on the eighth floor.\n\nMateo Ruiz (8:48 A.M.): Will do."}],"qs":[{"q":"What problem are the writers mainly discussing?","opts":["A crane has broken down.","Weather conditions may stop some work.","A supplier has sent the wrong materials.","A subcontractor has not arrived."],"answer":1,"exp":"Mr. Ruiz แจ้งว่าลมจะแรงถึง 50 กม./ชม. ภายในเที่ยง ซึ่งเกินขีดจำกัดความปลอดภัยในการยกของ (safety limit for lifting) จึงเป็นปัญหาสภาพอากาศที่อาจทำให้งานหยุด ไม่มีข้อมูลว่าเครนเสีย"},{"q":"What does Ms. Cole indicate about a delay?","opts":["It would require hiring more workers.","It would affect the project schedule by several days.","It has already been reported to the client.","It was caused by the electrical subcontractor."],"answer":1,"exp":"Ms. Cole เขียนว่าถ้ายกคานขึ้นไม่ได้วันนี้ จะเสียเวลาอย่างน้อยสองวัน และพยากรณ์วันพรุ่งนี้แย่กว่า จึงกระทบตารางงานหลายวัน ตัวเลือกเรื่อง subcontractor ผิดเพราะผู้รับเหมาไฟฟ้าเพียงแต่ต้องรอ"},{"q":"At 8:46 A.M., what does Mr. Osei most likely mean when he writes, \"The driver is already on the road\"?","opts":["The second delivery will arrive early.","The supplier refused his request.","The driver is lost.","The beams have been delivered to the wrong site."],"answer":0,"exp":"Mr. Osei ไปขอให้ supplier ส่งรถคันที่สองเร็วขึ้น การบอกว่าคนขับออกเดินทางแล้วหมายความว่าคำขอสำเร็จ ของจะมาถึงก่อน 10:30 ซึ่ง Ms. Cole ตอบรับว่า Excellent ยืนยันความหมายนี้"},{"q":"What is Mr. Ruiz asked to do?","opts":["Contact the crane operator","Check tomorrow's forecast","Prepare workers to receive a delivery","Begin electrical work on the eighth floor"],"answer":2,"exp":"Ms. Cole ขอให้ Mr. Ruiz เตรียมทีมงานให้พร้อมขนของลงทันทีที่รถมาถึง (have the crew ready to unload) ส่วนงานไฟฟ้าชั้นแปดต้องรอจนการยกเสร็จ จึงเป็นกับดัก"}]},{"passages":[{"kind":"article","head":"Veltrona Pharmaceuticals to Open Research Center in Graystone\nBy Owen Prescott, Midstate Business Weekly","t":"GRAYSTONE (May 14) — Veltrona Pharmaceuticals announced on Tuesday that it will build a $120 million research center on a 12-acre site near the Graystone University campus. — [1] — Construction is scheduled to begin in September, and the facility is expected to open in early 2029.\n\nThe center will focus on developing treatments for allergies and respiratory conditions, an area in which Veltrona has seen strong growth over the past five years. The company plans to hire about 250 scientists and technicians, many of whom will be recruited from the university's graduate programs. — [2] —\n\n\"Graystone gives us access to outstanding talent and an established network of research partners,\" said Veltrona chief executive Lorraine Hsu. \"We considered several other locations, but none offered the same combination of advantages.\" — [3] —\n\nCity officials welcomed the news. Mayor Daniel Okoro noted that the project would also create roughly 400 temporary construction jobs. — [4] — Veltrona currently operates manufacturing plants in Ohio and Indiana, and its headquarters will remain in Columbus."}],"qs":[{"q":"What is the article mainly about?","opts":["The relocation of a company headquarters","The merger of two pharmaceutical firms","A new university degree program","A company's plan to build a new facility"],"answer":3,"exp":"บทความรายงานว่า Veltrona จะสร้างศูนย์วิจัยมูลค่า $120 ล้านใน Graystone ตัวเลือกเรื่องย้ายสำนักงานใหญ่ผิดเพราะบทความระบุว่าสำนักงานใหญ่ยังอยู่ที่ Columbus (will remain)"},{"q":"What is indicated about Veltrona Pharmaceuticals?","opts":["It has never operated in Ohio.","It recently closed a manufacturing plant.","It expects to employ graduates of a local university.","It will begin construction in early 2029."],"answer":2,"exp":"บทความระบุว่าบริษัทจะจ้างนักวิทยาศาสตร์และช่างเทคนิคราว 250 คน ซึ่งหลายคนมาจากหลักสูตรบัณฑิตศึกษาของมหาวิทยาลัย ตัวเลือก early 2029 เป็นกับดักเพราะนั่นคือกำหนดเปิด ไม่ใช่เริ่มก่อสร้าง (September)"},{"q":"In paragraph 3, line 1, the word \"outstanding\" is closest in meaning to","opts":["unpaid","remaining","excellent","visible"],"answer":2,"exp":"ในบริบท \"access to outstanding talent\" คำว่า outstanding หมายถึงยอดเยี่ยม (excellent) ความหมาย unpaid (ค้างชำระ) ใช้กับหนี้หรือบิล เช่น outstanding balance จึงไม่เหมาะกับบริบทนี้"},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"Those positions are in addition to the permanent research staff.\"","opts":["[1]","[2]","[3]","[4]"],"answer":3,"exp":"\"Those positions\" ต้องอ้างถึงตำแหน่งงานที่เพิ่งกล่าวถึงและแตกต่างจากพนักงานวิจัยถาวร คือ 400 temporary construction jobs จึงต้องอยู่ที่ตำแหน่ง [4] หลังคำพูดของนายกเทศมนตรี"}]},{"passages":[{"kind":"letter","head":"Barrington & Pell LLP\n900 Commerce Plaza, Suite 1200\nAtlanta, GA 30303\n\nMarch 18\n\nMr. Victor Almeida\nAlmeida Restaurant Group\n57 Peachtree Lane\nAtlanta, GA 30309","t":"Dear Mr. Almeida,\n\nThank you for choosing Barrington & Pell to assist Almeida Restaurant Group with the lease negotiations for your planned location at Riverside Commons. This letter confirms the terms of our engagement.\n\nMs. Naomi Fischer, a partner in our real estate practice, will lead your matter. She will be supported by associate Kevin Tran, who will handle the day-to-day review of documents. Our fees will be billed monthly at the hourly rates listed in the enclosed schedule. As discussed at our meeting on March 12, we will cap the total fees for the initial lease review at $6,500.\n\nTo proceed, please sign the enclosed copy of this letter and return it to our office, along with a retainer of $2,000, by March 31. Once we receive these, Ms. Fischer will contact the landlord's representatives to request the draft lease.\n\nWe look forward to working with you.\n\nSincerely,\n\nGerald Pell\nManaging Partner"}],"qs":[{"q":"Why was the letter written?","opts":["To confirm an agreement for legal services","To offer Mr. Almeida a position at a law firm","To request payment of an overdue bill","To invite Mr. Almeida to a meeting"],"answer":0,"exp":"จดหมายระบุว่า \"This letter confirms the terms of our engagement\" คือยืนยันข้อตกลงการว่าจ้างบริการทางกฎหมาย ตัวเลือกเรื่องเชิญประชุมผิดเพราะการประชุมเกิดขึ้นแล้วเมื่อ 12 มีนาคม"},{"q":"What is Almeida Restaurant Group most likely planning to do?","opts":["Open a restaurant at a new location","Sell one of its restaurants","Hire a new managing partner","Purchase a commercial building"],"answer":0,"exp":"บริษัทต้องการความช่วยเหลือในการเจรจาสัญญาเช่า (lease negotiations) สำหรับสาขาที่วางแผนไว้ที่ Riverside Commons จึงน่าจะเปิดร้านอาหารที่ใหม่ การเช่าไม่ใช่การซื้ออาคาร"},{"q":"What is indicated about the fees?","opts":["They will be paid in a single payment.","They are lower than those of other firms.","A limit was agreed on for part of the work.","They will be calculated by Mr. Tran."],"answer":2,"exp":"จดหมายระบุว่าตามที่ตกลงในการประชุม จะจำกัดค่าธรรมเนียมการตรวจสัญญาเช่าเบื้องต้นไว้ที่ $6,500 (cap the total fees) ตัวเลือก single payment ผิดเพราะเรียกเก็บเป็นรายเดือน (billed monthly)"},{"q":"What will Ms. Fischer do after the signed letter is received?","opts":["Send Mr. Almeida a revised fee schedule","Arrange a meeting with Mr. Tran","Ask for a document from the landlord","Visit the location at Riverside Commons"],"answer":2,"exp":"เมื่อได้รับจดหมายที่ลงนามและเงิน retainer แล้ว Ms. Fischer จะติดต่อตัวแทนเจ้าของที่เพื่อขอร่างสัญญาเช่า (request the draft lease) ซึ่งถอดความเป็นการขอเอกสารจากเจ้าของที่"}]},{"passages":[{"kind":"web page","head":"www.lumorahome.com/help/returns\nLumora Home Goods — Returns & Exchanges","t":"We want you to love every item you order from Lumora. If you are not completely satisfied, most products may be returned or exchanged within 30 days of delivery.\n\nPlease note that items marked \"Final Clearance\" cannot be returned or exchanged.\n\nReturn shipping is free for Lumora Plus members. For all other customers, a return shipping fee of $7.95 will be deducted from the refund amount. For exchanges, this fee is waived if the original item was damaged or sent in error.\n\nLarge furniture items weighing more than 20 kg must be scheduled for collection through our Customer Care team. A $25 collection fee applies, which is waived for orders totaling more than $300.\n\nRefunds are issued to the original payment method within five business days after the item arrives at our returns center in Reno, Nevada."},{"kind":"e-mail","head":"To: customercare@lumorahome.com\nFrom: Gabriel Ferreira <gferreira@quickpost.net>\nDate: April 19\nSubject: Order LH-40217","t":"Dear Customer Care,\n\nOn April 2, I received the five-shelf bookcase I ordered (order number LH-40217, $280). Although I selected the dark walnut color on your Web site, the bookcase arrived in a light oak finish. Unfortunately, it does not match the other furniture in my study.\n\nRather than a refund, I would prefer to exchange it for the walnut version. Because the bookcase weighs 24 kg, I understand that I cannot simply send it back by courier myself. Could you let me know what dates are available for someone to come and pick it up? I am also not a Lumora Plus member, so I would appreciate confirmation of any charges before the collection is arranged.\n\nFinally, could you check whether the walnut model is currently in stock? If it is not, I may consider a different style.\n\nThank you,\nGabriel Ferreira"}],"qs":[{"q":"What is stated about Lumora Home Goods?","opts":["It operates several retail stores in Reno.","It charges some customers for return shipping.","It accepts returns of all discounted products.","It issues refunds on the day an item is shipped back."],"answer":1,"exp":"หน้าเว็บระบุว่าลูกค้าที่ไม่ใช่สมาชิก Lumora Plus จะถูกหักค่าส่งคืน $7.95 จากเงินคืน จึงตอบ B ส่วน C ผิดเพราะสินค้า \"Final Clearance\" คืนไม่ได้ และ D ผิดเพราะคืนเงินภายในห้าวันทำการหลังสินค้าถึงศูนย์รับคืน"},{"q":"Why did Mr. Ferreira write the e-mail?","opts":["To arrange the replacement of an incorrect item","To complain about a late delivery","To ask for a full refund","To cancel a membership"],"answer":0,"exp":"คุณ Ferreira ได้รับชั้นหนังสือสีผิด (oak แทน walnut) และเขียนว่า I would prefer to exchange it จึงต้องการเปลี่ยนสินค้า ตอบ A ส่วน C เป็นกับดักเพราะเขาเขียนชัดว่า Rather than a refund"},{"q":"What will Mr. Ferreira most likely have to do?","opts":["Visit the returns center in Reno","Join the Lumora Plus program","Pay a fee for the bookcase to be collected","Send the bookcase by courier"],"answer":2,"exp":"ต้องเชื่อมสองข้อความ: ชั้นหนังสือหนัก 24 kg (เกิน 20 kg) จึงต้องนัดให้มารับ และยอดสั่งซื้อ $280 ไม่ถึง $300 ค่าธรรมเนียม collection fee $25 จึงไม่ได้รับการยกเว้น ตอบ C ส่วน D ผิดเพราะเขาเองบอกว่าส่งเองไม่ได้"},{"q":"What is true about Mr. Ferreira's request?","opts":["It concerns an item marked \"Final Clearance.\"","It was sent before the item was delivered.","It was made after the return period ended.","It was submitted within the allowed time period."],"answer":3,"exp":"เชื่อมข้อมูล: นโยบายให้คืนภายใน 30 วันหลังส่งถึง สินค้าส่งถึง April 2 และอีเมลส่ง April 19 คือ 17 วัน จึงอยู่ในกำหนด ตอบ D ส่วน C ผิดเพราะยังไม่เกิน 30 วัน"},{"q":"In the e-mail, the word \"finish\" in paragraph 1, line 3, is closest in meaning to","opts":["coating","completion","border","goal"],"answer":0,"exp":"ในบริบท arrived in a light oak finish หมายถึงผิวเคลือบ/สีของพื้นผิวเฟอร์นิเจอร์ จึงใกล้กับ coating ตอบ A ส่วน completion เป็นความหมายของ finish ในฐานะ 'การจบ' ซึ่งไม่เข้ากับบริบท"}]},{"passages":[{"kind":"advertisement","head":"Saffron & Sage Kitchen — Corporate Catering","t":"Impress your clients and reward your team with fresh, locally sourced meals from Saffron & Sage, downtown Fairmont's favorite Mediterranean restaurant.\n\nExpress Box — $14 per person (minimum 10 people)\nA wrap or sandwich, side salad, and bottled drink, individually packed.\n\nMediterranean Buffet — $22 per person (minimum 20 people)\nA choice of three hot dishes, two salads, and fresh bread. Our staff will set up the buffet and collect the equipment afterward.\n\nExecutive Banquet — $35 per person (minimum 30 people)\nA plated three-course meal, served by our uniformed waitstaff, with table linens included.\n\nAll orders must be placed at least 72 hours in advance. Delivery is free within 15 km of our downtown location; a $40 charge applies to addresses farther away. First-time corporate clients receive a complimentary dessert platter with their order. Call 555-0148 or e-mail catering@saffronsage.com."},{"kind":"e-mail","head":"To: catering@saffronsage.com\nFrom: Nadia Brooks <nbrooks@pellhamvoss.com>\nDate: June 3\nSubject: Catering request for June 10","t":"Hello,\n\nI am the office manager at Pellham & Voss Consulting. We are hosting a half-day workshop for our clients on June 10 and would like to arrange lunch for 25 attendees. Our firm has never used your services before, but a colleague at another company recommended you highly.\n\nWe would like hot food, and it would be very helpful if your staff could arrange everything on site, as our team will be busy running the workshop. However, we do not need anyone to serve the meal at the tables. Our office is located in the Westbridge Business Center, approximately 22 km from downtown Fairmont.\n\nOne of our guests has a severe nut allergy. Would it be possible for your kitchen to clearly label any dishes that contain nuts?\n\nI look forward to your reply.\n\nNadia Brooks"}],"qs":[{"q":"What is indicated about Saffron & Sage Kitchen?","opts":["It has recently opened a second location.","It serves only vegetarian dishes.","It requires orders to be placed several days ahead.","It provides catering on weekends only."],"answer":2,"exp":"โฆษณาระบุ All orders must be placed at least 72 hours in advance (ล่วงหน้า 3 วัน) ตรงกับ several days ahead ตอบ C ส่วนตัวเลือกอื่นไม่มีข้อมูลรองรับ"},{"q":"Which package will Ms. Brooks most likely order?","opts":["Express Box","Mediterranean Buffet","Executive Banquet","A custom package"],"answer":1,"exp":"เชื่อมข้อมูล: เธอต้องการอาหารร้อน มี 25 คน (ถึงขั้นต่ำ 20) ต้องการให้พนักงานจัดเตรียมแต่ไม่ต้องเสิร์ฟที่โต๊ะ ตรงกับ Mediterranean Buffet ตอบ B ส่วน Executive Banquet ต้องมีขั้นต่ำ 30 คนและมีพนักงานเสิร์ฟ"},{"q":"What will Pellham & Voss Consulting most likely be charged for?","opts":["Table linens","A dessert platter","Additional servers","Delivery"],"answer":3,"exp":"สำนักงานอยู่ห่าง downtown 22 km เกินระยะส่งฟรี 15 km จึงต้องเสียค่าส่ง $40 ตอบ D ส่วน dessert platter ได้ฟรีเพราะเป็นลูกค้าใหม่"},{"q":"What is suggested about Pellham & Voss Consulting?","opts":["It has ordered from Saffron & Sage in the past.","It is located in downtown Fairmont.","It will receive a complimentary item.","It holds client workshops every month."],"answer":2,"exp":"อีเมลบอก Our firm has never used your services before และโฆษณาระบุว่าลูกค้าองค์กรครั้งแรกได้ complimentary dessert platter จึงตอบ C ส่วน A ขัดกับข้อมูลในอีเมลโดยตรง"},{"q":"What does Ms. Brooks ask about?","opts":["Whether dishes containing certain ingredients can be identified","Whether payment can be made upon delivery","Whether the event date can be changed","Whether a printed menu can be mailed to her"],"answer":0,"exp":"เธอถามว่าครัวสามารถ clearly label any dishes that contain nuts ได้หรือไม่ ซึ่ง paraphrase เป็น identified ตอบ A"}]},{"passages":[{"kind":"web page","head":"www.harrowridgepark.com/leasing\nHarrow Ridge Business Park — Available Units","t":"Developed by Calder Build Group, Harrow Ridge Business Park offers modern, energy-efficient office space just off Highway 9.\n\nBuilding A (completed)\nUnit A3 — 180 sq m, ground floor — $3,200 per month — available immediately\n\nBuilding B (under construction; completion expected September 1)\nUnit B1 — 250 sq m, ground floor — $4,100 per month\nUnit B5 — 140 sq m, top floor with private rooftop terrace — $2,900 per month\n\nBuilding C (planned; construction to begin next spring)\nUnits will be announced at a later date.\n\nTenants who sign a lease of three years or longer for a unit in Building B before construction is completed will receive their first two months rent-free. Contact our leasing agent, Larkspur Realty, to schedule a tour."},{"kind":"e-mail","head":"To: Monica Adeyemi <madeyemi@adeyemiconsult.com>\nFrom: Theo Lindqvist <tlindqvist@larkspurrealty.com>\nDate: July 10\nSubject: Harrow Ridge follow-up","t":"Dear Ms. Adeyemi,\n\nThank you for touring Harrow Ridge with me on Tuesday. I was delighted to hear that you are seriously considering the unit with the rooftop terrace for your team.\n\nI should let you know that Calder Build informed me this morning that work on Building B is running approximately three weeks behind schedule because of a delay in the delivery of glass panels. The developer has assured me that the revised date is firm.\n\nIf you would like to secure the unit, please let me know which lease term you prefer so that I can prepare the paperwork. I would be happy to answer any questions in the meantime.\n\nBest regards,\nTheo Lindqvist\nLarkspur Realty"},{"kind":"text message chain","head":"","t":"Monica Adeyemi (2:12 P.M.): Theo just e-mailed. The new building won't be ready until three weeks after the original date.\n\nRavi Shah (2:14 P.M.): Our lease here ends on September 15, doesn't it?\n\nMonica Adeyemi (2:15 P.M.): Don't remind me. Still, I'm going to sign the four-year lease. Not paying rent for the first two months makes up for a lot.\n\nRavi Shah (2:16 P.M.): Agreed. We could put the furniture in storage for a week or two and work from home.\n\nMonica Adeyemi (2:18 P.M.): Good idea. Please get quotes from a couple of moving companies for the end of September."}],"qs":[{"q":"What is indicated about Building C?","opts":["It includes units with rooftop terraces.","It has already been fully leased.","It will be completed before Building B.","It has not yet been constructed."],"answer":3,"exp":"หน้าเว็บระบุว่า Building C อยู่ในขั้น planned และ construction to begin next spring แสดงว่ายังไม่ได้สร้าง ตอบ D ส่วน C ผิดเพราะ Building B กำลังก่อสร้างอยู่แล้วและจะเสร็จก่อน"},{"q":"How much monthly rent will Ms. Adeyemi's company pay once the rent-free period ends?","opts":["$2,900","$3,200","$4,100","$4,400"],"answer":0,"exp":"เชื่อมข้อมูล: อีเมลบอกว่าเธอสนใจ the unit with the rooftop terrace ซึ่งในหน้าเว็บคือ Unit B5 ราคา $2,900 ต่อเดือน ตอบ A ส่วน $3,200 เป็นราคาของ Unit A3"},{"q":"When will Building B most likely be completed?","opts":["In early September","In late September","In mid-October","Next spring"],"answer":1,"exp":"หน้าเว็บระบุกำหนดเดิม September 1 และอีเมลบอกว่าล่าช้าประมาณสามสัปดาห์ จึงเสร็จราวปลายเดือนกันยายน ตอบ B ซึ่งสอดคล้องกับที่ Ms. Adeyemi ให้หาบริษัทขนย้ายช่วง end of September"},{"q":"What will Ms. Adeyemi's company most likely receive?","opts":["A discount on parking","A reduced moving fee","Two months without rent","Free furniture storage"],"answer":2,"exp":"เธอจะเซ็นสัญญาสี่ปี (three years or longer) ก่อนอาคารสร้างเสร็จ ซึ่งตามหน้าเว็บจะได้ first two months rent-free ตอบ C ส่วน D เป็นกับดักเพราะการฝากเฟอร์นิเจอร์เป็นแค่ความคิดของ Ravi ไม่ใช่สิทธิประโยชน์"},{"q":"At 2:15 P.M., what does Ms. Adeyemi most likely mean when she writes, \"Don't remind me\"?","opts":["She does not want to discuss the move at all.","She is already aware that the timing causes a problem.","She has forgotten when the current lease ends.","She wants Mr. Shah to set up a calendar reminder."],"answer":1,"exp":"สัญญาเช่าเดิมหมด September 15 แต่อาคารใหม่จะพร้อมราวปลายเดือน การตอบว่า Don't remind me แสดงว่าเธอรู้อยู่แล้วว่าช่วงเวลาไม่ต่อเนื่องเป็นปัญหา ตอบ B ส่วน A ผิดเพราะเธอยังคุยเรื่องการย้ายต่อ"}]},{"passages":[{"kind":"web page","head":"www.coastlineair.com/baggage\nCoastline Air — Checked Baggage Allowance","t":"Your checked baggage allowance depends on the fare you purchase.\n\nBasic: No checked bags included. First checked bag: $35.\nStandard: One checked bag (up to 23 kg) included.\nFlex: Two checked bags (up to 23 kg each) included, plus free flight changes.\n\nEach additional bag beyond your allowance costs $45. Bags weighing between 23 kg and 32 kg are subject to an overweight fee of $60. Sports equipment, such as golf bags and skis, counts as one checked bag and is subject to the same fees.\n\nFare upgrades can be purchased through Manage My Booking up to 24 hours before departure."},{"kind":"e-mail","head":"To: Helena Strand <hstrand@nordmail.com>\nFrom: Coastline Air <reservations@coastlineair.com>\nDate: September 12\nSubject: Booking confirmation — HZ7Q2P","t":"Dear Ms. Strand,\n\nThank you for choosing Coastline Air. Your booking is confirmed.\n\nOutbound: Flight CA 418, Vancouver (YVR) to San Diego (SAN), October 3, departing 8:25 A.M.\nReturn: Flight CA 421, San Diego (SAN) to Vancouver (YVR), October 10, departing 5:40 P.M.\nFare type: Standard\n\nOnline check-in opens 24 hours before departure. As this is an international journey, please make sure to bring a valid passport. Bag drop counters close 60 minutes before departure.\n\nWe wish you a pleasant trip."},{"kind":"form","head":"Coastline Air — Customer Feedback\nName: Helena Strand\nBooking reference: HZ7Q2P\nDate submitted: October 5","t":"Overall, my flight to San Diego was comfortable, and the cabin crew were attentive and friendly. Although we left the gate about 40 minutes late because of fog, the captain kept us well informed throughout.\n\nHowever, I was surprised at the bag drop when I was charged $45 for my golf clubs. I had checked one suitcase, which weighed only 19 kg, so I assumed the clubs would be accepted free of charge, as they were on another airline I flew with recently.\n\nI will be bringing the clubs home on my return flight next week. Could you let me know whether changing my fare would help me avoid paying this charge again?"}],"qs":[{"q":"What is the purpose of the web page?","opts":["To advertise discounted international fares","To announce a change to check-in procedures","To describe a new rewards program","To explain how much luggage passengers may bring"],"answer":3,"exp":"หน้าเว็บอธิบาย Checked Baggage Allowance ตามประเภทตั๋ว และค่าธรรมเนียมกระเป๋าเพิ่ม จึงตอบ D ส่วนตัวเลือกอื่นไม่ใช่จุดประสงค์หลัก"},{"q":"What does the e-mail advise Ms. Strand to do?","opts":["Bring an identification document","Check in at the airport only","Arrive at the gate two hours early","Pay for her seat in advance"],"answer":0,"exp":"อีเมลเขียนว่า please make sure to bring a valid passport ซึ่ง paraphrase เป็น identification document ตอบ A ส่วน C ผิดเพราะระบุเพียงว่าเคาน์เตอร์ bag drop ปิด 60 นาทีก่อนออกเดินทาง"},{"q":"Why was Ms. Strand charged $45?","opts":["Her suitcase exceeded the weight limit.","She had purchased a Basic fare.","Her fare covers only one checked bag.","She checked in after the deadline."],"answer":2,"exp":"เชื่อมสามข้อความ: ตั๋วของเธอเป็น Standard ซึ่งรวมกระเป๋าได้ 1 ใบ อุปกรณ์กีฬานับเป็นกระเป๋า 1 ใบ ดังนั้นถุงกอล์ฟคือกระเป๋าใบที่สองซึ่งคิด $45 ตอบ C ส่วน A ผิดเพราะกระเป๋าหนักเพียง 19 kg"},{"q":"What does Ms. Strand mention about her flight to San Diego?","opts":["It was moved to a different gate.","It departed later than scheduled.","It had no cabin crew on board.","It was canceled because of fog."],"answer":1,"exp":"แบบฟอร์มระบุ we left the gate about 40 minutes late because of fog จึงตอบ B ส่วน D เป็นกับดักคำซ้ำ (fog) แต่เที่ยวบินไม่ได้ถูกยกเลิก"},{"q":"What would most likely happen if Ms. Strand changed to a Flex fare for her return flight?","opts":["She would receive a free meal.","She could select a window seat.","Her flight would depart earlier.","She would not pay for her second bag."],"answer":3,"exp":"ตั๋ว Flex รวมกระเป๋าโหลดได้สองใบ เธอมีกระเป๋าเดินทางหนึ่งใบและถุงกอล์ฟหนึ่งใบ จึงไม่ต้องจ่ายค่ากระเป๋าใบที่สอง ตอบ D"}]},{"passages":[{"kind":"notice","head":"Dunmore Museum of Science\nAfter Hours: Adult Evenings — November","t":"This November, enjoy the museum after dark! Our After Hours series offers adults (18+) the chance to explore the galleries with live music, refreshments, and special programs from 6:30 P.M. to 10:00 P.M.\n\nFriday, November 7 — Into the Stars: A special planetarium presentation on newly discovered planets\nFriday, November 14 — Deep Blue: A talk by marine biologist Dr. Lena Ortiz on coral reef recovery\nFriday, November 21 — Bright Ideas: A hands-on workshop where guests build simple machines\n\nTickets are $25 for the general public and $18 for museum members. Groups of 10 or more receive 15 percent off when booking by phone at 555-0172. Food trucks will be parked in the museum courtyard each evening."},{"kind":"e-mail","head":"To: events@dunmoremuseum.org\nFrom: Carla Mendes <cmendes@veranopharma.com>\nDate: October 28\nSubject: Group booking confirmation","t":"Hello,\n\nThank you for taking my call this morning. As discussed, I am writing to confirm our reservation for 12 employees from Verano Pharmaceuticals for your After Hours event featuring the ocean scientist. Many of our staff work in research, and they are especially interested in the topic of reef recovery.\n\nPlease send the tickets to this e-mail address. I would also appreciate it if you could let me know whether any part of the courtyard can be reserved for our group to gather before the program begins.\n\nKind regards,\nCarla Mendes\nEmployee Engagement Coordinator"},{"kind":"review","head":"Posted by: J. Whitaker\nRating: 4 out of 5","t":"My coworkers and I attended After Hours last Friday, and it was a great night out. Unfortunately, the speaker we had come to hear was ill and could not attend. Instead, the museum's head curator gave a lively talk about the marine collection, and we were allowed into a gallery that is normally closed to visitors.\n\nThe food trucks were excellent, although the lines were long. To make up for the change in the program, the museum gave everyone a voucher for free admission on a future visit, which I thought was a very generous gesture."}],"qs":[{"q":"What is NOT mentioned as part of the After Hours series?","opts":["A behind-the-scenes storage tour","A planetarium presentation","A talk by a scientist","A hands-on workshop"],"answer":0,"exp":"ประกาศระบุ planetarium presentation, talk by marine biologist และ hands-on workshop แต่ไม่ได้กล่าวถึงทัวร์ห้องเก็บของ จึงตอบ A (คำถาม NOT ต้องหาข้อที่ไม่มีในบทความ)"},{"q":"On what date did Verano Pharmaceuticals employees most likely attend the event?","opts":["November 7","November 14","November 21","November 28"],"answer":1,"exp":"อีเมลจองงานที่มี the ocean scientist และหัวข้อ reef recovery ซึ่งตรงกับวันที่ November 14 (Deep Blue) ในประกาศ ตอบ B"},{"q":"What is indicated about Ms. Mendes's reservation?","opts":["It was made through the museum's Web site.","It included a museum membership.","It qualified for a reduced price.","It was for a planetarium show."],"answer":2,"exp":"เธอจองให้พนักงาน 12 คน (10 คนขึ้นไป) และจองทางโทรศัพท์ (Thank you for taking my call) จึงได้ส่วนลด 15 percent ตามประกาศ ตอบ C ส่วน A ผิดเพราะจองทางโทรศัพท์ไม่ใช่เว็บไซต์"},{"q":"According to the review, who did not appear as planned?","opts":["A museum curator","A food vendor","A museum member","A marine scientist"],"answer":3,"exp":"รีวิวบอกว่า the speaker we had come to hear was ill และเมื่อเชื่อมกับประกาศ ผู้บรรยายคือนักชีววิทยาทางทะเล Dr. Lena Ortiz ตอบ D ส่วน A เป็นกับดักเพราะภัณฑารักษ์เป็นผู้มาบรรยายแทน"},{"q":"What did the museum offer attendees?","opts":["A free annual membership","A credit toward a future visit","A gift from the museum shop","A cash refund"],"answer":1,"exp":"รีวิวระบุว่าพิพิธภัณฑ์ให้ voucher for free admission on a future visit ซึ่งตรงกับ credit toward a future visit ตอบ B ส่วน D ผิดเพราะไม่ใช่การคืนเงินสด"}]}]},{"p1":[{"scene":"A worker in a warehouse is holding a handheld scanner over the label on a package. Other boxes are moving along a conveyor beside him.","svg":"warehouse","opts":["He's taping a box closed.","He's scanning a package.","Some boxes are being loaded onto a truck.","He's repairing a conveyor belt."],"answer":1,"exp":"ชายคนนี้ถือเครื่องสแกนส่องที่ฉลากกล่อง จึงตรงกับ 'scannin และสมุดวางเปิดอยู่บนโต๊ะ ไม่ได้ซ้อนบนเก้าอี้"},{"scene":"Tourists with backpacks are walking up a ramp onto a sightseeing boat at a harbor. A crew member is standing at the top of the ramp.","svg":"dock","opts":["Passengers are boarding a vessel.","A boat is sailing out of the harbor.","Tourists are swimming near the pier.","A crew member is tying a rope to a post."],"answer":0,"exp":"นักท่องเที่ยวกำลังเดินขึ้นเรือ ตรงกับ 'boarding a vessel' (vessel = เรือ) ตัวลวงเรื่องเรือแล่นออกผิดเพราะเรือยังจอดอยู่ และลูกเรือเพียงยืนอยู่ ไม่ได้ผูกเชือก"}],"p2":[{"q":"When is the grand opening of our downtown branch?","opts":["Downtown, near the bank.","The store is quite large.","On the first of next month."],"answer":2,"exp":"When ถามเวลา คำตอบระบุวันที่ ตัวลวงซ้ำคำ downtown แต่ตอบเรื่องสถานที่ และอีกตัวบรรยายขนาดร้าน"},{"q":"Who's the lead attorney on the merger case?","opts":["Ms. Delgado is in charge of it.","It's a heavy suitcase.","They merged last year."],"answer":0,"exp":"Who ต้องการบุคคล คำตอบระบุ Ms. Delgado ตัวลวงใช้คำ case ในความหมายกระเป๋า (suitcase) และใช้คำ merged ซ้ำ"},{"q":"Where do I pick up my rental car?","opts":["It's a compact model.","At Counter 3, just past baggage claim.","I'll pick you up at six."],"answer":1,"exp":"Where ถามสถานที่ คำตอบบอกเคาน์เตอร์หมายเลข 3 ตัวลวงพูดถึงรุ่นรถ และใช้ pick up ในความหมายไปรับคน"},{"q":"How often are the gas lines inspected?","opts":["Twice a year, in spring and fall.","Yes, the inspector is here.","About forty kilometers."],"answer":0,"exp":"How often ถามความถี่ คำตอบบอกปีละสองครั้ง ตัวลวงใช้คำ inspector ที่คล้าย inspected และ Yes ใช้กับคำถาม WH ไม่ได้"},{"q":"Did the vaccine shipment arrive in good condition?","opts":["On the loading dock.","Yes, the cold storage worked perfectly.","It's shipping next week."],"answer":1,"exp":"คำถาม yes/no คำตอบยืนยันพร้อมเหตุผลว่าระบบเก็บความเย็นทำงานดี ตัวลวงบอกสถานที่ และใช้ tense อนาคตขัดกับคำถามที่ว่ามาถึงแล้ว"},{"q":"Would you like to see the dessert menu?","opts":["The desert is opts":["It's a business trip.","About three hundred dollars each way.","Yes, the upgrade was great."],"answer":1,"exp":"How much ถามราคา คำตอบให้ตัวเลข ตัวลวงซ้ำคำ business และ upgrade แต่ไม่ได้ตอบเรื่องราคา"},{"q":"Let's post some customer reviews on the product page.","opts":["I reviewed the page numbers.","It's our best product.","Good idea, that should build trust."],"answer":2,"exp":"Let's... เป็นการเสนอแนะ คำตอบเห็นด้วยพร้อมเหตุผล ตัวลวงซ้ำคำ reviewed และ product"},{"q":"Isn't the clinical trial starting this month?","opts":["You'd better ask Dr. Ferris about that.","I tried it yesterday.","At the medical center."],"answer":0,"exp":"คำตอบอ้อม ผู้ตอบไม่แน่ใจจึงแนะนำให้ถาม Dr. Ferris ตัวลวงใช้คำ tried ที่คล้าย trial และอีกตัวตอบเรื่องสถานที่"},{"q":"What's the deadline for submitting the construction bid?","opts":["The building's almost finished.","The battery is dead.","Five o'clock on Friday."],"answer":2,"exp":"ถามกำหนดส่ง คำตอบระบุเวลา ตัวลวงเกี่ยวกับก่อสร้างแต่ไม่ตอบ และใช้ dead ที่คล้าย deadline"},{"q":"Why are electricity rates going up next quarter?","opts":["Because fuel costs have risen sharply.","It's rated five stars.","Just up the stairs."],"answer":0,"exp":"Why ถามเหตุผล คำตอบบอกว่าต้นทุนเชื้อเพลิงสูงขึ้น ตัวลวงเล่นคำ rates/rated และ up"},{"q":"Should I reserve a table inside or out on the patio?","opts":["The patio would be nice if it's warm.","Yes, I made a reservation.","For four people."],"answer":0,"exp":"คำถามแบบเลือก คำตอบเลือก patio พร้อมเงื่อนไข ตัวลวงตอบ Yes และอีกตัวบอกจำนวนคน ซึ่งไม่ใช่สิ่งที่ถาม"},{"q":"Who manages the museum's gift shop?","opts":["Gift wrapping is free.","Mr. Hale has run it for years.","It's managed to stay open late."],"answer":1,"exp":"Who ถามผู้จัดการ คำตอบระบุ Mr. Hale ตัวลวงซ้ำคำ gift และ managed ในความหมาย 'สามารถทำได้'"},{"q":"I still haven't received my order confirmation e-mail.","opts":["The order was quite large.","Have you checked your spam folder?","I confirmed the meeting time."],"answer":1,"exp":"ประโย thing else in your cart?"},{"sp":"W","t":"Yes, I also have a tent."},{"sp":"M","t":"That's why. Tents aren't included in the promotion. But I can apply the discount to the other items manually if you place the order over the phone."},{"sp":"W","t":"That would be great. I'd rather not lose the boots in my size."}],"graphic":null,"qs":[{"q":"What problem does the woman have?","opts":["A discount code is not working.","A product is the wrong size.","Her account has been locked.","An order has not arrived."],"answer":0,"exp":"เธอบอกว่าใส่โค้ดแล้ว \"it says the code is invalid\" = โค้ดส่วนลดใช้ไม่ได้ (A) ส่วน (B) ใช้คำว่า size ที่ได้ยินตอนท้ายมาหลอก"},{"q":"Why is there a problem?","opts":["A promotion has ended.","The woman typed the code incorrectly.","The Web site is being updated.","An item is excluded from a promotion."],"answer":3,"exp":"ผู้ชายอธิบายว่า \"Tents aren't included in the promotion\" = มีสินค้าที่ไม่ร่วมโปรโมชัน (D) ส่วน (B) ผิดเพราะเธออ่านโค้ดถูกต้อง"},{"q":"What does the man offer to do?","opts":["Upgrade the shipping","Reserve a tent","Take the order by phone","Send a new code"],"answer":2,"exp":"ผู้ชายเสนอว่าจะใส่ส่วนลดให้ \"if you place the order over the phone\" (C) ส่วน (D) ผิดเพราะไม่ได้ส่งโค้ดใหม่ แต่ลดให้ด้วยตนเอง (manually)"}]},{"lines":[{"sp":"W","t":"Hello, Mr. Castellano. This is Nadia Reyes from Lakeview Property Management. I'm calling about the renovation on the ninth floor."},{"sp":"M","t":"Yes, the drilling has been very loud. My staff can hardly hear clients on the phone."},{"sp":"W","t":"I apologize. The contractor has agreed to do the noisiest work before nine in the morning and after five in the evening, starting Monday."},{"sp":"M","t":"That will help a lot. How much longer will the project take?"},{"sp":"W","t":"About three more weeks. In the meantime, the conference room on the second floor is empty. You're welcome to use it free of charge if you need a quieter space."},{"sp":"M","t":"That's kind of you. Could we use it for a client meeting this Thursday?"},{"sp":"W","t":"Certainly. I'll leave a key card for you at the security desk."}],"graphic":null,"qs":[{"q":"What is the man unhappy about?","opts":["Construction noise","Broken telephones","A lack of parking","A rent increase"],"answer":0,"exp":"ผู้ชายบอกว่า \"the drilling has been very loud\" = เสียงจากการก่อสร้าง (A) ส่วน (B) ใช้คำว่า phone มาหลอก แต่โทรศัพท์ไม่ได้เสีย"},{"q":"What change will begin on Monday?","opts":["Some work will be done outside office hours.","The renovation will be completed.","A new contractor will be hired.","The security desk will open earlier."],"answer":0,"exp":"ผู้รับเหมาจะทำงานที่เสียงดังที่สุด \"before nine ... and after five\" = นอกเวลาทำการ (A) ส่วน (B) ผิดเพราะโครงการยังเหลืออีกราว 3 สัปดาห์"},{"q":"What will the woman leave at the security desk?","opts":["A meeting agenda","A key card","A project schedule","A parking permit"],"answer":1,"exp":"เธอบอกว่า \"I'll leave a key card for you at the security desk\" (B) ส่วน (D) ไม่ได้มีการกล่าวถึง"}]},{"lines":[{"sp":"M","t":"Lucia, the health inspector is coming on Wednesday. Have we finished everything on the checklist?"},{"sp":"W","t":"Most of it. The walk-in freezer was cleaned yesterday, and all the food containers now have date labels."},{"sp":"M","t":"Great. What about the dishwasher? It wasn't reaching the right water temperature last week."},{"sp":"W","t":"The repair technician replaced the heating element on Friday. I tested it this morning, and it's working fine."},{"sp":"M","t":"Good. And the staff hygiene training?"},{"sp":"W","t":"Three of the new kitchen assistants still haven't completed it."},{"sp":"M","t":"The inspector is coming on Wednesday."},{"sp":"W","t":"I know, I know. I'll schedule a session for them tomorrow morning before we open."}],"graphic":null,"qs":[{"q":"What are the speakers preparing for?","opts":["A grand opening","A staff party","An inspection","A menu change"],"answer":2,"exp":"ผู้ชายบอกว่า \"the health inspector is coming on Wednesday\" จึงเตรียมรับการตรวจ (C) ส่วน (A) ใช้คำว่า open ที่ได้ยินตอนท้ายมาหลอก"},{"q":"What was fixed on Friday?","opts":["A freezer","A dishwasher","An oven","A label printer"],"answer":1,"exp":"ช่างเปลี่ยน heating element ของเครื่องล้างจานเมื่อวันศุกร์ (B) ส่วน (A) freezer ถูกทำความสะอาดเมื่อวาน ไม่ใช่ซ่อม"},{"q":"What does the man mean when he says, \"The inspector is coming on Wednesday\"?","opts":["He will be unavailable that day.","A task must be done soon.","A visit should be postponed.","A date was given incorrectly."],"answer":1,"exp":"ผู้ชายพูดซ้ำหลังได้ยินว่าพนักงานใหม่ยังไม่ผ่านการอบรม เพื่อเน้นว่าต้องรีบจัดการ (B) ผู้หญิงจึงตอบว่า \"I know\" แล้วนัดอบรมพรุ่งนี้ ส่วน (D) ผิดเพราะวันที่ไม่ได้ผิด"}]},{"lines":[{"sp":"W","t":"Hello, I own a small printing shop on Delmar Avenue. I got a notice saying the electricity will be shut off on the fifteenth."},{"sp":"M","t":"Yes, ma'am. We're replacing a transformer in your area. Power will be off from 10 A.M. to about 3 P.M."},{"sp":"W","t":"That's a problem. I have a large job due that day, and my printers can't run without power."},{"sp":"M","t":"I understand. Unfortunately, we can't change the date, since the work affects the whole street."},{"sp":"W","t":"Is there any way to get notified if the work finishes early?"},{"sp":"M","t":"Yes. If you sign up for text alerts on our Web site, you'll get a message as soon as power is restored."},{"sp":"W","t":"All right. I guess I'll have to finish the job the day before."}],"graphic":null,"qs":[{"q":"Why will the power be shut off?","opts":["A bill has not been paid.","A storm is expected.","A street is being repaved.","Equipment is being replaced."],"answer":3,"exp":"ผู้ชายบอกว่า \"We're replacing a transformer\" = กำลังเปลี่ยนอุปกรณ์ (D) ส่วน (C) ใช้คำว่า street ที่ได้ยินมาหลอก"},{"q":"What does the man recommend?","opts":["Moving to a different location","Registering for a notification service","Renting a generator","Requesting a refund"],"answer":1,"exp":"เขาแนะนำ \"sign up for text alerts on our Web site\" = ลงทะเบียนรับการแจ้งเตือน (B) ส่วน (C) ฟังดูสมเหตุสมผลแต่ไม่ได้ถูกพูดถึง"},{"q":"What does the woman say she will do?","opts":["Complete a job early","Close her shop for a week","Call a competitor","Cancel an order"],"answer":0,"exp":"เธอบอกว่า \"I'll have to finish the job the day before\" = ทำงานให้เสร็จก่อนกำหนด (A) ส่วน (D) ผิดเพราะเธอไม่ได้ยกเลิกงาน"}]},{"lines":[{"sp":"W","t":"Hassan, Mei, I just got an e-mail from Dorrance Logistics. They want to move our presentation from Friday to Wednesday."},{"sp":"M","t":"Wednesday? That's only two days from now. The cost analysis isn't finished."},{"sp":"W2","t":"I can finish the analysis by tomorrow evening if someone else takes over the client interviews summary."},{"sp":"W","t":"I'll handle the summary, then. Hassan, can you work on the slides?"},{"sp":"M","t":"Sure. But their chief financial officer wanted to see the warehouse comparison, and I'm still waiting for data from their Memphis site."},{"sp":"W","t":"Let's present what we have and promise a follow-up report on Memphis next week."},{"sp":"W2","t":"That works. Should we do a practice run?"},{"sp":"W","t":"Yes. Let's meet in my office on Tuesday at four."}],"graphic":null,"qs":[{"q":"What has the client requested?","opts":["An earlier meeting date","A lower fee","A different presenter","A longer presentation"],"answer":0,"exp":"ลูกค้าต้องการย้ายการนำเสนอจากวันศุกร์ไปวันพุธ = เลื่อนให้เร็วขึ้น (A) ส่วน (C) ไม่มีการพูดถึงการเปลี่ยนผู้นำเสนอ"},{"q":"What is the man waiting for?","opts":["Feedback on some slides","A signed contract","Information from a client's facility","Approval from a manager"],"answer":2,"exp":"ผู้ชายบอกว่า \"still waiting for data from their Memphis site\" = ข้อมูลจากสถานที่ของลูกค้า (C) ส่วน (A) ใช้คำว่า slides ที่ได้ยินมาหลอก"},{"q":"What will the speakers do on Tuesday?","opts":["Visit a warehouse","Submit a report","Rehearse a presentation","Interview some clients"],"answer":2,"exp":"ผู้หญิงตอบเรื่อง practice run ว่า \"Let's meet in my office on Tuesday at four\" = ซ้อมการนำเสนอ (C) ส่วน (B) ผิดเพราะรายงาน Memphis จะส่งสัปดาห์หน้า ไม่ใช่วันอังคาร"}]},{"lines":[{"sp":"M","t":"Ms. Takahashi, thanks for meeting with me. As Skyward Airlines' corporate accounts manager, I'd like to discuss renewing your company's travel agreement."},{"sp":"W","t":"Of course. Our staff flew with you over three hundred times last year, so we'd like to continue."},{"sp":"M","t":"That's great to hear. For the new agreement, we can offer a twelve percent discount on all domestic routes."},{"sp":"W","t":"That's similar to last year. Our main concern is the international routes. We're opening an office in Seoul next spring, and many employees will be traveling there."},{"sp":"M","t":"I see. We just added a daily direct flight to Seoul, so I could include those routes as well."},{"sp":"W","t":"That would make a big difference. Could you send me a revised proposal?"},{"sp":"M","t":"Certainly. I'll have it to you by Friday."}],"graphic":null,"qs":[{"q":"What is the purpose of the meeting?","opts":["To interview for a position","To renew a business agreement","To discuss a lost bag","To book a flight to Seoul"],"answer":1,"exp":"ผู้ชายบอกว่าต้องการ \"discuss renewing your company's travel agreement\" (B) ส่วน (D) ใช้คำว่า Seoul มาหลอก แต่ไม่ได้จองตั๋ว"},{"q":"What does the woman say her company is planning?","opts":["Changing its headquarters","Reducing business travel","Opening a new office","Hiring a travel agent"],"answer":2,"exp":"เธอบอกว่า \"We're opening an office in Seoul next spring\" (C) ส่วน (B) ตรงข้าม เพราะพนักงานจะเดินทางมากขึ้น"},{"q":"What will the man send by Friday?","opts":["An updated proposal","A customer survey","A flight schedule","Some discount coupons"],"answer":0,"exp":"เธอขอ \"a revised proposal\" และเขาบอกว่า \"I'll have it to you by Friday\" (A) ส่วน (C) แม้จะพูดถึงเที่ยวบินใหม่ แต่ไม่ได้บอกว่าจะส่งตาราง"}]},{"lines":[{"sp":"W","t":"Paul, have you read the new regulation on allergen labeling? It takes effect on July first."},{"sp":"M","t":"I skimmed it. Doesn't it just say allergens have to be printed in bold?"},{"sp":"W","t":"That's part of it. But it also says that if a product is made on equipment shared with nuts, the label has to state that clearly."},{"sp":"M","t":"Hmm. Our oat cookies and almond bars are made on the same line."},{"sp":"W","t":"Exactly. So either we redesign the oat cookie packaging, or we move production to line two."},{"sp":"M","t":"Line two is already running at full capacity. Redesigning the packaging is probably cheaper."},{"sp":"W","t":"I agree. I'll ask the design team for a quote this week."}],"graphic":null,"qs":[{"q":"What are the speakers discussing?","opts":["A product recall","A recipe change","A customer complaint","A new government rule"],"answer":3,"exp":"ทั้งคู่คุยเรื่อง \"the new regulation on allergen labeling\" = กฎใหม่ของรัฐ (D) ส่วน (A) ฟังดูเกี่ยวข้องกับสารก่อภูมิแพ้แต่ไม่มีการเรียกคืนสินค้า"},{"q":"What does the man say about line two?","opts":["It is too busy.","It is used only for nuts.","It will close soon.","It needs repairs."],"answer":0,"exp":"ผู้ชายบอกว่า \"Line two is already running at full capacity\" = ยุ่งเต็มกำลังแล้ว (A) ส่วน (D) ไม่มีการพูดถึงการซ่อม"},{"q":"What will the woman do this week?","opts":["Print new labels","Test some cookies","Hire a designer","Request a price estimate"],"answer":3,"exp":"เธอบอกว่า \"I'll ask the design team for a quote\" = ขอใบเสนอราคา (D) ส่วน (C) ผิดเพราะทีมออกแบบมีอยู่แล้ว ไม่ได้จ้างใหม่"}]},{"lines":[{"sp":"M","t":"Rebecca, how are the preparations for the science museum's fundraising gala going?"},{"sp":"W","t":"Pretty well. We've sold almost all two hundred tickets, and the caterer confirmed the menu yesterday."},{"sp":"M","t":"Excellent. What about the silent auction? Last year it raised more than the ticket sales."},{"sp":"W","t":"So far we have fifteen items, including a weekend at a mountain lodge and a private tour of the planetarium."},{"sp":"M","t":"Fifteen? Last year we had over forty."},{"sp":"W","t":"I know. A few local businesses haven't replied yet, though. I'm calling them again tomorrow."},{"sp":"M","t":"Maybe our board members could help. Several of them have good business connections."},{"sp":"W","t":"That's a great idea. I'll send them a message tonight."}],"graphic":null,"qs":[{"q":"What event are the speakers discussing?","opts":["A science conference","A fundraising dinner","A museum opening","A business award ceremony"],"answer":1,"exp":"ผู้ชายพูดถึง \"the science museum's fundraising gala\" = งานเลี้ยงระดมทุน (B) ส่วน (A) ใช้คำว่า science มาหลอก"},{"q":"What does the man mean when he says, \"Last year we had over forty\"?","opts":["He wants to repeat last year's menu.","He believes the event is too large.","He is worried about the number of auction items.","He thinks fewer tickets should be sold."],"answer":2,"exp":"เมื่อได้ยินว่ามีของประมูลแค่ 15 ชิ้น ผู้ชายพูดว่าปีที่แล้วมีกว่า 40 ชิ้น แสดงความกังวลว่าจำนวนน้อยไป (C) ส่วน (D) ผิดเพราะตั๋วขายดีแล้ว ไม่ได้มีปัญหา"},{"q":"What will the woman do tonight?","opts":["Visit a mountain lodge","Call local businesses","Print auction catalogs","Contact board members"],"answer":3,"exp":"เธอตอบข้อเสนอของผู้ชายว่า \"I'll send them a message tonight\" โดย them คือ board members (D) ส่วน (B) เธอจะโทรหาธุรกิจท้องถิ่นพรุ่งนี้ ไม่ใช่คืนนี้"}]},{"lines":[{"sp":"M","t":"Good morning. I'm Owen Price from Velora Pharmaceuticals. I have an appointment with the pharmacy manager."},{"sp":"W","t":"That's me, Grace Lin. And this is Dr. Patel, our senior pharmacist."},{"sp":"M2","t":"Nice to meet you. I understand you're here about the new allergy medication."},{"sp":"M","t":"That's right. It's called Clarivex. It's taken just once a day, and unlike similar products, it doesn't cause drowsiness."},{"sp":"W","t":"Our customers would certainly like that. What's the price compared to the brands we carry now?"},{"sp":"M","t":"It's slightly higher, but we're offering pharmacies a fifteen percent introductory discount for the first three months."},{"sp":"M2","t":"I'd like to read the clinical study results before we decide."},{"sp":"M","t":"Of course. I've brought copies for both of you, along with some free samples."}],"graphic":null,"qs":[{"q":"Who most likely is Owen Price?","opts":["A medical researcher","A sales representative","A pharmacist","A store customer"],"answer":1,"exp":"Owen Price มาจากบริษัทยา มีนัดกับผู้จัดการร้านเพื่อแนะนำยาใหม่และเสนอส่วนลด จึงเป็นตัวแทนขาย (B) ส่วน (C) คืออาชีพของ Dr. Patel"},{"q":"What is an advantage of the product?","opts":["It is cheaper than other brands.","It works within minutes.","It does not make people sleepy.","It is available without a prescription."],"answer":2,"exp":"เขาบอกว่า \"it doesn't cause drowsiness\" = ไม่ทำให้ง่วง (C) ส่วน (A) ผิดเพราะราคา \"slightly higher\""},{"q":"What does Dr. Patel want to do?","opts":["Review some research findings","Order a large quantity","Speak with a doctor","Try the medication himself"],"answer":0,"exp":"Dr. Patel บอกว่า \"I'd like to read the clinical study results\" = อ่านผลการวิจัย (A) ส่วน (D) ฟังดูเกี่ยวกับ free samples แต่เขาไม่ได้พูดเช่นนั้น"}]},{"lines":[{"sp":"W","t":"Hi, welcome to the Old Harbor Visitor Center. How can I help you?"},{"sp":"M","t":"Hello. I read about a guided bicycle tour of the historic district. Is it running today?"},{"sp":"W","t":"It is, but the morning tour is full. There's still space on the two o'clock tour."},{"sp":"M","t":"Two o'clock is fine. Do I need to bring my own bike?"},{"sp":"W","t":"No, bikes and helmets are provided. The tour leaves from the clock tower across the square."},{"sp":"M","t":"Great. How long does it last?"},{"sp":"W","t":"About two hours, including a stop at the lighthouse museum. Admission to the museum is included in the price."},{"sp":"M","t":"Perfect. I'll take one ticket, please. Can I pay by card?"},{"sp":"W","t":"Of course."}],"graphic":null,"qs":[{"q":"What is the man interested in?","opts":["A bicycle rental for a week","A guided tour","A museum membership","A boat trip"],"answer":1,"exp":"ผู้ชายถามถึง \"a guided bicycle tour of the historic district\" (B) ส่วน (A) ผิดเพราะจักรยานมีให้ในทัวร์ ไม่ได้เช่ารายสัปดาห์"},{"q":"Where does the tour begin?","opts":["At the visitor center","At a lighthouse","At a bike shop","At a clock tower"],"answer":3,"exp":"เธอบอกว่า \"The tour leaves from the clock tower across the square\" (D) ส่วน (B) เป็นจุดแวะระหว่างทาง"},{"q":"What is included in the price?","opts":["A meal","Admission to a museum","A souvenir photo","Transportation to a hotel"],"answer":1,"exp":"เธอบอกว่า \"Admission to the museum is included in the price\" (B) ตัวเลือกอื่นไม่ได้ถูกกล่าวถึง"}]},{"lines":[{"sp":"M","t":"Hi, I'm Derek from Brightline Builders. I'm here to pick up the flooring samples for the Elm Court apartments."},{"sp":"W","t":"Sure. They're right here. The developer narrowed it down to these four."},{"sp":"M","t":"Thanks. The developer told me they want something water-resistant for the kitchens and bathrooms."},{"sp":"W","t":"Then you can rule out the solid oak. It's beautiful, but it doesn't handle moisture well."},{"sp":"M","t":"Okay. And their budget is under five dollars per square foot."},{"sp":"W","t":"In that case, there's only one option left. It's a popular choice for rental units."},{"sp":"M","t":"Great. How soon could you deliver enough for forty units?"},{"sp":"W","t":"We'd have to order from the manufacturer, so about three weeks."}],"graphic":{"title":"Flooring Options (price per sq. ft.)","rows":[["Product","Water-resistant","Price"],["Solid Oak","No","$7.20"],["Porcelain Tile","Yes","$6.50"],["Luxury Vinyl","Yes","$4.30"],["Laminate","No","$3.10"]]},"qs":[{"q":"Why is the man visiting the woman?","opts":["To deliver some tiles","To inspect an apartment","To return a damaged product","To collect some samples"],"answer":3,"exp":"เขาบอกว่า \"I'm here to pick up the flooring samples\" (D) ส่วน (B) ผิดเพราะไม่ได้ไปตรวจห้องพัก"},{"q":"Look at the graphic. Which product will most likely be chosen?","opts":["Solid Oak","Porcelain Tile","Luxury Vinyl","Laminate"],"answer":2,"exp":"ต้องกันน้ำและราคาต่ำกว่า $5 มีเพียง Luxury Vinyl ($4.30) (C) ส่วน (D) Laminate ถูกกว่าแต่ไม่กันน้ำ"},{"q":"According to the woman, why will delivery take three weeks?","opts":["An item must be ordered from a manufacturer.","The store is short of staff.","A truck is being repaired.","A holiday is approaching."],"answer":0,"exp":"เธอบอกว่า \"We'd have to order from the manufacturer\" (A) ตัวเลือกอื่นไม่ได้ถูกกล่าวถึง"}]},{"lines":[{"sp":"W","t":"Hi, I'm calling about renting a booth at the Riverside Food Festival. I run a small dumpling business."},{"sp":"M","t":"Great. We have four booth types left. Will you be cooking on-site?"},{"sp":"W","t":"Yes, we'll be steaming dumplings, so I'll need electricity."},{"sp":"M","t":"Then you'll need one of the booths with a power connection. Do you have a preference for size?"},{"sp":"W","t":"There will only be two of us working, so the smallest one with power should be enough."},{"sp":"M","t":"Okay. I should mention that all food vendors must show a current food-handling certificate when they check in."},{"sp":"W","t":"No problem. I have one. When do you need payment?"},{"sp":"M","t":"Within five business days. I'll e-mail you an invoice right now."}],"graphic":{"title":"Vendor Booth Rental","rows":[["Booth Size","Electricity","Price"],["Small (2 m x 2 m)","No","$150"],["Medium (3 m x 3 m)","Yes","$240"],["Large (4 m x 4 m)","Yes","$320"],["Corner (4 m x 6 m)","Yes","$450"]]},"qs":[{"q":"What type of business does the woman run?","opts":["An event-planning agency","An electrical company","A cooking school","A food business"],"answer":3,"exp":"เธอบอกว่า \"I run a small dumpling business\" = ธุรกิจอาหาร (D) ส่วน (B) ใช้คำว่า electricity มาหลอก"},{"q":"Look at the graphic. How much will the woman most likely pay?","opts":["$150","$240","$320","$450"],"answer":1,"exp":"เธอต้องการไฟฟ้าและเลือกบูธที่เล็กที่สุดที่มีไฟ คือ Medium $240 (B) ส่วน (A) Small ถูกที่สุดแต่ไม่มีไฟฟ้า"},{"q":"What must vendors show at check-in?","opts":["A certificate","A payment receipt","A menu","A photo ID"],"answer":0,"exp":"ผู้ชายบอกว่าผู้ขายอาหาร \"must show a current food-handling certificate when they check in\" (A) ส่วน (B) ใช้เรื่อง payment ที่ได้ยินมาหลอก"}]},{"lines":[{"sp":"M","t":"Excuse me, are you with the Global Pharma Research Conference? I'm trying to get to the convention center."},{"sp":"W","t":"Yes, I'm one of the volunteers. The shuttle bus leaves from right outside this hotel entrance."},{"sp":"M","t":"Wonderful. My presentation on clinical trial design starts at ten, and I need to be there at least forty-five minutes early to set up."},{"sp":"W","t":"Then you should take the latest shuttle that still gets you there in time. It's about a twenty-minute ride."},{"sp":"M","t":"Thanks. Oh, I almost forgot. I haven't picked up my name badge yet."},{"sp":"W","t":"You can get it at the registration desk in the convention center lobby. It opens at eight."},{"sp":"M","t":"Perfect. I'll stop there first."}],"graphic":{"title":"Conference Shuttle - Hotel to Convention Center","rows":[["Departure","Arrival"],["7:30 A.M.","7:50 A.M."],["8:00 A.M.","8:20 A.M."],["8:30 A.M.","8:50 A.M."],["9:00 A.M.","9:20 A.M."]]},"qs":[{"q":"Who most likely is the woman?","opts":["A hotel receptionist","A research scientist","A conference volunteer","A bus driver"],"answer":2,"exp":"เธอบอกว่า \"I'm one of the volunteers\" (C) ส่วน (A) ใช้คำว่า hotel มาหลอก"},{"q":"Look at the graphic. Which shuttle will the man most likely take?","opts":["7:30 A.M.","8:00 A.M.","8:30 A.M.","9:00 A.M."],"answer":2,"exp":"เขาต้องถึงก่อน 10 โมงอย่างน้อย 45 นาที คือไม่เกิน 9:15 และผู้หญิงแนะนำรอบหลังสุดที่ยังทัน คือ 8:30 ถึง 8:50 (C) ส่วน (D) 9:00 ถึง 9:20 ช้าเกินไป"},{"q":"Where will the man go first at the convention center?","opts":["To an information booth","To a presentation room","To a coffee shop","To a registration desk"],"answer":3,"exp":"เขาต้องรับป้ายชื่อที่ \"the registration desk in the convention center lobby\" และบอกว่า \"I'll stop there first\" (D) ส่วน (B) เป็นที่ที่เขาจะไปหลังจากนั้น"}]}],"p4":[{"kind":"telephone message","sp":"W","graphic":null,"t":"Good morning, Mr. Okafor. This is Priya Nair from Lindell Property Group. Thanks for your interest in the two-bedroom apartment on Harbor Street. I wanted to let you know that the owner has accepted your request to bring your dog, as long as you pay an additional security deposit of three hundred dollars. I know you were also hoping to see the unit this Thursday evening. Unfortunately, the current tenant won't be moving out until Saturday, so we can't show it before then. I can take you there on Sunday at ten A.M. instead, if that works for you. In the meantime, I'll e-mail you some photos of the kitchen and balcony, which were both renovated last spring. Please bring a copy of your recent pay statements to the viewing, since the owner will want to review them with your application.","qs":[{"q":"What has the owner agreed to?","opts":["Lowering the monthly rent","Shortening the lease","Repainting the bedrooms","Allowing a pet"],"answer":3,"exp":"owner has accepted your request to bring your dog คือยอมให้เลี้ยงสัตว์ โดยต้องจ่าย security deposit เพิ่ม ไม่ได้ลดค่าเช่า"},{"q":"Why can't the listener see the apartment on Thursday?","opts":["The agent will be out of town.","The apartment is being renovated.","Someone is still living there.","The building will be closed."],"answer":2,"exp":"current tenant won't be moving out until Saturday ผู้เช่าเดิมยังอยู่ ตัวเลือก B เป็นกับดักเพราะการรีโนเวตเสร็จไปตั้งแต่ last spring"},{"q":"What should the listener bring to the viewing?","opts":["Proof of income","A signed lease","A reference letter","A security deposit"],"answer":0,"exp":"ให้นำ copy of your recent pay statements มาด้วย ซึ่งก็คือหลักฐานรายได้ (proof of income)"}]},{"kind":"announcement","sp":"M","graphic":null,"t":"Attention, passengers on Skyward Airlines Flight 408 to Wellington. We'd like to inform you that the aircraft scheduled for this flight requires a minor maintenance check, so we will be changing to a different plane. As a result, boarding will now take place at Gate 22 instead of Gate 15. Please make your way to the new gate, which is located at the far end of Concourse B. The new departure time is two fifteen, about forty minutes later than originally scheduled. Because the replacement aircraft is slightly smaller, we are looking for volunteers willing to take a later flight this evening. Passengers who agree will receive a meal voucher and a two-hundred-dollar travel credit. If you're interested, please speak with an agent at the service desk. We apologize for the inconvenience.","qs":[{"q":"What is the cause of the delay?","opts":["Bad weather","A crew shortage","An airport security check","An aircraft change"],"answer":3,"exp":"เครื่องเดิมต้อง maintenance check จึง changing to a different plane เป็นสาเหตุของการเลื่อน ตัวเลือก C ใช้คำว่า check ซ้ำแต่ผิดความหมาย"},{"q":"Why does the speaker ask for volunteers?","opts":["A plane has fewer seats.","A gate is overcrowded.","Some luggage must be moved.","A flight has been canceled."],"answer":0,"exp":"replacement aircraft is slightly smaller จึงมีที่นั่งน้อยลงและต้องหาผู้โดยสารที่ยอมไปเที่ยวหลัง"},{"q":"What will volunteers receive?","opts":["A free hotel room","A seat upgrade","A travel credit","Access to a lounge"],"answer":2,"exp":"ผู้ที่อาสาจะได้ meal voucher และ two-hundred-dollar travel credit ตัวเลือกอื่นไม่ได้กล่าวถึง"}]},{"kind":"advertisement","sp":"W","graphic":null,"t":"Tired of spending your weekends at crowded supermarkets? Let GreenCart do the shopping for you. With our easy-to-use app, you can order fresh produce, dairy, and household essentials from local farms and stores, and we'll bring everything to your door in as little as two hours. What makes GreenCart different? Every order is packed in reusable insulated bags, which our drivers collect on their next visit. That means less plastic waste and fresher food. And if any item doesn't meet your standards, simply snap a photo in the app, and we'll refund you immediately. No questions asked. For a limited time, new customers can enjoy free delivery on their first five orders. Just enter the code FRESH5 at checkout. GreenCart is now available in all neighborhoods north of the river, with more areas coming soon.","qs":[{"q":"What is being advertised?","opts":["A farmers' market","A cooking class","A grocery delivery service","A recycling program"],"answer":2,"exp":"GreenCart สั่งของสด ของใช้ในบ้าน แล้วส่งถึงบ้าน จึงเป็นบริการส่งของชำ ตัวเลือก D เป็นกับดักจากเรื่อง less plastic waste"},{"q":"What does the speaker say is special about the business?","opts":["It uses reusable packaging.","It sells only organic products.","It has a membership discount.","It operates twenty-four hours a day."],"answer":0,"exp":"Every order is packed in reusable insulated bags ที่คนขับมาเก็บคืน ตรงกับ reusable packaging"},{"q":"Why does the speaker say, \"No questions asked\"?","opts":["To explain that the app is simple to download","To emphasize that refunds are easy to get","To suggest that drivers are very friendly","To indicate that orders can be changed later"],"answer":1,"exp":"พูดต่อจากเรื่องถ่ายรูปสินค้าที่ไม่พอใจแล้ว refund you immediately ดังนั้น No questions asked เน้นว่าการขอคืนเงินทำได้ง่ายไม่ต้องอธิบาย"}]},{"kind":"news report","sp":"M","graphic":null,"t":"And now for regional business news. Pharmaceutical company Veltrax Labs has announced that it will build a new research facility in the town of Millbrook. The two-hundred-million-dollar center will focus on developing vaccines and is expected to open in about three years. Company officials said they chose Millbrook because of its close partnership with nearby Corran University, whose biology graduates will be offered internships at the facility. Local leaders welcomed the decision, saying it will create around six hundred jobs. However, some residents have raised concerns about increased traffic on the town's narrow main road. In response, Veltrax has promised to fund a new access road connecting the site directly to the highway. A public meeting to discuss the plans will be held at Millbrook Town Hall next Wednesday evening.","qs":[{"q":"Why did Veltrax Labs choose Millbrook?","opts":["Land prices were low.","It is near a university.","The town offered tax benefits.","The company's founder lives there."],"answer":1,"exp":"เลือก Millbrook เพราะ close partnership with nearby Corran University ตัวเลือกอื่นไม่ได้กล่าวถึง"},{"q":"What concern have some residents expressed?","opts":["Increased traffic","Air pollution","Rising housing costs","Noise from construction"],"answer":0,"exp":"residents have raised concerns about increased traffic on the town's narrow main road คือกังวลเรื่องการจราจร"},{"q":"What will happen next Wednesday?","opts":["Construction will begin.","Internships will be announced.","A road will be opened.","A public meeting will take place."],"answer":3,"exp":"A public meeting จะจัดที่ Millbrook Town Hall คืนวันพุธหน้า ตัวเลือก C ผิดเพราะถนนใหม่เป็นเพียงคำสัญญาที่จะสร้าง"}]},{"kind":"introduction","sp":"W","graphic":null,"t":"Good morning, and welcome to the second day of the Strategic Management Summit. Our first speaker today needs little introduction to many of you. Dr. Martin Feld spent fifteen years as a senior partner at Ashworth Consulting, where he advised some of the world's largest retailers on how to restructure their supply chains. Three years ago, he left the firm to start his own company, which helps small and mid-sized manufacturers adopt new technology at an affordable cost. His recent book, Lean by Design, has been translated into eleven languages. This morning, Dr. Feld will be sharing several case studies from his clients and explaining what they learned along the way. Please note that because of the large number of attendees, questions will be taken through the conference app rather than from the floor. Now, please join me in welcoming Dr. Feld.","qs":[{"q":"Where most likely are the listeners?","opts":["At a product launch","At a business conference","At a university graduation","At a retirement party"],"answer":1,"exp":"ผู้พูดต้อนรับสู่ second day of the Strategic Management Summit จึงเป็นงานประชุมทางธุรกิจ"},{"q":"What does Dr. Feld's current company do?","opts":["It publishes business books.","It trains new consultants.","It manages retail stores.","It helps manufacturers use technology."],"answer":3,"exp":"บริษัทของเขา helps small and mid-sized manufacturers adopt new technology ตัวเลือก C เป็นกับดักเพราะ retailers เป็นงานเก่าที่ Ashworth"},{"q":"How should listeners submit questions?","opts":["By using a mobile app","By raising their hands","By writing on a card","By e-mailing the speaker"],"answer":0,"exp":"questions will be taken through the conference app rather than from the floor คือส่งคำถามผ่านแอป ไม่ใช่ยกมือถาม"}]},{"kind":"talk","sp":"M","graphic":null,"t":"Thanks for coming to tonight's workshop, hosted by Northern Valley Power. Over the next hour, I'll show you some simple ways to lower your electricity bills this winter. Most people are surprised to learn that heating accounts for nearly half of a typical household's energy use. So the first thing I'll talk about is sealing gaps around windows and doors, which can be done for less than twenty dollars. After that, we'll look at programmable thermostats. I know what you're thinking: aren't those expensive? Well, Northern Valley Power is currently giving a fifty-dollar rebate to customers who install one before January. At the end of the session, our staff will be at the back table to help you schedule a free home energy assessment. Each person who signs up tonight will also receive a pack of energy-efficient light bulbs.","qs":[{"q":"What is the workshop mainly about?","opts":["Choosing a new power supplier","Reducing energy costs","Installing solar panels","Understanding a billing system"],"answer":1,"exp":"ผู้พูดจะแสดง simple ways to lower your electricity bills จึงเป็นเรื่องการลดค่าใช้จ่ายด้านพลังงาน"},{"q":"Why does the speaker mention a rebate?","opts":["To answer a concern about cost","To explain a recent price increase","To promote a new product line","To correct a previous error"],"answer":0,"exp":"ผู้พูดยกคำถามว่า aren't those expensive? แล้วตอบด้วยเงินคืน 50 ดอลลาร์ จึงเป็นการตอบข้อกังวลเรื่องราคา"},{"q":"What will people who sign up tonight receive?","opts":["A discount on their next bill","A programmable thermostat","A set of light bulbs","A window-sealing kit"],"answer":2,"exp":"ผู้ที่ลงทะเบียนคืนนี้จะได้ a pack of energy-efficient light bulbs ส่วน thermostat ได้แค่ rebate เมื่อติดตั้งเอง"}]},{"kind":"tour information","sp":"W","graphic":null,"t":"Hello, everyone, and welcome to the Old Port walking tour. My name is Sophie, and for the next two hours, we'll be exploring the historic harbor district, where merchants traded spices and silk more than three hundred years ago. We'll begin at the customs house just behind me, which is now a maritime museum. Then we'll walk along the waterfront to the lighthouse. By the way, the path to the lighthouse is quite steep. There's a shuttle bus that goes there every fifteen minutes. Halfway through the tour, we'll stop for refreshments at a café run by a family that's been baking here for five generations. Your ticket includes one free pastry and a drink. And please remember, if we get separated in the crowds, just look for my orange umbrella. Okay, let's get started.","qs":[{"q":"What is the tour mainly about?","opts":["A modern shopping district","A city's historic trading area","A local food festival","A famous ship's history"],"answer":1,"exp":"ทัวร์สำรวจ historic harbor district ที่เคยมีการค้าเครื่องเทศและผ้าไหม จึงเป็นย่านการค้าเก่าแก่ ตัวเลือก D เป็นกับดักจากคำว่า maritime"},{"q":"What does the speaker imply when she says, \"There's a shuttle bus that goes there every fifteen minutes\"?","opts":["The tour will be shorter than planned.","Listeners must buy a separate ticket.","Listeners do not have to walk up the path.","The group will leave without some people."],"answer":2,"exp":"ก่อนหน้าบอกว่าทางขึ้น lighthouse ชันมาก การบอกว่ามี shuttle bus จึงสื่อว่าคนที่ไม่อยากเดินขึ้นสามารถนั่งรถแทนได้"},{"q":"What is included in the ticket?","opts":["A museum guidebook","A souvenir umbrella","A boat ride","A snack and a beverage"],"answer":3,"exp":"Your ticket includes one free pastry and a drink คือขนมกับเครื่องดื่ม ตัวเลือก B เป็นกับดักเพราะร่มสีส้มเป็นของไกด์"}]},{"kind":"meeting excerpt","sp":"M","graphic":null,"t":"Before we wrap up this partners' meeting, I want to talk about our new document management system. As you know, the firm has been storing client files on several different servers, and associates have been spending far too much time searching for contracts and court filings. Starting next month, everything will be moved to a single secure cloud platform. The IT department will begin transferring files from the corporate law division this weekend, followed by the tax division the week after. I should mention that during the transfer, you won't be able to edit any files in your division, although you'll still be able to view them. So please finish any urgent revisions before then. Our vendor will be running hands-on training sessions next Tuesday and Wednesday, and I'd strongly encourage everyone, including the senior partners, to sign up for one.","qs":[{"q":"Where does the speaker most likely work?","opts":["At a law firm","At a software company","At a bank","At a government office"],"answer":0,"exp":"พูดถึง partners' meeting, contracts, court filings, corporate law division จึงน่าจะเป็นสำนักงานกฎหมาย ตัวเลือก B เป็นกับดักเพราะ vendor เป็นบริษัทซอฟต์แวร์"},{"q":"What problem does the speaker mention?","opts":["Some files were lost.","A server is too expensive.","Finding documents takes too long.","Clients have complained about fees."],"answer":2,"exp":"associates have been spending far too much time searching for contracts คือหาเอกสารใช้เวลานานเกินไป"},{"q":"What will listeners be unable to do during the transfer?","opts":["View client files","Contact the IT department","Log into their computers","Make changes to files"],"answer":3,"exp":"you won't be able to edit any files แต่ยัง view ได้ ดังนั้นตัวเลือก A ผิด คำตอบคือแก้ไขไฟล์ไม่ได้"}]},{"kind":"telephone message","sp":"W","graphic":{"title":"Ashby Museum of Art - Event Spaces","rows":[["Room","Capacity"],["Sculpture Court","300"],["Riverside Gallery","180"],["East Terrace","120"],["Founders' Room","60"]]},"t":"Hi, Mr. Larsen. This is Anita Shah, the events coordinator at the Ashby Museum of Art. I'm calling about the fundraising dinner your organization is planning for November. You originally reserved the Sculpture Court, but your assistant e-mailed me yesterday to say you're now expecting around one hundred fifty guests rather than three hundred. With that number, I'd recommend moving to the smallest space that can still hold everyone comfortably. It has large windows overlooking the river, so your guests will have a wonderful view. The rental fee is also about forty percent lower. Another thing: our usual caterer will be closed for renovations in November, so you'll need to choose from our list of approved partners. I'll e-mail that list to you this afternoon. Please let me know your decision by Friday so I can update the booking.","qs":[{"q":"What kind of event is the listener planning?","opts":["An art auction","A wedding reception","A product launch","A fundraising dinner"],"answer":3,"exp":"ผู้พูดกล่าวว่า fundraising dinner your organization is planning for November จึงเป็นงานเลี้ยงระดมทุน"},{"q":"Look at the graphic. Which room does the speaker recommend?","opts":["Sculpture Court","Riverside Gallery","East Terrace","Founders' Room"],"answer":1,"exp":"แขกประมาณ 150 คน ห้องที่เล็กที่สุดที่ยังรับได้คือ Riverside Gallery (180) และชื่อสอดคล้องกับวิวแม่น้ำ ส่วน East Terrace จุได้เพียง 120"},{"q":"What will the speaker send the listener?","opts":["A revised invoice","A floor plan","A list of caterers","A menu sample"],"answer":2,"exp":"จะ e-mail list of approved partners ซึ่งหมายถึงรายชื่อบริษัทจัดเลี้ยง เพราะ caterer ประจำปิดปรับปรุง"}]},{"kind":"radio broadcast","sp":"M","graphic":{"title":"Bridge Repair Closures","rows":[["Dates","Closed Section"],["May 4-8","North entrance"],["May 11-15","Center lanes"],["May 18-22","Pedestrian walkway"],["May 25-29","South entrance"]]},"t":"You're listening to City Drive on KXR Radio. Here's an update on the Marlow Bridge repair project. The construction company, Tidewater Builders, has finished the first phase of the work ahead of schedule. That's because the weather has been unusually dry this spring. The next phase begins on Monday, May eleventh, and lasts all week. During that time, drivers can still use the outer lanes, but expect heavy delays during rush hour. City officials are encouraging commuters to take the ferry from Pier Seven, which will be running extra trips every morning until the project is completed. Also, Tidewater Builders is looking for local feedback on the design of the new lighting along the bridge. You can vote for your favorite option on the city's Web site until the end of the month. We'll have more traffic news after these messages.","qs":[{"q":"According to the speaker, why was some work completed early?","opts":["More workers were hired.","Traffic was lighter than expected.","The weather was favorable.","New equipment was used."],"answer":2,"exp":"งานเสร็จก่อนกำหนดเพราะ weather has been unusually dry this spring คือสภาพอากาศเอื้ออำนวย"},{"q":"Look at the graphic. Which section of the bridge will be closed next week?","opts":["North entrance","Center lanes","Pedestrian walkway","Sout
