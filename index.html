h entrance"],"answer":1,"exp":"ระยะถัดไปเริ่ม May 11 ซึ่งตามตารางคือ Center lanes และสอดคล้องกับที่บอกว่ายังใช้ outer lanes ได้ ตัวเลือก A เป็นช่วงที่เสร็จไปแล้ว"},{"q":"What are listeners invited to do?","opts":["Choose a lighting design","Attend a bridge opening","Apply for construction jobs","Buy discounted ferry tickets"],"answer":0,"exp":"ผู้ฟังได้รับเชิญให้ vote for your favorite option เกี่ยวกับดีไซน์ไฟบนสะพาน ส่วน ferry มีแค่เที่ยวเพิ่ม ไม่ได้ลดราคา"}]}],"p5":[{"q":"The ------- of the main terminal at Brenton Airport is expected to ease congestion during peak travel seasons.","opts":["expand","expansion","expansive","expanded"],"answer":1,"exp":"หลัง The และหน้า of ต้องใช้คำนามทำหน้าที่ประธาน คือ expansion (การขยาย) ส่วน expansive เป็นคำคุณศัพท์ (กว้างขวาง) ทำหน้าที่ประธานไม่ได้"},{"q":"The Hollis Art Museum has decided ------- its opening hours on the first Thursday of every month.","opts":["to extend","extending","extended","extends"],"answer":0,"exp":"กริยา decide ตามด้วย to + V (infinitive) เสมอ จึงตอบ to extend ส่วน extending (gerund) ใช้กับกริยาอย่าง consider หรือ enjoy ไม่ใช่ decide"},{"q":"------- by a team of local volunteers, the Riverside Food Festival attracted over 15,000 visitors.","opts":["Organizing","Organize","Organized","To organize"],"answer":2,"exp":"เทศกาลอาหารถูกจัดโดยอาสาสมัคร จึงใช้ past participle (Organized) ขึ้นต้นวลีเพื่อแสดงความหมาย passive ส่วน Organizing มีความหมาย active คือเทศกาลเป็นผู้จัดเอง ซึ่งไม่สมเหตุผล"},{"q":"Of all the proposals submitted, Dunmore Builders' was the ------- detailed.","opts":["more","much","most","very"],"answer":2,"exp":"Of all ... และ the นำหน้าบ่งชี้การเปรียบเทียบขั้นสูงสุด (superlative) จึงใช้ the most detailed ส่วน more ใช้เปรียบเทียบสองสิ่งและมักตามด้วย than"},{"q":"------- you renew your membership by June 30, you will receive a 15 percent discount.","opts":["Even though","Provided that","Whereas","So that"],"answer":1,"exp":"Provided that = หากว่า/โดยมีเงื่อนไขว่า ใช้บอกเงื่อนไขในการได้รับส่วนลด ส่วน Even though (ถึงแม้ว่า) แสดงความขัดแย้ง ไม่ใช่เงื่อนไข"},{"q":"Norvia Pharmaceuticals has applied for government ------- to sell its new allergy medication overseas.","opts":["admission","attendance","alignment","approval"],"answer":3,"exp":"approval = การอนุมัติ บริษัทยาต้องได้รับอนุมัติจากรัฐก่อนวางจำหน่ายยา ส่วน admission (การรับเข้า/ค่าเข้าชม) ไม่เข้ากับบริบท"},{"q":"Customers who wish to change ------- delivery address should contact us before the order ships.","opts":["their","them","theirs","themselves"],"answer":0,"exp":"หน้าคำนาม delivery address ต้องใช้คำแสดงความเป็นเจ้าของ (possessive adjective) คือ their ส่วน theirs เป็น possessive pronoun ที่ใช้แทนคำนาม ไม่วางหน้าคำนาม"},{"q":"The results of the customer satisfaction survey ------- at next Tuesday's staff meeting.","opts":["discussed","are discussing","have discussed","will be discussed"],"answer":3,"exp":"next Tuesday บ่งบอกอนาคต และผลสำรวจเป็นสิ่งที่ถูกพูดถึง จึงใช้ future passive คือ will be discussed ส่วน are discussing เป็น active ซึ่งผลสำรวจพูดคุยเองไม่ได้"},{"q":"------- rising ingredient costs, Café Lumière has kept its menu prices unchanged.","opts":["In spite of","Even though","Because","Moreover"],"answer":0,"exp":"ช่องว่างตามด้วยวลีคำนาม (rising ingredient costs) และมีความหมายขัดแย้ง จึงใช้บุพบท In spite of ส่วน Even though ต้องตามด้วยอนุประโยคที่มีกริยา"},{"q":"The consulting team provided a ------- analysis of the client's operating costs.","opts":["comprehend","comprehension","comprehensive","comprehensively"],"answer":2,"exp":"หลัง a และหน้าคำนาม analysis ต้องใช้คำคุณศัพท์ comprehensive (ครอบคลุม ละเอียด) ส่วน comprehension เป็นคำนามหมายถึงความเข้าใจ"},{"q":"Water service on Maple Avenue will be ------- interrupted while crews repair a broken main.","opts":["temporarily","previously","mutually","formerly"],"answer":0,"exp":"temporarily = ชั่วคราว เข้ากับการหยุดจ่ายน้ำระหว่างซ่อมท่อ ส่วน previously และ formerly หมายถึงในอดีต ขัดกับกาลอนาคต will be"},{"q":"Ms. Vance ------- at Rowe & Fielding for twelve years before she opened her own law practice.","opts":["has worked","had worked","works","will have worked"],"answer":1,"exp":"การทำงานเกิดขึ้นก่อนอีกเหตุการณ์ในอดีต (before she opened) จึงใช้ past perfect คือ had worked ส่วน has worked เป็น present perfect ที่เชื่อมกับปัจจุบัน ไม่ใช่อดีตก่อนอดีต"},{"q":"Our downtown branch is open until 9 P.M., ------- the suburban branch closes at 6 P.M.","opts":["whereas","because","unless","so that"],"answer":0,"exp":"whereas = ในขณะที่ (แสดงการเปรียบเทียบความแตกต่าง) ระหว่างเวลาปิดของสองสาขา ส่วน because แสดงเหตุผล ซึ่งไม่มีความสัมพันธ์เชิงเหตุผลในประโยคนี้"},{"q":"Visitors must obtain ------- from the site supervisor before entering the construction zone.","opts":["authorize","authorization","authorized","authoritative"],"answer":1,"exp":"หลังกริยา obtain ต้องใช้คำนามเป็นกรรม คือ authorization (การอนุญาต) ส่วน authorize เป็นกริยา และ authoritative เป็นคำคุณศัพท์"},{"q":"The airline's new loyalty program ------- frequent flyers with free seat upgrades.","opts":["grants","rewards","donates","benefits"],"answer":1,"exp":"reward someone with something = ให้รางวัลแก่ใครด้วยสิ่งใด ใช้คู่กับ with ได้ถูกต้อง ส่วน grants ใช้ในรูป grant someone something โดยไม่มี with"},{"q":"The new packaging line at the Orland plant operates almost -------, requiring only two technicians per shift.","opts":["automatic","automate","automation","automatically"],"answer":3,"exp":"ช่องว่างขยายกริยา operates และมี almost นำหน้า จึงต้องใช้ adverb คือ automatically ส่วน automatic เป็น adjective ขยายกริยาไม่ได้"},{"q":"Please bring your tickets to the information desk, ------- staff will direct you to the correct gallery.","opts":["which","where","what","who"],"answer":1,"exp":"where เป็น relative adverb ใช้แทนสถานที่ (the information desk) และตามด้วยอนุประโยคสมบูรณ์ (staff will direct you) ส่วน which ต้องทำหน้าที่ประธานหรือกรรมในอนุประโยค ซึ่งอนุประโยคนี้ครบแล้ว"},{"q":"All job candidates must provide two professional ------- along with their application forms.","opts":["referrals","preferences","references","inferences"],"answer":2,"exp":"professional references = บุคคลอ้างอิงทางวิชาชีพที่ผู้สมัครงานต้องระบุ ส่วน referrals (การแนะนำส่งต่อ) และ preferences (ความชอบ) สะกดคล้ายกันแต่ความหมายไม่ตรง"},{"q":"Once the renovation of the east wing -------, the museum will host a reopening reception.","opts":["will finish","will be finished","is finished","finished"],"answer":2,"exp":"ในอนุประโยคบอกเวลา (Once, When, After) ที่หมายถึงอนาคต ใช้ present tense แทน future และการปรับปรุงเป็นสิ่งที่ถูกทำ จึงเป็น is finished ส่วน will be finished ผิดเพราะไม่ใช้ will ในอนุประโยคบอกเวลา"},{"q":"Many customers have commented on how ------- the new self-checkout kiosks are to use.","opts":["conveniently","convenient","convenience","conveniences"],"answer":1,"exp":"โครงสร้าง how + adjective + ประธาน + be (how convenient the kiosks are) ต้องใช้คำคุณศัพท์ convenient ส่วน conveniently เป็น adverb ไม่ทำหน้าที่ส่วนเติมเต็มหลัง be"},{"q":"The consulting contract with Brightwell Partners will be renewed ------- an annual basis.","opts":["in","at","by","on"],"answer":3,"exp":"สำนวน on a(n) ... basis = เป็นประจำทุก... (on an annual basis = เป็นรายปี) ใช้บุพบท on เท่านั้น"},{"q":"Ferris Utilities is committed to providing ------- service to all of its residential customers.","opts":["rely","reliably","reliable","reliance"],"answer":2,"exp":"หน้าคำนาม service ต้องใช้คำคุณศัพท์ reliable (เชื่อถือได้) ส่วน reliably เป็น adverb ขยายคำนามไม่ได้"},{"q":"Please ------- the attached floor plan carefully before signing the lease agreement.","opts":["conduct","attend","explain","examine"],"answer":3,"exp":"examine = ตรวจดูอย่างละเอียด เข้ากับ floor plan และ carefully ส่วน conduct (ดำเนินการ) ใช้กับ survey หรือ inspection ไม่ใช่เอกสารแบบแปลน"},{"q":"------- of the restaurant's two locations offers a private dining room.","opts":["Every","All","Both","Each"],"answer":3,"exp":"Each of + คำนามพหูพจน์ ตามด้วยกริยาเอกพจน์ (offers) ถูกต้อง ส่วน Every ใช้กับ of ไม่ได้ และ Both/All ต้องใช้กริยาพหูพจน์ (offer)"},{"q":"The sales associate was praised for her ------- to resolve customer complaints quickly.","opts":["able","ability","ably","enable"],"answer":1,"exp":"หลังคำแสดงความเป็นเจ้าของ her ต้องใช้คำนาม คือ ability (ความสามารถ) ซึ่งตามด้วย to + V ได้ ส่วน able เป็นคำคุณศัพท์"},{"q":"The flight to Lisbon was delayed ------- a mechanical problem was discovered during the pre-flight inspection.","opts":["because of","due to","because","owing"],"answer":2,"exp":"ช่องว่างตามด้วยอนุประโยค (a mechanical problem was discovered) จึงต้องใช้คำสันธาน because ส่วน because of และ due to เป็นบุพบทที่ตามด้วยคำนามเท่านั้น"},{"q":"The Coastal Escape tour package ------- round-trip airfare, hotel accommodations, and daily breakfast.","opts":["consists","involves","includes","attaches"],"answer":2,"exp":"includes = รวมถึง ใช้แจกแจงสิ่งที่อยู่ในแพ็กเกจทัวร์ ส่วน consists ต้องใช้ consists of และ attaches (แนบ) ไม่เข้ากับความหมาย"},{"q":"Crews ------- on the new subway extension since early last year.","opts":["are working","worked","will work","have been working"],"answer":3,"exp":"since early last year บอกการกระทำที่เริ่มในอดีตและยังดำเนินอยู่ จึงใช้ present perfect continuous คือ have been working ส่วน worked เป็น past simple ใช้กับ since ในลักษณะนี้ไม่ได้"},{"q":"The law firm offers a ------- consultation to first-time clients.","opts":["complimentary","complementary","compliment","complimented"],"answer":0,"exp":"complimentary = ฟรี ไม่คิดค่าใช้จ่าย เหมาะกับการให้คำปรึกษาแก่ลูกค้าใหม่ ส่วน complementary (ส่งเสริมกัน) สะกดคล้ายกันแต่ความหมายต่างกัน เป็นกับดักที่พบบ่อย"},{"q":"Laboratory staff must wear protective gloves ------- handling chemical samples.","opts":["during","between","for","when"],"answer":3,"exp":"when + V-ing (เป็นรูปย่อของ when they are handling) = เมื่อ... ส่วน during เป็นบุพบทที่ต้องตามด้วยคำนาม เช่น during the procedure ไม่ตามด้วย V-ing ที่มีกรรม"}],"p6":[{"kind":"letter","head":"Whitcombe & Lowry LLP\n410 Grant Street, Suite 900\nPittsburgh, PA 15219\n\nApril 22\n\nMr. Tomas Herrera\nHerrera Landscaping\n88 Birch Road\nBethel Park, PA 15102","t":"Dear Mr. Herrera,\n\nThank you for meeting with me last week to discuss your plans to expand Herrera Landscaping into a second county. As promised, I have [[1]] a summary of the licensing and insurance requirements that apply to your business.\n\nPlease review the document at your convenience. [[2]] you will need to register with the county's business office, I recommend doing so before signing any new client contracts. [[3]]\n\nOur firm would be happy to [[4]] you throughout this process. To schedule a follow-up appointment, please contact my assistant, Ms. Rhee, at 412-555-0147.\n\nSincerely,\n\nAnnette Lowry\nAttorney at Law","qs":[{"opts":["enclosing","enclosed","enclose","enclosure"],"answer":1,"exp":"have + V3 เป็น present perfect จึงใช้ enclosed (แนบมาด้วย) ซึ่งพบบ่อยในจดหมายธุรกิจ ส่วน enclosure เป็นคำนาม (สิ่งที่แนบ) ไม่ใช้หลัง have ในโครงสร้างนี้"},{"opts":["Despite","Because","Unless","Whether"],"answer":1,"exp":"Because แสดงเหตุผล: เพราะต้องจดทะเบียน จึงแนะนำให้ทำก่อนเซ็นสัญญา ส่วน Despite เป็นบุพบทตามด้วยคำนาม และ Unless (เว้นแต่) ทำให้ความหมายขัดแย้ง"},{"opts":["Our office will be closed for renovations until next year.","Your landscaping designs were featured in a local magazine.","The registration process usually takes about two weeks to complete.","The second county has no licensing requirements."],"answer":2,"exp":"ประโยคนี้ให้ข้อมูลเพิ่มเติมเรื่องการจดทะเบียน ซึ่งสนับสนุนคำแนะนำให้ทำก่อนเซ็นสัญญา ส่วนประโยคที่ว่าเคาน์ตีที่สองไม่มีข้อกำหนดใบอนุญาตขัดกับเอกสารสรุปข้อกำหนดที่แนบมา"},{"opts":["assist","consist","insist","resist"],"answer":0,"exp":"assist someone = ช่วยเหลือใคร เหมาะกับบริการของสำนักงานกฎหมาย ส่วน consist, insist, resist สะกดคล้ายกันแต่ความหมายและโครงสร้างไม่เข้ากับบริบท"}]},{"kind":"advertisement","head":"Now Open in Fairview Plaza!","t":"Saffron Table, the award-winning restaurant known for its modern take on Indian cuisine, has opened its second location in Fairview Plaza. [[1]] our original restaurant downtown, the new location features an open kitchen where diners can watch chefs prepare naan in a traditional clay oven.\n\nTo celebrate the opening, we are offering 20 percent off all dinner entrées through the end of the month. [[2]] Simply mention this advertisement when you order.\n\nThe Fairview Plaza location also has a private dining room that can [[3]] up to 40 guests, making it ideal for business lunches and family celebrations. Reservations are [[4]] recommended on weekends. Visit www.saffrontable.com to book a table.","qs":[{"opts":["Alike","Likely","Liking","Like"],"answer":3,"exp":"Like + คำนาม = เช่นเดียวกับ ใช้เป็นบุพบทเปรียบเทียบสาขาใหม่กับสาขาเดิม ส่วน Alike ใช้หลังคำนาม/กริยา (they look alike) ไม่นำหน้าคำนาม และ Likely แปลว่าน่าจะ"},{"opts":["Our chefs are currently looking for new recipes.","This offer cannot be combined with any other discounts.","The downtown location will close permanently next week.","Lunch is not served at either location."],"answer":1,"exp":"ประโยคก่อนหน้าพูดถึงข้อเสนอส่วนลด 20% การระบุเงื่อนไขของข้อเสนอจึงต่อเนื่องที่สุด ส่วนประโยคที่ว่าไม่มีอาหารกลางวันขัดกับย่อหน้าถัดไปที่กล่าวถึง business lunches"},{"opts":["accommodate","assemble","attend","situate"],"answer":0,"exp":"accommodate = รองรับ (จำนวนคน) ใช้กับ up to 40 guests ได้ถูกต้อง ส่วน attend (เข้าร่วม) ต้องมีคนเป็นประธาน ห้องอาหารเข้าร่วมไม่ได้"},{"opts":["strongly","strong","strength","strengthen"],"answer":0,"exp":"ช่องว่างขยายกริยา recommended จึงใช้ adverb คือ strongly (strongly recommended = แนะนำเป็นอย่างยิ่ง) ส่วน strong เป็น adjective ขยายกริยาไม่ได้"}]},{"kind":"e-mail","head":"To: SkyMiles Members\nFrom: SkyBridge Airways <rewards@skybridgeair.com>\nDate: January 15\nSubject: Changes to the SkyMiles program","t":"Dear Valued Member,\n\nWe are writing to inform you of several improvements to the SkyMiles program that will take effect on March 1. Most notably, miles earned on SkyBridge flights will no longer [[1]] after 24 months. Instead, they will remain in your account for as long as your membership is active.\n\nIn addition, members will be able to use their miles to pay for checked baggage and seat selection. [[2]] Previously, miles could be redeemed only for flights and upgrades.\n\nTo view your current balance, log in to your account at skybridgeair.com. [[3]] you have any questions about these changes, our member services team is available 24 hours a day.\n\nThank you for flying with us. We look forward to [[4]] you on board again soon.\n\nSkyBridge Airways Member Services","qs":[{"opts":["exceed","expend","expire","expose"],"answer":2,"exp":"expire = หมดอายุ สอดคล้องกับประโยคถัดไปที่ว่าไมล์จะคงอยู่ในบัญชีตราบที่ยังเป็นสมาชิก ส่วน exceed (เกิน) และ expend (ใช้จ่าย) สะกดคล้ายกันแต่ความหมายไม่ตรง"},{"opts":["Unfortunately, these benefits are being discontinued.","These options can be selected when you book online or through our mobile app.","Baggage fees will be eliminated for all passengers.","Membership cards will be mailed to new members next week."],"answer":1,"exp":"ประโยคก่อนหน้าพูดถึงการใช้ไมล์จ่ายค่าสัมภาระและเลือกที่นั่ง การบอกช่องทางเลือกใช้สิทธิ์จึงต่อเนื่อง ส่วนประโยคที่ว่าสิทธิประโยชน์ถูกยกเลิกขัดกับเนื้อหาที่เป็นการปรับปรุงโปรแกรม"},{"opts":["Unless","Although","Whether","Should"],"answer":3,"exp":"Should you have questions = If you have questions เป็นโครงสร้างเงื่อนไขแบบสลับที่ (inversion) ที่ใช้บ่อยในภาษาธุรกิจ ส่วน Unless (เว้นแต่) ทำให้ความหมายผิดไป"},{"opts":["welcome","welcomed","welcoming","be welcomed"],"answer":2,"exp":"look forward to ในที่นี้ to เป็นบุพบท จึงต้องตามด้วย V-ing คือ welcoming ส่วน welcome เป็นกับดักที่คิดว่า to เป็น infinitive"}]},{"kind":"notice","head":"Glenmore Museum of Natural History — Members' Evening","t":"Glenmore Museum members are invited to an exclusive preview of our new exhibition, Oceans in Motion, on Thursday, May 8, from 6:00 to 9:00 P.M. The exhibition, which [[1]] more than three years to develop, explores the ocean currents that shape our planet's climate.\n\nGuests will be able to tour the galleries before they open to the public and hear a short talk by lead curator Dr. Hannah Moyo. Light refreshments will be served in the Atrium [[2]] the evening.\n\nAdmission is free for members, but space is limited. [[3]] Each member may bring one guest. Please note that photography is not [[4]] inside the exhibition galleries.\n\nTo reserve your place, call 555-0139 or visit glenmoremuseum.org/members.","qs":[{"opts":["took","takes","will take","is taking"],"answer":0,"exp":"นิทรรศการพัฒนาเสร็จแล้วและพร้อมเปิดให้ชม การใช้เวลาพัฒนาจึงเป็นเหตุการณ์ในอดีต ใช้ past simple คือ took ส่วน will take หมายถึงยังไม่ได้เริ่มพัฒนา ซึ่งขัดกับบริบท"},{"opts":["between","across","onto","throughout"],"answer":3,"exp":"throughout the evening = ตลอดช่วงค่ำ ใช้กับช่วงเวลา ส่วน between ต้องใช้กับสองจุด (between 6 and 9) และ across ใช้กับพื้นที่มากกว่าเวลา"},{"opts":["Members are therefore encouraged to register by May 1.","Tickets for the general public are now sold out.","The exhibition closed to visitors last month.","Dr. Moyo will retire at the end of the year."],"answer":0,"exp":"ประโยคก่อนหน้าบอกว่าที่นั่งมีจำกัด จึงแนะนำให้ลงทะเบียนล่วงหน้า (therefore แสดงผลลัพธ์) ส่วนประโยคที่ว่านิทรรศการปิดไปแล้วขัดกับข้อความว่าเป็นนิทรรศการใหม่ที่กำลังจะเปิด"},{"opts":["permitted","permission","permit","permissive"],"answer":0,"exp":"is not + V3 เป็น passive (การถ่ายภาพไม่ได้รับอนุญาต) จึงใช้ permitted ส่วน permission เป็นคำนาม และ permissive เป็นคำคุณศัพท์แปลว่าผ่อนปรน ไม่ตรงความหมาย"}]}],"p7":[{"passages":[{"kind":"text message chain","head":"","t":"Linda Park (10:05 A.M.): Jake, I'm at 412 Willow Court for the 10:30 showing, but the lockbox code you gave me isn't working.\n\nJake Morrison (10:07 A.M.): Sorry about that! The owners changed it yesterday. Try 5829.\n\nLinda Park (10:09 A.M.): That worked. The buyers just pulled up, so we're right on time.\n\nJake Morrison (10:10 A.M.): Great. By the way, the owners had the kitchen repainted last week, so please mention it. And the washer and dryer are included in the price.\n\nLinda Park (10:11 A.M.): Good to know. I'll text you afterward to let you know how it went."}],"qs":[{"q":"Why did Ms. Park contact Mr. Morrison?","opts":["She was late for an appointment.","She needed the address of a house.","She wanted to cancel a showing.","She was unable to enter a property."],"answer":3,"exp":"Ms. Park แจ้งว่ารหัส lockbox ที่ได้รับใช้ไม่ได้ จึงเข้าบ้านไม่ได้ ตัวเลือกเรื่องมาสายผิดเพราะเธอบอกภายหลังว่ามาทันเวลา (right on time)"},{"q":"What does Mr. Morrison ask Ms. Park to do?","opts":["Lower the asking price","Call the owners after the showing","Point out a recent improvement","Remove the washer and dryer"],"answer":2,"exp":"Mr. Morrison บอกว่าเจ้าของเพิ่งทาสีห้องครัวใหม่ และขอให้เธอบอกผู้ซื้อ (please mention it) ซึ่งคือการชี้ให้เห็นการปรับปรุงล่าสุด ตัวเลือกเรื่องเครื่องซักผ้าเป็นกับดักเพราะเครื่องรวมอยู่ในราคา ไม่ได้ให้เอาออก"}]},{"passages":[{"kind":"notice","head":"Pemberton Art Museum — Visitor Notice","t":"The East Wing galleries will be closed from January 6 to February 14 while we install a new climate-control system that will better protect the paintings in our collection. During this time, selected works from the East Wing, including Claude Arnaud's \"Harbor at Dawn,\" will be on view in the Lower Level Gallery.\n\nAll other areas of the museum, including the sculpture garden, gift shop, and café, will remain open during regular hours. General admission will be reduced from $18 to $12 throughout the closure.\n\nWe thank you for your understanding as we work to preserve our collection for future generations."}],"qs":[{"q":"Why will part of the museum be closed?","opts":["To upgrade some equipment","To prepare for a special exhibition","To repair damage to a sculpture garden","To reorganize the gift shop"],"answer":0,"exp":"ประกาศระบุว่าจะปิด East Wing เพื่อติดตั้งระบบควบคุมสภาพอากาศใหม่ (new climate-control system) ซึ่งคือการปรับปรุงอุปกรณ์ sculpture garden เป็นกับดักเพราะยังเปิดตามปกติ"},{"q":"What is mentioned about the museum's admission price?","opts":["It will include entry to a special lecture.","It is free for children.","It will increase after February 14.","It will be lowered for a limited time."],"answer":3,"exp":"ค่าเข้าชมจะลดจาก $18 เป็น $12 ตลอดช่วงที่ปิด (throughout the closure) ซึ่งคือการลดราคาชั่วคราว ไม่มีข้อมูลว่าจะขึ้นราคาหลัง 14 กุมภาพันธ์"}]},{"passages":[{"kind":"invoice","head":"Northgate Electric Cooperative\nAccount No. 0047-3381-22\nCustomer: Tidewater Bakery, 18 Canal Street\nBilling period: September 1 – September 30\nStatement date: October 3","t":"Previous balance .......... $412.60\nPayment received September 18 — thank you .......... –$412.60\nElectricity used (5,240 kWh) .......... $628.80\nService charge .......... $24.00\nEnergy-efficiency rebate (new oven, approved August 22) .......... –$75.00\n\nAmount due: $577.80\nDue date: October 24\n\nA late fee of 1.5 percent will be added to balances not paid by the due date. Sign up for AutoPay at www.northgateelectric.coop and never miss a payment."}],"qs":[{"q":"What is indicated about Tidewater Bakery?","opts":["It paid its previous bill in full.","It used less electricity than in August.","It has signed up for AutoPay.","It owes a late fee."],"answer":0,"exp":"ใบแจ้งหนี้แสดงยอดค้างเดิม $412.60 และมีการชำระ $412.60 เมื่อ 18 กันยายน จึงจ่ายบิลก่อนหน้าครบแล้ว ไม่มีการเปรียบเทียบการใช้ไฟกับเดือนสิงหาคม"},{"q":"Why did the bakery receive a credit?","opts":["It reported a billing error.","It paid its bill early.","It reduced its business hours.","It purchased an energy-saving appliance."],"answer":3,"exp":"รายการ Energy-efficiency rebate (new oven) แสดงว่าได้รับเงินคืน $75 เพราะซื้อเตาอบใหม่ที่ประหยัดพลังงาน ตัวเลือกเรื่องจ่ายเร็วผิดเพราะไม่มีส่วนลดสำหรับการชำระก่อนกำหนด"}]},{"passages":[{"kind":"advertisement","head":"Harwick Advisory Group — Spring Workshop Series","t":"Are you a small-business owner trying to grow without losing control of your costs? Join the consultants of Harwick Advisory Group for a series of practical, three-hour workshops held at our downtown office on Saturday mornings in April.\n\nApril 5: Pricing Your Products for Profit\nApril 12: Cash-Flow Planning Made Simple\nApril 19: Hiring Your First Employees\nApril 26: Building an Online Sales Channel\n\nEach workshop costs $95, or register for all four for $320. Class size is limited to 20 participants so that every attendee can ask questions. Register at www.harwickadvisory.com/workshops."}],"qs":[{"q":"Who is the advertisement intended for?","opts":["Professional consultants","Owners of small companies","Job seekers","University students"],"answer":1,"exp":"โฆษณาเปิดด้วยคำถามถึง \"small-business owner\" จึงมุ่งเป้าไปที่เจ้าของธุรกิจขนาดเล็ก ตัวเลือก consultants เป็นกับดักเพราะที่ปรึกษาเป็นผู้สอนในเวิร์กช็อป"},{"q":"What is mentioned about the workshops?","opts":["Participants can save money by attending all of them.","They take place in the evening.","They are offered online.","They have no limit on attendance."],"answer":0,"exp":"แต่ละเวิร์กช็อปราคา $95 (รวมสี่ครั้ง = $380) แต่ลงทะเบียนทั้งสี่ครั้งจ่ายเพียง $320 จึงประหยัดกว่า ตัวเลือกเรื่องไม่จำกัดจำนวนผิดเพราะจำกัดไว้ 20 คน"}]},{"passages":[{"kind":"e-mail","head":"To: Carlos Mendes <cmendes@quickmail.com>\nFrom: Orchard Lane Outfitters <support@orchardlane.com>\nDate: July 9\nSubject: Your return request #RT-58812","t":"Dear Mr. Mendes,\n\nThank you for contacting Orchard Lane Outfitters about the hiking boots (order #OL-20934) you received on July 3. We are sorry to hear that they were the wrong size.\n\nWe have approved your request to exchange the boots for a size 10. Because the error was ours, we will cover all shipping costs. A prepaid return label is attached to this e-mail. Simply print it, attach it to the original box, and drop the package off at any Parcel Express location. Your replacement pair will be dispatched as soon as the returned item is scanned by the carrier, so you do not need to wait for it to reach our warehouse.\n\nPlease note that the boots must be unworn and returned within 30 days of delivery.\n\nKind regards,\nOrchard Lane Customer Support"}],"qs":[{"q":"Why did Mr. Mendes contact the company?","opts":["His order arrived late.","He was charged twice for an order.","He wanted to cancel a purchase.","He received an item in the wrong size."],"answer":3,"exp":"อีเมลระบุว่าบริษัทเสียใจที่รองเท้าที่ได้รับเป็นไซส์ผิด (the wrong size) จึงขอเปลี่ยน ตัวเลือกยกเลิกการสั่งซื้อผิดเพราะเขาขอเปลี่ยนสินค้า (exchange) ไม่ใช่ยกเลิก"},{"q":"In paragraph 2, line 4, the word \"dispatched\" is closest in meaning to","opts":["repaired","sent","inspected","ordered"],"answer":1,"exp":"ในบริบท \"Your replacement pair will be dispatched\" คำว่า dispatched หมายถึงถูกส่งออกไป (sent) ตัวเลือก inspected ผิดเพราะการสแกนเป็นของบริษัทขนส่ง ไม่ใช่ความหมายของคำนี้"},{"q":"What is indicated about the replacement boots?","opts":["They will be shipped before the original boots reach the warehouse.","They will cost Mr. Mendes an extra shipping fee.","They must be picked up at a Parcel Express location.","They are available only in size 10."],"answer":0,"exp":"อีเมลระบุว่าจะส่งคู่ใหม่ทันทีที่บริษัทขนส่งสแกนพัสดุที่ส่งคืน โดยไม่ต้องรอให้ถึงคลังสินค้า ตัวเลือกเรื่องค่าส่งผิดเพราะบริษัทรับผิดชอบค่าส่งทั้งหมด ส่วน Parcel Express เป็นที่สำหรับส่งของคืน ไม่ใช่รับของ"}]},{"passages":[{"kind":"schedule","head":"Kestrel Bay Ferries — Island Hopper Day Pass\nSummer Timetable (June 1 – September 15)","t":"Depart Port Halden: 8:00 A.M. / 11:00 A.M. / 2:30 P.M.\nArrive Merrow Island: 8:45 A.M. / 11:45 A.M. / 3:15 P.M.\nDepart Merrow Island for Gull Rock: 9:15 A.M. / 12:15 P.M. / 3:45 P.M.\nArrive Gull Rock: 9:50 A.M. / 12:50 P.M. / 4:20 P.M.\nFinal return from Gull Rock to Port Halden: 5:30 P.M. (arrives 6:40 P.M.)\n\nDay Pass: Adults $38, Children (5–12) $19, Children under 5 free\n\nNotes:\n- Day Pass holders may get on and off at any stop as often as they like.\n- Bicycles may be brought on board for an additional $5.\n- Sailings may be canceled in rough weather. Check www.kestrelbayferries.com before traveling.\n- The 8:00 A.M. sailing does not operate on Sundays."}],"qs":[{"q":"What is true about the Day Pass?","opts":["It is only valid on weekdays.","It includes the cost of bringing a bicycle.","It must be purchased online.","It allows passengers to stop at islands multiple times."],"answer":3,"exp":"ตารางระบุว่าผู้ถือ Day Pass ขึ้นลงที่จุดใดก็ได้บ่อยเท่าที่ต้องการ (as often as they like) ตัวเลือกเรื่องจักรยานผิดเพราะต้องจ่ายเพิ่ม $5"},{"q":"What time does the last ferry leave Gull Rock for Port Halden?","opts":["At 4:20 P.M.","At 5:30 P.M.","At 3:45 P.M.","At 6:40 P.M."],"answer":1,"exp":"ตารางระบุ Final return from Gull Rock to Port Halden: 5:30 P.M. ส่วน 6:40 P.M. เป็นเวลาที่ถึง Port Halden ไม่ใช่เวลาออก จึงเป็นกับดัก"},{"q":"What is suggested about traveling on a Sunday?","opts":["The earliest departure from Port Halden is at 11:00 A.M.","Children travel free of charge.","Ferries do not stop at Merrow Island.","Bicycles are not permitted."],"answer":0,"exp":"หมายเหตุระบุว่าเที่ยว 8:00 A.M. ไม่ให้บริการวันอาทิตย์ ดังนั้นเที่ยวแรกจาก Port Halden ในวันอาทิตย์คือ 11:00 A.M. เป็นคำถามอนุมาน (inference) ไม่มีข้อมูลว่าเด็กเดินทางฟรีเฉพาะวันอาทิตย์"}]},{"passages":[{"kind":"form","head":"Pacific Food Processing Expo — Exhibitor Registration Form\nVancouver Convention Centre, March 18–20","t":"Company name: Golden Field Grain Co.\nContact person: Ayesha Malik, Sales Director\nE-mail: amalik@goldenfieldgrain.ca\n\nBooth size requested: [ ] 3 m x 3 m ($1,800)   [X] 3 m x 6 m ($3,200)   [ ] 6 m x 6 m ($5,900)\n\nAdditional services:\n[X] Electrical outlet ($120)\n[ ] Internet connection ($90)\n[X] Refrigerated display case ($350)\n\nProducts to be exhibited: Organic oat flour, gluten-free baking mixes, and a new line of ready-to-eat breakfast cereals launching in April.\n\nSpecial requests: We would like a booth near the product demonstration stage, if possible, as we plan to hold short tasting sessions each afternoon.\n\nPayment of 50 percent is due upon registration. The remaining balance must be paid by February 15."}],"qs":[{"q":"What is the purpose of the form?","opts":["To place an order for baking ingredients","To apply for a sales position","To reserve space at an industry event","To book a hotel room in Vancouver"],"answer":2,"exp":"แบบฟอร์มนี้เป็น Exhibitor Registration Form ของงาน Expo ใช้เพื่อจองพื้นที่บูธ ตัวเลือกเรื่องสั่งวัตถุดิบเป็นกับดักเพราะผลิตภัณฑ์เบเกอรี่เป็นสินค้าที่บริษัทจะนำมาจัดแสดง"},{"q":"What service did Ms. Malik NOT request?","opts":["A power supply","Internet access","A cooled display unit","A booth measuring 3 m x 6 m"],"answer":1,"exp":"ในแบบฟอร์มไม่ได้ทำเครื่องหมายที่ Internet connection ส่วน electrical outlet (power supply), refrigerated display case (cooled display unit) และบูธ 3 m x 6 m ถูกเลือกไว้ทั้งหมด"},{"q":"Why does Golden Field Grain Co. want to be near the stage?","opts":["It will give a speech on the first day.","It needs access to a refrigerator.","It intends to offer samples of its products.","It wants to be close to the entrance."],"answer":2,"exp":"ในช่อง Special requests ระบุว่าจะจัด tasting sessions ทุกบ่าย ซึ่งคือการให้ชิมตัวอย่างสินค้า ไม่มีข้อมูลว่าบริษัทจะขึ้นกล่าวสุนทรพจน์"}]},{"passages":[{"kind":"online chat","head":"","t":"Bianca Rossi (1:15 P.M.): Hi, team. Head office just confirmed that the new Solara skincare line will launch in all our stores on Friday instead of next Monday.\n\nKwame Asante (1:17 P.M.): Friday? The display stands were supposed to be delivered on Thursday afternoon. That gives us one evening to set everything up.\n\nBianca Rossi (1:18 P.M.): I know it's tight. Can we stay late on Thursday?\n\nSun-hee Lim (1:20 P.M.): I can stay until 10:00. But we'll also need the product training before customers start asking questions.\n\nKwame Asante (1:21 P.M.): The Solara representative is coming Thursday at 9:00 A.M. for that.\n\nSun-hee Lim (1:22 P.M.): Then we're in good shape.\n\nBianca Rossi (1:24 P.M.): Great. Kwame, could you call the delivery company and see if the stands can come in the morning instead? I'll put together the staff schedule for Thursday night and send it out by 5:00 today.\n\nKwame Asante (1:25 P.M.): Sure, I'll call them now."}],"qs":[{"q":"What has recently changed?","opts":["The location of a store","The date of a product launch","The price of a skincare line","The time of a staff meeting"],"answer":1,"exp":"Ms. Rossi แจ้งว่าการเปิดตัวสินค้า Solara เลื่อนมาเป็นวันศุกร์แทนวันจันทร์หน้า จึงเป็นการเปลี่ยนวันเปิดตัวสินค้า ไม่มีการพูดถึงการเปลี่ยนราคา"},{"q":"What concern does Mr. Asante express?","opts":["Some products have not been ordered.","There may not be enough time to prepare displays.","The staff have not been trained.","A representative has canceled a visit."],"answer":1,"exp":"Mr. Asante กังวลว่าชั้นวางจะมาถึงบ่ายวันพฤหัส ทำให้มีเวลาจัดแค่คืนเดียว ตัวเลือกเรื่อง representative ยกเลิกผิดเพราะตัวแทนยังมาวันพฤหัส 9:00 A.M."},{"q":"At 1:22 P.M., what does Ms. Lim most likely mean when she writes, \"Then we're in good shape\"?","opts":["She thinks the store looks attractive.","She believes the displays have already arrived.","She wants to leave work early.","She is satisfied that the training will happen in time."],"answer":3,"exp":"Ms. Lim กังวลว่าต้องอบรมเรื่องสินค้าก่อนลูกค้ามาถาม เมื่อ Mr. Asante บอกว่าตัวแทนจะมาอบรมวันพฤหัสเช้า เธอจึงหมายความว่าการอบรมจะทันเวลา ไม่มีปัญหา"},{"q":"What will Ms. Rossi do by the end of the day?","opts":["Distribute a work schedule","Call a delivery company","Meet with a representative","Contact head office"],"answer":0,"exp":"Ms. Rossi บอกว่าจะจัดตารางงานพนักงานสำหรับคืนวันพฤหัสและส่งออกไปภายใน 5:00 วันนี้ ส่วนการโทรหาบริษัทขนส่งเป็นหน้าที่ของ Mr. Asante จึงเป็นกับดัก"}]},{"passages":[{"kind":"article","head":"Former Rail Yard to Become Mixed-Use District\nBy Teresa Lindqvist, Harlow Daily News","t":"HARLOW (September 3) — The long-abandoned Eastside rail yard will be transformed into a neighborhood of apartments, shops, and green space under a plan approved by the city council on Monday. — [1] —\n\nThe $340 million project, called Ironworks Commons, is being developed by Calloway Partners, a firm known for converting former industrial sites in Denver and Pittsburgh. Plans call for 600 apartments, a grocery store, and roughly 40 smaller retail spaces. — [2] — The developer also intends to preserve the yard's historic brick locomotive shed and convert it into an indoor food hall.\n\nSome nearby residents had expressed concern about increased traffic. In response, Calloway Partners agreed to fund a new bus stop and a protected bicycle lane along Mercer Avenue. — [3] —\n\nWork on the first phase, which includes 250 apartments and the food hall, will start next spring. — [4] — Calloway expects the entire district to be completed within six years."}],"qs":[{"q":"What is the article mainly about?","opts":["The opening of a new train station","The history of a railway company","Plans to redevelop an unused property","A dispute between two developers"],"answer":2,"exp":"บทความรายงานแผนเปลี่ยนลานรถไฟร้างเป็นย่านที่พักอาศัยและร้านค้า (mixed-use district) คือการพัฒนาพื้นที่ที่ไม่ได้ใช้งานใหม่ ตัวเลือกสถานีรถไฟใหม่เป็นกับดักจากคำว่า rail yard"},{"q":"What is indicated about Calloway Partners?","opts":["It is based in Harlow.","It owns a chain of grocery stores.","It has completed similar projects in other cities.","It plans to tear down a historic building."],"answer":2,"exp":"บทความระบุว่า Calloway Partners มีชื่อเสียงด้านการแปลงพื้นที่อุตสาหกรรมเก่าใน Denver และ Pittsburgh ตัวเลือกเรื่องรื้ออาคารประวัติศาสตร์ผิดเพราะบริษัทจะอนุรักษ์ locomotive shed ไว้"},{"q":"How did the developer respond to residents' concerns?","opts":["By agreeing to pay for transportation improvements","By reducing the number of apartments","By delaying the start of construction","By moving the grocery store to another site"],"answer":0,"exp":"เพื่อตอบข้อกังวลเรื่องการจราจร บริษัทตกลงออกเงินสร้างป้ายรถเมล์และเลนจักรยานใหม่บน Mercer Avenue (fund ... = pay for) ไม่มีข้อมูลว่าลดจำนวนอพาร์ตเมนต์"},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"Leasing for those units is expected to begin in late 2028.\"","opts":["[1]","[2]","[3]","[4]"],"answer":3,"exp":"\"those units\" ต้องอ้างถึงหน่วยที่พักที่เพิ่งกล่าวถึง คือ 250 apartments ในระยะแรก จึงต้องอยู่ที่ตำแหน่ง [4] หลังประโยคเรื่องการเริ่มงานระยะแรก ตำแหน่ง [2] ไม่เหมาะเพราะยังไม่ได้แบ่งระยะการก่อสร้าง"}]},{"passages":[{"kind":"letter","head":"Corvanta Pharma Ltd.\n14 Greyfriars Road\nCambridge CB2 1QA\n\n5 May\n\nDr. Helena Marsh\n22 Elmstead Close\nLeeds LS6 2PT","t":"Dear Dr. Marsh,\n\nFollowing your interviews with our clinical research team last month, I am delighted to offer you the position of Senior Clinical Trials Manager at Corvanta Pharma, based at our Cambridge laboratory. Your experience overseeing vaccine studies at Brennock Health made a strong impression on the panel. — [1] —\n\nYour starting salary will be £68,000 per year. In addition, Corvanta will reimburse up to £4,000 of your moving expenses from Leeds, provided that receipts are submitted within 60 days of your start date. We propose a start date of Monday, 7 July, although we are willing to accommodate a later date if you need more time to relocate. — [2] —\n\nDuring your first two weeks, you will complete our standard orientation program, which covers laboratory safety and data-protection procedures. — [3] — You will then join Dr. Samuel Okafor's team, which is preparing to launch a trial of a new asthma medication in September.\n\nPlease confirm your acceptance by 19 May. A formal contract will follow. — [4] —\n\nYours sincerely,\n\nFiona Gallagher\nHead of Human Resources"}],"qs":[{"q":"Why did Ms. Gallagher write the letter?","opts":["To invite Dr. Marsh to an interview","To offer Dr. Marsh a job","To ask Dr. Marsh to join a clinical trial as a participant","To confirm Dr. Marsh's relocation to Leeds"],"answer":1,"exp":"จดหมายระบุว่า \"I am delighted to offer you the position\" จึงเป็นจดหมายเสนองาน ตัวเลือกเชิญสัมภาษณ์ผิดเพราะการสัมภาษณ์เกิดขึ้นแล้วเมื่อเดือนที่แล้ว และเธอกำลังย้ายจาก Leeds ไม่ใช่ย้ายไป Leeds"},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong?\n\"All new employees attend this program, regardless of their previous experience.\"","opts":["[1]","[2]","[3]","[4]"],"answer":2,"exp":"\"this program\" ต้องอ้างถึงโปรแกรมที่เพิ่งกล่าวถึง คือ orientation program ในย่อหน้าที่ 3 จึงต้องอยู่ที่ตำแหน่ง [3] ซึ่งอยู่ระหว่างการอธิบายการปฐมนิเทศกับการเข้าร่วมทีมของ Dr. Okafor"},{"q":"In paragraph 2, line 3, the word \"accommodate\" is closest in meaning to","opts":["house","contain","allow","deliver"],"answer":2,"exp":"ในบริบท \"willing to accommodate a later date\" คำว่า accommodate หมายถึงยอมรับหรือปรับตามความต้องการ ใกล้เคียงกับ allow ความหมาย house (ให้ที่พัก) เป็นความหมายอื่นของ accommodate ที่ไม่เข้ากับบริบทนี้"},{"q":"What will Dr. Marsh do first after she joins the company?","opts":["Take part in a training program","Begin testing an asthma medication","Submit receipts for her moving costs","Sign a formal contract"],"answer":0,"exp":"จดหมายระบุว่าในสองสัปดาห์แรกเธอจะเข้าโปรแกรมปฐมนิเทศ (orientation program) ก่อนเข้าร่วมทีมของ Dr. Okafor ตัวเลือกเรื่องยาหอบหืดเป็นกับดักเพราะทีมจะเริ่มทดลองในเดือนกันยายน หลังการปฐมนิเทศ"}]},{"passages":[{"kind":"notice","head":"Ridgeway Water & Power\nNotice of Scheduled Maintenance — Elm District","t":"To improve the reliability of our network, Ridgeway Water & Power will carry out maintenance work in the Elm District on Tuesday, March 11, from 9:00 A.M. to 3:00 P.M. Service will be affected as follows:\n\nNorth Elm Street — water service only\nCarver Avenue — electricity only\nJuniper Lane — water and electricity\n\nWe recommend that customers store drinking water and switch off sensitive electronic equipment before work begins. Customers who rely on electrically powered medical equipment should call 555-0190 to register for priority updates.\n\nCustomers whose electricity is interrupted for more than four hours will receive a $10 credit, which will be applied automatically to their next bill. We apologize for any inconvenience."},{"kind":"e-mail","head":"To: service@ridgewaywp.com\nFrom: Tomás Rivera <tomas@crumbandcup.com>\nDate: March 3\nSubject: Planned maintenance on March 11","t":"Dear Ridgeway Water & Power,\n\nI own Crumb & Cup, a bakery café at 41 Juniper Lane. I recently received your notice about the maintenance work scheduled for next week.\n\nTuesday is one of our busiest days, as we bake bread for several local restaurants that morning. Without power or water, we will have to cancel those orders. Would it be possible to move the work on our street to a Sunday or to start it later in the afternoon? I realize this may be difficult to arrange, but I would be grateful if you could accommodate our request.\n\nIf the schedule cannot be changed, could you confirm whether I need to apply for the credit mentioned in your notice?\n\nSincerely,\nTomás Rivera"}],"qs":[{"q":"What is the purpose of the notice?","opts":["To announce an increase in service rates","To request payment of an overdue bill","To inform customers of a planned service interruption","To introduce a new energy-saving program"],"answer":2,"exp":"ประกาศแจ้งเรื่อง scheduled maintenance ที่จะทำให้น้ำและไฟฟ้าดับบางถนนในวันที่ 11 มีนาคม จึงตอบ C ส่วน A และ B ไม่มีการกล่าวถึง"},{"q":"What services will be unavailable at Crumb & Cup on March 11?","opts":["Both water and electricity","Water only","Electricity only","Gas and water"],"answer":0,"exp":"เชื่อมข้อมูล: ร้านอยู่ที่ Juniper Lane ซึ่งในประกาศระบุว่าได้รับผลกระทบทั้ง water and electricity ตอบ A ส่วน B เป็นของ North Elm Street"},{"q":"What will most likely happen if the work is carried out as scheduled?","opts":["Mr. Rivera will need to submit an application form.","Mr. Rivera's account will receive a credit.","A technician will visit Mr. Rivera's café.","Mr. Rivera's water meter will be replaced."],"answer":1,"exp":"งานจะใช้เวลา 9:00 A.M.–3:00 P.M. (6 ชั่วโมง เกิน 4 ชั่วโมง) ร้านจึงได้เครดิต $10 ซึ่ง applied automatically จึงตอบ B ส่วน A ผิดเพราะไม่ต้องยื่นขอ"},{"q":"What does Mr. Rivera ask Ridgeway Water & Power to do?","opts":["Deliver bottled water to his café","Repair a problem with his equipment","Send him a copy of his latest bill","Change the timing of the work"],"answer":3,"exp":"เขาขอให้ move the work on our street to a Sunday or to start it later in the afternoon คือการเปลี่ยนเวลา ตอบ D"},{"q":"In the e-mail, the word \"accommodate\" in paragraph 2, line 4, is closest in meaning to","opts":["house","fit","grant","store"],"answer":2,"exp":"accommodate our request ในบริบทนี้หมายถึง 'ยอมทำตามคำขอ' ใกล้กับ grant ตอบ C ส่วน house เป็นความหมายของ accommodate ในเรื่อง 'ให้ที่พัก' ซึ่งไม่เข้าบริบท"}]},{"passages":[{"kind":"advertisement","head":"Halvorsen & Pike LLP\nLegal Essentials for Small Businesses — Spring Seminar Series","t":"Are you starting or growing a small business? Join the attorneys of Halvorsen & Pike for a series of practical seminars designed for business owners. All sessions are free of charge and take place from 6:00 P.M. to 8:00 P.M. at our offices on the fourth floor of 220 Lambert Street.\n\nApril 8 — Protecting Your Brand: Trademark Basics (Grace Liu)\nApril 15 — Hiring Your First Employees: Contracts Explained (Martin Pike)\nApril 22 — Before You Sign: Understanding Commercial Leases (Sandra Okoye)\n\nSeating is limited to 40 participants per session, and advance registration is required at www.halvorsenpike.com/seminars. Every attendee will receive a voucher for a free 30-minute consultation with the presenting attorney."},{"kind":"e-mail","head":"To: seminars@halvorsenpike.com\nFrom: Joanne Mercer <joanne@wickandember.com>\nDate: April 17\nSubject: Seminar follow-up","t":"Dear Seminar Coordinator,\n\nI attended your session on Tuesday evening and found it extremely useful. I run Wick & Ember, which has sold handmade candles exclusively online for the past three years. Business has grown so much that I am about to hire two employees, so the presentation came at the perfect time.\n\nI would like to use my consultation voucher to meet with the attorney who led Tuesday's session to review the draft contracts I have prepared. Please let me know what times are available next week.\n\nIn addition, I am planning to open a small retail shop downtown and expect to sign a lease next month. When I tried to register for that topic on your Web site, I was told the session was full. Is there a waiting list I could join?\n\nBest regards,\nJoanne Mercer"}],"qs":[{"q":"What is indicated about the seminars?","opts":["They are held at different locations.","They are offered at no cost.","They are open only to the firm's clients.","They last for an entire day."],"answer":1,"exp":"โฆษณาระบุ All sessions are free of charge ตรงกับ offered at no cost ตอบ B ส่วน A ผิดเพราะทุกครั้งจัดที่ 220 Lambert Street และ D ผิดเพราะจัดเพียงสองชั่วโมง"},{"q":"Whom does Ms. Mercer want to meet with?","opts":["Grace Liu","Sandra Okoye","Martin Pike","The seminar coordinator"],"answer":2,"exp":"เชื่อมข้อมูล: อีเมลวันที่ 17 เมษายนกล่าวถึง session on Tuesday เรื่องการจ้างพนักงาน ซึ่งตรงกับวันที่ 15 เมษายน ผู้บรรยายคือ Martin Pike ตอบ C"},{"q":"Which seminar is Ms. Mercer unable to register for?","opts":["Protecting Your Brand","Hiring Your First Employees","Marketing for Online Stores","Before You Sign"],"answer":3,"exp":"เธอจะเซ็นสัญญาเช่าร้าน (sign a lease) แต่สมัครไม่ได้เพราะเต็ม หัวข้อที่ตรงคือ Before You Sign: Understanding Commercial Leases ในวันที่ 22 เมษายน ตอบ D"},{"q":"What is suggested about Wick & Ember?","opts":["It currently has no physical store.","It has been in business for over ten years.","It sells candles to other retailers.","It recently hired a lawyer."],"answer":0,"exp":"อีเมลระบุว่าธุรกิจ has sold handmade candles exclusively online และกำลังวางแผนเปิดร้านค้า จึงแสดงว่ายังไม่มีหน้าร้าน ตอบ A ส่วน B ผิดเพราะดำเนินกิจการมาเพียงสามปี"},{"q":"What does Ms. Mercer ask about at the end of the e-mail?","opts":["Changing the date of her consultation","Joining a list for a full session","Receiving a copy of a presentation","Paying for an additional voucher"],"answer":1,"exp":"เธอถาม Is there a waiting list I could join? คือขอเข้ารายชื่อสำรองสำหรับสัมมนาที่เต็มแล้ว ตอบ B"}]},{"passages":[{"kind":"web page","head":"Meadowgold Dairy Ingredients — Wholesale Price List (Effective May 1)","t":"Shredded mozzarella, 10 kg case — $48.00\nAged cheddar block, 5 kg — $39.00\nSmoked provolone, 5 kg — $44.00\nWhey powder, 25 kg bag — $62.00\n\nOrders totaling more than $2,000 before tax qualify for an 8 percent discount.\n\nWe deliver to food manufacturers throughout the region every Tuesday and Friday. To receive your order on a given delivery day, please submit it by 12:00 noon two days before. Orders received after the deadline will be scheduled for the following delivery day."},{"kind":"e-mail","head":"To: orders@meadowgolddairy.com\nFrom: Steven Park <spark@crestlinefoods.com>\nDate: Wednesday, May 14, 3:40 P.M.\nSubject: Purchase order CF-2291","t":"Hello,\n\nCrestline Foods would like to place the following order for our frozen pizza production line:\n\n30 cases of shredded mozzarella\n10 blocks of smoked provolone\n4 bags of whey powder\n\nWe would like the order delivered this Friday, if possible, as we are launching a new pizza range next week.\n\nAlso, a member of our product development team saw that you have introduced a goat cheese crumble. Could you send us a small sample so that we can test it in a recipe?\n\nRegards,\nSteven Park\nPurchasing Manager, Crestline Foods"},{"kind":"e-mail","head":"To: Steven Park <spark@crestlinefoods.com>\nFrom: Ingrid Holloway <iholloway@meadowgolddairy.com>\nDate: May 15\nSubject: RE: Purchase order CF-2291","t":"Dear Mr. Park,\n\nThank you for your order. Unfortunately, we are temporarily out of the smoked cheese you requested because of a problem with our smoking equipment. As a substitute, I have included ten blocks of our aged cheddar. If this is not acceptable, please let me know by tomorrow.\n\nEven with this change, your order total still qualifies for our volume discount. Please note, however, that your order arrived after our cutoff time, so it will be delivered on our next scheduled delivery day.\n\nI have also asked our development kitchen to include a 1 kg sample of the new goat cheese crumble with your delivery, at no charge.\n\nBest regards,\nIngrid Holloway\nCustomer Accounts"}],"qs":[{"q":"What is indicated about Meadowgold Dairy Ingredients?","opts":["It delivers on specific days of the week.","It sells its products directly to consumers.","It recently raised the price of mozzarella.","It charges a fee for late orders."],"answer":0,"exp":"รายการราคาระบุว่าส่งสินค้า every Tuesday and Friday จึงตอบ A ส่วน B ผิดเพราะขายให้ food manufacturers ไม่ใช่ผู้บริโภค"},{"q":"Why did Mr. Park write the e-mail?","opts":["To complain about a damaged delivery","To ask about a change in prices","To apply for a business account","To order ingredients for a product"],"answer":3,"exp":"Mr. Park เขียนว่า would like to place the following order for our frozen pizza production line คือสั่งวัตถุดิบสำหรับผลิตพิซซ่า ตอบ D"},{"q":"How much does the product that is currently unavailable cost?","opts":["$39.00 per block","$48.00 per case","$44.00 per block","$62.00 per bag"],"answer":2,"exp":"เชื่อมข้อมูล: อีเมลตอบกลับบอกว่า smoked cheese หมดชั่วคราว ซึ่งในรายการคือ smoked provolone ราคา $44.00 ตอบ C ส่วน $39.00 เป็นราคาของ aged cheddar ที่ส่งมาแทน"},{"q":"Why will Crestline Foods still receive a discount?","opts":["It has been a customer for many years.","Its revised order total remains above $2,000.","It accepted a substitute product.","It agreed to test a new product."],"answer":1,"exp":"คำนวณจากรายการราคา: mozzarella 30 x $48 = $1,440, cheddar 10 x $39 = $390, whey 4 x $62 = $248 รวม $2,078 ยังเกิน $2,000 จึงได้ส่วนลด 8 percent ตอบ B ส่วน C เป็นกับดักเพราะการรับสินค้าทดแทนไม่ใช่เงื่อนไขของส่วนลด"},{"q":"When will Crestline Foods most likely receive its order?","opts":["On Tuesday, May 20","On Thursday, May 15","On Friday, May 16","On Friday, May 23"],"answer":0,"exp":"ต้องสั่งก่อนเที่ยงสองวันก่อนวันส่ง ส่งวันศุกร์ต้องสั่งภายในวันพุธเที่ยง แต่ Mr. Park ส่งอีเมลวันพุธ 3:40 P.M. ซึ่งเลยเวลา จึงเลื่อนไปวันส่งถัดไปคือวันอังคาร May 20 ตอบ A ส่วน C คือวันที่เขาต้องการแต่ไม่ทัน"}]},{"passages":[{"kind":"memo","head":"MEMO\nTo: All Laboratory Personnel\nFrom: Rachel Dunn, Health and Safety Office\nDate: May 20\nSubject: Annual laboratory safety training","t":"All employees who work in Halcyon Pharmaceuticals' research laboratories are required to complete this year's safety training by June 30. Anyone who has not completed the training by that date will have his or her laboratory access temporarily suspended.\n\nThe two-hour sessions will be held in Conference Room 108, Building 2, on the following dates:\n\nWednesday, June 4 — 9:00 A.M.\nThursday, June 12 — 2:00 P.M.\nThursday, June 19 — 8:00 P.M. (intended for night-shift staff)\nThursday, June 26 — 10:00 A.M. (reserved for employees who joined the company after January 1)\n\nPlease sign up for one session through the training portal by May 30."},{"kind":"e-mail","head":"To: Rachel Dunn <rdunn@halcyonpharma.com>\nFrom: Kwame Mensah <kmensah@halcyonpharma.com>\nDate: June 2\nSubject: Safety training","t":"Dear Ms. Dunn,\n\nI registered for the evening session of the safety training, as it is the only one that fits my work hours. However, my supervisor has just asked me to represent our team at the International Drug Formulation Conference in Basel, which runs from June 17 to 21.\n\nThe daytime sessions on June 4 and June 12 fall during the hours I normally sleep after my shift, so attending them would be very difficult. Would it be possible for me to join the final session instead, even though I have been with the company for four years?\n\nThank you for your help.\n\nKwame Mensah\nLaboratory Technician, Stability Testing"},{"kind":"e-mail","head":"To: Kwame Mensah <kmensah@halcyonpharma.com>\nFrom: Rachel Dunn <rdunn@halcyonpharma.com>\nDate: June 3\nSubject: RE: Safety training","t":"Dear Mr. Mensah,\n\nThank you for letting me know in advance. Although the final session is normally limited to recent hires, there is still space available, so I have moved your registration to that date. You do not need to take any further action in the training portal.\n\nPlease be aware that the session will now take place in Room 214 of the same building, as Room 108 is being renovated. Remember to bring your employee badge, as it will be scanned to record your attendance.\n\nEnjoy the conference.\n\nRachel Dunn"}],"qs":[{"q":"What is the purpose of the memo?","opts":["To announce the opening of a new laboratory","To invite staff to an international conference","To introduce a new health and safety officer","To inform employees about a required program"],"answer":3,"exp":"บันทึกแจ้งว่าพนักงานห้องปฏิบัติการทุกคน are required to complete this year's safety training และระบุวันอบรม จึงตอบ D"},{"q":"Which session did Mr. Mensah originally register for?","opts":["The session on June 4","The session on June 19","The session on June 12","The session on June 26"],"answer":1,"exp":"เชื่อมข้อมูล: เขาบอกว่าลงทะเบียน evening session เพราะทำงานกะกลางคืน ซึ่งในบันทึกคือรอบ June 19 เวลา 8:00 P.M. (intended for night-shift staff) ตอบ B"},{"q":"Why is Mr. Mensah unable to attend his original session?","opts":["He will be away on a business trip.","He will be starting a new shift schedule.","He has already completed the training.","He is changing to a different department."],"answer":0,"exp":"เขาต้องไปร่วมประชุมที่ Basel ระหว่าง June 17-21 ซึ่งตรงกับรอบ June 19 จึงตอบ A ส่วน C ผิดเพราะเขายังไม่ได้อบรม"},{"q":"What is suggested about Mr. Mensah?","opts":["He has requested a transfer to the day shift.","He organizes the Basel conference every year.","He is not usually eligible for the June 26 session.","He missed the deadline to register for training."],"answer":2,"exp":"บันทึกระบุว่ารอบ June 26 สำหรับพนักงานที่เข้าทำงานหลัง January 1 แต่ Mr. Mensah ทำงานมาสี่ปี และ Ms. Dunn เขียนว่า normally limited to recent hires จึงตอบ C ส่วน D ผิดเพราะเขาลงทะเบียนไว้แล้ว"},{"q":"According to Ms. Dunn, what should Mr. Mensah do?","opts":["Register again through the training portal","Ask his supervisor for written approval","Go to Room 108 in Building 2","Bring identification to the session"],"answer":3,"exp":"Ms. Dunn เตือนว่า Remember to bring your employee badge เพื่อสแกนบันทึกการเข้าร่วม ซึ่งตรงกับ identification ตอบ D ส่วน C ผิดเพราะย้ายไป Room 214 และ A ผิดเพราะ You do not need to take any further action"}]},{"passages":[{"kind":"web page","head":"www.kestrelbaytours.com\nKestrel Bay Tours — Explore the Coast with Us","t":"Harbor Cruise (2 hours) — $45 per person\nRelax on our covered deck while our guide points out local landmarks. Departs daily at 11:00 A.M. and 3:00 P.M.\n\nFull-Day Whale Watch (7 hours) — $120 per adult, $60 per child under 12\nHead out to the open sea in search of humpback and minke whales. Lunch is included, and vegetarian meals are available on request. Offered April through October.\n\nSea Caves Kayak Adventure (3 hours) — $85 per person\nPaddle through hidden caves with an experienced instructor. Saturdays and Sundays only. Participants must be at least 12 years old.\n\nIf a tour is canceled because of weather, guests may choose a full refund or a seat on the next available departure."},{"kind":"form","head":"Kestrel Bay Tours — Booking Confirmation\nBooking No.: KB-60834","t":"Name: Aiko Tanaka\nTour: Full-Day Whale Watch\nDate: Saturday, May 17\nGuests: 2 adults, 1 child (age 9)\nSpecial requests: One vegetarian lunch, please.\nTotal paid: $300.00\n\nPlease check in at Pier 4 at least 20 minutes before departure."},{"kind":"review","head":"Kestrel Bay Tours — Customer Reviews\nPosted by: Aiko T.\nMay 21","t":"Our whale-watching trip got off to a rocky start. On the morning of our tour, high winds forced the company to cancel all departures. The staff were apologetic, and we decided to go out the following day rather than ask for our money back. It was definitely worth the wait. We spotted at least six humpback whales, and our guide, Marco, was full of fascinating information.\n\nMy only complaint is that the lunch I had specifically asked for was not on board, so I had to make do with bread and fruit. Also, my son was disappointed that he couldn't join the kayak tour that weekend, but we will try again when he is older."}],"qs":[{"q":"What is indicated about the Full-Day Whale Watch?","opts":["It departs twice a day.","It is available only part of the year.","It is suitable only for adults.","It does not include any meals."],"answer":1,"exp":"หน้าเว็บระบุ Offered April through October คือมีเฉพาะบางช่วงของปี ตอบ B ส่วน C ผิดเพราะมีราคาสำหรับเด็ก และ D ผิดเพราะ Lunch is included"},{"q":"What does Ms. Tanaka mention about the tour company's staff?","opts":["They changed the departure pier.","They were not familiar with local wildlife.","They charged her an extra fee.","They expressed regret about the cancellation."],"answer":3,"exp":"รีวิวเขียนว่า The staff were apologetic ซึ่ง paraphrase ได้ว่าแสดงความเสียใจต่อการยกเลิก ตอบ D ส่วน B ผิดเพราะไกด์ Marco มีความรู้มาก"},{"q":"On what day did Ms. Tanaka's family most likely go whale watching?","opts":["On Sunday, May 18","On Saturday, May 17","On Friday, May 16","On Wednesday, May 21"],"answer":0,"exp":"เชื่อมข้อมูล: แบบฟอร์มจองวันเสาร์ May 17 แต่ถูกยกเลิกเพราะลมแรง และครอบครัวเลือกไป the following day จึงเป็นวันอาทิตย์ May 18 ตอบ A ส่วน D คือวันที่โพสต์รีวิว"},{"q":"What did Ms. Tanaka complain about?","opts":["The length of the tour","The number of whales seen","The failure to provide a meal she requested","The cost of the child's ticket"],"answer":2,"exp":"เธอเขียนว่า the lunch I had specifically asked for was not on board และแบบฟอร์มระบุว่าขอ vegetarian lunch จึงเป็นการไม่ได้รับอาหารที่ขอไว้ ตอบ C"},{"q":"Why most likely was Ms. Tanaka's son unable to take part in the kayak tour?","opts":["The tour was offered on weekdays only.","He did not meet the age requirement.","The tour had been fully booked.","He had not received kayak instruction."],"answer":1,"exp":"เชื่อมข้อมูล: แบบฟอร์มระบุว่าลูกอายุ 9 ปี แต่หน้าเว็บกำหนดว่าผู้เข้าร่วมต้องอายุอย่างน้อย 12 ปี ตอบ B ส่วน A ผิดเพราะทัวร์คายัคมีเฉพาะเสาร์-อาทิตย์"}]}]}]</script>
<script>
(function(){
"use strict";
const ALL = JSON.parse(document.getElementById('data').textContent);
let D, Q, SETS, LSETS, RSETS, n;
const L = ['A','B','C','D'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STORE = 'toeic200.v1';

/* ---------- build question list ---------- */
function addSet(part, data, qs, extra){
  const set = {id: SETS.length, part, data, nums: [], ...extra};
  qs.forEach(q => { Q[n] = {n, part, set: set.id, q: q.q ?? null, opts: q.opts, answer: q.answer, exp: q.exp}; set.nums.push(n); n++; });
  SETS.push(set); return set;
}
function load(i){
D = ALL[i] || ALL[0]; Q = {}; SETS = []; n = 1;
D.p1.forEach(it => addSet(1, it, [it]));
D.p2.forEach(it => addSet(2, it, [it]));
D.p3.forEach(it => addSet(3, it, it.qs));
D.p4.forEach(it => addSet(4, it, it.qs));
for (let i = 0; i < D.p5.length; i += 6) addSet(5, null, D.p5.slice(i, i + 6));
D.p6.forEach(it => addSet(6, it, it.qs));
D.p7.forEach(it => addSet(7, it, it.qs));
LSETS = SETS.filter(s => s.part <= 4); RSETS = SETS.filter(s => s.part >= 5);
}
load(0);
const PART_NAME = {1:'Photographs',2:'Question-Response',3:'Conversations',4:'Talks',5:'Incomplete Sentences',6:'Text Completion',7:'Reading Comprehension'};
const PART_TH = {1:'รูปภาพ',2:'ถาม-ตอบ',3:'บทสนทนา',4:'บทพูดสั้น',5:'เติมประโยค',6:'เติมข้อความ',7:'อ่านจับใจความ'};
const RANGE = p => { const ns = SETS.filter(s => s.part === p).flatMap(s => s.nums); return [ns[0], ns[ns.length-1]]; };

const DIR = {
  1:{en:'For each question, you will hear four statements about a picture. Choose the statement that best describes the picture. The statements are not printed and are spoken only once.', th:'ฟังประโยค 4 ประโยคเกี่ยวกับภาพ แล้วเลือกประโยคที่บรรยายภาพได้ถูกต้องที่สุด ประโยคไม่ได้พิมพ์ไว้และเล่นเพียงครั้งเดียว'},
  2:{en:'You will hear a question or statement and three responses. They are spoken only once and are not printed. Choose the best response.', th:'ฟังคำถามหรือข้อความ แล้วเลือกคำตอบที่เหมาะสมที่สุดจาก 3 ตัวเลือก ไม่มีข้อความบนจอ'},
  3:{en:'You will hear conversations between two or more people. Answer three questions about each conversation. The conversations are spoken only once.', th:'ฟังบทสนทนา แล้วตอบคำถาม 3 ข้อต่อบทสนทนา คำถามจะพิมพ์ไว้บนจอและอ่านออกเสียงด้วย'},

/* ---------- speech ---------- */
const hasTTS = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
const V = {N:{pitch:1}, M:{pitch:.85}, W:{pitch:1.15}, M2:{pitch:.75}, W2:{pitch:1.3}};
function pickVoices(){
  if (!hasTTS) return;
  const all = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  if (!all.length) return;
  const fem = /female|samantha|victoria|karen|moira|tessa|fiona|zira|susan|serena|allison|ava|kate|libby|sonia|jenny|aria|emma|natasha|michelle|clara|hazel|catherine|nicky|joanna|salli|kimberly/i;
  const mal = /\bmale|daniel|alex\b|fred|david|mark|george|guy|ryan|tom\b|oliver|aaron|arthur|rishi|james|thomas|william|christopher|eric|roger|matthew|brian|lee\b|gordon/i;
  const F = all.filter(v => fem.test(v.name)), M = all.filter(v => !fem.test(v.name) && mal.test(v.name));
  const us = a => a.find(v => /en[-_]US/i.test(v.lang)) || a[0];
  const other = (a, not) => a.find(v => v !== not && !/en[-_]US/i.test(v.lang)) || a.find(v => v !== not) || not;
  const base = us(all);
  V.N = {voice: base, pitch: 1};
  V.M = M.length ? {voice: us(M), pitch: 1} : {voice: base, pitch: .8};
  V.W = F.length ? {voice: us(F), pitch: 1} : {voice: base, pitch: 1.2};
  V.M2 = M.length > 1 ? {voice: other(M, V.M.voice), pitch: 1} : {voice: V.M.voice, pitch: (V.M.pitch||1) * .88};
  V.W2 = F.length > 1 ? {voice: other(F, V.W.voice), pitch: 1} : {voice: V.W.voice, pitch: (V.W.pitch||1) * 1.12};
  if (V.N.voice === V.M.voice && F.length) V.N = {voice: other(F, V.W.voice), pitch: 1};
}
if (hasTTS) { pickVoices(); speechSynthesis.onvoiceschanged = pickVoices; }

class Abort extends Error {}
let TK = {dead:true}, paused = false, skipWait = false, speaking = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const live = tk => { if (tk.dead) throw new Abort(); };
async function holdWhilePaused(tk){ while (paused) { live(tk); await sleep(150); } live(tk); }
function setEq(on){ speaking = on; const e = $('#eq'); if (e) e.classList.toggle('on', on); }
function scriptLine(txt, who){
  const box = $('#script'); if (!box) return;
  box.querySelectorAll('.now').forEach(x => x.classList.remove('now'));
  const d = document.createElement('div'); d.className = 'now';
  d.innerHTML = (who ? '<b>' + esc(who) + ':</b> ' : '') + esc(txt);
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}
function utter(text, role, tk){
  return new Promise(res => {
    if (!hasTTS || !V.N.voice && !speechSynthesis.getVoices().length) { setTimeout(res, Math.max(1200, text.length * 62 / S.rate)); return; }
    const u = new SpeechSynthesisUtterance(text), v = V[role] || V.N;
    if (v.voice) { u.voice = v.voice; u.lang = v.voice.lang; } else u.lang = 'en-US';
    u.pitch = v.pitch || 1; u.rate = S.rate;
    let done = false; const fin = () => { if (done) return; done = true; clearTimeout(g); clearInterval(k); res(); };
    u.onend = fin; u.onerror = fin;
    const g = setTimeout(fin, 3000 + text.length * 110 / S.rate);
    const k = setInterval(() => { if (tk.dead) { speechSynthesis.cancel(); fin(); } }, 120);
    speechSynthesis.speak(u);
  });
}
async function say(text, role, tk, who){
  const parts = String(text).match(/[^.!?]+(?:[.!?]+["'”’)]*|$)/g) || [text];
  if (S.script || S.mode === 'practice') scriptLine(text, who || (role === 'N' ? 'Narrator' : roleName(role)));
  setEq(true);
  try { for (const p of parts) { const t = p.trim(); if (!t) continue; await holdWhilePaused(tk); await utter(t, role, tk); live(tk); } }
  finally { setEq(false); }
}
const roleName = r => ({M:'Man',W:'Woman',M2:'Man 2',W2:'Woman 2'}[r] || r);
async function wait(ms, tk){
  const el = $('#cd'); let left = ms;
  while (left > 0) { live(tk); if (skipWait) { skipWait = false; break; } if (!paused) left -= 100; if (el) el.textContent = Math.ceil(left/1000) + ' วินาที'; await sleep(100); }
  if (el) el.textContent = '';
}

    S.lpos = LSETS.length; save();
    if (S.sections === 'full') startReading(); else submit();
  } catch(e) { if (!(e instanceof Abort)) { console.error(e); } }
}
async function playSet(set, tk){
  const d = set.data, a = set.nums[0], b = set.nums[set.nums.length-1];
  if (set.part === 1) {
    const r = a % 2 ? 'W' : 'M';
    await say('Number ' + a + '. Look at the picture marked number ' + a + ' in your test book.', 'N', tk);
    for (let k = 0; k < d.opts.length; k++) await say(L[k] + '. ' + d.opts[k], r, tk, L[k]);
    await wait(5000, tk); return;
  }
  if (set.part === 2) {
    const r1 = a % 2 ? 'W' : 'M', r2 = r1 === 'W' ? 'M' : 'W';
    await say('Number ' + a + '.', 'N', tk);
    await say(d.q, r1, tk, 'Q');
    for (let k = 0; k < d.opts.length; k++) await say(L[k] + '. ' + d.opts[k], r2, tk, L[k]);
    await wait(5000, tk); return;
  }
  let intro;
  if (set.part === 3) {
    const three = new Set(d.lines.map(l => l.sp)).size > 2;
    intro = 'Questions ' + a + ' through ' + b + ' refer to the following conversation' + (three ? ' with three speakers' : '') + (d.graphic ? ' and graphic' : '') + '.';
    await say(intro, 'N', tk);
    for (const l of d.lines) await say(l.t, l.sp, tk);
  } else {
    intro = 'Questions ' + a + ' through ' + b + ' refer to the following ' + (d.kind || 'talk') + (d.graphic ? ' and graphic' : '') + '.';
    await say(intro, 'N', tk);
    await say(d.t, d.sp || 'W', tk);
  }
  for (const num of set.nums) {
    markCur(num);
    await say('Number ' + num + '. ' + Q[num].q, 'N', tk);
    await wait(/look at the graphic/i.test(Q[num].q) ? 12000 : 8000, tk);
  }
  markCur(0);
}

/* ---------- reading ---------- */
let timerIv = null;
function startReading(){
  TK.dead = true; if (hasTTS) speechSynthesis.cancel();
  S.screen = 'read'; S.readingStarted = true; S.rpos = 0; S.deadline = Date.now() + 75*60*1000; save();
  render(); startTimer();
}
function startTimer(){
  clearInterval(timerIv);
  const tick = () => {
    const el = $('#timer'); if (!el || S.screen !== 'read') { clearInterval(timerIv); return; }
    const left = Math.max(0, S.deadline - Date.now());
    const m = Math.floor(left/60000), s = Math.floor(left/1000) % 60;
    el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    el.classList.toggle('low', left < 5*60000);
    if (left <= 0) {
      clearInterval(timerIv);
      if (S.mode === 'strict') { submit(); }
      else el.textContent = 'หมดเวลา';
    }
  };
  tick(); timerIv = setInterval(tick, 1000);
}
function renderRead(){
  const set = RSETS[S.rpos], d = set.data;
  const firstOfPart = RSETS.find(s => s.part === set.part) === set;
  const answered = Array.from({length:100}, (_, i) => S.answers[101+i]).filter(x => x !== undefined && x !== null).length;
  let body = firstOfPart ? dirsHTML(set.part) : '';
  if (set.part === 5) {
    body += '<div class="qs">' + set.nums.map(x => qHTML(x, {flag:true, stem: esc(Q[x].q).replace(/-{3,}/g, '<span class="blank">&nbsp;</span>')})).join('') + '</div>';
  } else if (set.part === 6) {
    const psg = '<div class="psg"><div class="kind">' + esc(d.kind) + ' · Questions ' + set.nums[0] + '–' + set.nums[3] + '</div>' + (d.head ? '<div class="head">' + esc(d.head) + '</div>' : '') + para(d.t, set.nums) + '</div>';
    body += '<div class="split"><div class="passages">' + psg + '</div><div class="qs">' + set.nums.map(x => qHTML(x, {flag:true, stem:''})).join('') + '</div></div>';
  } else {
    const multi = d.passages.length > 1;
    const lbl = 'Questions ' + set.nums[0] + '–' + set.nums[set.nums.length-1] + ' refer to the following ' + (multi ? d.passages.map(p => p.kind).join(', ') : d.passages[0].kind) + '.';
    body += '<p class="hint" style="margin-bottom:12px">' + esc(lbl) + '</p><div class="split"><div class="passages">' + d.passages.map(p => '<div class="psg"><div class="kind">' + esc(p.kind) + '</div>' + (p.head ? '<div class="head">' + esc(p.head) + '</div>' : '') + para(p.t) + '</div>').join('') + '</div><div class="qs">' + set.nums.map(x => qHTML(x, {flag:true})).join('') + '</div></div>';
  }
  $('#app').innerHTML = `
  <div class="bar"><div class="wrap">
    <span class="sec">Reading</span><span class="part">Part ${set.part} · ${PART_NAME[set.part]} · ข้อ ${set.nums[0]}–${set.nums[set.nums.length-1]}</span><span class="grow"></span>
    <span class="hint">ตอบแล้ว <span class="mono" id="cnt">${answered}</span>/100</span>
    <span class="timer" id="timer">75:00</span>
    <button class="btn primary" id="submit">ส่งคำตอบ</button>
    <button class="btn sheet-toggle" id="st">กระดาษคำตอบ</button>
  </div></div>
  <div class="wrap exam">
    <main class="page">${body}
      <div class="pager"><button class="btn" id="prev" ${S.rpos===0?'disabled':''}>← ก่อนหน้า</button><span class="hint mono">หน้า ${S.rpos+1}/${RSETS.length}</span><button class="btn" id="next" ${S.rpos===RSETS.length-1?'disabled':''}>ถัดไป →</button></div>
    </main>
    <aside class="sheet" id="sheet"></aside>
  </div>`;
  refreshSheet();
  $('#prev').onclick = () => goRead(S.rpos - 1);
  $('#next').onclick = () => goRead(S.rpos + 1);
  $('#submit').onclick = () => {
    const blank = 100 - answered;
    confirmBox('ส่งคำตอบ?', blank ? 'ยังไม่ได้ตอบ ' + blank + ' ข้อ ใน TOEIC ไม่มีการหักคะแนน ควรเดาให้ครบทุกข้อ' : 'ตอบครบ 100 ข้อแล้ว', 'ส่งคำตอบ', submit);
  };
  wireSheetToggle();
  startTimer();
}
function goRead(i, num){
  if (i < 0 || i >= RSETS.length) return;
  S.rpos = i; save(); renderRead();
  if (num) { const e = $('#q' + num); if (e) e.scrollIntoView({block:'center'}); } else window.scrollTo({top:0});
}

/* ---------- interactions ---------- */
document.addEventListener('click', e => {
  const o = e.target.closest('.opt');
  if (o && (S.screen === 'listen' || S.screen === 'read')) {
    const num = +o.dataset.n, k = +o.dataset.k;
    S.answers[num] = k; save();
    o.parentElement.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', +b.dataset.k === k));
    refreshSheet();
    const c = $('#cnt'); if (c) c.textContent = Object.keys(S.answers).filter(x => x > 100 && S.answers[x] != null).length;
    return;
  }
  const f = e.target.closest('[data-flag]');
  if (f) { const num = +f.dataset.flag; S.flags[num] = !S.flags[num]; save(); f.classList.toggle('on', S.flags[num]); f.textContent = S.flags[num] ? '⚑ ทำเครื่องหมายไว้' : '⚐ ทำเครื่องหมาย'; refreshSheet(); return; }
  const j = e.target.closest('[data-jump]');
  if (j) {
    const num = +j.dataset.jump;
    closeSheet();
    if (S.screen === 'read') { const idx = RSETS.findIndex(s => s.nums.includes(num)); goRead(idx, num); }
    else if (S.screen === 'listen') {
      const el = $('#q' + num);
      if (el) el.scrollIntoView({block:'center'});
      else if (Q[num].part <= 4 && LSETS.findIndex(s => s.nums.includes(num)) < S.lpos) quickMark(num);
    }
  }
});
function quickMark(num){
  const q = Q[num];
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="card"><h3>แก้คำตอบข้อ ' + num + '</h3><p class="hint">ข้อสอบ Listening ที่ผ่านไปแล้ว ฟังซ้ำไม่ได้ แต่แก้คำตอบบนกระดาษคำตอบได้</p><div class="opts only" style="padding-left:0">' + q.opts.map((_, k) => '<button class="btn" data-qm="' + k + '">' + L[k] + '</button>').join('') + '</div><button class="btn ghost" data-qm="x">ปิด</button></div>';
  m.onclick = ev => { const b = ev.target.closest('[data-qm]'); if (!b && ev.target !== m) return; if (b && b.dataset.qm !== 'x') { S.answers[num] = +b.dataset.qm; save(); refreshSheet(); } m.remove(); };
  document.body.appendChild(m);
}
function wireSheetToggle(){ const b = $('#st'); if (b) b.onclick = () => { $('#sheet').classList.add('open'); const s = document.createElement('div'); s.className = 'scrim'; s.id = 'scrim'; s.onclick = closeSheet; document.body.appendChild(s); }; }
function closeSheet(){ const s = $('#sheet'); if (s) s.classList.remove('open'); const c = $('#scrim'); if (c) c.remove(); }
function confirmBox(title, msg, okLabel, onOk){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="card" role="dialog" aria-modal="true"><h3>' + esc(title) + '</h3><p class="hint" style="font-size:14px">' + esc(msg) + '</p><div class="row" style="justify-content:flex-end"><button class="btn" id="mc">ยกเลิก</button><button class="btn primary" id="mo">' + esc(okLabel) + '</button></div></div>';
  document.body.appendChild(m);
  m.querySelector('#mc').onclick = () => m.remove();
  m.querySelector('#mo').onclick = () => { m.remove(); onOk(); };
  m.querySelector('#mo').focus();
}

/* ---------- scoring ---------- */
const LT = [[0,5],[10,25],[20,85],[30,140],[40,195],[50,250],[60,305],[70,360],[80,410],[90,460],[96,495],[100,495]];
const RT = [[0,5],[10,15],[20,60],[30,115],[40,170],[50,225],[60,280],[70,335],[80,390],[90,445],[97,495],[100,495]];
function scale(raw, T){ for (let i = 1; i < T.length; i++) if (raw <= T[i][0]) { const [x0,y0] = T[i-1], [x1,y1] = T[i]; return Math.max(5, Math.min(495, Math.round((y0 + (raw-x0)*(y1-y0)/(x1-x0))/5)*5)); } return 495; }
function submit(){
  clearInterval(timerIv); TK.dead = true; if (hasTTS) speechSynthesis.cancel();
  const doL = S.sections !== 'reading', doR = S.sections !== 'listening';
  const parts = {}; let lr = 0, rr = 0;
  for (let i = 1; i <= 200; i++) { const q = Q[i]; parts[q.part] = parts[q.part] || {c:0,t:0}; parts[q.part].t++; if (S.answers[i] === q.answer) { parts[q.part].c++; if (i <= 100) lr++; else rr++; } }
  const Ls = doL ? scale(lr, LT) : null, Rs = doR ? scale(rr, RT) : null;
  S.result = {at: Date.now(), setNo: S.setNo, sections: S.sections, lr, rr, L: Ls, R: Rs, T: (Ls||0) + (Rs||0), parts, answers: {...S.answers}};
  HIST.push({at: S.result.at, setNo: S.setNo, sections: S.sections, L: Ls, R: Rs, T: S.result.T});
  S.screen = 'result'; S.readingStarted = false; S.startedAt = null; S.lpos = 0; save(); render(); window.scrollTo({top:0});
}
function level(t, full){
  const x = full ? t : t * 2;
  if (x >= 905) return 'ระดับ Proficient (เทียบ CEFR C1)';
  if (x >= 785) return 'ระดับ Upper-intermediate+ (เทียบ CEFR B2)';
  if (x >= 550) return 'ระดับ Intermediate (เทียบ CEFR B1)';
  if (x >= 225) return 'ระดับ Elementary (เทียบ CEFR A2)';
  return 'ระดับ Beginner (เทียบ CEFR A1)';
}

let RF = {kind:'wrong', part:0};
function renderResult(){
  const r = S.result; if (!r) { S.screen = 'start'; return render(); }
  const full = r.sections === 'full';
  const parts = [1,2,3,4,5,6,7].filter(p => (p <= 4 && r.sections !== 'reading') || (p >= 5 && r.sections !== 'listening'));
  $('#app').innerHTML = `
  <div class="wrap res">
    <div class="row" style="justify-content:space-between"><div class="label">ผลสอบชุดที่ ${(r.setNo||0)+1} · ${esc(new Date(r.at).toLocaleString('th-TH',{dateStyle:'long',timeStyle:'short'}))}</div><button class="btn" id="home">กลับหน้าแรก</button></div>
    <div class="card score">
      <div class="total"><span>คะแนนรวมโดยประมาณ</span><b>${r.T}</b><span>จาก ${full ? 990 : 495} · ${level(r.T, full)}</span></div>
      <div class="halves">
        ${r.L !== null ? `<div class="half"><small>Listening</small><b>${r.L}</b> <span class="hint">/ 495</span><small>ถูก ${r.lr}/100 ข้อ</small></div>` : ''}
        ${r.R !== null ? `<div class="half"><small>Reading</small><b>${r.R}</b> <span class="hint">/ 495</span><small>ถูก ${r.rr}/100 ข้อ</small></div>` : ''}
      </div>
    </div>
    <div class="card"><div class="label" style="margin-bottom:12px">ความแม่นยำราย Part</div><div class="bars">
      ${parts.map(p => { const x = r.parts[p], pc = Math.round(x.c / x.t * 100); return `<div class="brow"><span>Part ${p} · ${PART_TH[p]}</span><div class="track"><div class="fill" style="width:${pc}%"></div></div><span class="v">${x.c}/${x.t}</span></div>`; }).join('')}
    </div><p class="hint" style="margin-top:12px">คะแนนสเกลเป็นการประมาณจากตารางแปลงคะแนนทั่วไป ข้อสอบจริงใช้การปรับเทียบ (equating) แยกตามชุดข้อสอบ จึงอาจต่างได้ราว ±25–50 คะแนน</p></div>
    <div class="card" style="display:grid;gap:14px">
      <div class="row" style="justify-content:space-between"><h2 style="font-size:20px">เฉลยและคำอธิบาย</h2>
        <div class="filters">
          ${[['wrong','ข้อที่ผิด/ไม่ได้ตอบ'],['all','ทั้งหมด']].map(([k,t]) => `<button class="btn ${RF.kind===k?'primary':''}" data-rf="${k}">${t}</button>`).join('')}
        </div></div>
      <div class="filters">${[0,...parts].map(p => `<button class="btn ${RF.part===p?'primary':''}" data-rp="${p}">${p ? 'Part ' + p : 'ทุก Part'}</button>`).join('')}</div>
      <div id="rvlist" style="display:grid;gap:12px"></div>
    </div>
    <div class="row"><button class="btn primary" id="again">สอบใหม่อีกครั้ง</button></div>
  </div>`;
  $('#home').onclick = () => { S.screen = 'start'; save(); render(); };
  $('#again').onclick = () => { S.screen = 'start'; save(); render(); window.scrollTo({top:0}); };
  document.querySelectorAll('[data-rf]').forEach(b => b.onclick = () => { RF.kind = b.dataset.rf; renderResult(); });
  document.querySelectorAll('[data-rp]').forEach(b => b.onclick = () => { RF.part = +b.dataset.rp; renderResult(); });
  paintReview(parts);
}
function ctxText(set){
  const d = set.data;
  if (set.part === 1) return 'ภาพ: ' + d.scene + '\n\n' + d.opts.map((o,k) => '(' + L[k] + ') ' + o).join('\n');
  if (set.part === 2) return 'Q: ' + d.q + '\n\n' + d.opts.map((o,k) => '(' + L[k] + ') ' + o).join('\n');
  if (set.part === 3) return d.lines.map(l => roleName(l.sp) + ': ' + l.t).join('\n');
  if (set.part === 4) return '[' + (d.kind || 'talk') + ']\n' + d.t;
  if (set.part === 6) return (d.head ? d.head + '\n\n' : '') + d.t.replace(/\[\[(\d)\]\]/g, (_, i) => '(' + set.nums[i-1] + ') ______');
  if (set.part === 7) return d.passages.map(p => '— ' + p.kind.toUpperCase() + ' —\n' + (p.head ? p.head + '\n' : '') + p.t).join('\n\n');
  return '';
}
function paintReview(parts){
  const r = S.result, box = $('#rvlist'); let h = '', count = 0;
  for (let i = 1; i <= 200; i++) {
    const q = Q[i]; if (!parts.includes(q.part)) continue;
    if (RF.part && q.part !== RF.part) continue;
    const a = r.answers[i], ok = a === q.answer;
    if (RF.kind === 'wrong' && ok) continue;
    if (++count > 400) break;
    const set = SETS[q.set];
    const stem = q.part === 1 ? 'Photograph ' + i : q.part === 2 ? q.q : q.part === 6 ? 'ช่องว่างที่ (' + i + ')' : q.q;
    h += `<div class="rv"><div class="top"><span class="mono" style="font-weight:600">${i}.</span><span class="pill ${a == null ? 'no' : ok ? 'ok' : 'bad'}">${a == null ? 'ไม่ได้ตอบ' : ok ? 'ถูก' : 'ผิด'}</span><span class="hint">Part ${q.part} · ${PART_TH[q.part]}</span></div>
      <div>${esc(stem)}</div>
      ${set.data && set.data.graphic ? graphicHTML(set.data.graphic) : ''}
      <div style="display:grid;gap:4px">${q.opts.map((o,k) => `<div class="o ${k===q.answer?'right':k===a?'wrong':''}">(${L[k]}) ${esc(o)}${k===q.answer?' ✓':''}${k===a&&k!==q.answer?' ← คำตอบของคุณ':''}</div>`).join('')}</div>
      <div class="exp">${esc(q.exp)}</div>
      ${q.part !== 5 ? `<details><summary>${q.part <= 4 ? 'ดูบทพูด (transcript)' : 'ดูบทความ'}</summary><div class="ctx">${esc(ctxText(set))}</div></details>` : ''}
    </div>`;
  }
  box.innerHTML = h || '<p class="hint">ไม่มีข้อที่ตรงกับตัวกรองนี้ ยอดเยี่ยมมาก</p>';
}

function best(i){ const h = HIST.filter(x => (x.setNo ?? 0) === i && x.sections === 'full'); return h.length ? Math.max(...h.map(x => x.T)) : ''; }
/* ---------- boot ---------- */
if (S.screen === 'listen' || S.screen === 'read') S.screen = 'start';
if (S.setNo >= ALL.length) S.setNo = 0;
load(S.screen === 'result' && S.result ? (S.result.setNo || 0) : S.setNo);
render();
})();
</script>

</body>
</html>
