ures a large photo of our award-winning warehouse design.\n\nThe final files will be sent to you on October 13. Because the issue will be distributed at the National Logistics Expo, we need the copies delivered to our office in Harwick no later than October 20. As you know, our office is about 70 kilometers from your plant.\n\nBest regards,\nAlicia Romero\nManaging Editor"},{"kind":"invoice","head":"Larkspur Printing Co.\nINVOICE No. 20918\nBill to: Fieldstone Media, 15 Quarry Road, Harwick\nDate: October 21","t":"Modern Warehouse Quarterly, Winter issue (2,000 copies) — $5,400\nGlossy cover upgrade — $300\nRush production — $810\nDelivery — $120\n\nTotal due: $6,630\n\nPayment is due within 30 days of the invoice date. Customers who pay within 10 days receive a 2 percent discount on the total."}],"qs":[{"q":"What is indicated in the quotation?","opts":["The price will remain valid for a limited time.","The magazine will have 64 pages.","All deliveries are free of charge.","The base price includes a glossy cover."],"answer":0,"exp":"ใบเสนอราคาระบุว่า This quotation is valid for 30 days จึงตอบ A ส่วน C ผิดเพราะส่งฟรีเฉพาะภายใน 50 กิโลเมตร และ D ผิดเพราะ glossy cover ต้องเพิ่ม $300"},{"q":"What is the purpose of Ms. Romero's e-mail?","opts":["To cancel an order","To complain about print quality","To accept an offer with a modification","To request a quotation for a new magazine"],"answer":2,"exp":"Ms. Romero เขียนว่า We would like to proceed, with one change คือยอมรับใบเสนอราคาแต่ขอเปลี่ยนเป็นปกมัน จึงตอบ C (modification = การปรับเปลี่ยน)"},{"q":"Why was Fieldstone Media charged for rush production?","opts":["Its files were sent late.","It ordered more copies than usual.","It requested a special type of paper.","Its deadline allowed less than the standard production time."],"answer":3,"exp":"ไฟล์ส่ง October 13 และต้องได้รับภายใน October 20 ซึ่งน้อยกว่าเวลาผลิตมาตรฐาน 10 business days จึงต้องใช้ rush production (15% ของ $5,400 = $810) ตอบ D ต้องเชื่อมทั้งสามข้อความ"},{"q":"Why does the invoice include a delivery charge?","opts":["The copies were delivered on a weekend.","Fieldstone Media's office is more than 50 kilometers from the plant.","Ms. Romero asked for delivery to the expo.","The order weighed more than expected."],"answer":1,"exp":"ใบเสนอราคาระบุว่าเก็บค่าส่ง $120 สำหรับระยะทางเกิน 50 kilometers และ Ms. Romero บอกว่าสำนักงานอยู่ห่างประมาณ 70 kilometers จึงตอบ B; C ผิดเพราะเธอขอให้ส่งที่สำนักงานใน Harwick ไม่ใช่งาน expo"},{"q":"What is true about the invoice?","opts":["It must be paid within 10 days.","It includes a charge for extra copies.","It was sent before the magazine was printed.","It offers a reduction for early payment."],"answer":3,"exp":"ใบแจ้งหนี้ระบุว่า Customers who pay within 10 days receive a 2 percent discount จึงตอบ D (reduction for early payment = ส่วนลดเมื่อชำระเร็ว) ส่วน A เป็นกับดักเพราะกำหนดชำระจริงคือ within 30 days"}]}]},{"p1":[{"scene":"A store clerk is folding sweaters on a display table in a clothing shop. Mannequins dressed in coats stand in the front window.","svg":"store","opts":["She's trying on a sweater.","Mannequins are being carried outside.","She's folding some garments.","She's paying at a cash register."],"answer":2,"exp":"พนักงานกำลังพับเสื้อกันหนาวบนโต๊ะโชว์ จึงตรงกับ 'folding some garments' (garments = เสื้อผ้า) ตัวลวงเรื่อง trying on ใช้คำ sweater ที่เห็นในภาพแต่การกระทำผิด ส่วนหุ่นโชว์ยังตั้งอยู่ที่หน้าต่าง ไม่ได้ถูกขนออกไป"},{"scene":"Metal scaffolding has been put up along the front of a partly finished apartment building. Buckets and a ladder sit on the ground, but no workers are visible.","svg":"construction","opts":["Some workers are climbing a ladder.","Scaffolding has been erected next to a building.","A building is being demolished.","Buckets are being filled with water."],"answer":1,"exp":"ภาพแสดงนั่งร้านที่ตั้งไว้แล้วข้างอาคาร ใช้ present perfect passive 'has been erected' อธิบายสภาพ ตัวลวงเรื่องคนปีนบันไดผิดเพราะไม่มีคนในภาพ และ 'being demolished' (กำลังถูกรื้อถอน) ไม่ตรงกับอาคารที่กำลังสร้าง"},{"scene":"A chef in a white apron is slicing peppers on a cutting board in a restaurant kitchen. Several pots are sitting on the stove behind him.","svg":"kitchen","opts":["A chef is stirring a pot.","A cook is cutting some vegetables.","Some plates are being washed in a sink.","He's taking off his apron."],"answer":1,"exp":"พ่อครัวกำลังหั่นพริกหวานบนเขียง ตรงกับ 'cutting some vegetables' ตัวลวงเรื่อง stirring a pot ใช้คำ pot ที่เห็นในภาพแต่เขาไม่ได้คนหม้อ และเขายังสวมผ้ากันเปื้อนอยู่ ไม่ได้ถอด"},{"scene":"Suitcases of various sizes are moving along a baggage carousel in an airport arrivals hall. A few travelers are standing nearby, watching for their bags.","svg":"airport","opts":["Some luggage is on a conveyor belt.","Travelers are checking in at a counter.","A suitcase is being weighed on a scale.","Passengers are boarding an airplane."],"answer":0,"exp":"กระเป๋าเดินทางอยู่บนสายพานรับกระเป๋า (baggage carousel = conveyor belt) ตัวลวงเรื่องเช็กอินและการชั่งกระเป๋าเป็นกิจกรรมในสนามบินที่ไม่ปรากฏในภาพ ส่วนการขึ้นเครื่องก็ไม่ได้เกิดขึ้น"},{"scene":"A laboratory technician wearing safety goggles and gloves is holding a test tube up to the light. A rack of labeled vials sits on the bench in front of her.","svg":"lab","opts":["She's wearing protective eyewear.","She's putting on a pair of gloves.","She's labeling some bottles.","Vials are being packed into a box."],"answer":0,"exp":"เธอสวมแว่นนิรภัยอยู่ จึงตรงกับ 'wearing protective eyewear' ระวังความต่างระหว่าง wearing (สภาพที่สวมอยู่) กับ putting on (กำลังสวม) ซึ่งเป็นกับดักที่พบบ่อย ส่วนขวดถูกติดฉลากไว้แล้ว ไม่ได้กำลังติด"},{"scene":"Rows of white folding chairs have been set out on a lawn facing a small stage under a large tent. The chairs are all empty.","svg":"park","opts":["An audience is watching a performance.","A tent is being taken down.","People are sitting on the grass.","Chairs have been arranged in rows."],"answer":3,"exp":"เก้าอี้ถูกจัดเรียงเป็นแถวแล้วและไม่มีคน ใช้ 'have been arranged' ตัวลวงเรื่องผู้ชมดูการแสดงและคนนั่งบนสนามหญ้าผิดเพราะไม่มีคนในภาพ ส่วนเต็นท์ยังตั้งอยู่ ไม่ได้ถูกรื้อ"}],"p2":[{"q":"Where's the returns counter in this store?","opts":["Next to customer service on the ground floor.","I'd like a refund, please.","It was returned yesterday."],"answer":0,"exp":"Where ถามสถานที่ คำตอบบอกตำแหน่งว่าอยู่ข้างแผนกบริการลูกค้า ตัวลวงใช้คำ returned ซ้ำจากคำถามแต่ตอบเรื่องเวลา และ refund เป็นคำที่เกี่ยวข้องแต่ไม่ได้ตอบคำถาม"},{"q":"Who approved the changes to the floor plan?","opts":["On the third floor.","The architect signed off on them Tuesday.","Yes, it's a good plan."],"answer":1,"exp":"Who ต้องการบุคคล คำตอบระบุ architect (สถาปนิก) และ sign off = อนุมัติ ตัวลวงซ้ำคำ floor และ plan ส่วนการตอบ Yes ใช้กับคำถาม WH ไม่ได้"},{"q":"When will the restaurant's new menu be available?","opts":["The menu is on the table.","A table for four, please.","Starting next Monday."],"answer":2,"exp":"When ถามเวลา คำตอบบอกว่าเริ่มวันจันทร์หน้า ตัวลวงซ้ำคำ menu แต่บอกตำแหน่ง และอีกตัวเลือกเป็นการจองโต๊ะซึ่งเกี่ยวกับร้านอาหารแต่ไม่ตอบคำถาม"},{"q":"Is the water service going to be shut off tomorrow?","opts":["It's on the fourth floor.","Let me check the notice from the utility company.","About two liters a day."],"answer":1,"exp":"เป็นคำตอบอ้อมที่ไม่ได้ตอบ yes/no แต่บอกว่าจะตรวจสอบประกาศของบริษัทสาธารณูปโภค (utility company) ซึ่งสมเหตุสมผล ตัวลวงเรื่องปริมาณน้ำเชื่อมโยงกับคำว่า water แต่ไม่ตอบ"},{"q":"Would you prefer an aisle seat or a window seat?","opts":["An aisle seat, if there's one left.","It's a very long flight.","Yes, I can see it from here."],"answer":0,"exp":"คำถามแบบเลือก (A or B) คำตอบเลือก aisle seat ชัดเจน การตอบ Yes ไม่เหมาะกับคำถามแบบเลือก และอีกตัวเลือกพูดเรื่องเที่ยวบินโดยไม่ได้เลือก"},{"q":"Why did the client cancel the consultation?","opts":["Their director had a scheduling conflict.","At our office downtown.","No, it hasn't been canceled."],"answer":0,"exp":"Why ถามเหตุผล คำตอบให้เหตุผลว่าผู้อำนวยการติดตารางงาน (scheduling conflict) ตัวลวงหนึ่งบอกสถานที่ อีกตัวขัดแย้งกับข้อเท็จจริงในคำถามที่ว่ายกเลิกไปแล้ว"},{"q":"How many units in the apartment complex are still available?","opts":["It's a complex issue.","Yes, they're very spacious.","The leasing office would know that."],"answer":2,"exp":"คำตอบอ้อม แนะนำให้ถามสำนักงานให้เช่า (leasing office) ตัวลวงใช้คำ complex ในความหมายอื่น (ซับซ้อน) และการตอบ Yes ใช้กับ How many ไม่ได้"},{"q":"You've finished testing the new batch of tablets, haven't you?","opts":["Take two tablets after meals.","Yes, the results came in this morning.","I bought a new tablet computer."],"answer":1,"exp":"Tag question ถามว่าทดสอบยาเม็ดล็อตใหม่เสร็จแล้วใช่ไหม คำตอบยืนยันพร้อมรายละเอียด ตัวลวงทั้งสองใช้คำ tablet ซ้ำแต่ในบริบทวิธีกินยาและคอมพิวเตอร์แท็บเล็ต"},{"q":"Could you print the vouchers for the tour group?","opts":["The tour starts at ten.","Sure, how many people are in it?","I passed it on the way here."],"answer":1,"exp":"เป็นคำขอร้อง (request) คำตอบรับปากและถามจำนวนคนเพื่อพิมพ์ให้ถูก ตัวลวงซ้ำคำ tour แต่ตอบเรื่องเวลา ส่วน passed it ไม่เกี่ยวข้อง"},{"q":"The exhibition opening has been moved to Friday.","opts":["It's an open floor plan.","I moved here last month.","Then I'll update the invitations."],"answer":2,"exp":"เป็นประโยคบอกเล่า คำตอบที่เหมาะสมคือการตอบสนองว่าจะแก้ไขบัตรเชิญ ตัวลวงใช้คำเสียงคล้าย open/opening และ moved ในความหมายย้ายบ้าน"},{"q":"Which supplier provides our flour?","opts":["About fifty bags a week.","No, I don't think so.","Hartwell Mills, for the past two years."],"answer":2,"exp":"Which ถามว่าเป็นซัพพลายเออร์รายใด คำตอบระบุชื่อบริษัท ตัวลวงเรื่องปริมาณเกี่ยวข้องกับแป้งแต่ไม่ตอบคำถาม และ No ใช้กับคำถาม WH ไม่ได้"},{"q":"Should we ship these orders by express or standard delivery?","opts":["Standard is fine for most of them.","Yes, they've been shipped.","The express train leaves at noon."],"answer":0,"exp":"คำถามแบบเลือก คำตอบเลือก standard ตัวลวงตอบ Yes ซึ่งไม่เหมาะกับคำถามแบบเลือก และอีกตัวใช้คำ express ในความหมายรถไฟด่วน"},{"q":"What caused the high electricity bill this month?","opts":["It's billed on the first of the month.","The air conditioning ran nonstop during the heat wave.","About twenty dollars more."],"answer":1,"exp":"What caused ถามสาเหตุ คำตอบบอกว่าแอร์เปิดตลอดช่วงคลื่นความร้อน ตัวลวงพูดถึงวันออกบิลและจำนวนเงินที่เพิ่ม ซึ่งไม่ใช่สาเหตุ"},{"q":"Why don't we offer free shipping on orders over fifty dollars?","opts":["That could really boost our online sales.","We ordered fifty of them.","It'll be shipped on Friday."],"answer":0,"exp":"Why don't we... เป็นการเสนอแนะ คำตอบแสดงความเห็นด้วยและให้เหตุผล (boost sales) ตัวลวงซ้ำคำ fifty และ shipping เพื่อหลอก"},{"q":"Has the building inspector visited the site yet?","opts":["It's a beautiful sight.","In the visitors' parking lot.","He's scheduled to come Thursday morning."],"answer":2,"exp":"คำตอบบอกว่ามีกำหนดมาวันพฤหัส แปลว่ายังไม่ได้มา ตัวลวงใช้คำพ้องเสียง site/sight และคำว่า visitors ที่คล้าย visited"},{"q":"Who's handling the catering for the awards banquet?","opts":["In the main ballroom.","It was handled with care.","I think Priya has the vendor list."],"answer":2,"exp":"คำตอบอ้อม ไม่ได้บอกชื่อตรง ๆ แต่ชี้ว่า Priya มีรายชื่อผู้ให้บริการ ตัวลวงบอกสถานที่ และใช้คำ handled ซ้ำในความหมายอื่น"},{"q":"Isn't the museum closed on Mondays?","opts":["Only during the winter season.","A collection of modern sculptures.","I closed the window already."],"answer":0,"exp":"Negative question ถามยืนยันว่าพิพิธภัณฑ์ปิดวันจันทร์ไม่ใช่หรือ คำตอบให้ข้อมูลว่าปิดเฉพาะฤดูหนาว ตัวลวงซ้ำคำ closed ในบริบทปิดหน้าต่าง"},{"q":"Where should we store the frozen ingredients?","opts":["In the walk-in freezer behind the kitchen.","They were delivered fresh.","Since early this morning."],"answer":0,"exp":"Where ถามที่เก็บ คำตอบระบุห้องแช่แข็ง (walk-in freezer) ตัวลวงพูดถึงความสดและเวลา ซึ่งไม่ตอบคำถาม"},{"q":"How long does it take to process a refund?","opts":["About two meters long.","I processed it myself.","Usually three to five business days."],"answer":2,"exp":"How long ในที่นี้ถามระยะเวลา คำตอบบอกจำนวนวันทำการ ตัวลวงตีความ long เป็นความยาว และซ้ำคำ processed"},{"q":"I'm afraid the hotel is fully booked that weekend.","opts":["It's on the top bookshelf.","Maybe we could try the inn across the street.","Yes, I've read that book."],"answer":1,"exp":"ประโยคบอกเล่าแจ้งปัญหา คำตอบเสนอทางเลือกคือโรงแรมเล็กฝั่งตรงข้าม ตัวลวงทั้งสองเล่นคำ booked/book/bookshelf"},{"q":"Do you know when our contract with the consulting firm expires?","opts":["I'd have to look it up in the files.","Yes, the contractor is here.","It's a large firm."],"answer":0,"exp":"คำตอบอ้อม ผู้ตอบไม่ทราบแต่บอกว่าต้องค้นในแฟ้ม ตัวลวงใช้คำเสียงคล้าย contract/contractor และซ้ำคำ firm"},{"q":"Can I get a copy of the safety data sheet for this compound?","opts":["I'll e-mail it to you right away.","He's a very safe driver.","It's mixed in a separate room."],"answer":0,"exp":"เป็นคำขอ คำตอบรับว่าจะส่งอีเมลให้ทันที ตัวลวงซ้ำคำ safety ในรูป safe และอีกตัวพูดเรื่องการผสมสารซึ่งไม่ตอบคำขอ"},{"q":"The lobby renovation will finish ahead of schedule, won't it?","opts":["Here's the new train schedule.","No, I haven't finished eating.","It looks that way, if the weather holds."],"answer":2,"exp":"Tag question คำตอบยืนยันแบบมีเงื่อนไข (if the weather holds = ถ้าอากาศดีต่อไป) ตัวลวงซ้ำคำ schedule และ finish ในบริบทอื่น"},{"q":"Would you mind covering the front desk while I take my break?","opts":["The desk is made of oak.","Not at all, take your time.","I took the cover off."],"answer":1,"exp":"Would you mind... ถ้ายินดีจะตอบ Not at all คำตอบนี้จึงหมายถึงยินดีช่วย ตัวลวงซ้ำคำ desk และ cover/took"},{"q":"What did the focus group think of the new packaging?","opts":["It's packed in cardboard boxes.","The summary won't be ready until Friday.","A group of twelve shoppers."],"answer":1,"exp":"คำตอบอ้อม บอกว่ายังไม่ทราบเพราะรายงานสรุปจะเสร็จวันศุกร์ ตัวลวงเล่นคำ packaging/packed และ group"}],"p3":[{"lines":[{"sp":"W","t":"Hello, I'm calling about my water bill for October. It's almost three times higher than usual, and nothing has changed in my household."},{"sp":"M","t":"I'm sorry to hear that. Could I have your account number, please?"},{"sp":"W","t":"Yes, it's 4-4-7-0-2-1."},{"sp":"M","t":"Thank you, Ms. Ferreira. I see that your meter reading jumped sharply around the middle of the month. That often means there's a leak somewhere on the property."},{"sp":"W","t":"A leak? I haven't noticed any water on the floors."},{"sp":"M","t":"Leaks are often hidden, under a garden or inside a wall. We can send a technician to check your meter and pipes at no charge."},{"sp":"W","t":"That would be great. Is anyone available this week?"},{"sp":"M","t":"Thursday morning between eight and noon. And if a leak is confirmed and repaired, you may qualify for a partial credit on this bill."}],"graphic":null,"qs":[{"q":"Why is the woman calling?","opts":["To change a payment method","To set up a new account","To report a water outage","To question a charge on a bill"],"answer":3,"exp":"ผู้หญิงบอกว่าค่าน้ำเดือนตุลาคม \"almost three times higher than usual\" จึงโทรมาสอบถามยอดเรียกเก็บ (D) ส่วน (C) ผิดเพราะไม่ได้พูดถึงน้ำไม่ไหล"},{"q":"What does the man say probably caused the problem?","opts":["A rate increase","A hidden leak","A billing error","A broken meter"],"answer":1,"exp":"ผู้ชายบอกว่าค่ามิเตอร์ที่พุ่งขึ้น \"often means there's a leak\" และ \"Leaks are often hidden\" จึงตอบ (B) ส่วน (C) เป็นสิ่งที่ผู้หญิงอาจคิด แต่ผู้ชายไม่ได้กล่าวเช่นนั้น"},{"q":"According to the man, what might the woman receive?","opts":["A free plumbing repair","A replacement meter","A reduction on her bill","An extended payment deadline"],"answer":2,"exp":"ผู้ชายบอกว่าถ้าซ่อมรอยรั่วแล้ว \"you may qualify for a partial credit on this bill\" = ได้ส่วนลดในบิล (C) ส่วน (D) ผิดเพราะที่ฟรีคือการตรวจ (at no charge) ไม่ใช่การซ่อม"}]},{"lines":[{"sp":"M","t":"Hi, Olivia. It's Greg from the Harmon Street site. Our steel beams were supposed to arrive at seven this morning, but the truck still isn't here."},{"sp":"W","t":"Sorry about that, Greg. I just checked with dispatch. The driver was stopped at a weigh station, and there's a problem with his permit for oversized loads."},{"sp":"M","t":"That's a big problem for us. We've rented a crane for today only, and it's costing us by the hour."},{"sp":"W","t":"I understand. Dispatch is sending a second driver with the correct paperwork. The beams should reach you by one o'clock."},{"sp":"M","t":"One o'clock? That only leaves the crane operator three hours."},{"sp":"W","t":"I know it's not ideal. To make up for it, we'll cover the extra crane rental if you need to bring it back tomorrow."},{"sp":"M","t":"All right. Please e-mail me that in writing so I can show my project manager."}],"graphic":null,"qs":[{"q":"Where does the man most likely work?","opts":["At a trucking company","At an equipment rental shop","At a construction site","At a steel factory"],"answer":2,"exp":"ผู้ชายแนะนำตัวว่า \"Greg from the Harmon Street site\" และรอคานเหล็กกับเครน แสดงว่าทำงานที่ไซต์ก่อสร้าง (C) ส่วน (A) คือที่ทำงานของ dispatch ฝั่งผู้หญิง"},{"q":"What caused the delay?","opts":["A crane broke down.","Some beams were damaged.","A road was closed.","A driver lacked the proper permit."],"answer":3,"exp":"ผู้หญิงบอกว่า \"there's a problem with his permit for oversized loads\" = คนขับไม่มีใบอนุญาตที่ถูกต้อง (D) ส่วน (B) เป็นการใช้คำว่า crane ที่ได้ยินในบทสนทนามาหลอก"},{"q":"What does the man ask the woman to do?","opts":["Reschedule a delivery for tomorrow","Send a different driver","Confirm an offer in writing","Call his project manager"],"answer":2,"exp":"ผู้ชายขอว่า \"Please e-mail me that in writing\" คือยืนยันข้อเสนอเป็นลายลักษณ์อักษร (C) ส่วน (A) ผิดเพราะเธอส่งคนขับคนที่สองไปแล้วเองโดยไม่ได้ถูกขอ"}]},{"lines":[{"sp":"W","t":"Antonio, the seafood supplier just called. They won't have any scallops until next Friday because of the storms along the coast."},{"sp":"M","t":"But the scallop risotto is on our new autumn menu, and the menus went to the printer yesterday."},{"sp":"W","t":"I know. Can we offer something similar for a week? Maybe a shrimp version?"},{"sp":"M","t":"Hmm. The shrimp we get is good, but it cooks much faster. I'd need to test the recipe before Saturday."},{"sp":"W","t":"Well, the kitchen is quiet tomorrow afternoon."},{"sp":"M","t":"True. All right, I'll try it then. In the meantime, could you ask the servers to tell guests about the change when they order?"},{"sp":"W","t":"Sure. I'll mention it at the staff meeting tonight, and I'll write it on the specials board, too."}],"graphic":null,"qs":[{"q":"What problem does the woman mention?","opts":["A supplier has raised its prices.","Some menus contain a printing error.","An ingredient is temporarily unavailable.","A delivery was sent to the wrong address."],"answer":2,"exp":"ผู้หญิงบอกว่าซัพพลายเออร์ \"won't have any scallops until next Friday\" = วัตถุดิบขาดชั่วคราว (C) ส่วน (A) ผิดเพราะเมนูถูกส่งพิมพ์แล้ว แต่ไม่ได้มีข้อผิดพลาดในการพิมพ์"},{"q":"What does the woman mean when she says, \"Well, the kitchen is quiet tomorrow afternoon\"?","opts":["The man will have time to try a recipe.","The restaurant should close early.","A delivery can be accepted then.","Fewer staff members are needed."],"answer":0,"exp":"ผู้ชายบอกว่าต้องทดสอบสูตรก่อนวันเสาร์ ผู้หญิงจึงชี้ว่าพรุ่งนี้บ่ายครัวว่าง = มีเวลาทดลองสูตร (A) ซึ่งเขาตอบว่า \"I'll try it then\" ส่วน (D) เป็นการตีความคำว่า quiet ผิดทาง"},{"q":"What will the woman do tonight?","opts":["Call another supplier","Prepare a shrimp dish","Inform the servers about a change","Print new menus"],"answer":2,"exp":"ผู้หญิงบอกว่า \"I'll mention it at the staff meeting tonight\" = แจ้งพนักงานเสิร์ฟเรื่องการเปลี่ยนแปลง (C) ส่วน (B) เป็นหน้าที่ของผู้ชายที่จะทดลองทำพรุ่งนี้"}]},{"lines":[{"sp":"M","t":"Thanks for coming in, Mr. Lindqvist. Ms. Okoro and I have reviewed the lease agreement you sent us for your new bakery location."},{"sp":"M2","t":"Great. Is there anything I should be concerned about?"},{"sp":"W","t":"Mainly section twelve. It says you're responsible for all repairs to the building's heating and cooling system, even major ones."},{"sp":"M2","t":"Really? I assumed the landlord would handle that."},{"sp":"M","t":"Most commercial landlords do, which is why we'd recommend asking them to change that clause before you sign."},{"sp":"W","t":"We can draft the revised wording for you and send it to the landlord's attorney."},{"sp":"M2","t":"Please do. How long would that take?"},{"sp":"W","t":"We could have a draft ready by Wednesday. I'll e-mail it to you first so you can approve it."}],"graphic":null,"qs":[{"q":"Who most likely are the women and the first man?","opts":["Bakery owners","Building inspectors","Real estate agents","Lawyers"],"answer":3,"exp":"ทั้งสองคนตรวจสัญญาเช่า แนะนำให้แก้ข้อสัญญา และจะร่างถ้อยคำส่งให้ \"the landlord's attorney\" จึงน่าจะเป็นทนายความ (D) ส่วน (A) เป็นอาชีพของลูกค้า ไม่ใช่ผู้ให้คำปรึกษา"},{"q":"What concern do the speakers discuss?","opts":["How much the monthly rent is","Who must pay for certain repairs","Where a business can be located","When a lease will expire"],"answer":1,"exp":"ข้อ 12 ระบุว่าผู้เช่า \"responsible for all repairs to the building's heating and cooling system\" จึงเป็นเรื่องใครต้องรับผิดชอบค่าซ่อม (B) ส่วน (A) ไม่ได้ถูกพูดถึงในบทสนทนา"},{"q":"What does the woman say she will do first?","opts":["Send a draft to Mr. Lindqvist","Call the landlord directly","Visit the bakery location","Sign the lease agreement"],"answer":0,"exp":"เธอบอกว่า \"I'll e-mail it to you first so you can approve it\" = ส่งร่างให้ลูกค้าก่อน (A) ส่วน (B) ผิดเพราะจะส่งให้ทนายของเจ้าของอาคาร ไม่ได้โทรหาเจ้าของโดยตรง"}]},{"lines":[{"sp":"W","t":"Kevin, how's the returns team doing? Customers are posting online that their refunds are taking too long."},{"sp":"M","t":"We're about four days behind. Since the holiday sale, returns have doubled, and we haven't added any staff."},{"sp":"W","t":"I see. Could we bring in temporary workers?"},{"sp":"M","t":"We could, but training them takes a while. I think a faster solution is to change our process."},{"sp":"W","t":"What do you have in mind?"},{"sp":"M","t":"Right now, every returned item is fully inspected before the refund is issued. For items under twenty dollars, we could refund customers as soon as the package is scanned."},{"sp":"W","t":"That makes sense. Most of those products are low risk anyway. Write up a short proposal, and I'll present it to the operations director on Monday."}],"graphic":null,"qs":[{"q":"What are customers complaining about?","opts":["Delays in receiving refunds","High shipping fees","Damaged products","Missing holiday discounts"],"answer":0,"exp":"ผู้หญิงบอกว่าลูกค้าโพสต์ว่า \"their refunds are taking too long\" = ได้รับเงินคืนช้า (A) ส่วน (D) ใช้คำว่า holiday sale ที่ได้ยินมาหลอก"},{"q":"What does the man suggest?","opts":["Extending the return period","Hiring temporary workers","Skipping inspections for some items","Raising the price of low-cost items"],"answer":2,"exp":"ผู้ชายเสนอให้คืนเงินทันทีเมื่อสแกนพัสดุสำหรับสินค้าต่ำกว่า 20 ดอลลาร์ แทนการตรวจทุกชิ้น = ข้ามการตรวจสำหรับบางสินค้า (C) ส่วน (B) เป็นข้อเสนอของผู้หญิงที่ผู้ชายบอกว่าใช้เวลาฝึกนาน"},{"q":"What will the woman do on Monday?","opts":["Present a proposal to a director","Train new employees","Respond to online reviews","Inspect returned merchandise"],"answer":0,"exp":"ผู้หญิงบอกว่า \"I'll present it to the operations director on Monday\" (A) ส่วนการเขียนข้อเสนอเป็นหน้าที่ของผู้ชาย"}]},{"lines":[{"sp":"M","t":"Ji-woo, the painting on loan from the Lisbon gallery arrives on Tuesday. Is the east wall ready for it?"},{"sp":"W","t":"Almost. The lighting crew is installing new fixtures there tomorrow. But I got a message from the gallery's registrar this morning."},{"sp":"M","t":"Oh? What did she say?"},{"sp":"W","t":"Their contract requires the light level on the painting to stay below fifty lux, to protect the paint. Our new fixtures are brighter than that."},{"sp":"M","t":"Can the crew adjust them?"},{"sp":"W","t":"They can add dimmers, but that will push installation back a day."},{"sp":"M","t":"That's fine, as long as the wall is finished before the opening reception on the fourteenth. Also, has the text for the wall label been approved?"},{"sp":"W","t":"Not yet. I'm meeting the education director about it this afternoon."}],"graphic":null,"qs":[{"q":"What will arrive on Tuesday?","opts":["Some lighting fixtures","Invitations for a reception","A borrowed artwork","A shipment of wall labels"],"answer":2,"exp":"ผู้ชายบอกว่า \"the painting on loan from the Lisbon gallery arrives on Tuesday\" = งานศิลปะที่ยืมมา (C) ส่วน (A) จะติดตั้งพรุ่งนี้ ไม่ใช่มาถึงวันอังคาร"},{"q":"What requirement does the woman mention?","opts":["A security guard must be present.","The room temperature must be checked daily.","Visitors must not take photographs.","Light levels must be kept low."],"answer":3,"exp":"สัญญากำหนดว่า \"the light level on the painting to stay below fifty lux\" = ต้องคุมแสงให้ต่ำ (D) ตัวเลือกอื่นเป็นเงื่อนไขทั่วไปของพิพิธภัณฑ์แต่ไม่ได้กล่าวถึง"},{"q":"What will the woman do this afternoon?","opts":["Discuss the text of a label","Attend a reception","Contact a registrar","Install some dimmers"],"answer":0,"exp":"เธอบอกว่าจะพบ education director เรื่องข้อความบนป้ายผนัง \"this afternoon\" (A) ส่วน (D) เป็นงานของทีมไฟ และ (B) จัดวันที่ 14"}]},{"lines":[{"sp":"W","t":"Martin, did you see the alert from storage unit three last night? The temperature went up to eleven degrees for about forty minutes."},{"sp":"M","t":"I saw it this morning. That unit holds the vaccine samples for the stability study. They're supposed to stay between two and eight degrees."},{"sp":"W","t":"Exactly. Do we know what happened?"},{"sp":"M","t":"Facilities thinks the door seal is worn out. The door probably didn't close completely after the evening check."},{"sp":"W","t":"We'll have to file a deviation report with quality assurance today. And the samples should be moved to another unit right away."},{"sp":"M","t":"I already moved them to unit five. I'll start the report after lunch."},{"sp":"W","t":"Good. I'll ask facilities to replace the seal, and let's make sure the evening staff know to double-check that door."}],"graphic":null,"qs":[{"q":"What happened last night?","opts":["Some samples were lost.","A storage unit became too warm.","A power failure shut down the lab.","A study was canceled."],"answer":1,"exp":"ผู้หญิงบอกว่าอุณหภูมิในตู้หมายเลข 3 \"went up to eleven degrees\" ซึ่งสูงกว่าเกณฑ์ 2-8 องศา = ตู้อุ่นเกินไป (B) ส่วน (C) ไม่ได้กล่าวถึงไฟดับ"},{"q":"According to the man, what is the likely cause?","opts":["An incorrect thermostat setting","A faulty alarm","An overloaded shelf","A damaged door seal"],"answer":3,"exp":"ผู้ชายบอกว่า \"Facilities thinks the door seal is worn out\" = ขอบยางประตูเสื่อม (D) ส่วน (B) ผิดเพราะสัญญาณเตือนทำงานปกติ"},{"q":"What has the man already done?","opts":["Trained the evening staff","Replaced a part","Relocated some samples","Submitted a report"],"answer":2,"exp":"ผู้ชายบอกว่า \"I already moved them to unit five\" = ย้ายตัวอย่างแล้ว (C) ส่วน (D) เขาจะเริ่มเขียนรายงานหลังอาหารกลางวัน ยังไม่ได้ส่ง"}]},{"lines":[{"sp":"M","t":"Good afternoon, Riverbend Tours. How can I help you?"},{"sp":"W","t":"Hi. I'm organizing an outing for our company's sales team, about twenty-five people. I saw your sunset river cruise online."},{"sp":"M","t":"Yes, that's one of our most popular tours. It runs Thursday through Sunday and lasts two and a half hours."},{"sp":"W","t":"Does the price include a meal?"},{"sp":"M","t":"It includes light snacks. But for groups over twenty, we can arrange a full buffet dinner on board for an additional fifteen dollars per person."},{"sp":"W","t":"That sounds perfect. We're thinking of Friday the ninth."},{"sp":"M","t":"Let me see... Friday the ninth is already booked by a private group, but Saturday the tenth is open."},{"sp":"W","t":"Hmm, I'll need to check with my manager about Saturday. Could you hold it for me until tomorrow?"}],"graphic":null,"qs":[{"q":"Why is the woman calling?","opts":["To apply for a job as a tour guide","To arrange a group activity","To complain about a cruise","To request a refund"],"answer":1,"exp":"เธอบอกว่ากำลังจัด \"an outing for our company's sales team\" = จัดกิจกรรมกลุ่ม (B) ส่วน (C) ไม่ได้มีการร้องเรียน"},{"q":"What is available for large groups?","opts":["A longer tour route","Free transportation","A discounted ticket price","A dinner option"],"answer":3,"exp":"ผู้ชายบอกว่ากลุ่มมากกว่า 20 คนสามารถจัด \"a full buffet dinner on board\" ได้ (D) ส่วน (C) ผิดเพราะต้องจ่ายเพิ่ม ไม่ใช่ลดราคา"},{"q":"What does the woman ask the man to do?","opts":["Reserve a date temporarily","Call her manager","Change a menu","Send a price quote"],"answer":0,"exp":"เธอขอว่า \"Could you hold it for me until tomorrow?\" = จองวันไว้ชั่วคราว (A) ส่วน (B) ผิดเพราะเธอจะเป็นผู้ถามผู้จัดการเอง"}]},{"lines":[{"sp":"M","t":"Sophie, the new packaging machine for the granola line was installed over the weekend. Have you seen it running?"},{"sp":"W","t":"I watched it for an hour this morning. It's about forty percent faster than the old one."},{"sp":"M","t":"That's great news. Then we should be able to fill the supermarket order by the end of the month."},{"sp":"W","t":"Well, the operators have only had one training session."},{"sp":"M","t":"I see. How much more do they need?"},{"sp":"W","t":"The supplier recommends at least two more days with their technician. Otherwise, we risk mistakes like crooked labels or bags that aren't sealed properly."},{"sp":"M","t":"All right. Can you contact the supplier and arrange it for this week?"},{"sp":"W","t":"Sure. I'll call them right after lunch."}],"graphic":null,"qs":[{"q":"What are the speakers mainly discussing?","opts":["Some new equipment","A supermarket's prices","A product recipe","A hiring plan"],"answer":0,"exp":"ทั้งคู่พูดถึง \"the new packaging machine\" ที่เพิ่งติดตั้ง (A) ส่วน (D) ผิดเพราะเรื่องที่คุยคือการฝึกอบรม ไม่ใช่การจ้างคน"},{"q":"What does the woman mean when she says, \"the operators have only had one training session\"?","opts":["She wants to hire more staff.","She doubts a deadline can be met.","She thinks a schedule has already changed.","She is pleased with the operators' progress."],"answer":1,"exp":"ผู้ชายมั่นใจว่าจะส่งออร์เดอร์ได้ทัน ผู้หญิงจึงพูดประโยคนี้เพื่อแสดงความไม่แน่ใจ (B) เพราะพนักงานยังฝึกไม่พอ ส่วน (A) ผิดเพราะเธอต้องการการฝึกเพิ่ม ไม่ใช่คนเพิ่ม"},{"q":"What will the woman do after lunch?","opts":["Contact an equipment supplier","Inspect some labels","Meet with a supermarket buyer","Repair a sealing machine"],"answer":0,"exp":"เธอบอกว่า \"I'll call them right after lunch\" โดย them หมายถึง supplier ของเครื่อง (A) ส่วน (B) เป็นคำที่ได้ยินแต่ไม่ใช่สิ่งที่เธอจะทำ"}]},{"lines":[{"sp":"W","t":"Here's the living room. As you can see, the windows face south, so you'll get plenty of sunlight."},{"sp":"M","t":"It's bigger than it looked in the photos. What do you think, Emma?"},{"sp":"W2","t":"I like it. But I'm worried about noise. Isn't there a train line nearby?"},{"sp":"W","t":"There is, about two blocks away. But the building was renovated last year, and all the windows were replaced with soundproof glass."},{"sp":"M","t":"That's good to know. And what about parking? We both drive to work."},{"sp":"W","t":"Each unit comes with one space in the underground garage. A second space is available for seventy dollars a month."},{"sp":"W2","t":"That's reasonable. Could we see the kitchen next?"},{"sp":"W","t":"Of course. It's right through here."}],"graphic":null,"qs":[{"q":"Who most likely is the first woman?","opts":["A train conductor","A construction worker","An interior designer","A real estate agent"],"answer":3,"exp":"ผู้หญิงคนแรกพาชมห้อง อธิบายรายละเอียดอาคารและที่จอดรถ จึงน่าจะเป็นนายหน้าอสังหาฯ (D) ส่วน (C) ผิดเพราะไม่ได้พูดถึงการออกแบบตกแต่ง"},{"q":"What is Emma concerned about?","opts":["Cost","Size","Security","Noise"],"answer":3,"exp":"Emma ถามว่า \"I'm worried about noise. Isn't there a train line nearby?\" (D) ส่วน (B) ผิดเพราะผู้ชายชมว่าห้องใหญ่กว่าในรูป"},{"q":"What is mentioned about parking?","opts":["It is located across the street.","An extra space costs more.","It is free for visitors.","It is currently under renovation."],"answer":1,"exp":"นายหน้าบอกว่า \"A second space is available for seventy dollars a month\" = ที่จอดเพิ่มต้องจ่ายเพิ่ม (B) ส่วน (D) ใช้คำว่า renovated ซึ่งพูดถึงตัวอาคาร ไม่ใช่ที่จอดรถ"}]},{"lines":[{"sp":"M","t":"Hi, Tamara. Before I place the order for the new office chairs, can we talk about shipping?"},{"sp":"W","t":"Sure. Which options does the furniture site offer?"},{"sp":"M","t":"There are four. The cheapest is standard ground, but that takes up to ten days."},{"sp":"W","t":"That's too long. The old chairs are being collected on the twentieth, and we need the new ones here before then."},{"sp":"M","t":"Right. So we need delivery within a week. But the fastest option is very expensive."},{"sp":"W","t":"Then choose the cheapest one that still gets here within seven days."},{"sp":"M","t":"Okay. One more thing: the site says they offer free assembly if we sign up for their business account."},{"sp":"W","t":"Really? Then go ahead and create an account before you check out."}],"graphic":{"title":"Shipping Options","rows":[["Service","Delivery Time","Cost"],["Standard Ground","8-10 days","$45"],["Economy Plus","6-7 days","$80"],["Priority","3-4 days","$130"],["Next Day","1 day","$210"]]},"qs":[{"q":"What does the man plan to purchase?","opts":["Kitchen appliances","Computer equipment","Packaging materials","Office furniture"],"answer":3,"exp":"ผู้ชายกำลังจะสั่ง \"the new office chairs\" = เฟอร์นิเจอร์สำนักงาน (D) ส่วน (A) ไม่เกี่ยวข้องกับบทสนทนา"},{"q":"Look at the graphic. How much will the speakers most likely pay for shipping?","opts":["$45","$80","$130","$210"],"answer":1,"exp":"ผู้หญิงให้เลือกตัวเลือกที่ถูกที่สุดซึ่งส่งถึงภายใน 7 วัน คือ Economy Plus (6-7 วัน) ราคา $80 (B) ส่วน (A) ถูกที่สุดแต่ใช้เวลาถึง 10 วัน"},{"q":"What does the woman tell the man to do?","opts":["Open a business account","Cancel an existing order","Call a delivery company","Assemble the items himself"],"answer":0,"exp":"ผู้หญิงบอกว่า \"go ahead and create an account before you check out\" เพื่อได้บริการประกอบฟรี (A) ส่วน (D) ตรงข้ามกับที่พูด เพราะจะได้ free assembly"}]},{"lines":[{"sp":"W","t":"Hi, I'm checking in for the flight to Auckland. I have this suitcase and a set of golf clubs."},{"sp":"M","t":"Certainly. May I see your passport? ... Thank you, Ms. Brennan. Let me weigh the suitcase first. It's twenty-six kilograms."},{"sp":"W","t":"Oh, I thought the limit was thirty."},{"sp":"M","t":"For business class it is, but your ticket is economy, so the allowance is twenty-three kilograms. You can pay the overweight fee or move a few items to your carry-on."},{"sp":"W","t":"I'll just move some things. Give me a minute."},{"sp":"M","t":"No problem. And the golf clubs will be checked as sports equipment, which has its own fee."},{"sp":"W","t":"That's fine. Also, is there any chance of an aisle seat?"},{"sp":"M","t":"Let me check. Yes, I can move you to 18C."}],"graphic":{"title":"Baggage Fees - Economy","rows":[["Item","Fee"],["Second checked bag","$60"],["Overweight bag (23-32 kg)","$75"],["Sports equipment","$50"],["Musical instrument","$40"]]},"qs":[{"q":"Where most likely are the speakers?","opts":["At a sporting goods store","At an airport","At a travel agency","At a hotel"],"answer":1,"exp":"ผู้หญิง \"checking in for the flight to Auckland\" และมีการชั่งกระเป๋า จึงอยู่ที่สนามบิน (B) ส่วน (C) ใช้คำว่า golf clubs มาหลอก"},{"q":"What does the woman decide to do?","opts":["Repack some belongings","Leave her golf clubs behind","Upgrade to business class","Take a later flight"],"answer":0,"exp":"เธอเลือก \"I'll just move some things\" ไปไว้ในกระเป๋าถือ = จัดของใหม่ (A) แทนการจ่ายค่าน้ำหนักเกิน ส่วน (C) ผิดเพราะเธอไม่ได้ขออัปเกรด"},{"q":"Look at the graphic. How much will the woman most likely pay?","opts":["$40","$50","$60","$75"],"answer":1,"exp":"เธอย้ายของเพื่อไม่ต้องจ่ายค่าน้ำหนักเกิน เหลือเพียงค่า sports equipment สำหรับไม้กอล์ฟ $50 (B) ส่วน (D) คือค่าน้ำหนักเกินที่เธอเลี่ยงแล้ว"}]},{"lines":[{"sp":"M","t":"Thank you for calling Marigold Bistro. This is Raymond."},{"sp":"W","t":"Hello. I'd like to book a private room for a retirement lunch for one of our colleagues on the twenty-second. There'll be about eighteen people."},{"sp":"M","t":"Wonderful. We have four private rooms. Do you have any special requirements?"},{"sp":"W","t":"Yes, we'll be showing a short slide show, so we'll need a screen."},{"sp":"M","t":"Then I'd suggest the smallest room with a screen that fits your group. The others are either too small or much larger than you'd need."},{"sp":"W","t":"Sounds good. Is there a minimum charge?"},{"sp":"M","t":"There is, but with eighteen guests ordering our set lunch, you'll easily go over it."},{"sp":"W","t":"Great. Could you also arrange a cake? I'll send you the details by e-mail."}],"graphic":{"title":"Private Dining Rooms","rows":[["Room","Seats","Screen"],["Garden Room","12","Yes"],["Willow Room","16","No"],["Harbor Room","24","Yes"],["Grand Room","40","Yes"]]},"qs":[{"q":"What event is the woman planning?","opts":["A client dinner","A retirement celebration","A product presentation","A wedding reception"],"answer":1,"exp":"เธอบอกว่าจองห้องสำหรับ \"a retirement lunch for one of our colleagues\" (B) ส่วน (D) ใช้ความคิดเรื่อง slide show มาหลอก แต่เป็นงานเลี้ยงเกษียณ"},{"q":"Look at the graphic. Which room will the woman most likely reserve?","opts":["Garden Room","Willow Room","Harbor Room","Grand Room"],"answer":2,"exp":"ต้องรองรับ 18 คนและมีจอ ห้องเล็กที่สุดที่ตรงเงื่อนไขคือ Harbor Room (24 ที่นั่ง มีจอ) (C) ส่วน (B) Willow มีที่นั่ง 16 และไม่มีจอ"},{"q":"What will the woman send by e-mail?","opts":["A list of guests","A slide show file","Information about a cake","A payment receipt"],"answer":2,"exp":"เธอขอให้จัดเค้กและบอกว่า \"I'll send you the details by e-mail\" (C) ส่วน (B) เป็นสิ่งที่จะฉายในงาน ไม่ได้บอกว่าจะส่งอีเมล"}]}],"p4":[{"kind":"telephone message","sp":"M","graphic":null,"t":"Hello, Ms. Alvarez. This is Derek Hong from Summit Home Builders, returning your call about the kitchen renovation at your property on Elm Street. I'm afraid the cabinets we ordered arrived yesterday with several scratched doors, so we've sent them back to the manufacturer. Replacements should reach us in about ten days, which means we won't be able to finish the project by the end of this month as planned. I realize that's disappointing, especially since you mentioned you're hosting family over the holidays. To help keep things moving, our crew can install the new countertops and flooring next week, while we wait for the cabinets. Also, I'd like you to come by our showroom to approve the replacement door handles, since the original style has been discontinued. Please give me a call at 555-0147 to set up a time. Thanks.","qs":[{"q":"What problem does the speaker mention?","opts":["Some materials were damaged.","A worker is unavailable.","A permit has expired.","The budget has been exceeded."],"answer":0,"exp":"ผู้พูดบอกว่า cabinets มาถึงพร้อม scratched doors จึงตรงกับ materials were damaged ส่วนเรื่อง permit หรือ budget ไม่ได้กล่าวถึงเลย"},{"q":"What does the speaker say the crew can do next week?","opts":["Repaint some walls","Install some flooring","Remove some old appliances","Deliver some cabinets"],"answer":1,"exp":"มีประโยค our crew can install the new countertops and flooring next week ตัวเลือก D เป็นกับดักเพราะ cabinets ยังต้องรอของใหม่ประมาณสิบวัน"},{"q":"Why does the speaker ask the listener to visit a showroom?","opts":["To sign a revised contract","To pick up a refund","To approve a product choice","To see a completed kitchen"],"answer":2,"exp":"ผู้พูดขอให้มาที่ showroom เพื่อ approve the replacement door handles เพราะรุ่นเดิม discontinued แล้ว จึงเป็นการอนุมัติการเลือกสินค้า"}]},{"kind":"announcement","sp":"W","graphic":null,"t":"Good afternoon, shoppers, and welcome to Hartley's Department Store. We're pleased to let you know that our annual home goods sale is now under way on the third floor. All bedding, towels, and kitchenware are thirty percent off through Sunday. And if you've downloaded the new Hartley's mobile app, you'll receive an extra ten percent off at the register. Just show the barcode on your phone screen to the cashier. Please note that because of the large crowds expected this weekend, we've opened two additional checkout counters near the escalators on the third floor. Also, our gift-wrapping station on the ground floor will be closed today for renovation. It will reopen tomorrow morning in its new location next to customer service. Thank you for shopping at Hartley's.","qs":[{"q":"What is being announced?","opts":["A store opening","A product recall","A loyalty program","A seasonal sale"],"answer":3,"exp":"ผู้พูดประกาศว่า annual home goods sale กำลังจัดอยู่ จึงเป็นการลดราคาประจำปี/ตามฤดูกาล ส่วน loyalty program เป็นกับดักเพราะมีพูดถึง app แต่ไม่ใช่หัวข้อหลัก"},{"q":"How can shoppers receive an additional discount?","opts":["By using a mobile application","By spending a minimum amount","By signing up for a newsletter","By paying in cash"],"answer":0,"exp":"ถ้าโหลด Hartley's mobile app แล้วโชว์ barcode จะได้ลดเพิ่ม 10% ตัวเลือกอื่นไม่ได้กล่าวถึง"},{"q":"According to the speaker, what has changed about a service?","opts":["Its hours have been extended.","It will be moved to a different area.","It now charges a fee.","It is available online."],"answer":1,"exp":"gift-wrapping station จะ reopen in its new location next to customer service คือย้ายที่ ตัวเลือก A ผิดเพราะไม่ได้พูดเรื่องขยายเวลา"}]},{"kind":"advertisement","sp":"M","graphic":null,"t":"Are you starting a new business but unsure about the legal requirements? At Pierce and Quinlan Associates, our consultants have helped more than two thousand entrepreneurs register their companies, draft partnership agreements, and protect their trademarks. Unlike many large law firms, we charge a flat fee for each service, so you'll always know the cost in advance. No surprises, no hourly billing. This month, we're also offering a free thirty-minute consultation to any first-time client. During this session, one of our advisors will review your business plan and explain exactly which licenses you'll need. Now, you might be thinking, a lawyer's office downtown means expensive parking. Not anymore. We've just moved to the Fairview Business Park, with plenty of free spaces right outside the door. To book your consultation, visit piercequinlan.com today.","qs":[{"q":"What type of business is being advertised?","opts":["An accounting service","A real estate agency","A legal consulting firm","A business school"],"answer":2,"exp":"โฆษณาพูดถึงการจดทะเบียนบริษัท ร่างสัญญา และคุ้มครอง trademark และเทียบกับ large law firms จึงเป็นบริษัทที่ปรึกษากฎหมาย"},{"q":"What does the speaker say is an advantage of the business?","opts":["Its staff speak several languages.","It charges fixed prices.","It is open on weekends.","It offers online classes."],"answer":1,"exp":"we charge a flat fee for each service แปลว่าคิดค่าบริการเป็นราคาตายตัว (fixed prices) ซึ่งตรงข้ามกับ hourly billing"},{"q":"Why does the speaker say, \"Not anymore\"?","opts":["To announce that a service has been discontinued","To indicate that a fee has been reduced","To explain that an office has been closed","To point out that parking is no longer a problem"],"answer":3,"exp":"ก่อนหน้านั้นพูดว่าออฟฟิศในเมืองหมายถึงที่จอดรถแพง แล้วบอก Not anymore เพราะย้ายไปที่ที่มี free spaces จึงหมายถึงที่จอดรถไม่เป็นปัญหาอีกต่อไป"}]},{"kind":"radio broadcast","sp":"W","graphic":null,"t":"This is Carla Mendes with your morning community update on Radio 98.4. Westbrook Water Utility has announced that it will be replacing aging water pipes along Cedar Avenue starting next Monday. The work is expected to take about three weeks. During this time, residents between Fifth and Ninth Streets may experience low water pressure in the mornings, and there will be brief service interruptions on Tuesday and Thursday afternoons. The utility recommends that affected households store some drinking water in advance. Cedar Avenue will also be reduced to one lane, so commuters should consider using Lakeview Road instead. A spokesperson for the utility said the upgrade will significantly reduce the number of leaks reported in the area. For a detailed schedule, residents can sign up for text alerts on the utility's Web site. Coming up next, we'll have the latest sports scores.","qs":[{"q":"What will begin next Monday?","opts":["A road-widening project","A pipe replacement project","A new billing system","A water-saving campaign"],"answer":1,"exp":"Westbrook Water Utility จะ replacing aging water pipes เริ่มวันจันทร์หน้า ตัวเลือก A เป็นกับดักเพราะถนนแค่ถูกลดเหลือเลนเดียว ไม่ได้ขยายถนน"},{"q":"What are drivers advised to do?","opts":["Take a different road","Park in a public garage","Avoid traveling in the afternoon","Use public transportation"],"answer":0,"exp":"ผู้พูดแนะนำ commuters should consider using Lakeview Road instead คือใช้เส้นทางอื่น"},{"q":"How can listeners get more information?","opts":["By calling a hotline","By attending a public meeting","By registering for text messages","By reading a local newspaper"],"answer":2,"exp":"residents can sign up for text alerts on the utility's Web site ตรงกับการลงทะเบียนรับข้อความ ส่วน hotline ไม่ได้กล่าวถึง"}]},{"kind":"tour information","sp":"M","graphic":null,"t":"Welcome to the Granville Museum of Science and Industry. I'm Thomas, and I'll be your guide this morning. Our tour will last about ninety minutes and will focus on our newest exhibit, Engines of Change, which traces the history of transportation from steam locomotives to electric cars. Before we start, a few reminders. Photography is welcome throughout the museum, but please don't use a flash in the textile gallery, as bright light can damage the older fabrics. Also, some of the vehicles on display have interactive controls. You're welcome to try them, but please wait for me to unlock each station first. At the end of the tour, we'll stop by the museum shop, where you can show your ticket to get fifteen percent off any book about the exhibit. All right, if everyone has their headsets on, let's head to the first hall.","qs":[{"q":"What is the focus of the tour?","opts":["A collection of historical clothing","The life of a famous inventor","A new exhibit about transportation","The construction of the museum"],"answer":2,"exp":"ทัวร์เน้น newest exhibit ชื่อ Engines of Change เกี่ยวกับประวัติการคมนาคม ตัวเลือก A เป็นกับดักจากคำว่า textile gallery"},{"q":"What are listeners asked to wait for before using some displays?","opts":["A staff member's permission","A safety video","An instruction manual","A group to finish"],"answer":0,"exp":"ไกด์บอกว่า please wait for me to unlock each station first คือต้องรอเจ้าหน้าที่ (ไกด์) อนุญาต/ปลดล็อกก่อน"},{"q":"How can listeners receive a discount?","opts":["By joining a membership program","By completing a survey","By purchasing a group ticket","By showing their admission ticket"],"answer":3,"exp":"ที่ museum shop ให้ show your ticket เพื่อลด 15% สำหรับหนังสือ จึงตอบว่าแสดงบัตรเข้าชม"}]},{"kind":"meeting excerpt","sp":"W","graphic":null,"t":"Let's move on to the packaging update. As many of you know, the national health authority has introduced new labeling rules for over-the-counter medicines. Starting in March, all of our pain-relief products must list dosage instructions in a larger font, and each box must include a scannable code linking to the full product information. Our design team has already prepared the new labels, and the samples look great. The challenge is timing. Our packaging supplier says it can't produce the new boxes before mid-February, which leaves very little time for distribution. So, I've asked Raj in logistics to look into whether a second supplier could handle part of the order. In the meantime, I'd like each of you to check your current inventory and send me the number of boxes in old packaging by Friday. We'll need to decide what to do with them.","qs":[{"q":"What industry do the listeners most likely work in?","opts":["Pharmaceuticals","Publishing","Food service","Electronics"],"answer":0,"exp":"พูดถึง over-the-counter medicines และ pain-relief products จึงเป็นอุตสาหกรรมยา (pharmaceuticals)"},{"q":"What concern does the speaker mention?","opts":["A design is unpopular.","A deadline may be difficult to meet.","A product has been recalled.","Shipping costs have increased."],"answer":1,"exp":"The challenge is timing เพราะ supplier ผลิตกล่องใหม่ได้กลาง ก.พ. เหลือเวลาน้อยก่อนเดือนมีนาคม จึงกังวลเรื่องกำหนดเวลา ตัวเลือก A ผิดเพราะ samples look great"},{"q":"What are the listeners asked to do by Friday?","opts":["Contact a new supplier","Review some label designs","Report inventory figures","Attend a training session"],"answer":2,"exp":"ผู้พูดขอให้ check current inventory แล้วส่งจำนวนกล่องแบบเก่าภายในวันศุกร์ ส่วนการติดต่อ supplier ใหม่เป็นงานของ Raj"}]},{"kind":"news report","sp":"M","graphic":null,"t":"In business news, Coastline Airways announced today that it will launch direct flights between Port Daniel and three cities in Southeast Asia beginning in June. The airline's chief executive, Helena Strauss, said the new routes are a response to a sharp rise in tourism to the region over the past two years. To celebrate the launch, Coastline is offering round-trip fares at half price for anyone who books before the end of this month. The announcement comes just weeks after the airline completed the purchase of twelve new fuel-efficient aircraft. Ms. Strauss noted that the new planes will cut fuel consumption by nearly twenty percent. Industry analysts were surprised by the move. Only last year, the company was cutting routes. Coastline expects to hire about four hundred additional staff, including pilots and cabin crew, at its Port Daniel base.","qs":[{"q":"What did Coastline Airways announce?","opts":["A merger with another airline","A change in its baggage policy","The opening of a new terminal","New international routes"],"answer":3,"exp":"ข่าวคือจะ launch direct flights ไปสามเมืองใน Southeast Asia จึงเป็นเส้นทางบินระหว่างประเทศใหม่"},{"q":"Why does the speaker say, \"Only last year, the company was cutting routes\"?","opts":["To explain why analysts were surprised","To criticize a recent decision","To suggest that prices will rise","To correct an earlier report"],"answer":0,"exp":"ประโยคก่อนหน้าคือ analysts were surprised by the move การบอกว่าปีที่แล้วยังตัดเส้นทางอยู่เป็นการอธิบายว่าทำไมนักวิเคราะห์ถึงแปลกใจ"},{"q":"According to the report, what will the airline do at its Port Daniel base?","opts":["Build a maintenance center","Hire more employees","Open a training school","Install solar panels"],"answer":1,"exp":"Coastline expects to hire about four hundred additional staff ที่ฐาน Port Daniel ตรงกับการจ้างพนักงานเพิ่ม"}]},{"kind":"instructions","sp":"W","graphic":null,"t":"Good morning, and welcome to your first day at Riverside Fresh Foods. Before we go onto the production floor, I need to go over our hygiene procedures. First, everyone must wear a hairnet, gloves, and a white coat at all times inside the processing area. You'll find these in the changing room to your left. Second, before entering, you'll pass through a hand-washing station. The door to the floor won't open until the sensor confirms you've used the soap dispenser. Third, no jewelry, watches, or mobile phones are allowed past this point. You can store personal items in the lockers, and the keys are attached to your ID badge. Finally, if you feel unwell at any time, you must inform your supervisor immediately, even if it seems minor. Okay, once you're changed, meet me by the packaging line, and I'll introduce you to your team leaders.","qs":[{"q":"Who most likely are the listeners?","opts":["Food inspectors","Factory visitors","New employees","Maintenance technicians"],"answer":2,"exp":"ผู้พูดกล่าวว่า welcome to your first day และจะแนะนำ team leaders จึงเป็นพนักงานใหม่ ไม่ใช่ผู้มาเยี่ยมชม"},{"q":"According to the speaker, what must happen before a door will open?","opts":["A badge must be scanned.","A supervisor must give approval.","A coat must be checked.","Soap must be used."],"answer":3,"exp":"ประตูจะไม่เปิดจนกว่า sensor จะยืนยันว่าใช้ soap dispenser แล้ว ตัวเลือก A เป็นกับดักเพราะ ID badge ใช้กับกุญแจ locker"},{"q":"What should listeners do if they feel sick?","opts":["Notify a supervisor","Go to a medical office","Leave the building","Fill out a form"],"answer":0,"exp":"if you feel unwell ... you must inform your supervisor immediately คือแจ้งหัวหน้างาน (notify a supervisor)"}]},{"kind":"talk","sp":"M","graphic":{"title":"Lunch Specials","rows":[["Dish","Price"],["Grilled Salmon","$16"],["Mushroom Risotto","$13"],["Chicken Curry","$12"],["Beef Noodle Soup","$11"]]},"t":"Okay, everyone, before we open for lunch, a few quick updates. First, the good news: the local food magazine Taste of Brenton has named us one of the city's top ten new restaurants, so expect more customers than usual this week. Now, about today's specials. Unfortunately, our seafood delivery was delayed this morning, so we won't be serving the salmon dish until tomorrow. Please let guests know when you hand them the menu. Instead, the chef recommends the special priced at thirteen dollars, so try to suggest that one to anyone who asks for a vegetarian option. Also, starting next Monday, we'll be using a new tablet system to send orders directly to the kitchen. Natalie will hold a short training session on Saturday afternoon, and I'd like all servers to attend.","qs":[{"q":"What does the speaker say about the restaurant?","opts":["It has recently expanded.","It received positive recognition.","It will change its hours.","It is hiring new staff."],"answer":1,"exp":"นิตยสาร Taste of Brenton จัดให้เป็นหนึ่งใน top ten new restaurants จึงเป็นการได้รับการยอมรับในทางบวก"},{"q":"Look at the graphic. Which dish does the chef recommend?","opts":["Grilled Salmon","Mushroom Risotto","Chicken Curry","Beef Noodle Soup"],"answer":1,"exp":"เชฟแนะนำเมนูราคา 13 ดอลลาร์ ซึ่งในตารางคือ Mushroom Risotto และสอดคล้องกับการเป็นตัวเลือกมังสวิรัติ ส่วน Grilled Salmon ไม่มีเสิร์ฟวันนี้"},{"q":"What will happen on Saturday?","opts":["A magazine will publish a review.","A seafood order will arrive.","A training session will be held.","A new menu will be introduced."],"answer":2,"exp":"Natalie จะจัด short training session วันเสาร์บ่ายเรื่องระบบ tablet ใหม่ ตัวเลือก B ผิดเพราะของทะเลจะมาพรุ่งนี้"}]},{"kind":"telephone message","sp":"W","graphic":{"title":"ShopNest Delivery Options","rows":[["Option","Delivery Time","Fee"],["Standard","5-7 days","Free"],["Express","2-3 days","$8"],["Next Day","1 day","$15"],["Same Day","Within 6 hours","$25"]]},"t":"Hi, this message is for Jonathan Reyes. I'm calling from the customer care team at ShopNest. You contacted us yesterday because the desk lamp you ordered from our Web site was delivered with a broken base. I'm very sorry about that. We've already arranged for a replacement lamp to be sent to you, and you don't need to return the damaged one. Just dispose of it however you like. I also see that you originally paid for express delivery, but the item still arrived late. So, to make up for that, we've upgraded your replacement to the next-fastest option at no charge, which means it'll reach you in just one day. Finally, I've added a twenty-dollar credit to your ShopNest account, which you can use on your next purchase. If you have any other questions, just reply to the e-mail we sent you this morning.","qs":[{"q":"Why did the listener contact the company?","opts":["He received a damaged item.","He was charged twice.","He ordered the wrong size.","He wanted to cancel an order."],"answer":0,"exp":"ลูกค้าติดต่อมาเพราะ desk lamp ส่งมาพร้อม broken base คือได้รับสินค้าเสียหาย"},{"q":"Look at the graphic. Which delivery option will the listener receive?","opts":["Standard","Express","Same Day","Next Day"],"answer":3,"exp":"ลูกค้าเดิมจ่ายแบบ Express แล้วได้อัปเกรดเป็นตัวเลือกที่เร็วขึ้นถัดไปซึ่งส่งถึงใน 1 วัน ตามตารางคือ Next Day ส่วน Same Day เร็วกว่าแต่ไม่ใช่ตัวถัดไป"},{"q":"What has the company added to the listener's account?","opts":["A membership upgrade","An extended warranty","A store credit","A gift card for a partner store"],"answer":2,"exp":"ผู้พูดบอกว่า added a twenty-dollar credit to your ShopNest account คือเครดิตสำหรับซื้อครั้งต่อไป (store credit)"}]}],"p5":[{"q":"Customers can track the status of their orders through our ------- redesigned mobile app.","opts":["recent","recentness","most recent","recently"],"answer":3,"exp":"ช่องว่างอยู่หน้าคำคุณศัพท์ (past participle) redesigned ซึ่งขยายคำนาม app จึงต้องใช้ adverb คือ recently (เมื่อเร็วๆ นี้) ส่วน recent เป็น adjective ขยาย adjective ไม่ได้"},{"q":"Construction of the Harborview condominium tower ------- by the end of next spring.","opts":["will have been completed","completes","has completed","was completing"],"answer":0,"exp":"by the end of next spring บอกเวลาในอนาคตที่เหตุการณ์จะเสร็จสิ้นก่อน จึงใช้ future perfect และประธาน construction ถูกกระทำ ต้องเป็น passive คือ will have been completed ส่วน has completed เป็น active และไม่ใช่อนาคต"},{"q":"The restaurant's rooftop terrace will remain open ------- the winter months, weather permitting.","opts":["among","beside","upon","throughout"],"answer":3,"exp":"throughout + ช่วงเวลา = ตลอดช่วง (ตลอดฤดูหนาว) เหมาะกับความหมาย ส่วน among ใช้กับกลุ่มสิ่งของ/คนตั้งแต่สามขึ้นไป ไม่ใช้กับช่วงเวลา"},{"q":"Please retain the original packaging, as it may be needed to process a ------- claim.","opts":["tenure","venue","warranty","quota"],"answer":2,"exp":"warranty claim = การเรียกร้องสิทธิ์ตามการรับประกันสินค้า สอดคล้องกับการเก็บบรรจุภัณฑ์เดิมไว้ ส่วน tenure (วาระการดำรงตำแหน่ง) และ quota (โควตา) ไม่เกี่ยวกับบริบท"},{"q":"The architects at Lindqvist Partners pride ------- on designing energy-efficient buildings.","opts":["their","them","themselves","theirs"],"answer":2,"exp":"สำนวน pride oneself on = ภาคภูมิใจใน... ต้องใช้สรรพนามสะท้อน (reflexive) ที่ตรงกับประธาน the architects คือ themselves ส่วน them เป็นกรรมธรรมดาซึ่งไม่ใช้ในสำนวนนี้"},{"q":"The city council has approved the ------- of a new water treatment plant near Elm Creek.","opts":["construct","constructive","constructively","construction"],"answer":3,"exp":"หลัง the และหน้า of ต้องใช้คำนาม คือ construction (การก่อสร้าง) ส่วน constructive เป็นคำคุณศัพท์แปลว่าสร้างสรรค์ ไม่สามารถทำหน้าที่คำนามได้"},{"q":"------- the airline introduced online check-in, average waiting times at its ticket counters have fallen considerably.","opts":["Despite","Since","Unless","During"],"answer":1,"exp":"ประโยคหลักใช้ present perfect (have fallen) และช่องว่างตามด้วยอนุประโยค จึงใช้คำสันธาน Since (ตั้งแต่) ส่วน Despite และ During เป็นบุพบทที่ต้องตามด้วยคำนาม ไม่ใช่อนุประโยค"},{"q":"All vaccine samples must ------- at a temperature below four degrees Celsius until shipment.","opts":["store","storing","be stored","have stored"],"answer":2,"exp":"ตัวอย่างวัคซีนเป็นสิ่งที่ถูกเก็บ จึงต้องใช้ passive หลัง modal คือ must + be + V3 = be stored ส่วน store เป็น active ซึ่งไม่สมเหตุผลเพราะตัวอย่างเก็บสิ่งอื่นเองไม่ได้"},{"q":"Wexley Consulting has been hired to ------- the firm's document management procedures.","opts":["overcome","streamline","retire","persuade"],"answer":1,"exp":"streamline = ปรับปรุงให้กระชับและมีประสิทธิภาพขึ้น ใช้กับ procedures ได้อย่างเหมาะสม ส่วน overcome (เอาชนะ) ใช้กับปัญหาหรืออุปสรรค ไม่ใช่ขั้นตอนการทำงาน"},{"q":"Guests at the Bellmont Hotel frequently describe the front desk staff as ------- and attentive.","opts":["courtesy","courteously","courteousness","courteous"],"answer":3,"exp":"โครงสร้าง describe A as + adjective และเชื่อมด้วย and กับ attentive ซึ่งเป็นคำคุณศัพท์ จึงต้องใช้ adjective คือ courteous (สุภาพ) ส่วน courtesy เป็นคำนาม"},{"q":"Tenants are responsible for minor maintenance tasks, ------- replacing light bulbs and air filters.","opts":["so that","in case","such as","as if"],"answer":2,"exp":"such as = เช่น ใช้ยกตัวอย่างงานซ่อมบำรุงเล็กน้อย ส่วน so that และ in case เป็นคำสันธานที่ต้องตามด้วยอนุประโยค (ประธาน+กริยา)"},{"q":"Ms. Okafor ------- the quarterly utility rates when the billing system suddenly crashed.","opts":["reviews","has reviewed","was reviewing","will review"],"answer":2,"exp":"เหตุการณ์ที่กำลังดำเนินอยู่ในอดีตแล้วมีอีกเหตุการณ์แทรกเข้ามา (when ... crashed) ใช้ past continuous คือ was reviewing ส่วน has reviewed เป็น present perfect ไม่เข้ากับเหตุการณ์ในอดีตที่ระบุชัด"},{"q":"Halston Grocers is offering free delivery to ------- who spend more than $50 per order.","opts":["shop","shopped","shopping","shoppers"],"answer":3,"exp":"หลังบุพบท to และหน้า who ต้องใช้คำนามที่หมายถึงคน คือ shoppers (ผู้ซื้อ) ส่วน shopping เป็นคำนามหมายถึงการซื้อของ ไม่ใช่คน จึงใช้กับ who ไม่ได้"},{"q":"Due to a scheduling -------, the gallery opening has been moved from Friday to Saturday evening.","opts":["contest","contract","conflict","conduct"],"answer":2,"exp":"scheduling conflict = ตารางเวลาชนกัน เป็นเหตุผลที่ต้องเลื่อนงาน ส่วน contract (สัญญา) และ conduct (ความประพฤติ) เป็นคำที่สะกดคล้ายกันแต่ความหมายไม่เข้ากับบริบท"},{"q":"The new menu features dishes that are ------- affordable and nutritious.","opts":["either","neither","whether","both"],"answer":3,"exp":"คู่คำเชื่อม both ... and = ทั้ง...และ... เข้ากับ and ในประโยค ส่วน either ต้องคู่กับ or และ neither ต้องคู่กับ nor"},{"q":"Pharmaceutical products must be labeled ------- in accordance with national regulations.","opts":["accurately","accurate","accuracy","accurateness"],"answer":0,"exp":"ช่องว่างขยายกริยา be labeled จึงต้องใช้ adverb คือ accurately (อย่างถูกต้องแม่นยำ) ส่วน accurate เป็น adjective ซึ่งขยายกริยาไม่ได้"},{"q":"The contractor ------- bid was accepted will begin work on the parking garage in June.","opts":["whose","who","whom","which"],"answer":0,"exp":"ช่องว่างตามด้วยคำนาม bid และแสดงความเป็นเจ้าของ (bid ของผู้รับเหมา) จึงใช้ relative pronoun whose ส่วน who ต้องตามด้วยกริยาโดยตรง ไม่ใช่คำนาม"},{"q":"Passengers traveling with infants are invited to board ------- other passengers in economy class.","opts":["aside","despite","toward","ahead of"],"answer":3,"exp":"ahead of = ก่อน/นำหน้า ผู้โดยสารที่มีทารกได้ขึ้นเครื่องก่อนผู้โดยสารอื่น ส่วน aside ต้องใช้ aside from และ despite (แม้ว่า) ไม่เข้ากับความหมาย"},{"q":"Visitors are asked to ------- from touching the sculptures in the east gallery.","opts":["prevent","avoid","refrain","resist"],"answer":2,"exp":"refrain from + V-ing = งดเว้นการ... เป็นคำที่ใช้กับ from ส่วน avoid ตามด้วย V-ing ได้ทันทีโดยไม่มี from และ prevent ต้องมีกรรมก่อน from (prevent someone from)"},{"q":"Many diners found the chef's tasting menu both creative and -------.","opts":["satisfied","satisfying","satisfaction","satisfy"],"answer":1,"exp":"เมนูเป็นสิ่งที่ทำให้ผู้อื่นพอใจ จึงใช้ adjective รูป -ing คือ satisfying ส่วน satisfied (-ed) ใช้กับคนที่รู้สึกพอใจ ไม่ใช่กับสิ่งของ"},{"q":"It is essential that every contractor ------- a safety helmet while on the site.","opts":["wears","wear","wore","wearing"],"answer":1,"exp":"หลังโครงสร้าง It is essential that ... ต้องใช้ subjunctive คือกริยารูปพื้นฐาน (base form) wear เสมอแม้ประธานเป็นเอกพจน์ ส่วน wears เป็นตัวลวงที่ผันตามประธานตามปกติ"},{"q":"The utility company plans to ------- customers in advance of any scheduled power outages.","opts":["notify","announce","express","describe"],"answer":0,"exp":"notify + คน = แจ้งให้ใครทราบ ใช้กับ customers ได้โดยตรง ส่วน announce ต้องมีกรรมเป็นสิ่งที่ประกาศ (announce something to someone) ไม่ใช้คนเป็นกรรม"},{"q":"Our consultants will review your current tax filings ------- recommending any changes.","opts":["before","then","until","so"],"answer":0,"exp":"before + V-ing = ก่อนที่จะ... สื่อว่าตรวจสอบเอกสารภาษีก่อนแนะนำการเปลี่ยนแปลง ส่วน then เป็นคำกริยาวิเศษณ์ ไม่สามารถตามด้วย V-ing ในโครงสร้างนี้ได้"},{"q":"Strict ------- to food safety standards is required at all of Tavora Foods' processing plants.","opts":["adhere","adherence","adhered","adhering"],"answer":1,"exp":"หลังคำคุณศัพท์ Strict และทำหน้าที่ประธานของประโยค ต้องใช้คำนาม adherence (การปฏิบัติตามอย่างเคร่งครัด) ส่วน adhere เป็นกริยา"},{"q":"Since its launch last year, the online store ------- more than 20,000 orders.","opts":["is processed","processes","had been processed","has processed"],"answer":3,"exp":"Since + จุดเวลาในอดีต ต่อเนื่องถึงปัจจุบัน ใช้ present perfect และร้านค้าเป็นผู้ดำเนินการ จึงเป็น active คือ has processed ส่วน had been processed เป็น past perfect passive ไม่ถูกทั้งกาลและวาจก"},{"q":"Express shipping is available for an ------- fee of $12.","opts":["additional","eventual","adjacent","obvious"],"answer":0,"exp":"additional fee = ค่าธรรมเนียมเพิ่มเติม เป็นคำที่ใช้คู่กันบ่อยในบริบทการจัดส่ง ส่วน adjacent (อยู่ติดกัน) และ eventual (ในท้ายที่สุด) ไม่เข้ากับคำว่า fee"},{"q":"The pharmacy's new automated system fills prescriptions far more ------- than the old manual process.","opts":["efficient","efficiently","efficiency","efficiencies"],"answer":1,"exp":"more ... than ขยายกริยา fills จึงต้องใช้ adverb ในรูปเปรียบเทียบ คือ more efficiently ส่วน efficient เป็น adjective ขยายกริยาไม่ได้"},{"q":"Reservations for groups of eight or more must be made at least 48 hours ------- advance.","opts":["in","on","at","by"],"answer":0,"exp":"สำนวน in advance = ล่วงหน้า ใช้บุพบท in เท่านั้น บุพบทอื่นใช้กับ advance ในความหมายนี้ไม่ได้"},{"q":"The consulting firm's latest report offers ------- insight into consumer spending trends.","opts":["eligible","valuable","punctual","spacious"],"answer":1,"exp":"valuable insight = ข้อมูลเชิงลึกที่มีคุณค่า เหมาะกับรายงาน ส่วน eligible (มีสิทธิ์) และ punctual (ตรงต่อเวลา) ใช้กับคน ไม่ใช้กับ insight"},{"q":"Ticket prices for the summer music festival vary ------- on seating location.","opts":["depend","dependent","depending","dependence"],"answer":2,"exp":"depending on = ขึ้นอยู่กับ ใช้เป็นวลีขยายประโยคหลัก (vary depending on) ส่วน depend เป็นกริยาแท้ ไม่สามารถตามหลังกริยา vary ได้โดยไม่มีคำเชื่อม"}],"p6":[{"kind":"e-mail","head":"To: Priya Raman <praman@quickmail.com>\nFrom: Customer Care, Nestwell Home Goods <care@nestwellhome.com>\nDate: September 9\nSubject: Your order #NW-58203","t":"Dear Ms. Raman,\n\nThank you for shopping with Nestwell Home Goods. We are writing to let you know that the ceramic dinnerware set you ordered on September 6 has been [[1]] in transit. According to the carrier, the package was crushed at a regional sorting facility.\n\nWe sincerely apologize for this inconvenience. A replacement set has already been shipped to you at no additional cost, and it should arrive [[2]] three to five business days. [[3]]\n\nIf the original package is delivered to you, please do not open it. Simply contact us, and we will send you a prepaid return label. As a token of our appreciation for your [[4]], we have also added a $15 credit to your Nestwell account.\n\nSincerely,\nThe Nestwell Customer Care Team","qs":[{"opts":["damaging","damage","damages","damaged"],"answer":3,"exp":"has been + V3 เป็น present perfect passive สินค้าถูกทำให้เสียหายระหว่างขนส่ง จึงใช้ damaged ส่วน damaging เป็นรูป -ing ที่ใช้กับ has been แล้วมีความหมาย active ไม่สมเหตุผล"},{"opts":["among","along","until","within"],"answer":3,"exp":"within + ระยะเวลา = ภายใน (ภายใน 3-5 วันทำการ) ส่วน until ต้องตามด้วยจุดเวลา เช่น until Friday ไม่ใช่ช่วงระยะเวลา"},{"opts":["You can follow its progress using the tracking number below: 1Z84-302-771.","Unfortunately, this item is no longer in stock.","We hope you enjoyed your recent stay with us.","Please return the replacement set by September 10."],"answer":0,"exp":"ประโยคก่อนหน้าพูดถึงการจัดส่งสินค้าทดแทน การให้หมายเลขติดตามพัสดุจึงต่อเนื่องเหมาะสม ส่วนประโยคที่บอกว่าสินค้าหมดสต็อกขัดแย้งกับข้อความที่ว่าได้ส่งสินค้าทดแทนไปแล้ว"},{"opts":["patient","patience","patiently","patients"],"answer":1,"exp":"หลัง your ต้องใช้คำนาม patience (ความอดทน) ซึ่งเข้ากับการขอบคุณลูกค้า ส่วน patients เป็นคำนามพหูพจน์หมายถึงผู้ป่วย ความหมายไม่ตรง"}]},{"kind":"notice","head":"NOTICE TO RESIDENTS OF THE CEDAR HILLS DISTRICT","t":"Corbin Valley Water Authority will be replacing aging water pipes along Linden Street and Ash Lane from October 14 to October 18. Work crews will be on site daily between 8:00 A.M. and 5:00 P.M. [[1]] this period, residents may notice a temporary drop in water pressure.\n\nIn addition, water service to some homes will be shut off for up to four hours on October 16. Affected households [[2]] by a printed notice at least 48 hours beforehand. [[3]]\n\nAfter service is restored, tap water may appear slightly cloudy. This is harmless and should clear [[4]] after running the tap for a few minutes. For questions, please call our customer line at 555-0182.","qs":[{"opts":["During","While","Within","Since"],"answer":0,"exp":"During + คำนาม (this period) = ในระหว่าง ส่วน While เป็นคำสันธานต้องตามด้วยอนุประโยค และ Since ไม่เข้ากับเหตุการณ์ในอนาคต"},{"opts":["informed","will be informed","have informed","are informing"],"answer":1,"exp":"เหตุการณ์จะเกิดในอนาคต (ก่อนวันที่ 16) และครัวเรือนเป็นผู้ถูกแจ้ง จึงใช้ future passive คือ will be informed ส่วน have informed เป็น active ซึ่งครัวเรือนไม่ได้เป็นผู้แจ้ง"},{"opts":["We recommend storing some drinking water in advance for use during the shutoff.","The new pipes were installed last year at a cost of $2 million.","Parking on Linden Street will be free of charge next month.","Residents may pay their bills online at any time."],"answer":0,"exp":"ย่อหน้านี้พูดถึงการหยุดจ่ายน้ำ 4 ชั่วโมง คำแนะนำให้สำรองน้ำดื่มไว้จึงสอดคล้องที่สุด ส่วนประโยคที่ว่าท่อใหม่ติดตั้งไปแล้วเมื่อปีที่แล้วขัดกับข้อความว่ากำลังจะเปลี่ยนท่อ"},{"opts":["quick","quickly","quicken","quickness"],"answer":1,"exp":"ช่องว่างขยายกริยา clear จึงต้องใช้ adverb คือ quickly (อย่างรวดเร็ว) ส่วน quick เป็น adjective และ quicken เป็นกริยา"}]},{"kind":"article","head":"Business Briefs — Westport Daily","t":"WESTPORT (March 3) — Harmon Realty Group announced on Monday that it has purchased the former Alder Textile Mill on River Road. The company plans to convert the 120-year-old brick building into 85 loft-style apartments and a ground-floor marketplace for local vendors.\n\n\"The mill is one of Westport's most recognizable landmarks,\" said Harmon president Celia Burke. \"Our goal is to [[1]] its historic character while making it suitable for modern living.\" Original features such as the exposed timber beams and arched windows will be kept.\n\nRenovation work is scheduled to begin in May. [[2]], the first residents are expected to move in by the end of next year. [[3]]\n\nCity officials have welcomed the project, noting that the site has stood [[4]] for nearly a decade. Leasing information will be posted on Harmon's Web site this fall.","qs":[{"opts":["prevent","predict","preserve","prescribe"],"answer":2,"exp":"preserve = รักษาไว้ เข้ากับ historic character และประโยคถัดไปที่บอกว่าจะเก็บองค์ประกอบดั้งเดิมไว้ ส่วน prevent (ป้องกัน) ไม่สมเหตุผลกับลักษณะทางประวัติศาสตร์"},{"opts":["In contrast","For example","If all goes according to plan","Otherwise"],"answer":2,"exp":"If all goes according to plan = หากทุกอย่างเป็นไปตามแผน ใช้คาดการณ์ว่าผู้อยู่อาศัยจะเข้าอยู่ได้ปลายปีหน้า ส่วน In contrast แสดงความขัดแย้งซึ่งไม่มีในบริบทนี้"},{"opts":["The mill closed its doors only last month.","Ms. Burke has worked as a textile designer for 20 years.","The marketplace will sell only imported goods.","Rents for the units have not yet been announced."],"answer":3,"exp":"หลังพูดถึงกำหนดเข้าอยู่อาศัย การบอกว่ายังไม่ประกาศค่าเช่าเชื่อมกับย่อหน้าสุดท้ายที่ว่าจะประกาศข้อมูลการเช่าภายหลัง ส่วนประโยคที่ว่าโรงงานเพิ่งปิดเมื่อเดือนที่แล้วขัดกับข้อความว่าว่างมาเกือบสิบปี"},{"opts":["vacancy","vacant","vacate","vacantly"],"answer":1,"exp":"stand + adjective = อยู่ในสภาพ... (stood vacant = ถูกทิ้งร้างว่างเปล่า) จึงใช้คำคุณศัพท์ vacant ส่วน vacancy เป็นคำนามหมายถึงตำแหน่งงานว่างหรือห้องว่าง"}]},{"kind":"memo","head":"To: All Laboratory Staff\nFrom: Dr. Martin Kowal, Director of Quality Assurance\nDate: June 2\nSubject: Updated sample-labeling procedure","t":"Beginning Monday, June 9, Velacor Pharmaceuticals will adopt a new procedure for labeling research samples. Under the current system, labels are written by hand, which has occasionally led to errors in identifying samples. [[1]], all labels will be generated by the new BarTrack software and printed at each workstation.\n\nEach label will contain a barcode linking the sample to its digital record. Staff should scan the barcode [[2]] a sample is moved from one storage unit to another. [[3]]\n\nTraining sessions will be held on June 5 and June 6 in Conference Room B. Attendance is [[4]] for all laboratory personnel. Please sign up for one session through the company intranet by Wednesday.","qs":[{"opts":["Under the new system","Even so","Until then","In the past"],"answer":0,"exp":"ประโยคก่อนหน้าอธิบายระบบเดิม (Under the current system) ประโยคนี้จึงเปรียบเทียบกับระบบใหม่ด้วย Under the new system ส่วน In the past ขัดกับกาลอนาคต will be generated"},{"opts":["wherever","whenever","however","whatever"],"answer":1,"exp":"whenever = ทุกครั้งที่ ใช้บอกว่าต้องสแกนบาร์โค้ดทุกครั้งที่ย้ายตัวอย่าง ส่วน wherever หมายถึงที่ใดก็ตาม ซึ่งไม่ได้บอกเงื่อนไขด้านเวลา"},{"opts":["This will allow us to keep an accurate record of each sample's location at all times.","Handwritten labels will continue to be used for most samples.","The storage units were replaced last spring.","Please submit your vacation requests to your supervisor."],"answer":0,"exp":"ประโยคนี้อธิบายประโยชน์ของการสแกนเมื่อย้ายตัวอย่าง คือติดตามตำแหน่งได้ตลอด จึงต่อเนื่องกับประโยคก่อนหน้า ส่วนประโยคที่ว่ายังใช้ป้ายเขียนมือต่อไปขัดกับเนื้อหาที่ว่าทุกป้ายจะพิมพ์จากซอฟต์แวร์"},{"opts":["requiring","requirement","required","requires"],"answer":2,"exp":"หลัง is ต้องใช้ส่วนเติมเต็มที่เป็นคำคุณศัพท์ required (จำเป็น/บังคับ) ส่วน requiring ทำให้ประโยคเป็น active ที่ต้องมีกรรม และ requirement เป็นคำนามที่ไม่ตรงความหมาย (การเข้าร่วมไม่ใช่ข้อกำหนด)"}]}],"p7":[{"passages":[{"kind":"text message chain","head":"","t":"Rosa Delgado (3:41 P.M.): Hi Tom. The fish delivery from Harbor Seafood still hasn't arrived, and we have a party of 30 booked for 7:00 tonight.\n\nTom Becker (3:43 P.M.): I just called them. Their truck broke down outside Millbrook. They can send a second van, but it won't get here before 6:30.\n\nRosa Delgado (3:44 P.M.): That's cutting it close. The salmon needs at least 40 minutes in the marinade.\n\nTom Becker (3:46 P.M.): What about Fulton Market on Pine Street? They usually have fresh salmon.\n\nRosa Delgado (3:47 P.M.): Say no more.\n\nTom Becker (3:48 P.M.): Great. Take the restaurant card. I'll cancel the second van."}],"qs":[{"q":"What problem does Ms. Delgado mention?","opts":["A large reservation was canceled.","A recipe has been changed.","A delivery truck went to the wrong address.","An order has not been delivered."],"answer":3,"exp":"Ms. Delgado แจ้งว่าปลาที่สั่งจาก Harbor Seafood ยังมาไม่ถึง จึงเป็นปัญหาของสินค้าที่ยังไม่ได้ส่ง ตัวเลือกที่พูดถึงรถไปผิดที่อยู่เป็นกับดัก เพราะรถเสีย (broke down) ไม่ใช่ไปผิดที่"},{"q":"At 3:47 P.M., what does Ms. Delgado most likely mean when she writes, \"Say no more\"?","opts":["She wants Mr. Becker to stop calling suppliers.","She will buy fish from Fulton Market.","She is unhappy with Mr. Becker's suggestion.","She will wait for the second van."],"answer":1,"exp":"Mr. Becker เสนอให้ไปซื้อปลาแซลมอนที่ Fulton Market และ Ms. Delgado ตอบว่า \"Say no more\" หมายความว่าเห็นด้วยทันทีและจะไปซื้อเอง ซึ่งยืนยันด้วยข้อความต่อมาว่าให้เอาบัตรร้านไปและจะยกเลิกรถคันที่สอง"}]},{"passages":[{"kind":"notice","head":"Crestwood Water Authority\nScheduled Service Interruption","t":"Residents and businesses on Alder Road between 4th Street and Kingsley Avenue are advised that water service will be shut off on Tuesday, August 19, from 9:00 A.M. to approximately 3:00 P.M. Crews will be replacing a section of the main pipe that was installed in 1962.\n\nAfter service is restored, tap water may appear cloudy for a short time. This is caused by air in the pipes and is not harmful. Running a cold-water tap for two to three minutes should clear it.\n\nA water truck will be parked in front of the Alder Road Community Center throughout the day for anyone who needs drinking water. For updates, visit www.crestwoodwater.org/alerts."}],"qs":[{"q":"Why will the water service be interrupted?","opts":["To replace old equipment","To test the quality of the water","To connect a new community center","To repair damage caused by a storm"],"answer":0,"exp":"ประกาศระบุว่าทีมงานจะเปลี่ยนท่อหลักที่ติดตั้งตั้งแต่ปี 1962 จึงเป็นการเปลี่ยนอุปกรณ์เก่า (old equipment) ตัวเลือก community center เป็นกับดักเพราะศูนย์ชุมชนเป็นเพียงจุดตั้งรถน้ำ"},{"q":"What are residents told to do if their water looks cloudy?","opts":["Call the water authority","Let the cold water run briefly","Collect water from a truck","Check the Web site for updates"],"answer":1,"exp":"ประกาศแนะนำให้เปิดน้ำเย็นทิ้งไว้ 2-3 นาทีเพื่อไล่อากาศ (Running a cold-water tap for two to three minutes) ตัวเลือกเรื่องรถน้ำผิดเพราะเป็นบริการสำหรับผู้ต้องการน้ำดื่มระหว่างวันที่ปิดน้ำ"}]},{"passages":[{"kind":"advertisement","head":"Nestwell Home - Online Only","t":"Furnish your home without leaving it! Nestwell Home offers more than 3,000 sofas, tables, beds, and storage pieces, all available exclusively at www.nestwellhome.com.\n\nNot sure about a color or fabric? Order up to five free fabric samples, delivered to your door within three business days. Every furniture order ships free to addresses within the continental United States, and our in-home assembly service is available for a flat fee of $49.\n\nThis month only, new customers who sign up for our e-mail newsletter will receive a code for 10 percent off their first purchase."}],"qs":[{"q":"What is indicated about Nestwell Home?","opts":["It sells its products only on the Internet.","It has recently opened a new showroom.","It specializes in office furniture.","It offers free assembly for all orders."],"answer":0,"exp":"โฆษณาระบุว่าสินค้ามีขายเฉพาะที่ www.nestwellhome.com (available exclusively ... Online Only) ตัวเลือก free assembly ผิดเพราะบริการประกอบคิดค่าบริการ $49 สิ่งที่ฟรีคือการจัดส่ง"},{"q":"How can customers receive a discount?","opts":["By ordering five fabric samples","By paying a flat fee","By purchasing more than one item","By subscribing to a newsletter"],"answer":3,"exp":"ลูกค้าใหม่ที่สมัครรับ e-mail newsletter จะได้รหัสส่วนลด 10% สำหรับการซื้อครั้งแรก คำว่า sign up for ถอดความเป็น subscribe to ส่วน fabric samples เป็นบริการฟรีแต่ไม่ใช่วิธีรับส่วนลด"}]},{"passages":[{"kind":"e-mail","head":"To: Priya Raman <praman@meridianconsult.com>\nFrom: SkyPort Airways <notifications@skyportair.com>\nDate: November 4\nSubject: Change to your itinerary - Booking ref. QX7T4L","t":"Dear Ms. Raman,\n\nWe regret to inform you that SkyPort Airways flight SP 218 from Chicago to Toronto on November 12 has been rescheduled. The flight will now depart at 4:50 P.M. instead of 11:20 A.M. and will arrive in Toronto at 7:35 P.M. Your seat assignment, 14C, remains unchanged.\n\nIf the new departure time is not convenient, you may switch to another SkyPort flight on the same route within three days of your original travel date at no additional charge. Alternatively, you may request a full refund. Either option can be selected in the \"Manage My Booking\" section of our Web site.\n\nWe apologize for any inconvenience.\n\nSkyPort Airways Customer Care"}],"qs":[{"q":"What is the purpose of the e-mail?","opts":["To confirm a seat upgrade","To notify a passenger of a schedule change","To announce a new route to Toronto","To request payment for a booking"],"answer":1,"exp":"อีเมลแจ้งว
