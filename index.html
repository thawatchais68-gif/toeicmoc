ject: Elevator maintenance","t":"Please be advised that the main elevators in the east wing will be [[1]] service from Monday, March 21, through Wednesday, March 23. During this period, technicians will replace the elevator control systems, which [[2]] in 2009.\n\nEmployees in the east wing are asked to use the stairwells or the freight elevator next to the loading dock. [[3]] Staff in the west wing will not be affected.\n\nWe apologize for the inconvenience and thank you in advance for your [[4]].","qs":[{"opts":["over","out of","off","under"],"answer":1,"exp":"out of service = งดให้บริการ/ใช้งานไม่ได้ เป็นสำนวนที่ใช้กับลิฟต์หรือเครื่องจักร ส่วน under ใช้กับ under maintenance หรือ under repair ไม่ใช่ under service"},{"opts":["are installed","will install","have installed","were installed"],"answer":3,"exp":"ระบบควบคุมถูกติดตั้ง จึงต้องเป็น passive และมี in 2009 บอกเวลาในอดีต จึงใช้ were installed ส่วน have installed เป็น active และใช้กับปีที่ระบุชัดไม่ได้"},{"opts":["Those with mobility concerns should contact the facilities office for assistance.","The new cafeteria menu will be posted next week.","Technicians completed the repairs ahead of schedule.","The loading dock is closed to deliveries on weekends."],"answer":0,"exp":"หลังจากขอให้ใช้บันได ประโยคที่เหมาะสมคือการแนะนำผู้ที่มีปัญหาในการเคลื่อนไหว (mobility concerns) ให้ติดต่อขอความช่วยเหลือ ส่วน Technicians completed ... ใช้อดีตกาลขัดกับงานที่ยังไม่เริ่ม"},{"opts":["cooperate","cooperative","cooperation","cooperatively"],"answer":2,"exp":"หลังคำแสดงความเป็นเจ้าของ your ต้องใช้คำนาม cooperation (ความร่วมมือ) สำนวน thank you for your cooperation พบบ่อยในบันทึกภายใน"}]},{"kind":"notice","head":"Notice to Riverside Public Library Patrons","t":"Beginning July 1, the Riverside Public Library will [[1]] its hours of operation on weekends. On Saturdays and Sundays, the library will open at 9 A.M. instead of 10 A.M. and will remain open until 6 P.M., one hour later than at present.\n\nThis change is a response to [[2]] from patrons who requested more convenient access to our study rooms. [[3]] In addition, the library café will begin serving light meals during the extended hours.\n\nFor [[4]] information, please visit our Web site or speak with a staff member at the front desk.","qs":[{"opts":["reduce","limit","shorten","extend"],"answer":3,"exp":"ห้องสมุดเปิดเร็วขึ้นและปิดช้าลง แสดงว่าขยายเวลา จึงใช้ extend ตัวเลือก reduce, limit, shorten ให้ความหมายตรงข้าม ต้องอ่านประโยคถัดไปจึงจะตอบได้"},{"opts":["suggest","suggestive","suggestions","suggested"],"answer":2,"exp":"หลังบุพบท to (a response to) ต้องใช้คำนาม suggestions (ข้อเสนอแนะ) ส่วน suggestive เป็นคุณศัพท์ และ suggest เป็นกริยา"},{"opts":["The library will be closed for renovations in July.","Study rooms can now be reserved up to two weeks in advance.","Library cards must be renewed every three years.","Weekend hours will be reduced starting next month."],"answer":1,"exp":"ประโยคก่อนหน้าพูดถึงห้องอ่านหนังสือ (study rooms) และประโยคถัดไปขึ้นต้นด้วย In addition จึงต้องเป็นการปรับปรุงบริการอีกอย่าง คือจองห้องได้ล่วงหน้า ส่วน Weekend hours will be reduced ขัดกับเนื้อหา"},{"opts":["further","farther","furthest","far"],"answer":0,"exp":"For further information = สำหรับข้อมูลเพิ่มเติม เป็นสำนวนตายตัว ส่วน farther ใช้กับระยะทางจริงเท่านั้น"}]},{"kind":"article","head":"Local Business News","t":"GREENVILLE (May 8) — Hartwell Foods, a manufacturer of organic snacks, officially opened its new production facility on Route 9 yesterday. The 12,000-square-meter plant will [[1]] the company's output by nearly 40 percent.\n\nCompany president Maria Lund said the expansion was necessary to meet growing demand from supermarkets across the region. [[2]], Hartwell's products were available only in specialty health food stores.\n\nThe facility is expected to create about 150 new jobs. Hiring has already begun, and the company is [[3]] seeking machine operators and quality-control technicians. [[4]]","qs":[{"opts":["increase","increasing","increased","increases"],"answer":0,"exp":"หลัง modal verb will ต้องใช้กริยารูปพื้นฐาน (base form) คือ increase ส่วนรูปอื่นใช้หลัง will ไม่ได้"},{"opts":["Similarly","Until recently","As a result","Nevertheless"],"answer":1,"exp":"Until recently = จนกระทั่งเมื่อไม่นานมานี้ ใช้เปรียบเทียบอดีต (ขายเฉพาะร้านเฉพาะทาง) กับปัจจุบัน (ขายในซูเปอร์มาร์เก็ต) ส่วน As a result ไม่เข้ากับความสัมพันธ์เชิงเหตุผล"},{"opts":["particular","particularity","particularly","more particular"],"answer":2,"exp":"ช่องว่างอยู่ระหว่าง is กับกริยา seeking จึงต้องใช้ adverb คือ particularly (โดยเฉพาะ) ส่วน particular เป็นคุณศัพท์"},{"opts":["The new plant was closed for inspection last week.","Supermarkets have reduced their orders of organic snacks.","Ms. Lund plans to retire at the end of the year.","Interested applicants can find details on the company's Web site."],"answer":3,"exp":"ประโยคก่อนหน้าพูดถึงการรับสมัครงาน ประโยคปิดที่เหมาะสมคือแนะนำผู้สนใจให้ดูรายละเอียดบนเว็บไซต์ ส่วน Supermarkets have reduced ... ขัดกับข้อความที่ว่าความต้องการเพิ่มขึ้น"}]}],"p7":[{"passages":[{"kind":"text message chain","head":"","t":"Dana Whitfield (2:12 P.M.): Hi Marcus, are you still at the Lakeside branch? The projector in Conference Room B won't turn on, and the client arrives at 3:00.\n\nMarcus Bell (2:14 P.M.): I left about twenty minutes ago. I'm on my way to the supplier in Ashford.\n\nDana Whitfield (2:15 P.M.): Oh no. Is there a spare one anywhere in the building?\n\nMarcus Bell (2:17 P.M.): Check the storage cabinet next to reception. Priya keeps the key.\n\nDana Whitfield (2:25 P.M.): Found it. It's working perfectly.\n\nMarcus Bell (2:26 P.M.): Great. I'll submit a repair request for the other one when I'm back tomorrow."}],"qs":[{"q":"Why does Ms. Whitfield contact Mr. Bell?","opts":["To ask him to meet a client","To report a problem with some equipment","To reschedule a meeting","To request directions to a supplier"],"answer":1,"exp":"Ms. Whitfield เขียนว่า projector ใน Conference Room B เปิดไม่ติด จึงเป็นการแจ้งปัญหาอุปกรณ์ (equipment) ตัวเลือก A ผิดเพราะลูกค้าจะมาพบเธอเอง ไม่ได้ขอให้ Mr. Bell ไปพบ"},{"q":"At 2:14 P.M., what does Mr. Bell most likely mean when he writes, \"I left about twenty minutes ago\"?","opts":["He arrived at the office late.","He has already finished the repair.","He will be at the supplier soon.","He cannot help her in person."],"answer":3,"exp":"Ms. Whitfield ถามว่าเขายังอยู่ที่สาขา Lakeside หรือไม่ การตอบว่าออกมาแล้ว 20 นาทีหมายความว่าเขาไม่สามารถมาช่วยด้วยตัวเองได้ ตัวเลือก C เป็นกับดักเพราะเขากำลังเดินทางไป supplier แต่ไม่ใช่ความหมายที่เขาต้องการสื่อ"}]},{"passages":[{"kind":"notice","head":"Notice to All Tenants of the Halvorsen Building","t":"Please be advised that the main elevator will be closed for scheduled maintenance from Monday, June 9, through Wednesday, June 11. During this period, tenants and visitors are asked to use the service elevator located at the rear of the lobby, next to the loading area.\n\nDeliveries of large items should be postponed until Thursday, June 12, if possible. Tenants who must receive deliveries during the closure should contact the building manager, Ms. Teresa Duval, at extension 210 at least 24 hours in advance so that the loading area can be reserved.\n\nWe apologize for any inconvenience and thank you for your patience."}],"qs":[{"q":"What is the purpose of the notice?","opts":["To announce a temporary closure","To introduce a new building manager","To describe a new delivery policy","To request feedback from tenants"],"answer":0,"exp":"ประกาศแจ้งว่าลิฟต์หลักจะปิดซ่อมบำรุงชั่วคราว 9-11 มิถุนายน จึงเป็นการแจ้งการปิดชั่วคราว (temporary closure) ตัวเลือก C ผิดเพราะการพูดถึงการส่งของเป็นเพียงรายละเอียดเสริม ไม่ใช่นโยบายใหม่"},{"q":"According to the notice, why should tenants contact Ms. Duval?","opts":["To report a problem with the service elevator","To receive a key to the loading area","To arrange a delivery during the maintenance period","To change the date of the maintenance work"],"answer":2,"exp":"ประกาศระบุว่าผู้เช่าที่ต้องรับของระหว่างการปิดลิฟต์ต้องติดต่อ Ms. Duval ล่วงหน้า 24 ชั่วโมงเพื่อจองพื้นที่ loading area ตัวเลือก B เป็นกับดักเพราะใช้คำว่า loading area แต่ไม่ได้พูดถึงกุญแจ"}]},{"passages":[{"kind":"advertisement","head":"Brightline Office Interiors","t":"Is your workspace ready for the way your team works today? Brightline Office Interiors has helped more than 400 businesses across the region design comfortable, efficient offices.\n\nOur services include space planning, furniture selection, lighting design, and installation. Every project begins with a free on-site consultation, during which one of our designers will measure your space and discuss your needs and budget.\n\nBook a consultation before August 31 and receive 15 percent off any furniture order over $5,000. Visit www.brightlineinteriors.com or call 555-0184 to schedule an appointment."}],"qs":[{"q":"What is NOT mentioned as a service offered by Brightline Office Interiors?","opts":["Lighting design","Furniture installation","Space planning","Equipment rental"],"answer":3,"exp":"โฆษณาระบุบริการ space planning, furniture selection, lighting design และ installation แต่ไม่ได้กล่าวถึงการให้เช่าอุปกรณ์ (equipment rental) คำถามแบบ NOT ต้องหาตัวเลือกที่ไม่ปรากฏในข้อความ"},{"q":"How can customers receive a discount?","opts":["By ordering furniture online","By scheduling a consultation by a certain date","By referring another business","By spending less than $5,000"],"answer":1,"exp":"ส่วนลด 15% ให้กับลูกค้าที่จอง consultation ก่อน 31 สิงหาคม และสั่งเฟอร์นิเจอร์เกิน $5,000 ตัวเลือก D ผิดเพราะต้องสั่งเกิน (over) $5,000 ไม่ใช่น้อยกว่า"}]},{"passages":[{"kind":"invoice","head":"Greenway Catering Co.\n18 Mercer Street, Portland\nInvoice No. 4471    Date: March 3\nBill to: Ostrander Legal Partners, Attn: Ms. Helen Cho","t":"Event: Client appreciation luncheon, February 27\n\nSandwich platters (6) .......... $270.00\nSeasonal salad bowls (4) .......... $120.00\nFruit and pastry tray (2) .......... $90.00\nBeverage service (40 guests) .......... $160.00\nDelivery and setup .......... $0.00\n\nTotal due: $640.00\n\nPayment is due within 30 days of the invoice date. As a returning customer, your delivery and setup fee has been waived. Please note that a 2 percent late charge will be applied to balances unpaid after April 2."}],"qs":[{"q":"What is indicated about Ostrander Legal Partners?","opts":["It hosted an event for 60 guests.","It paid the invoice in advance.","It has used Greenway Catering before.","It requested a vegetarian menu."],"answer":2,"exp":"ใบแจ้งหนี้ระบุว่า 'As a returning customer' ค่าส่งจึงได้รับการยกเว้น แสดงว่าเคยใช้บริการมาก่อน ตัวเลือก A ผิดเพราะ beverage service ระบุ 40 คน"},{"q":"Why is no charge listed for delivery and setup?","opts":["The fee was waived for a regular client.","The client picked up the order.","The service was included in the beverage price.","The delivery was made late."],"answer":0,"exp":"ข้อความระบุชัดว่า 'your delivery and setup fee has been waived' เพราะเป็นลูกค้าเก่า คำว่า waived แปลว่ายกเว้น ตัวเลือก C ผิดเพราะไม่ได้บอกว่ารวมอยู่ในค่าเครื่องดื่ม"}]},{"passages":[{"kind":"e-mail","head":"To: All Staff <staff@kellanpharma.com>\nFrom: Rafael Ortega <rortega@kellanpharma.com>\nDate: October 14\nSubject: New expense reporting system","t":"Dear colleagues,\n\nStarting November 1, all travel and business expenses must be submitted through ClearSpend, our new online reporting system. — [1] — The current paper forms will no longer be accepted after October 31.\n\nClearSpend allows you to photograph receipts with your phone and attach them directly to a report. — [2] — Managers will be notified automatically when a report is ready for approval, which should reduce processing time from about two weeks to five business days.\n\nTo help everyone get started, the finance department will hold 30-minute training sessions in Room 4C on October 22 and October 24. — [3] — Please register for one session through the company intranet by October 20.\n\nIf you have questions in the meantime, contact me at extension 3352. — [4] —\n\nBest regards,\nRafael Ortega\nFinance Department"}],"qs":[{"q":"What is the main purpose of the e-mail?","opts":["To remind employees to submit overdue receipts","To announce a change in a company procedure","To explain a new travel policy","To introduce a new finance manager"],"answer":1,"exp":"อีเมลแจ้งว่าจะเปลี่ยนจากแบบฟอร์มกระดาษมาใช้ระบบออนไลน์ ClearSpend จึงเป็นการแจ้งการเปลี่ยนขั้นตอน (procedure) ตัวเลือก C เป็นกับดักเพราะพูดถึง travel expenses แต่ไม่ได้เปลี่ยนนโยบายการเดินทาง"},{"q":"According to the e-mail, what is one benefit of ClearSpend?","opts":["It reduces the cost of business travel.","It allows staff to book hotels online.","It eliminates the need for manager approval.","It shortens the time needed to process reports."],"answer":3,"exp":"อีเมลระบุว่าระยะเวลาดำเนินการจะลดลงจากประมาณสองสัปดาห์เหลือห้าวันทำการ ตัวเลือก C ผิดเพราะผู้จัดการยังต้องอนุมัติ เพียงแต่จะได้รับการแจ้งเตือนอัตโนมัติ"},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Each session will include a brief demonstration followed by time for questions.\"","opts":["[3]","[1]","[2]","[4]"],"answer":0,"exp":"ประโยคนี้อธิบายรายละเอียดของ training sessions จึงควรอยู่ตำแหน่ง [3] ต่อจากประโยคที่กล่าวถึงการจัดอบรม 30 นาที คำว่า Each session อ้างถึง sessions ในประโยคก่อนหน้า"}]},{"passages":[{"kind":"memo","head":"MEMO\nTo: Warehouse Supervisors\nFrom: Aiko Tanabe, Operations Director\nDate: May 5\nRe: Inventory count","t":"Our annual inventory count will take place on Saturday, May 17, beginning at 7:00 A.M. As in previous years, the warehouse will be closed to outgoing shipments that day, so please make sure all orders scheduled for May 17 are dispatched by the end of the day on Friday, May 16.\n\nThis year, we will be using handheld barcode scanners instead of printed count sheets. The scanners will be delivered on May 12, and I would like each supervisor to practice with them before the count. Mr. Hollis from our IT team will be available on May 13 and 14 to answer questions.\n\nEmployees who work on May 17 will receive overtime pay and a catered lunch. Please submit a list of participating staff from your section to me by May 9."}],"qs":[{"q":"What will happen on May 17?","opts":["Barcode scanners will be delivered.","A new supervisor will start work.","Products in the warehouse will be counted.","Mr. Hollis will lead a training session."],"answer":2,"exp":"บันทึกระบุว่าการตรวจนับสินค้าประจำปี (annual inventory count) จะจัดวันที่ 17 พฤษภาคม ตัวเลือก A ผิดเพราะเครื่องสแกนจะส่งมาวันที่ 12 พฤษภาคม"},{"q":"What are supervisors asked to do by May 9?","opts":["Provide the names of employees who will work","Order lunch for their staff","Return the printed count sheets","Contact the IT department"],"answer":0,"exp":"ข้อความสุดท้ายขอให้ส่งรายชื่อพนักงานที่จะเข้าร่วม (list of participating staff) ภายใน 9 พฤษภาคม ตัวเลือก B เป็นกับดักเพราะกล่าวถึง catered lunch แต่บริษัทเป็นผู้จัดให้"},{"q":"What is suggested about the inventory count this year?","opts":["It will take place on a weekday.","It will be shorter than in previous years.","It will require extra warehouse staff to be hired.","It will use a different method than before."],"answer":3,"exp":"ปีนี้จะใช้ handheld barcode scanners แทน printed count sheets แสดงว่าวิธีการต่างจากเดิม ตัวเลือก A ผิดเพราะ May 17 เป็นวันเสาร์"}]},{"passages":[{"kind":"web page","head":"www.harborviewcoworking.com/membership","t":"Harborview Coworking — Membership Options\n\nLocated two blocks from Central Station, Harborview offers flexible workspace for freelancers, start-ups, and remote teams. All members enjoy high-speed Internet, free coffee and tea, and access to our rooftop lounge.\n\nOur Flex membership ($180 per month) gives you access to any open desk from 8 A.M. to 6 P.M. on weekdays. The Dedicated Desk membership ($320 per month) reserves a personal desk for you with a lockable drawer and 24-hour access. Private offices for teams of two to six are also available; rates vary by size.\n\nMembers on all plans may book our meeting rooms at a discounted hourly rate. Not sure which option is right for you? Schedule a tour and enjoy a complimentary day pass."}],"qs":[{"q":"For whom is the web page most likely intended?","opts":["Train passengers looking for parking","People looking for a place to work","Building owners seeking tenants","Job seekers applying for positions"],"answer":1,"exp":"หน้าเว็บอธิบายประเภทสมาชิกของพื้นที่ coworking สำหรับ freelancers, start-ups และ remote teams จึงมุ่งเป้าไปยังคนที่หาที่ทำงาน ตัวเลือก A เป็นกับดักเพราะกล่าวถึง Central Station เพื่อบอกทำเลเท่านั้น"},{"q":"What is available only to Dedicated Desk members?","opts":["Free beverages","Discounted meeting rooms","Round-the-clock access","Use of the rooftop lounge"],"answer":2,"exp":"Dedicated Desk ได้รับสิทธิ์เข้าใช้ 24 ชั่วโมง (24-hour access = round-the-clock) ส่วน Flex ใช้ได้เฉพาะ 8 A.M.-6 P.M. ตัวเลือก B ผิดเพราะสมาชิกทุกแผนได้ส่วนลดห้องประชุม"},{"q":"In paragraph 3, line 2, the word \"complimentary\" is closest in meaning to","opts":["free","polite","admiring","matching"],"answer":0,"exp":"ในบริบทนี้ complimentary day pass หมายถึงบัตรเข้าใช้หนึ่งวันแบบไม่เสียค่าใช้จ่าย จึงตรงกับ free ตัวเลือก B และ C เป็นกับดักเพราะเป็นความหมายของ compliment (คำชม) ส่วน matching เป็นความหมายของ complementary ที่สะกดคล้ายกัน"}]},{"passages":[{"kind":"online chat","head":"","t":"Grace Liu (9:58 A.M.): Morning, everyone. The printer just told me the brochures for the Denver trade show won't be ready until Thursday afternoon.\n\nOmar Haddad (10:00 A.M.): Thursday? Our booth opens Friday at 9:00. We were planning to ship everything on Wednesday.\n\nGrace Liu (10:01 A.M.): I know. Apparently their main press broke down. They offered to rush the job for an extra $150, but even then, the earliest is Wednesday evening.\n\nSophie Brandt (10:03 A.M.): What if we skip shipping the brochures? I'm flying to Denver Thursday night. I could pick them up and carry them with me.\n\nOmar Haddad (10:04 A.M.): That's 500 brochures, Sophie. They'd fill two large boxes.\n\nSophie Brandt (10:05 A.M.): I've packed heavier.\n\nGrace Liu (10:07 A.M.): All right. Then we don't need the rush fee. I'll tell the printer Thursday afternoon is fine and ask them to pack the brochures in smaller boxes.\n\nOmar Haddad (10:08 A.M.): Good idea. I'll still ship the banners and display stands on Wednesday as planned.\n\nSophie Brandt (10:09 A.M.): Perfect. Grace, please send me the printer's address."}],"qs":[{"q":"What problem are the writers discussing?","opts":["A trade show has been postponed.","A shipment was sent to the wrong address.","A flight to Denver has been canceled.","Some printed materials will be delayed."],"answer":3,"exp":"Ms. Liu แจ้งว่าโรงพิมพ์จะพิมพ์ brochures เสร็จช้ากว่ากำหนด (ไม่ทันส่งวันพุธ) จึงเป็นปัญหาเรื่องเอกสารสิ่งพิมพ์ล่าช้า ตัวเลือก A ผิดเพราะงานแสดงสินค้ายังเปิดวันศุกร์ตามเดิม"},{"q":"At 10:05 A.M., what does Ms. Brandt most likely mean when she writes, \"I've packed heavier\"?","opts":["She thinks the brochures should be shipped instead.","She is confident she can transport the boxes.","She has already packed her luggage.","She wants to reduce the number of brochures."],"answer":1,"exp":"Mr. Haddad กังวลว่า brochures 500 ชุดจะเต็มสองกล่องใหญ่ Ms. Brandt ตอบว่าเคยขนของหนักกว่านี้ หมายความว่าเธอมั่นใจว่าขนไปเองได้ ตัวเลือก C เป็นกับดักเพราะใช้คำว่า packed แต่ไม่ใช่ความหมายที่สื่อ"},{"q":"What will Ms. Liu most likely do next?","opts":["Pay an extra fee to the printer","Book a flight to Denver","Contact the printer about the order","Ship the display stands"],"answer":2,"exp":"เวลา 10:07 Ms. Liu บอกว่าจะแจ้งโรงพิมพ์ว่าบ่ายวันพฤหัสบดีได้ และขอให้แพ็กในกล่องเล็ก ตัวเลือก A ผิดเพราะเธอบอกว่าไม่ต้องจ่าย rush fee แล้ว"},{"q":"What is indicated about the banners?","opts":["They will be sent as originally scheduled.","They will be carried by Ms. Brandt.","They were damaged at the printer.","They will arrive after the booth opens."],"answer":0,"exp":"Mr. Haddad บอกว่าจะส่ง banners และ display stands ในวันพุธตามแผนเดิม (as planned = as originally scheduled) ตัวเลือก B ผิดเพราะ Ms. Brandt จะขนเฉพาะ brochures"}]},{"passages":[{"kind":"article","head":"Local Bakery Rises to New Heights\nBy Natalie Okafor, Riverton Business Journal","t":"RIVERTON (April 8) — When Lucia Ferraro opened Ferraro's Bakery on Elm Street eight years ago, she baked everything herself in a kitchen the size of a closet. — [1] — Today, the business employs 35 people and supplies bread to more than 60 restaurants and grocery stores in the region.\n\nLast month, Ferraro's moved its production to a former furniture factory on the east side of town. The new facility is five times larger than the original kitchen and features energy-efficient ovens that allow the bakery to double its output. — [2] — The original Elm Street shop will remain open as a café and retail store.\n\nMs. Ferraro credits much of her success to her commitment to local ingredients. \"We buy our flour from a mill just 40 miles away, and most of our fruit comes from nearby farms,\" she said. — [3] — Customers have noticed the difference, and demand has grown steadily every year.\n\nThe bakery plans to hire 15 additional employees by the end of the summer, mainly for its delivery and packaging teams. — [4] — Interested applicants can find job listings on the company's Web site."}],"qs":[{"q":"What is the article mainly about?","opts":["The opening of a new restaurant","The history of a furniture factory","The growth of a local business","Changes to the local food supply"],"answer":2,"exp":"บทความเล่าการเติบโตของ Ferraro's Bakery จากครัวเล็ก ๆ จนมีพนักงาน 35 คนและย้ายไปโรงงานใหม่ ตัวเลือก B ผิดเพราะโรงงานเฟอร์นิเจอร์เป็นเพียงสถานที่ตั้งใหม่"},{"q":"What is stated about the Elm Street location?","opts":["It will be converted into a factory.","It is being renovated.","It will close at the end of the summer.","It will continue to serve customers."],"answer":3,"exp":"บทความระบุว่าร้านเดิมบน Elm Street ยังเปิดต่อในฐานะคาเฟ่และร้านค้าปลีก ตัวเลือก A เป็นกับดักเพราะสลับข้อมูลกับสถานที่ใหม่ที่เคยเป็นโรงงาน"},{"q":"In paragraph 2, line 2, the word \"features\" is closest in meaning to","opts":["describes","includes","advertises","resembles"],"answer":1,"exp":"ในประโยค The new facility ... features energy-efficient ovens คำว่า features เป็นกริยาแปลว่ามีหรือประกอบด้วย จึงตรงกับ includes ตัวเลือก C เป็นกับดักเพราะ feature ใช้ในความหมายนำเสนอในสื่อได้ แต่ไม่เข้ากับบริบทนี้"},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Working with these suppliers also helps reduce transportation costs.\"","opts":["[3]","[1]","[2]","[4]"],"answer":0,"exp":"ประโยคนี้ใช้ these suppliers ซึ่งอ้างถึงโรงโม่แป้งและฟาร์มใกล้เคียงที่ Ms. Ferraro กล่าวถึง จึงควรอยู่ตำแหน่ง [3] ต่อจากคำพูดของเธอ ตำแหน่งอื่นไม่มีคำนามที่ these suppliers อ้างถึงได้"}]},{"passages":[{"kind":"letter","head":"Westbrook Public Library\n220 Carver Avenue\nWestbrook, NJ 07012\n\nSeptember 2\n\nMr. Daniel Pruitt\nPruitt Accounting Services\n41 Lyle Road\nWestbrook, NJ 07014","t":"Dear Mr. Pruitt,\n\nOn behalf of the Westbrook Public Library, I would like to thank you for your generous donation of $2,500 to our Community Learning Program. Your contribution will allow us to offer free financial planning workshops for local residents throughout the autumn.\n\nThe first workshop, \"Budgeting Basics for Families,\" will be held on Tuesday, October 7, at 6:30 P.M. in our Lindgren Meeting Room. We have already received more than 50 registrations, so we are considering adding a second session later in the month.\n\nSeveral of our patrons have asked whether a professional accountant might be willing to lead one of the sessions. Given your experience, we would be delighted if you would consider presenting a workshop on preparing personal tax returns in November. Our program coordinator, Ms. Ines Calloway, will call you next week to discuss this possibility.\n\nAs a token of our appreciation, your company's name will be listed on our donor wall in the main lobby.\n\nSincerely,\n\nWalter Simms\nLibrary Director"}],"qs":[{"q":"Why did Mr. Simms write the letter?","opts":["To invite Mr. Pruitt to join the library board","To request payment for a workshop","To announce the opening of a meeting room","To express gratitude for a gift"],"answer":3,"exp":"ย่อหน้าแรกระบุว่าเขียนเพื่อขอบคุณสำหรับเงินบริจาค $2,500 (express gratitude for a gift) ตัวเลือก A ผิดเพราะจดหมายเชิญให้สอนเวิร์กช็อป ไม่ใช่เข้าร่วม library board"},{"q":"What is suggested about the first workshop?","opts":["It has attracted a lot of interest.","It will be led by Ms. Calloway.","It has been moved to a larger room.","It is intended for accountants."],"answer":0,"exp":"จดหมายระบุว่ามีผู้ลงทะเบียนแล้วกว่า 50 คนและกำลังพิจารณาเพิ่มรอบที่สอง แสดงว่ามีผู้สนใจมาก ตัวเลือก C ผิดเพราะไม่ได้กล่าวถึงการย้ายห้อง"},{"q":"What is Mr. Pruitt asked to consider?","opts":["Donating additional funds","Hiring library patrons","Teaching a class on a financial topic","Attending a workshop in October"],"answer":2,"exp":"ห้องสมุดเชิญให้ Mr. Pruitt พิจารณาสอนเวิร์กช็อปเรื่องการเตรียมแบบแสดงรายการภาษีส่วนบุคคลในเดือนพฤศจิกายน ตัวเลือก D เป็นกับดักเพราะกล่าวถึงเวิร์กช็อปเดือนตุลาคมซึ่งเป็นงานแรก ไม่ใช่สิ่งที่เขาถูกขอให้ทำ"},{"q":"According to the letter, what will happen next week?","opts":["Mr. Pruitt's name will be added to a donor wall.","Mr. Pruitt will receive a phone call.","A second workshop will be scheduled.","Registration for the workshops will close."],"answer":1,"exp":"จดหมายระบุว่า Ms. Calloway จะโทรหา Mr. Pruitt สัปดาห์หน้าเพื่อหารือ ตัวเลือก A ผิดเพราะไม่ได้ระบุว่าจะติดชื่อบน donor wall เมื่อใด และเป็นชื่อบริษัท ไม่ใช่ชื่อเขา"}]},{"passages":[{"kind":"web page","head":"www.harbourviewcentre.com/rooms\nHarbourview Conference Centre — Meeting Spaces","t":"Located on the waterfront just ten minutes from the city centre, Harbourview Conference Centre offers flexible spaces for meetings, workshops, and corporate celebrations.\n\nCaptain's Suite — seats up to 15 — $350 per day\nSeaside Room — seats up to 40 — $600 per day\nLighthouse Hall — seats up to 120 — $1,500 per day\n\nAll room rates include high-speed Wi-Fi, a ceiling-mounted projector, and a sound system at no additional charge. Catering is provided by our in-house partner, Bluefin Kitchen; menus can be viewed on the Dining page.\n\nClients who confirm a reservation at least 60 days before their event receive 10 percent off the room rate. Complimentary parking is available in our underground garage for events held Monday through Thursday. On Fridays and weekends, guests may park in the garage for a flat fee of $12 per vehicle."},{"kind":"e-mail","head":"To: bookings@harbourviewcentre.com\nFrom: Priya Natarajan <pnatarajan@orlandpharma.com>\nDate: January 5\nSubject: Room reservation for March 14","t":"Dear Harbourview Bookings Team,\n\nI am the events coordinator at Orland Pharmaceuticals, and I would like to reserve a room for a one-day sales training workshop on Friday, March 14. We expect 35 participants. Since our budget is limited this quarter, I am looking for the most economical room that can comfortably hold our group.\n\nI have two questions. First, several participants will be driving from our regional offices, so could you tell me what parking arrangements are available? Second, does Bluefin Kitchen offer vegetarian lunch options? About a third of our group has requested them.\n\nI would be happy to confirm the booking today if the room is available.\n\nBest regards,\nPriya Natarajan"}],"qs":[{"q":"What is indicated about Harbourview Conference Centre?","opts":["It is located in the city centre.","It provides presentation equipment at no extra cost.","It prepares all of its meals in its own kitchen.","It is closed on weekends."],"answer":1,"exp":"เว็บไซต์ระบุว่า All room rates include ... a ceiling-mounted projector ... at no additional charge จึงตอบ B ส่วน A ผิดเพราะศูนย์อยู่ห่างจากใจกลางเมืองสิบนาที (ten minutes from the city centre) ไม่ได้อยู่ในใจกลางเมือง"},{"q":"Why did Ms. Natarajan write the e-mail?","opts":["To complain about a previous event","To cancel an existing reservation","To request a refund for a deposit","To arrange a booking and ask for information"],"answer":3,"exp":"คุณ Natarajan เขียนว่า I would like to reserve a room และมี two questions เรื่องที่จอดรถและอาหารมังสวิรัติ จึงเป็นการจองและสอบถามข้อมูล ตัวเลือกอื่นไม่ได้กล่าวถึงในอีเมล"},{"q":"Which room will Ms. Natarajan most likely reserve?","opts":["The Seaside Room","The Captain's Suite","Lighthouse Hall","The Dining Room"],"answer":0,"exp":"คำถามเชื่อมสองบทความ: อีเมลบอกว่ามีผู้เข้าร่วม 35 คนและต้องการห้องที่ประหยัดที่สุด (most economical) ส่วนเว็บไซต์ระบุว่า Seaside Room จุได้ 40 คนในราคา $600 ขณะที่ Captain's Suite จุได้แค่ 15 คน และ Lighthouse Hall แพงเกินจำเป็น"},{"q":"What will Ms. Natarajan's participants who drive most likely have to do?","opts":["Park on a nearby street","Arrive before 8:00 A.M.","Pay a fee to use the garage","Show a parking permit from Orland Pharmaceuticals"],"answer":2,"exp":"อีเมลระบุว่างานจัดวันศุกร์ (Friday, March 14) และเว็บไซต์บอกว่าจอดฟรีเฉพาะวันจันทร์ถึงพฤหัสบดี ส่วนวันศุกร์ต้องจ่าย flat fee of $12 per vehicle จึงตอบ C ต้องอ่านทั้งสองบทความ"},{"q":"What is suggested about Ms. Natarajan's booking?","opts":["It must be confirmed by telephone.","It is eligible for a reduced rate.","It includes lunch for all participants.","It requires a deposit of 10 percent."],"answer":1,"exp":"อีเมลส่งวันที่ 5 มกราคม และพร้อมยืนยันวันนั้น ซึ่งห่างจากงานวันที่ 14 มีนาคมเกิน 60 วัน เว็บไซต์ระบุว่าจองล่วงหน้าอย่างน้อย 60 วันได้ส่วนลด 10 percent (reduced rate = ราคาลดลง) ตัวเลือก D เป็นกับดักที่ใช้ตัวเลข 10 percent ซ้ำ"}]},{"passages":[{"kind":"memo","head":"MEMO\nTo: All Kessler Logistics Staff\nFrom: Finance Department\nDate: April 10\nSubject: New expense reimbursement process","t":"Beginning May 1, all expense reports must be submitted through our new online system, ExpensePro. Paper forms will no longer be accepted after that date.\n\nPlease note the following guidelines. Digital copies of receipts must be uploaded within 30 days of the purchase date. Meal expenses will be reimbursed up to $45 per day for domestic travel and $65 per day for international travel. Any claim totaling more than $500 must be approved by the employee's department head before it can be processed.\n\nTo help staff become familiar with ExpensePro, the Finance Department will hold training sessions on April 22 and April 24 at 2:00 P.M. in Room 3B. If you have questions, please contact Daniel Osei at extension 4127."},{"kind":"e-mail","head":"To: Daniel Osei <dosei@kesslerlogistics.com>\nFrom: Mei-Ling Cho <mcho@kesslerlogistics.com>\nDate: May 9\nSubject: ExpensePro question","t":"Hello Daniel,\n\nI have just returned from a client visit in Seoul, where I stayed from April 20 to May 5. I am now trying to file my first claim in ExpensePro, which comes to $720 in total, including my hotel and meals of $60 per day.\n\nUnfortunately, I was not in the office for either of the training sessions, and I am having some trouble with the upload function. Is there a recording of the session or a user guide that I could refer to?\n\nAlso, my manager, Tomás Reyes, is on leave until May 20. Could you let me know whether someone else is authorized to sign off on my claim in his absence?\n\nThank you,\nMei-Ling"}],"qs":[{"q":"What is the main purpose of the memo?","opts":["To introduce a new member of the Finance Department","To remind staff about an upcoming audit","To announce a change in a company procedure","To request feedback on a software program"],"answer":2,"exp":"บันทึกแจ้งว่าตั้งแต่ May 1 ต้องส่งรายงานค่าใช้จ่ายผ่านระบบออนไลน์ ExpensePro แทนแบบฟอร์มกระดาษ จึงเป็นการประกาศเปลี่ยนขั้นตอน (procedure) แม้จะมีการพูดถึงซอฟต์แวร์ แต่ไม่ได้ขอความคิดเห็น (feedback) ข้อ D จึงผิด"},{"q":"According to the memo, what must employees do within 30 days?","opts":["Submit proof of their purchases","Complete an online training course","Obtain a corporate credit card","Return unused travel funds"],"answer":0,"exp":"บันทึกระบุว่า Digital copies of receipts must be uploaded within 30 days of the purchase date ซึ่ง receipts ถูกถอดความเป็น proof of their purchases ข้อ B เป็นกับดักเพราะการอบรมไม่ได้กำหนดเวลา 30 วัน"},{"q":"Why most likely was Ms. Cho unable to attend a training session?","opts":["She was on leave for personal reasons.","She was not informed about the sessions.","She had a meeting with Mr. Reyes.","She was traveling overseas for work."],"answer":3,"exp":"ต้องเชื่อมข้อมูล: บันทึกระบุวันอบรม April 22 และ 24 ส่วนอีเมลบอกว่าคุณ Cho อยู่ที่ Seoul ช่วง April 20 ถึง May 5 เพื่อพบลูกค้า จึงไม่ได้เข้าอบรมเพราะเดินทางไปทำงานต่างประเทศ ข้อ A ผิดเพราะคนที่ลางานคือ Mr. Reyes"},{"q":"What is suggested about Ms. Cho's meal expenses?","opts":["They exceed the daily limit for domestic travel only.","They fall within the allowed amount.","They were paid for by a client.","They must be submitted on a paper form."],"answer":1,"exp":"อีเมลระบุค่าอาหาร $60 ต่อวันในการเดินทางไป Seoul (ต่างประเทศ) และบันทึกกำหนดเพดาน $65 ต่อวันสำหรับ international travel จึงอยู่ในวงเงินที่อนุญาต ข้อ A เป็นกับดักเพราะแม้จะเกิน $45 ของในประเทศ แต่ไม่เกี่ยวกับการเดินทางครั้งนี้"},{"q":"Why does Ms. Cho ask about someone else signing off on her claim?","opts":["Her claim requires a department head's approval.","Her receipts were uploaded after the deadline.","Mr. Osei is not familiar with ExpensePro.","Her trip was longer than originally planned."],"answer":0,"exp":"ยอดเบิกของเธอคือ $720 ซึ่งเกิน $500 ตามบันทึกจึงต้องให้ department head อนุมัติ แต่หัวหน้าของเธอลาถึง May 20 จึงต้องถามหาผู้อนุมัติแทน (sign off = อนุมัติ) เป็นคำถามเชื่อมสองบทความ"}]},{"passages":[{"kind":"web page","head":"Golden Crust Bakeries — Careers\nPosition: Production Shift Supervisor (Kirkstall Plant, Leeds)","t":"Golden Crust Bakeries, a leading supplier of fresh bread to supermarkets across northern England, is seeking a Production Shift Supervisor to lead a team of 20 bakery operatives.\n\nResponsibilities include scheduling staff, monitoring product quality, and ensuring compliance with hygiene regulations.\n\nRequirements:\n- At least three years of supervisory experience in a food manufacturing environment\n- Level 3 Food Safety certification\n- Availability for early shifts beginning at 4:00 A.M.\n- Strong communication and problem-solving skills\n\nTo apply, send a CV and cover letter to recruitment@goldencrust.co.uk by 15 June. Interviews will be held during the week of 23 June."},{"kind":"e-mail","head":"To: recruitment@goldencrust.co.uk\nFrom: Aaron Whitfield <a.whitfield@mailbox.co.uk>\nDate: 9 June\nSubject: Application — Production Shift Supervisor","t":"Dear Hiring Manager,\n\nI am writing to apply for the Production Shift Supervisor position advertised on your Web site. For the past five years, I have supervised a team of 15 employees on the packaging line at Pennine Dairy Products in Bradford, where I introduced a new rota system that reduced overtime costs by 18 percent.\n\nI currently hold a Level 2 Food Hygiene certificate, and I am enrolled in a Level 3 Food Safety course, which I will complete on 30 June. I am used to starting work early and would have no difficulty with the shift times described.\n\nMy CV is attached. Thank you for your consideration.\n\nYours faithfully,\nAaron Whitfield"},{"kind":"e-mail","head":"To: Aaron Whitfield <a.whitfield@mailbox.co.uk>\nFrom: Fiona Blake <f.blake@goldencrust.co.uk>\nDate: 17 June\nSubject: Interview invitation","t":"Dear Mr. Whitfield,\n\nThank you for your application. We would like to invite you for an interview on Wednesday, 25 June, at 10:00 A.M. at our Kirkstall plant. You will meet with Gareth Lowe, our Production Manager, and the interview will be followed by a short tour of the production floor.\n\nWe noted the course you are currently taking. Should you be offered the position, we would ask you to forward a copy of your certificate as soon as you receive it.\n\nPlease reply to confirm your attendance.\n\nKind regards,\nFiona Blake\nHuman Resources"}],"qs":[{"q":"What is NOT mentioned as a requirement for the position?","opts":["Experience supervising workers","A qualification in food safety","Willingness to work early in the morning","A university degree in food science"],"answer":3,"exp":"ประกาศรับสมัครระบุประสบการณ์ควบคุมงาน, Level 3 Food Safety certification และการทำงานกะเช้าตี 4 แต่ไม่ได้กล่าวถึงปริญญาด้านวิทยาศาสตร์การอาหาร จึงตอบ D (คำถาม NOT ต้องหาสิ่งที่ไม่มีในบทความ)"},{"q":"What does Mr. Whitfield mention about his current job?","opts":["He manages deliveries to supermarkets.","He oversees staff at a dairy company.","He works only on weekend shifts.","He recently received a promotion."],"answer":1,"exp":"คุณ Whitfield เขียนว่า I have supervised a team of 15 employees ... at Pennine Dairy Products ซึ่งถอดความเป็น oversees staff at a dairy company ข้อ A เป็นกับดักเพราะการส่งขนมปังให้ซูเปอร์มาร์เก็ตเป็นธุรกิจของ Golden Crust"},{"q":"Which job requirement does Mr. Whitfield not yet fully meet?","opts":["The number of years of supervisory experience","The ability to work early shifts","The level of certification","The application deadline"],"answer":2,"exp":"ประกาศต้องการ Level 3 Food Safety certification แต่ในอีเมลคุณ Whitfield มีเพียง Level 2 และจะเรียน Level 3 จบวันที่ 30 June จึงยังไม่ครบในเรื่องระดับใบรับรอง ส่วนประสบการณ์ห้าปีเกินสามปีที่กำหนด และเขาส่งใบสมัครวันที่ 9 June ก่อนกำหนด 15 June"},{"q":"What is suggested about Mr. Whitfield's interview?","opts":["It is scheduled during the period stated in the job posting.","It will be conducted by telephone.","It has been moved to a different plant.","It will take place after he completes his course."],"answer":0,"exp":"อีเมลฉบับที่สามนัดสัมภาษณ์วันที่ 25 June ซึ่งอยู่ในสัปดาห์ของ 23 June ตามที่ประกาศรับสมัครระบุไว้ ข้อ D ผิดเพราะคอร์สจบวันที่ 30 June ซึ่งหลังวันสัมภาษณ์"},{"q":"What does Ms. Blake ask Mr. Whitfield to do?","opts":["Bring his CV to the interview","Contact Mr. Lowe directly","Send a document at a later date","Complete a safety test during the tour"],"answer":2,"exp":"คุณ Blake ขอให้ forward a copy of your certificate as soon as you receive it คือส่งเอกสารในภายหลัง ข้อ A ผิดเพราะเขาแนบ CV มากับใบสมัครแล้ว และไม่มีการขอให้นำมาอีก"}]},{"passages":[{"kind":"invoice","head":"ErgoNest Office Furnishings\nINVOICE — Order No. A-58213\nCustomer: Lakeside Design Studio, attn. Hana Kowalski\nDelivery date: September 3","t":"ErgoNest Pro Task Chair (black) — Qty 4 — $289.00 each — $1,156.00\nSlimLine Monitor Arm — Qty 2 — $75.00 each — $150.00\nSubtotal: $1,306.00\nShipping: $0.00 (free on all orders over $1,000)\nTotal paid: $1,306.00\n\nReturn policy: Items in their original packaging may be returned within 30 days of delivery for a full refund. Items returned between 31 and 60 days after delivery are eligible for store credit only."},{"kind":"e-mail","head":"To: support@ergonest.com\nFrom: Hana Kowalski <hana@lakesidedesign.com>\nDate: September 18\nSubject: Order A-58213","t":"Hello,\n\nWe received our order on schedule, and the staff are very happy with the new chairs. However, I have run into a problem with the SlimLine Monitor Arms. The clamp only opens wide enough for desks up to 5 centimetres thick, and our desks are 6 centimetres thick, so neither arm can be installed.\n\nI would like to return both arms. I still have the original boxes. Could you also recommend a similar model that would fit our desks? We would prefer to keep buying from ErgoNest if possible.\n\nRegards,\nHana Kowalski\nOffice Manager, Lakeside Design Studio"},{"kind":"e-mail","head":"To: Hana Kowalski <hana@lakesidedesign.com>\nFrom: Luis Ortega <l.ortega@ergonest.com>\nDate: September 19\nSubject: RE: Order A-58213","t":"Dear Ms. Kowalski,\n\nI am sorry for the inconvenience. The SlimLine clamp measurements are listed on our Web site, but I understand they are easy to overlook. A good alternative would be the FlexMount XL, which is priced at $92.00 and fits desks up to 8 centimetres thick.\n\nIf you would like to exchange your two SlimLine arms for two FlexMount XL arms, we will waive the price difference as a thank-you for being a returning customer. Either way, I will e-mail you a prepaid return label today so that you can send the SlimLine arms back at no cost.\n\nSincerely,\nLuis Ortega\nCustomer Care, ErgoNest"}],"qs":[{"q":"What is indicated on the invoice?","opts":["The order qualified for free shipping.","The chairs were delivered in two shipments.","Lakeside Design Studio paid with store credit.","The monitor arms were on sale."],"answer":0,"exp":"ใบแจ้งหนี้ระบุ Shipping: $0.00 (free on all orders over $1,000) และยอดสั่งซื้อคือ $1,306 จึงได้ส่งฟรี ข้อ C เป็นกับดักที่ใช้คำว่า store credit จากนโยบายคืนสินค้า"},{"q":"Why did Ms. Kowalski send the e-mail?","opts":["To complain about a late delivery","To order additional chairs","To report that a product does not fit her furniture","To ask about the color options for a chair"],"answer":2,"exp":"คุณ Kowalski แจ้งว่าตัวหนีบ (clamp) ของ monitor arm เปิดได้แค่ 5 ซม. แต่โต๊ะหนา 6 ซม. จึงติดตั้งไม่ได้ ข้อ A ผิดเพราะเธอบอกว่า received our order on schedule"},{"q":"What is true about Ms. Kowalski's return request?","opts":["It was sent after the deadline for store credit.","It was made within the period for a full refund.","It includes one of the chairs.","It was rejected by Mr. Ortega."],"answer":1,"exp":"ต้องเชื่อมข้อมูล: สินค้าส่งถึงวันที่ 3 September และเธอส่งอีเมลวันที่ 18 September ซึ่งอยู่ภายใน 30 วัน ตามนโยบายในใบแจ้งหนี้จึงได้รับเงินคืนเต็มจำนวน และเธอยังเก็บกล่องเดิมไว้ ข้อ C ผิดเพราะเธอพอใจกับเก้าอี้"},{"q":"What does Mr. Ortega offer to do?","opts":["Send a technician to install the arms","Provide a discount on future orders","Refund the cost of the chairs","Cover the cost difference for replacement items"],"answer":3,"exp":"คุณ Ortega เขียนว่า we will waive the price difference หากเปลี่ยนเป็น FlexMount XL คือยกเว้นส่วนต่างราคาให้ (waive = ยกเว้น) ข้อ B ผิดเพราะไม่ได้เสนอส่วนลดสำหรับการสั่งซื้อครั้งต่อไป"},{"q":"What is suggested about the FlexMount XL?","opts":["It costs more than the monitor arms Ms. Kowalski purchased.","It is designed for desks thinner than 5 centimetres.","It is currently out of stock.","It was included in Ms. Kowalski's original order."],"answer":0,"exp":"อีเมลฉบับที่สามระบุว่า FlexMount XL ราคา $92 ขณะที่ใบแจ้งหนี้แสดงว่า SlimLine ราคา $75 ต่อชิ้น จึงแพงกว่าและเป็นเหตุให้มีส่วนต่างราคา ข้อ B ผิดเพราะรุ่นนี้รองรับโต๊ะหนาถึง 8 ซม."}]},{"passages":[{"kind":"schedule","head":"Brightwater Public Library\nSmall Business Workshop Series — October","t":"October 7 — Social Media Marketing on a Budget — Rachel Dunn, marketing consultant — Room A\nOctober 14 — Bookkeeping Basics — Victor Alvarez, certified accountant — Room B\nOctober 21 — Securing a Business Loan — Sunita Rao, loan officer, First Harbor Bank — Room A\nOctober 28 — Hiring Your First Employee — Grace Liu, HR specialist — Room C\n\nAll sessions run from 6:30 to 8:00 P.M. and are free of charge. Registration is required, and seating is limited to 30 participants per session. Library card holders may register online at www.brightwaterlibrary.org/events."},{"kind":"e-mail","head":"To: Ellen Marsh <emarsh@brightwaterlibrary.org>\nFrom: Omar Haddad <omar@haddadcafe.com>\nDate: October 2\nSubject: Workshop registration","t":"Dear Ms. Marsh,\n\nI own a small café on Fulton Street and recently registered online for the workshop on business loans, since we are hoping to open a second location next year. My business partner, Leila Saba, would also like to attend, but she does not have a library card and was unable to complete the online form. Is there another way for her to sign up?\n\nAlso, will the presenter's slides be made available? I would like to share them with our financial adviser.\n\nThank you,\nOmar Haddad"},{"kind":"notice","head":"Brightwater Public Library — Schedule Update\nPosted: October 16","t":"Due to a scheduling conflict on the part of the presenter, the October 21 workshop, \"Securing a Business Loan,\" will now take place on Thursday, October 23, at the usual time. Because the number of registrations has exceeded the capacity of Room A, the session will be held in the Community Hall on the ground floor.\n\nRegistrants will receive a copy of the presentation slides by e-mail the day after the session. Those without a library card may register in person at the front desk.\n\nWe apologize for any inconvenience. Questions may be directed to Ellen Marsh, Events Coordinator."}],"qs":[{"q":"What is indicated about the workshops in the schedule?","opts":["They are held in the same room each week.","They are open only to library card holders.","They do not require participants to pay.","They last for two hours."],"answer":2,"exp":"ตารางระบุว่า are free of charge จึงไม่ต้องจ่ายเงิน ข้อ B ผิดเพราะแค่การลงทะเบียนออนไลน์เท่านั้นที่ใช้บัตรห้องสมุด และข้อ D ผิดเพราะแต่ละครั้งใช้เวลาหนึ่งชั่วโมงครึ่ง (6:30-8:00 P.M.)"},{"q":"Who most likely will lead the workshop Mr. Haddad registered for?","opts":["A café owner","A library employee","A certified accountant","A bank employee"],"answer":3,"exp":"อีเมลบอกว่าคุณ Haddad ลงทะเบียน workshop on business loans และตารางระบุว่าหัวข้อ Securing a Business Loan บรรยายโดย Sunita Rao เจ้าหน้าที่สินเชื่อของ First Harbor Bank ข้อ C เป็นกับดักเพราะนักบัญชีบรรยายหัวข้อ Bookkeeping Basics"},{"q":"Why did Mr. Haddad write to Ms. Marsh?","opts":["To suggest a topic for a future workshop","To ask how another person can register","To cancel his registration","To offer to give a presentation"],"answer":1,"exp":"คุณ Haddad ถามว่า Is there another way for her to sign up? เพราะหุ้นส่วนของเขาไม่มีบัตรห้องสมุด จึงเป็นการถามวิธีลงทะเบียนให้อีกคนหนึ่ง (sign up = register)"},{"q":"What is suggested about the workshop Mr. Haddad registered for?","opts":["More than 30 people signed up for it.","It was moved to an earlier date.","Its presenter was replaced.","It will be held in Room A as planned."],"answer":0,"exp":"ตารางกำหนดที่นั่งไม่เกิน 30 คนต่อครั้ง ส่วนประกาศบอกว่าจำนวนผู้ลงทะเบียน exceeded the capacity of Room A จึงอนุมานได้ว่ามีผู้สมัครเกิน 30 คน ข้อ B ผิดเพราะเลื่อนจาก 21 ไป 23 ตุลาคม ซึ่งเป็นวันที่ช้ากว่า"},{"q":"According to the notice, what will happen after the October 23 session?","opts":["A survey will be sent to participants.","The Community Hall will be closed for repairs.","A recording will be posted online.","Presentation materials will be e-mailed to registrants."],"answer":3,"exp":"ประกาศระบุว่า Registrants will receive a copy of the presentation slides by e-mail the day after the session ซึ่งตอบคำถามของคุณ Haddad เรื่องสไลด์ด้วย ข้อ C ผิดเพราะไม่มีการกล่าวถึงการบันทึกวิดีโอ"}]}]},{"p1":[{"scene":"A nurse in scrubs is wrapping a blood pressure cuff around the arm of a seated patient. A clipboard rests on the counter beside them.","svg":"lab","opts":["The patient is lying on a hospital bed.","A nurse is measuring a patient's blood pressure.","A nurse is writing on a clipboard.","The patient is rolling up a sleeve."],"answer":1,"exp":"ภาพแสดงพยาบาลกำลังพันผ้าวัดความดันที่แขนผู้ป่วย จึงตรงกับ B ตัวลวง C ใช้คำว่า clipboard ที่เห็นในภาพ แต่ไม่มีใครกำลังเขียนอยู่ และ A ผิดเพราะผู้ป่วยนั่ง ไม่ได้นอน (lying)"},{"scene":"At a hotel front desk, a receptionist is handing a key card to a guest. A luggage cart loaded with suitcases stands near the entrance.","svg":"office","opts":["A guest is pushing a luggage cart.","Suitcases are being unpacked in a room.","A receptionist is answering the telephone.","A key card is being handed to a guest."],"answer":3,"exp":"ภาพแสดงพนักงานต้อนรับยื่นคีย์การ์ดให้แขก ประโยค passive 'is being handed' จึงถูก ตัวลวง A ผิดเพราะรถเข็นกระเป๋าจอดอยู่เฉยๆ ไม่มีใครเข็น (pushing) ส่วน B พูดถึงการแกะกระเป๋าซึ่งไม่ปรากฏ"},{"scene":"Two factory workers wearing safety goggles are inspecting bottles as they move along a conveyor belt.","svg":"warehouse","opts":["Some workers are examining products on a conveyor belt.","Some workers are putting on their goggles.","Bottles are being loaded onto a truck.","A conveyor belt is being repaired."],"answer":0,"exp":"คนงานสวมแว่นนิรภัยอยู่แล้วและกำลังตรวจขวดบนสายพาน examining = inspecting จึงตรงกับ A ตัวลวง B ใช้ putting on ซึ่งหมายถึงการกำลังสวม (กริยาการกระทำ) ไม่ใช่สภาพที่สวมอยู่แล้ว (wearing)"},{"scene":"Newly published books are arranged in neat piles on a display table in a bookshop. No people are visible.","svg":"library","opts":["A customer is browsing through a book.","Some books are being placed on a shelf.","Books have been stacked on a table.","A table is being moved to the window."],"answer":2,"exp":"ภาพไม่มีคน มีหนังสือวางซ้อนเป็นกองบนโต๊ะ จึงใช้ present perfect passive 'have been stacked' ได้ถูกต้อง ตัวลวง B ใช้ 'are being placed' ซึ่งต้องมีคนกำลังทำอยู่ และ A ผิดเพราะไม่มีลูกค้าในภาพ"},{"scene":"A delivery truck is backed up to a loading dock, and a man is pushing a hand truck stacked with boxes up a ramp into the trailer.","svg":"dock","opts":["A man is moving boxes with a hand truck.","A man is climbing into the driver's seat.","Some boxes have fallen onto the ground.","A truck is driving away from the building."],"answer":0,"exp":"ชายคนนั้นกำลังเข็นรถเข็นมือ (hand truck) ที่มีกล่องขึ้นทางลาด จึงตรงกับ A ตัวลวง D ผิดเพราะรถบรรทุกถอยจอดชิดลานขนถ่าย ไม่ได้ขับออกไป ส่วน C ไม่มีกล่องตกพื้น"},{"scene":"In a training room, an instructor is pointing at a chart projected on a screen while several trainees take notes at long tables.","svg":"meeting","opts":["The trainees are leaving the room.","The instructor is turning off the projector.","The instructor is handing out some notes.","Some people are writing while a presenter speaks."],"answer":3,"exp":"ผู้เข้าอบรมกำลังจดบันทึก (take notes) ขณะที่วิทยากรชี้แผนภูมิ D จึงถูก ตัวลวง C ใช้คำว่า notes ซ้ำแต่ความหมายคือการแจกเอกสาร ซึ่งไม่ได้เกิดในภาพ และ B ผิดเพราะโปรเจกเตอร์ยังเปิดอยู่"}],"p2":[{"q":"How long will the server maintenance take?","opts":["About two hours, according to IT.","Since last Tuesday.","The main server room."],"answer":0,"exp":"How long ถามระยะเวลา A ตอบประมาณสองชั่วโมง ตัวลวง B ใช้ since ซึ่งตอบคำถาม How long have... (อดีตถึงปัจจุบัน) ไม่ใช่อนาคต C ซ้ำคำ server"},{"q":"Has the manuscript been sent to the copy editor yet?","opts":["She edited the last issue.","A copy for each author.","It went out this morning."],"answer":2,"exp":"คำถาม Yes/No ถามว่าส่งต้นฉบับ (manuscript) แล้วหรือยัง C ตอบว่าส่งไปเมื่อเช้า (went out) ตัวลวง B ใช้คำ copy ที่เสียงซ้ำแต่ความหมายต่าง และ A ใช้ edited ล่อจาก editor"},{"q":"The trainees are asking for printed copies of the slides.","opts":["Print it on both sides.","Twelve trainees in total.","I'll e-mail them a PDF instead."],"answer":2,"exp":"ประโยคบอกเล่าแจ้งความต้องการ C ตอบสนองโดยเสนอทางเลือกส่งไฟล์ PDF แทน ตัวลวง A ใช้ print และ sides ที่เสียงคล้าย slides ส่วน B ซ้ำคำ trainees"},{"q":"How often are the forklifts serviced?","opts":["In the service elevator.","Every three months.","Two forklift drivers."],"answer":1,"exp":"How often ถามความถี่ B ตอบทุกสามเดือน จึงถูก A ซ้ำคำว่า service คนละความหมาย C ตอบจำนวนคน (How many)"},{"q":"Which ward is Mr. Gomez being transferred to?","opts":["In about an hour.","He's feeling much better.","The cardiology unit on the fifth floor."],"answer":2,"exp":"Which ward ถามว่าย้ายไปหอผู้ป่วยไหน C ระบุแผนกโรคหัวใจชั้นห้า ตัวลวง A ตอบเวลา (When) B เกี่ยวกับผู้ป่วยแต่ไม่ตอบคำถาม"},{"q":"I think the label printer is jammed again.","opts":["I'll call the technician.","Labels for the shipping boxes.","No, I didn't print it."],"answer":0,"exp":"ประโยคบอกเล่าแจ้งปัญหาเครื่องพิมพ์ฉลากติด A ตอบสนองด้วยการจะโทรเรียกช่าง ตัวลวง B และ C ซ้ำคำ label และ print"},{"q":"The author's book tour has been extended to Canada.","opts":["A tour guide.","Yes, she wrote three books.","Then we'll need more copies printed."],"answer":2,"exp":"ประโยคบอกเล่าแจ้งข่าว C ตอบสนองอย่างสมเหตุสมผลว่าต้องพิมพ์หนังสือเพิ่ม ตัวลวง A ซ้ำคำ tour และ B ซ้ำคำ book"},{"q":"Didn't the courier pick up the package for Osaka?","opts":["It's a large package.","He's coming back at three.","Yes, I'm from Osaka."],"answer":1,"exp":"คำถามปฏิเสธถามว่าพนักงานส่งของมารับพัสดุแล้วไม่ใช่หรือ B ตอบอ้อมว่าเขาจะกลับมาตอนบ่ายสาม (ยังไม่ได้รับ) ตัวลวง A และ C ซ้ำคำ package และ Osaka"},{"q":"Where's the nearest branch that's open on Saturdays?","opts":["On Harper Street, next to the post office.","From nine to noon.","A savings account."],"answer":0,"exp":"Where ถามสถานที่ A บอกที่ตั้งสาขาจึงถูก B ตอบช่วงเวลาซึ่งล่อจากคำว่า open on Saturdays C เกี่ยวกับธนาคารแต่ไม่ตอบคำถาม"},{"q":"What's the password for the guest Wi-Fi?","opts":["It passed the inspection.","It's printed on your key card holder.","In the business center."],"answer":1,"exp":"ถามรหัส Wi-Fi B บอกว่าพิมพ์อยู่บนซองคีย์การ์ด จึงถูก ตัวลวง A ใช้ passed ที่เสียงคล้าย password C ตอบสถานที่ที่อาจล่อให้คิดว่าเกี่ยวกับอินเทอร์เน็ต"},{"q":"When does Dr. Patel see patients on Fridays?","opts":["Only in the mornings, I believe.","Yes, she's a pediatrician.","At the front desk."],"answer":0,"exp":"คำถาม When ถามเวลา A ตอบว่าเฉพาะช่วงเช้า จึงถูก B ตอบ Yes ซึ่งใช้กับคำถาม WH ไม่ได้ ส่วน C ตอบสถานที่ (Where)"},{"q":"Would you prefer a room facing the garden or the street?","opts":["The garden, please.","Yes, it's on the second floor.","Breakfast is included."],"answer":0,"exp":"คำถามแบบเลือก (A or B) ตอบโดยเลือกหนึ่งตัวเลือก A จึงถูก B ตอบ Yes ซึ่งไม่เหมาะกับคำถามแบบเลือก C เกี่ยวกับโรงแรมแต่ไม่ตอบคำถาม"},{"q":"Do you know where the safety goggles are kept?","opts":["Keep it for yourself.","There's a bin by the entrance.","Yes, they're mandatory."],"answer":1,"exp":"คำถามทางอ้อม (Do you know where...) ถามสถานที่ B ตอบว่ามีถังเก็บอยู่ข้างทางเข้า ตัวลวง A ซ้ำคำ keep ส่วน C ตอบ Yes แต่ไม่บอกสถานที่"},{"q":"When will the quarterly loan figures be released?","opts":["Not until the auditors finish.","A low interest rate.","Yes, they were released."],"answer":0,"exp":"When ถามเวลา A ตอบว่าต้องรอผู้ตรวจสอบบัญชีทำงานเสร็จก่อน (not until) ตัวลวง C ตอบ Yes และซ้ำ released B เกี่ยวกับเงินกู้แต่ไม่ตอบคำถาม"},{"q":"Who approved the overtime for the assembly line?","opts":["About six extra hours.","The plant manager did.","On line three."],"answer":1,"exp":"Who ถามบุคคล B ระบุผู้จัดการโรงงาน (plant manager) จึงถูก A ตอบจำนวนชั่วโมงซึ่งเกี่ยวกับ overtime แต่ไม่ตอบคำถาม C ซ้ำคำว่า line เพื่อหลอก"},{"q":"Why don't we hire a freelance designer for the book cover?","opts":["That's a good idea.","It was designed in Berlin.","The hardcover edition."],"answer":0,"exp":"Why don't we... เป็นการเสนอแนะ ไม่ใช่ถามเหตุผล A ตอบรับข้อเสนอจึงถูก B ใช้ designed ล่อจาก designer C ใช้ hardcover ที่เสียงคล้าย cover"},{"q":"Is the conference room booked for the software demo?","opts":["A new version.","Sanjay reserved it yesterday.","Yes, I'll demonstrate it."],"answer":1,"exp":"ถามว่าจองห้องประชุมแล้วหรือยัง B ตอบอ้อมว่า Sanjay จองไว้เมื่อวาน (reserved = booked) ตัวลวง C ขึ้นต้นด้วย Yes แต่พูดถึงการสาธิต ไม่ใช่การจองห้อง"},{"q":"Why is the loading bay closed today?","opts":["Near the east entrance.","They're repainting the floor.","It closes at six."],"answer":1,"exp":"Why ถามเหตุผล B บอกว่ากำลังทาสีพื้นใหม่ จึงถูก A ตอบสถานที่ C ซ้ำคำว่า close แต่ตอบเวลา"},{"q":"Can you show me how to use the new scheduling system?","opts":["The schedule is on the wall.","Show me the receipt.","Sure, do you have a few minutes now?"],"answer":2,"exp":"คำขอร้อง C ตอบรับและถามกลับว่าว่างตอนนี้ไหม ตัวลวง A ใช้ schedule ซ้ำ B ใช้ show ซ้ำ"},{"q":"Should we ship the order by air or by sea?","opts":["Yes, it's ready to go.","The client needs it by Monday.","A shipping container."],"answer":1,"exp":"คำถามแบบเลือก B ตอบอ้อมว่าลูกค้าต้องการภายในวันจันทร์ (นัยคือต้องส่งทางอากาศ) ตัวลวง A ตอบ Yes ซึ่งไม่เหมาะ C ใช้ shipping ซ้ำ"},{"q":"How much does the late checkout cost?","opts":["At two o'clock.","Check it out first.","There's no charge for members."],"answer":2,"exp":"How much ถามราคา C ตอบว่าไม่คิดค่าใช้จ่ายสำหรับสมาชิก ตัวลวง A ตอบเวลา B ใช้ check it out ที่เสียงคล้าย checkout แต่คนละความหมาย"},{"q":"Could you reschedule my appointment for next week?","opts":["Let me see what's available.","He's on the schedule.","Last week, I think."],"answer":0,"exp":"คำขอร้อง (Could you...) A ตอบอ้อมว่าขอดูช่วงเวลาที่ว่างก่อน ซึ่งเป็นการรับคำขอ ตัวลวง B ใช้ schedule ซ้ำ และ C ใช้ week ซ้ำแต่ผิดกาล"},{"q":"Who's going to cover the night shift at the clinic?","opts":["It's covered by insurance.","At eleven P.M.","Nurse Okafor volunteered."],"answer":2,"exp":"Who ถามบุคคล C ตอบว่าพยาบาล Okafor อาสา ตัวลวง A ใช้ covered คนละความหมาย (ประกันคุ้มครอง) B ตอบเวลา"},{"q":"Aren't the new hires starting orientation today?","opts":["No, it was postponed to Monday.","In the training room.","Hire more staff."],"answer":0,"exp":"คำถามปฏิเสธ A ตอบ No พร้อมเหตุผลว่าเลื่อนเป็นวันจันทร์ (postponed) ตัวลวง B ตอบสถานที่ C ซ้ำคำ hire"},{"q":"You've installed the new accounting software, haven't you?","opts":["It's quite expensive.","An account number.","IT is coming to do it tomorrow."],"answer":2,"exp":"Tag question ถามว่าติดตั้งแล้วใช่ไหม C ตอบอ้อมว่าฝ่าย IT จะมาติดตั้งพรุ่งนี้ (แปลว่ายังไม่ได้ติดตั้ง) ตัวลวง B ใช้ account ที่คล้ายกับ accounting"}],"p3":[{"lines":[{"sp":"W","t":"Riverside Physical Therapy, this is Grace speaking."},{"sp":"M","t":"Hi, this is Tom Hendricks. I have an appointment with Dr. Patel on Thursday at ten, but I need to change it. My company is sending me to a conference that day."},{"sp":"W","t":"No problem, Mr. Hendricks. Dr. Patel has an opening on Friday at eight-thirty in the morning, or on Monday afternoon at three."},{"sp":"M","t":"Friday morning would be better. I'd rather not wait until next week, since my shoulder is still pretty stiff."},{"sp":"W","t":"All right, you're booked for Friday at eight-thirty. Also, our records show that your insurance card expired last month."},{"sp":"M","t":"Oh, I got a new one in the mail. Should I bring it with me?"},{"sp":"W","t":"Yes, please. Or you can upload a photo of it through our patient portal before your visit. That'll save you time at check-in."}],"graphic":null,"qs":[{"q":"Why is the man calling?","opts":["To ask about a bill","To request a different doctor","To change an appointment time","To register for a conference"],"answer":2,"exp":"ผู้ชายบอกว่า \"I have an appointment... but I need to change it\" จึงตอบ (C) ส่วน \"To register for a conference\" ผิด เพราะ conference เป็นเหตุผลที่ต้องเลื่อนนัด ไม่ใช่จุดประสงค์ของการโทร"},{"q":"Why does the man prefer the Friday appointment?","opts":["He wants treatment as soon as possible.","He works from home on Fridays.","Dr. Patel is only available then.","He has a conference on Monday."],"answer":0,"exp":"ผู้ชายพูดว่า \"I'd rather not wait until next week, since my shoulder is still pretty stiff\" แปลว่าอยากรักษาเร็วที่สุด (A) ส่วน conference จัดวันพฤหัสฯ ไม่ใช่วันจันทร์"},{"q":"What does the woman suggest the man do?","opts":["Pay with a credit card","Arrive early on Friday","Call his insurance company","Submit a document online"],"answer":3,"exp":"ผู้หญิงแนะนำให้ \"upload a photo of it through our patient portal\" = ส่งเอกสาร (บัตรประกัน) ทางออนไลน์ (D) ระวัง \"Call his insurance company\" ซึ่งใช้คำว่า insurance ที่ได้ยินในบทสนทนาเป็นกับดัก"}]},{"lines":[{"sp":"M","t":"Linda, the packaging machine on Line 3 stopped again about twenty minutes ago. It's the same motor problem we had last week."},{"sp":"W","t":"Oh no. Did you call the maintenance team?"},{"sp":"M","t":"Yes, and the technician says the replacement motor won't arrive from the supplier until tomorrow afternoon."},{"sp":"W","t":"But we have to ship four thousand units to Hartwell Foods by Friday."},{"sp":"M","t":"Well, Line 2 is only running at half capacity this week."},{"sp":"W","t":"Good point. Let's move the Hartwell order over there. Can you tell the shift supervisor to start setting it up?"},{"sp":"M","t":"Sure. And I'll ask maintenance whether the motor can be sent by express courier."},{"sp":"W","t":"Thanks. I'll also call Hartwell to let them know there might be a small delay, just in case."}],"graphic":null,"qs":[{"q":"What problem does the man report?","opts":["A delivery was sent to the wrong address.","A shift supervisor is absent.","A machine has stopped working.","A supplier has raised its prices."],"answer":2,"exp":"ผู้ชายบอกว่า \"the packaging machine on Line 3 stopped again\" = เครื่องจักรเสีย (C) ส่วน supplier ถูกพูดถึงเรื่องส่งมอเตอร์ ไม่ใช่เรื่องขึ้นราคา"},{"q":"What does the man mean when he says, \"Line 2 is only running at half capacity this week\"?","opts":["Another production line can handle the work.","Production targets have been lowered.","More employees should be hired.","Line 2 also needs to be repaired."],"answer":0,"exp":"การบอกว่า Line 2 ทำงานแค่ครึ่งเดียว หมายถึงยังมีกำลังการผลิตว่างพอจะรับงานแทน ผู้หญิงจึงตอบว่า \"Let's move the Hartwell order over there\" จึงตอบ (A) ไม่ได้หมายความว่า Line 2 เสียด้วย"},{"q":"What does the woman say she will do?","opts":["Inspect Line 3","Contact a client","Visit a supplier","Order a new motor"],"answer":1,"exp":"ผู้หญิงพูดว่า \"I'll also call Hartwell\" ซึ่ง Hartwell Foods คือลูกค้าที่สั่งสินค้า = contact a client (B) ส่วนการติดต่อเรื่องมอเตอร์เป็นสิ่งที่ผู้ชายจะทำ"}]},{"lines":[{"sp":"W","t":"Hi, Marcus. It's Helen from Pinecrest Publishing. I'm calling about your manuscript for the gardening guide."},{"sp":"M","t":"Hi, Helen. Actually, I was about to call you. I'm afraid I'm running behind on the last two chapters."},{"sp":"W","t":"I see. The deadline is the fifteenth. How much more time do you think you'll need?"},{"sp":"M","t":"About two weeks. I want to add photographs of the spring plantings, and they won't be ready until early next month."},{"sp":"W","t":"Hmm, that'll affect the printing schedule. But I do think the photos would really improve the book."},{"sp":"M","t":"I agree. Would it help if I sent you the chapters that are already finished?"},{"sp":"W","t":"Yes, that way our copy editor can get started. And I'll check with the production manager about pushing back the print date."}],"graphic":null,"qs":[{"q":"Who most likely is the woman?","opts":["A garden designer","A professional photographer","A bookstore manager","An editor at a publishing company"],"answer":3,"exp":"ผู้หญิงแนะนำตัวว่ามาจาก Pinecrest Publishing และโทรมาเรื่อง manuscript และ deadline ของผู้เขียน จึงน่าจะเป็นบรรณาธิการ (D) ส่วน photographer เป็นคำที่เกี่ยวกับรูปถ่ายในบทสนทนาแต่ไม่ใช่อาชีพของเธอ"},{"q":"Why does the man need more time?","opts":["He has been ill recently.","He is waiting for feedback from readers.","He wants to include additional images.","He is changing the topic of the book."],"answer":2,"exp":"ผู้ชายบอกว่า \"I want to add photographs of the spring plantings\" = ต้องการเพิ่มรูปภาพ (images) (C) คำว่า photographs ถูกถอดความเป็น images"},{"q":"What does the man offer to do?","opts":["Send some completed work","Pay for extra printing costs","Hire a copy editor","Shorten the book"],"answer":0,"exp":"ผู้ชายเสนอ \"sent you the chapters that are already finished\" = ส่งงานที่เสร็จแล้ว (A) ส่วน copy editor เป็นพนักงานของสำนักพิมพ์อยู่แล้ว ไม่ใช่สิ่งที่เขาจะจ้าง"}]},{"lines":[{"sp":"M","t":"Good morning. I'd like to open a business checking account for my new bakery."},{"sp":"W","t":"Congratulations on the new business! Have you registered the company with the city yet?"},{"sp":"M","t":"Yes, I received the registration certificate last week. I have it right here."},{"sp":"W","t":"Great. I'll also need a photo ID and your tax identification number."},{"sp":"M","t":"I've got my driver's license, but I left the tax document at the shop."},{"sp":"W","t":"That's fine. We can start the application now, and you can bring the document in later this week. The account will be activated once we receive it."},{"sp":"M","t":"Okay. Is there a monthly fee for the account?"},{"sp":"W","t":"Normally it's ten dollars, but it's waived for the first six months for new small businesses."}],"graphic":null,"qs":[{"q":"What does the man want to do?","opts":["Open a bank account","Register a company","Apply for a business loan","Exchange some currency"],"answer":0,"exp":"ผู้ชายพูดชัดเจนว่า \"I'd like to open a business checking account\" จึงตอบ (A) ส่วน register a company เขาทำไปแล้วเมื่อสัปดาห์ก่อน"},{"q":"What did the man forget to bring?","opts":["A photo ID","A business plan","A tax document","A registration certificate"],"answer":2,"exp":"ผู้ชายบอกว่า \"I left the tax document at the shop\" จึงตอบ (C) ส่วน photo ID เขามี driver's license มาแล้ว และ certificate ก็อยู่กับเขา"},{"q":"What does the woman say about the monthly fee?","opts":["It depends on the account balance.","It was recently increased.","It can be paid online.","It will not be charged at first."],"answer":3,"exp":"\"it's waived for the first six months\" คำว่า waive = ยกเว้น ไม่เก็บค่าธรรมเนียมช่วงแรก (D) ไม่มีการพูดถึงการขึ้นราคา"}]},{"lines":[{"sp":"W","t":"Raymond, Victor, thanks for joining me. Our container of auto parts from Busan is still being held at the port."},{"sp":"M","t":"I spoke to the customs office this morning. They said the weight on our packing list doesn't match what they measured."},{"sp":"M2","t":"That's my fault, I'm afraid. The supplier sent us a corrected packing list, and I forwarded the old version by mistake."},{"sp":"W","t":"These things happen. How quickly can we fix it?"},{"sp":"M2","t":"I have the correct list right here. I'll submit it through the customs portal right after this meeting."},{"sp":"M","t":"Once it's approved, the container should be released within a day."},{"sp":"W","t":"Good. Our client in Detroit expects the parts by Monday, so let's arrange a truck for Thursday just to be safe."},{"sp":"M","t":"I'll book one with Fairway Transport. They've always been reliable."}],"graphic":null,"qs":[{"q":"What is being shipped?","opts":["Medical equipment","Automobile parts","Office furniture","Electronic devices"],"answer":1,"exp":"ผู้หญิงพูดว่า \"Our container of auto parts from Busan\" คำว่า auto parts = automobile parts (B)"},{"q":"What caused the delay?","opts":["An incorrect document was sent.","A container was damaged.","A customs fee was not paid.","A ship arrived late."],"answer":0,"exp":"ผู้ชายคนที่สองยอมรับว่า \"I forwarded the old version by mistake\" คือส่ง packing list ฉบับเก่าที่ผิด (A) ไม่มีการพูดถึงค่าธรรมเนียมหรือตู้สินค้าเสียหาย"},{"q":"What does the woman ask the men to arrange?","opts":["A visit to the port","Ground transportation for the parts","A contract with a new supplier","A meeting with the client"],"answer":1,"exp":"ผู้หญิงบอกว่า \"let's arrange a truck for Thursday\" = จัดรถขนส่งทางบก (B) ส่วน client ใน Detroit ถูกพูดถึงเพียงว่าต้องการสินค้าภายในวันจันทร์"}]},{"lines":[{"sp":"W","t":"Kevin, how's the feedback from the beta testers of our budgeting app?"},{"sp":"M","t":"Mostly positive. People really like the new expense charts. But about fifteen percent of Android users can't log in after updating."},{"sp":"W","t":"That's quite a lot. Do we know what's causing it?"},{"sp":"M","t":"The development team thinks it's related to the new password encryption. They're testing a fix now."},{"sp":"W","t":"Our public launch is scheduled for the twelfth. Do you think we'll make it?"},{"sp":"M","t":"Honestly, I'd recommend postponing by a week. We don't want a lot of negative reviews in the app store on the first day."},{"sp":"W","t":"You're right. I'll talk to the marketing department about moving the launch announcement."}],"graphic":null,"qs":[{"q":"Where do the speakers most likely work?","opts":["At an advertising agency","At an electronics store","At a software company","At a bank"],"answer":2,"exp":"บทสนทนาพูดถึง beta testers, app, development team และ launch ของแอป จึงทำงานที่บริษัทซอฟต์แวร์ (C) ส่วน bank เป็นกับดักจากคำว่า budgeting"},{"q":"According to the man, what do users like about the product?","opts":["Its low price","Its password protection","Its login screen","Its charts"],"answer":3,"exp":"ผู้ชายบอกว่า \"People really like the new expense charts\" จึงตอบ (D) ส่วน login และ password เป็นส่วนที่มีปัญหา"},{"q":"What does the man recommend?","opts":["Lowering a price","Removing a feature","Hiring more beta testers","Delaying a product launch"],"answer":3,"exp":"ผู้ชายแนะนำ \"postponing by a week\" = เลื่อนการเปิดตัว (D) คำว่า postpone = delay"}]},{"lines":[{"sp":"M","t":"Excuse me. I'm staying in room 614, and there's a lot of noise from the construction next door. I couldn't sleep past six this morning."},{"sp":"W","t":"I'm very sorry, sir. The building next to ours is being renovated, and unfortunately the work starts early."},{"sp":"M","t":"I'm here for three more nights, and I have important meetings every day."},{"sp":"W","t":"I understand. We have a quieter room on the other side of the building, on the ninth floor. It faces the river."},{"sp":"M","t":"That would be great. Could I move this afternoon?"},{"sp":"W","t":"Of course. I'll have a porter bring up your luggage whenever you're ready. And please accept complimentary breakfast for the rest of your stay."},{"sp":"M","t":"That's very kind of you. Thank you."}],"graphic":null,"qs":[{"q":"What is the man's complaint?","opts":["An elevator is out of service.","His room is too small.","His room is noisy.","His breakfast was cold."],"answer":2,"exp":"ผู้ชายบ่นว่า \"there's a lot of noise from the construction next door\" = ห้องมีเสียงดัง (C) ส่วน breakfast เป็นสิ่งที่โรงแรมเสนอให้ฟรี ไม่ใช่สิ่งที่เขาบ่น"},{"q":"Why is the man staying at the hotel?","opts":["To visit relatives","To attend business meetings","To go sightseeing","To inspect a renovation project"],"answer":1,"exp":"ผู้ชายบอกว่า \"I have important meetings every day\" จึงมาเพื่อประชุมทางธุรกิจ (B) ส่วน renovation เป็นงานของตึกข้างๆ"},{"q":"What does the woman offer the man?","opts":["Free meals","A ride to the airport","A late checkout","A discount on his room"],"answer":0,"exp":"\"complimentary breakfast\" complimentary = ฟรี จึงตรงกับ free meals (A) ไม่ได้ลดราคาห้อง"}]},{"lines":[{"sp":"W","t":"Hello, Northgate Skills Training Center. How may I help you?"},{"sp":"M","t":"Hi. I manage a warehouse, and I need to get five of my employees certified to operate forklifts. Do you offer a course?"},{"sp":"W","t":"Yes, we do. Our forklift safety course runs for two days: one day in the classroom and one day of practical training on the equipment."},{"sp":"M","t":"Is there one coming up this month? We have a certification inspection on the thirtieth."},{"sp":"W","t":"The next course starts on the eighteenth, and there are still six seats available."},{"sp":"M","t":"Perfect. Is there a discount for group registration?"},{"sp":"W","t":"Yes. Organizations that register four or more people receive fifteen percent off. I'll e-mail you the registration form now. Please send it back with your employees' names by Friday."}],"graphic":null,"qs":[{"q":"What does the man want to do?","opts":["Arrange training for his staff","Purchase a forklift","Apply for a teaching position","Reschedule an inspection"],"answer":0,"exp":"ผู้ชายต้องการให้พนักงาน 5 คน \"certified to operate forklifts\" จึงต้องการจัดการฝึกอบรมให้พนักงาน (A) ส่วน inspection เป็นกำหนดการที่มีอยู่แล้ว ไม่ได้ขอเลื่อน"},{"q":"What does the woman say about the course?","opts":["It is offered online.","It lasts one week.","It includes hands-on practice.","It is fully booked."],"answer":2,"exp":"\"one day of practical training on the equipment\" = ฝึกปฏิบัติจริง (hands-on) (C) ส่วน fully booked ผิดเพราะยังเหลือ six seats"},{"q":"What does the woman ask the man to do by Friday?","opts":["Take an exam","Pay a deposit","Visit the center","Return a form"],"answer":3,"exp":"ผู้หญิงขอให้ \"send it back with your employees' names by Friday\" คือส่งแบบฟอร์มกลับ (D)"}]},{"lines":[{"sp":"W","t":"Hi, I'm Sophie Laurent. I'm starting as a volunteer at the hospital's information desk next week, and I was told to see you about orientation."},{"sp":"M","t":"Welcome, Sophie. I'm Ben, the volunteer coordinator. Orientation is this Saturday from nine to noon in Conference Room B, on the second floor."},{"sp":"W","t":"Great. Is there anything I should bring?"},{"sp":"M","t":"Just a copy of your vaccination record. We'll also take a photo for your ID badge while you're here."},{"sp":"W","t":"Okay. To be honest, I'm a little nervous. Will I be at the desk by myself on my first shift?"},{"sp":"M","t":"Martha's covering that shift. She's been here for twelve years."},{"sp":"W","t":"Oh, that's a relief. I'm sure I'll learn a lot from her."},{"sp":"M","t":"You will. And the orientation includes a full tour, so you'll know where all the main departments are."}],"graphic":null,"qs":[{"q":"What is the purpose of the woman's visit?","opts":["To visit a patient","To ask about an orientation session","To apply for a nursing position","To pick up her ID badge"],"answer":1,"exp":"ผู้หญิงบอกว่า \"I was told to see you about orientation\" จึงตอบ (B) ส่วน ID badge ยังไม่ได้ทำ จะถ่ายรูปในวันปฐมนิเทศ"},{"q":"What is the woman asked to bring?","opts":["A letter of reference","A parking permit","A medical document","A passport photo"],"answer":2,"exp":"ผู้ชายขอ \"a copy of your vaccination record\" = เอกสารทางการแพทย์ (C) ส่วนรูปถ่ายจะถ่ายให้ที่โรงพยาบาล จึงไม่ต้องนำ photo มาเอง"},{"q":"What does the man mean when he says, \"She's been here for twelve years\"?","opts":["The shift schedule cannot be changed.","Martha is planning to retire soon.","The woman should apply for Martha's position.","An experienced person will be working with the woman."],"answer":3,"exp":"ผู้หญิงกังวลว่าจะต้องอยู่คนเดียว ผู้ชายตอบว่า Martha ทำงานที่นี่มา 12 ปี หมายถึงมีคนที่มีประสบการณ์อยู่ด้วย ผู้หญิงจึงตอบว่า \"that's a relief\" (D)"}]},{"lines":[{"sp":"M","t":"Ms. Duarte, Ms. Feld, welcome to Cobalt Metalworks. I'm Andrew, the plant manager."},{"sp":"W","t":"Thank you for having us. We're looking forward to seeing how our brackets are produced."},{"sp":"M","t":"Before we go onto the production floor, I'll need you both to put on these safety glasses and hard hats."},{"sp":"W2","t":"Of course. Will we be able to see the new laser-cutting machines you mentioned in your proposal?"},{"sp":"M","t":"Yes, they were installed last month. They've reduced our production time by almost thirty percent."},{"sp":"W","t":"That's impressive. It could really help with the larger orders we're planning for next year."},{"sp":"W2","t":"Would it be all right if we took photographs during the tour? Our board of directors would like to see the facility."},{"sp":"M","t":"I'm afraid photography isn't permitted on the floor, but I can e-mail you some approved images afterward."}],"graphic":null,"qs":[{"q":"Who most likely are the women?","opts":["Clients of the company","New employees","Safety inspectors","Machine technicians"],"answer":0,"exp":"ผู้หญิงพูดว่า \"how our brackets are produced\" และวางแผน \"larger orders\" แสดงว่าเป็นลูกค้าที่สั่งสินค้า (A) ส่วน safety inspectors เป็นกับดักจากการสวม safety glasses"},{"q":"What does the man say about the new machines?","opts":["They will be delivered next month.","They have made production faster.","They require special training.","They were expensive to install."],"answer":1,"exp":"\"They've reduced our production time by almost thirty percent\" = ผลิตได้เร็วขึ้น (B) ส่วนเครื่องติดตั้งแล้วเมื่อเดือนที่แล้ว ไม่ใช่เดือนหน้า"},{"q":"What does the man offer to do?","opts":["Give a presentation to a board","Send some pictures","Extend the tour","Lend the women a camera"],"answer":1,"exp":"ผู้ชายบอกว่า \"I can e-mail you some approved images afterward\" = ส่งรูปภาพให้ (B) board of directors เป็นคำที่ได้ยินแต่เขาไม่ได้เสนอจะไปนำเสนอ"}]},{"lines":[{"sp":"W","t":"Hi, this is Olivia from Maple Leaf Press. I'm calling about printing our new cookbook."},{"sp":"M","t":"Hi, Olivia. Did you get the price list I sent over?"},{"sp":"W","t":"Yes, thanks. We'd originally planned on five hundred copies, but pre-orders have been much stronger than we expected."},{"sp":"M","t":"That's great news. So you'd like a larger print run?"},{"sp":"W","t":"Yes, we'd like to double it. Can you still deliver by the end of March?"},{"sp":"M","t":"Let me see... Yes, that's no problem. But if you want a glossy cover, it'll add about two days to production."},{"sp":"W","t":"That's fine. We definitely want the glossy cover. Could you send me a revised quote today?"},{"sp":"M","t":"Sure. I'll e-mail it to you within the hour."}],"graphic":{"title":"Harbor Print Co. - Print Run Pricing","rows":[["Quantity","Price per Copy"],["500 copies","$6.20"],["1,000 copies","$4.80"],["2,000 copies","$3.90"],["5,000 copies","$3.10"]]},"qs":[{"q":"Why does the woman want to change her order?","opts":["A deadline has been moved up.","The original price was too high.","The book has more pages than planned.","Advance sales have been high."],"answer":3,"exp":"ผู้หญิงบอกว่า \"pre-orders have been much stronger than we expected\" pre-order = ยอดสั่งจองล่วงหน้า (advance sales) (D)"},{"q":"Look at the graphic. How much will the woman most likely pay per copy?","opts":["$6.20","$4.80","$3.90","$3.10"],"answer":1,"exp":"เดิมวางแผน 500 เล่ม และต้องการ \"double it\" = 1,000 เล่ม ซึ่งในตารางราคาเล่มละ $4.80 (B) ส่วน $6.20 เป็นราคาของ 500 เล่มเดิม"},{"q":"What will the man do?","opts":["Send an updated price estimate","Visit the woman's office","Print a sample cover","Cancel the original order"],"answer":0,"exp":"ผู้หญิงขอ \"a revised quote\" และผู้ชายตอบว่าจะ e-mail ให้ภายในหนึ่งชั่วโมง quote = ใบเสนอราคา (A)"}]},{"lines":[{"sp":"M","t":"Jessica, we've got a problem at Dock 3. One of the hydraulic lifts isn't working."},{"sp":"W","t":"Oh, really? Northway Trucking is due there at ten with that big shipment of refrigerators."},{"sp":"M","t":"Right. And those are much too heavy to unload by hand."},{"sp":"W","t":"Well, the dock that Delta Express uses is free all morning. Let's send the Northway truck there instead."},{"sp":"M","t":"Good idea. I'll call their dispatcher so the driver knows where to go."},{"sp":"W","t":"Thanks. And could you put in a repair request for the lift? We need all four docks running tomorrow. It's our busiest day of the week."},{"sp":"M","t":"I already did. The technician said he'd come by after lunch."}],"graphic":{"title":"Loading Dock Schedule - Wednesday","rows":[["Dock","Carrier","Arrival"],["Dock 1","Swift Freight","7:00 A.M."],["Dock 2","Harbor Lines","8:30 A.M."],["Dock 3","Northway Trucking","10:00 A.M."],["Dock 4","Delta Express","2:30 P.M."]]},"qs":[{"q":"What problem does the man mention?","opts":["A driver is unavailable.","A truck has arrived late.","Some equipment is broken.","A shipment is missing."],"answer":2,"exp":"ผู้ชายบอกว่า \"One of the hydraulic lifts isn't working\" = อุปกรณ์เสีย (C) ไม่มีการพูดว่ารถมาสาย"},{"q":"Look at the graphic. Which dock will the Northway Trucking shipment most likely use?","opts":["Dock 1","Dock 2","Dock 3","Dock 4"],"answer":3,"exp":"ผู้หญิงให้ส่งรถไปที่ \"the dock that Delta Express uses\" ซึ่งในตารางคือ Dock 4 และว่างทั้งช่วงเช้า (Delta มาบ่ายสองครึ่ง) (D) ส่วน Dock 3 คือท่าเดิมที่ลิฟต์เสีย"},{"q":"Why does the woman want the repair done quickly?","opts":["The next day will be especially busy.","A client has complained.","The technician is going on vacation.","An inspection is scheduled."],"answer":0,"exp":"ผู้หญิงบอกว่า \"We need all four docks running tomorrow. It's our busiest day of the week\" (A)"}]},{"lines":[{"sp":"M","t":"Thank you for calling CloudDesk. This is Ryan. How can I help you?"},{"sp":"W","t":"Hi, I'm Teresa Wong from Lakeside Accounting. We've been using your Starter plan, but our firm is growing."},{"sp":"M","t":"Glad to hear it. How many people will need access?"},{"sp":"W","t":"We just hired eight new acc
