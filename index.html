ountants, so there'll be eighteen of us in total. We may add more next year, but probably not more than twenty-five."},{"sp":"M","t":"I see. You could upgrade to the plan that fits your current staff now, and move up again later if you need to."},{"sp":"W","t":"That makes sense. Will we lose any of our saved files when we upgrade?"},{"sp":"M","t":"Not at all. Everything transfers automatically. I can also set up a free online training session for your new staff."},{"sp":"W","t":"That'd be great. Could we schedule it for next Tuesday?"}],"graphic":{"title":"CloudDesk Subscription Plans","rows":[["Plan","Users","Monthly Price"],["Starter","Up to 5","$49"],["Team","Up to 20","$129"],["Business","Up to 50","$299"],["Enterprise","Unlimited","$599"]]},"qs":[{"q":"Why is the woman calling?","opts":["Some of her files have been lost.","She wants to cancel a service.","She was charged incorrectly.","Her company has hired more employees."],"answer":3,"exp":"ผู้หญิงบอกว่า \"our firm is growing\" และ \"We just hired eight new accountants\" (D) ส่วนเรื่องไฟล์เป็นเพียงคำถามว่าจะหายหรือไม่ ไม่ใช่ไฟล์หายแล้ว"},{"q":"Look at the graphic. Which plan will the woman most likely choose?","opts":["Starter","Team","Business","Enterprise"],"answer":1,"exp":"ผู้ชายแนะนำแผนที่เหมาะกับพนักงานปัจจุบัน คือ 18 คน ซึ่งอยู่ในแผน Team (Up to 20) (B) ส่วน Business เหมาะกับ 25 คนในอนาคต ซึ่งยังไม่จำเป็นตอนนี้"},{"q":"What does the man offer to do?","opts":["Transfer files by hand","Extend a free trial","Arrange a training session","Give a discount"],"answer":2,"exp":"ผู้ชายเสนอ \"set up a free online training session for your new staff\" (C) ส่วนไฟล์จะย้าย \"automatically\" ไม่ใช่ by hand"}]}],"p4":[{"kind":"telephone message","sp":"W","graphic":null,"t":"Hello, this message is for Mr. Daniel Okafor. This is Teresa from the Westbrook Family Clinic. I'm calling about your annual checkup with Dr. Lindqvist, which is scheduled for Thursday at ten A.M. Unfortunately, Dr. Lindqvist has been asked to attend a medical conference that day, so we need to move your appointment. We have two openings next week: Monday at nine or Wednesday at two-thirty. Also, please note that our clinic recently moved to a new building on Harper Street, right across from the public library. There's free parking in the lot behind the building. When you come in, please bring your updated insurance card, since our records show that the one we have on file expired last month. You can call us back at 555-0147 to confirm a time. Thank you.","qs":[{"q":"Why is the speaker calling?","opts":["To share test results","To recommend a specialist","To reschedule an appointment","To request a payment"],"answer":2,"exp":"ผู้พูดแจ้งว่าแพทย์ต้องไปประชุม so we need to move your appointment คือการเลื่อนนัด (reschedule) ส่วน specialist เป็นตัวลวงเพราะบทพูดกล่าวถึงแพทย์แต่ไม่ได้แนะนำแพทย์เฉพาะทาง"},{"q":"What does the speaker say about the clinic?","opts":["It has extended its hours.","It has changed locations.","It has hired new doctors.","It is located inside a library."],"answer":1,"exp":"ผู้พูดบอกว่า our clinic recently moved to a new building ซึ่งก็คือการย้ายที่ตั้ง ส่วน library เป็นคำซ้ำจากบทพูดที่ใช้บอกว่าคลินิกอยู่ตรงข้ามห้องสมุด ไม่ใช่อยู่ข้างใน"},{"q":"What is the listener asked to bring?","opts":["A list of medications","A current insurance card","A parking permit","A completed form"],"answer":1,"exp":"ผู้พูดขอให้ bring your updated insurance card เพราะบัตรเดิมหมดอายุแล้ว คำว่า parking เป็นตัวลวงเพราะที่จอดรถฟรี ไม่ต้องใช้ใบอนุญาต"}]},{"kind":"announcement","sp":"M","graphic":null,"t":"Good morning, guests of the Coral Bay Resort. We'd like to inform you that our rooftop swimming pool will be closed from today until Sunday while we replace the pool's filtration system. We apologize for any inconvenience. During this time, guests are welcome to use the facilities at Harbor Fitness, a full-service gym with an indoor pool just five minutes away. Simply show your room key at their front desk for free entry. A complimentary shuttle will leave from our main entrance every thirty minutes between seven A.M. and nine P.M. In addition, to thank you for your patience, all guests will receive a voucher for a free drink at the Lagoon Bar on the ground floor. The vouchers will be delivered to your rooms this afternoon. If you have any questions, please contact the front desk by dialing zero from your room phone.","qs":[{"q":"Why is a facility closed?","opts":["Equipment is being replaced.","A private event is being held.","The weather is bad.","Staff are being trained."],"answer":0,"exp":"สระว่ายน้ำปิดเพราะ we replace the pool's filtration system คือมีการเปลี่ยนอุปกรณ์ (equipment) ตัวเลือกอื่นไม่ได้กล่าวถึง"},{"q":"According to the speaker, how can listeners get free entry to a gym?","opts":["By booking a shuttle seat online","By presenting a voucher","By calling the front desk","By showing a room key"],"answer":3,"exp":"ผู้พูดบอก Simply show your room key at their front desk for free entry ส่วน voucher เป็นตัวลวงเพราะ voucher ใช้แลกเครื่องดื่มฟรีที่บาร์ ไม่ใช่เข้ายิม"},{"q":"What will guests receive this afternoon?","opts":["A drink voucher","A shuttle schedule","A room upgrade","A refund"],"answer":0,"exp":"ผู้พูดบอกว่าแขกทุกคนจะได้รับ voucher for a free drink ซึ่งจะส่งถึงห้อง this afternoon ส่วน shuttle schedule เป็นคำที่ได้ยินในบทพูดแต่ไม่ได้แจกให้"}]},{"kind":"meeting excerpt","sp":"W","graphic":null,"t":"Before we open the branch this morning, I want to talk about the new feature in our mobile banking app. As of today, customers can deposit checks simply by taking a photo of them with their phones. Head office is hoping this will reduce the long lines we see at the counters every Friday afternoon. So when customers come in to deposit a check, I'd like you to tell them about the feature and offer to help them set it up. Now, I know some of you are worried that older customers won't be comfortable with it. But honestly, my seventy-eight-year-old father figured it out in two minutes. To make things easier, the marketing department has printed brochures with step-by-step instructions. I've put a stack of them at each teller window. Please hand one to every customer who shows interest.","qs":[{"q":"Where most likely are the listeners?","opts":["At a mobile phone store","At a marketing agency","At a bank","At a printing company"],"answer":2,"exp":"บทพูดกล่าวถึง open the branch, deposit checks, teller window แสดงว่าเป็นธนาคาร ส่วน mobile phone store เป็นตัวลวงจากคำว่า phones และ app"},{"q":"What does the speaker imply when she says, \"my seventy-eight-year-old father figured it out in two minutes\"?","opts":["Her father works at the branch.","The feature is easy to use.","Older customers prefer visiting in person.","The instructions need to be revised."],"answer":1,"exp":"ผู้พูดตอบความกังวลว่าลูกค้าสูงอายุจะใช้ไม่เป็น โดยยกตัวอย่างพ่ออายุ 78 ที่ใช้เป็นใน 2 นาที จึงสื่อว่าฟีเจอร์ใช้ง่าย ตัวเลือกเรื่องลูกค้าสูงอายุชอบมาที่สาขาเป็นความคิดที่ผู้พูดกำลังโต้แย้ง"},{"q":"What have the listeners been provided with?","opts":["Instruction brochures","New tablets","Customer surveys","Updated work schedules"],"answer":0,"exp":"ผู้พูดบอกว่าแผนกการตลาดพิมพ์ brochures with step-by-step instructions และวางไว้ที่ทุก teller window แล้ว ตัวเลือกอื่นไม่ได้กล่าวถึง"}]},{"kind":"news report","sp":"M","graphic":null,"t":"In business news, Delmont Auto Components announced yesterday that it will expand its manufacturing plant in Fairview. The company, which produces brake systems for several major car makers, says the expansion is necessary to meet rising demand from manufacturers of electric vehicles. Construction of a new production wing is scheduled to begin in March, and the company expects to hire around three hundred additional workers once it is completed. Local officials have welcomed the news, noting that the plant is already the largest employer in the county. However, some residents have raised concerns about increased truck traffic on Route Nine, which runs past two schools. In response, Delmont has agreed to fund a new access road that will connect the plant directly to the highway. The company will hold a public information session at the Fairview Community Center next Tuesday evening.","qs":[{"q":"What does Delmont Auto Components produce?","opts":["Electric vehicles","Vehicle parts","Construction materials","Road signs"],"answer":1,"exp":"บทพูดบอกว่าบริษัท produces brake systems ซึ่งเป็นชิ้นส่วนรถยนต์ (vehicle parts) ส่วน electric vehicles เป็นตัวลวงเพราะเป็นลูกค้าที่ต้องการชิ้นส่วน ไม่ใช่สินค้าที่บริษัทผลิตเอง"},{"q":"What concern have some residents expressed?","opts":["A loss of local jobs","Heavier traffic near schools","Noise from construction at night","Higher property taxes"],"answer":1,"exp":"ชาวบ้านกังวลเรื่อง increased truck traffic on Route Nine ซึ่งผ่านโรงเรียนสองแห่ง ส่วนเรื่องงานเป็นตัวลวง เพราะโครงการนี้จะเพิ่มงาน 300 ตำแหน่ง"},{"q":"What will happen next Tuesday?","opts":["Construction will begin.","A new road will open.","A public meeting will take place.","Hiring will start."],"answer":2,"exp":"บริษัทจะจัด public information session ในวันอังคารหน้า ซึ่งก็คือการประชุมสาธารณะ ส่วนการก่อสร้างจะเริ่มในเดือนมีนาคม ไม่ใช่วันอังคาร"}]},{"kind":"tour information","sp":"W","graphic":null,"t":"Welcome to Ashgrove Press, and thank you for joining today's tour. I'm Margaret, and I've worked as an editor here for almost fifteen years. Ashgrove has been publishing books since 1952, and today we release about two hundred titles a year, mostly cookbooks and travel guides. We'll begin on the second floor, where our editors and designers work, and then we'll go down to the printing room to see how our books are bound. The machines down there are quite loud, so we'll hand out earplugs before we enter. Please also keep in mind that photography is not permitted in the design studio, because many of the projects there haven't been announced yet. At the end of the tour, we'll stop by our gift shop, where every visitor can pick out one paperback from our new releases shelf free of charge.","qs":[{"q":"Who most likely is the speaker?","opts":["An editor","A graphic designer","A shop clerk","A machine operator"],"answer":0,"exp":"ผู้พูดแนะนำตัวว่า I've worked as an editor here ส่วน designer เป็นตัวลวงเพราะได้ยินคำว่า designers ในบทพูด"},{"q":"Why are the listeners not allowed to take photographs in the studio?","opts":["The lighting is too dim.","The staff might be distracted.","The equipment is fragile.","Some projects are confidential."],"answer":3,"exp":"ห้ามถ่ายรูปเพราะ many of the projects there haven't been announced yet แปลว่าเป็นโครงการที่ยังเป็นความลับ (confidential)"},{"q":"What will each listener receive at the end of the tour?","opts":["A pair of earplugs","A discount coupon","A free book","A printed map"],"answer":2,"exp":"ตอนจบทัวร์ผู้เข้าชมเลือก one paperback ... free of charge ได้ฟรี ส่วน earplugs เป็นตัวลวงเพราะแจกก่อนเข้าห้องพิมพ์ ไม่ใช่ตอนจบ"}]},{"kind":"instructions","sp":"M","graphic":null,"t":"Good morning, everyone. Starting today, all of you on the loading dock will be using these new handheld scanners instead of the paper checklists. Each scanner is linked directly to our inventory system, so as soon as you scan a package, its location is updated for the customer-service team. Here's how it works. First, scan the barcode on the shipping label. Then, when the screen turns green, select the truck number from the drop-down list. If the screen turns red, that means the package has been sent to the wrong dock, so set it aside and notify your supervisor. At the end of each shift, return your scanner to the charging station by the break room. Make sure you plug it in, because the batteries only last about ten hours. Okay, Priya will now hand out the scanners and help anyone who needs to log in.","qs":[{"q":"What is the speaker mainly discussing?","opts":["A new piece of equipment","A change in shift times","A customer complaint","A safety inspection"],"answer":0,"exp":"บทพูดทั้งหมดอธิบายวิธีใช้ handheld scanners ใหม่ที่ใช้แทน paper checklists ส่วนเรื่องกะงานเป็นตัวลวงจากคำว่า end of each shift"},{"q":"According to the speaker, what should listeners do if the screen turns red?","opts":["Restart the device","Print a new label","Inform a supervisor","Contact customer service"],"answer":2,"exp":"ถ้าหน้าจอเป็นสีแดง ให้ set it aside and notify your supervisor ส่วน customer service เป็นตัวลวงเพราะเป็นทีมที่ได้รับข้อมูลตำแหน่งพัสดุ"},{"q":"What will Priya do next?","opts":["Charge the batteries","Load a truck","Update a checklist","Distribute some devices"],"answer":3,"exp":"ผู้พูดบอกว่า Priya will now hand out the scanners คือแจกอุปกรณ์ (distribute) ส่วนการชาร์จแบตเป็นสิ่งที่พนักงานต้องทำตอนจบกะ"}]},{"kind":"advertisement","sp":"W","graphic":null,"t":"Are you ready to take the next step in your career? The Kingsley Professional Training Center offers certification courses in project management, data analysis, and business writing. All of our instructors have at least ten years of industry experience, so you'll learn practical skills that you can use at work right away. Our courses are designed for busy professionals. Classes meet on weekday evenings or Saturday mornings, and every session is also recorded, so you can catch up online if you miss one. This month only, anyone who registers for two courses will receive the second one at half price. And if your employer is paying for your training, ask about our corporate billing service, which lets us send the invoice directly to your company. To view our full course schedule, visit kingsleytraining.com today.","qs":[{"q":"What is being advertised?","opts":["A recruitment agency","A publishing service","An online university","A training center"],"answer":3,"exp":"โฆษณานี้คือ Kingsley Professional Training Center ที่เปิดคอร์สอบรม ส่วน online university เป็นตัวลวงเพราะได้ยิน catch up online แต่ไม่ใช่มหาวิทยาลัย"},{"q":"What does the speaker say about the classes?","opts":["They are taught in small groups.","They are held at company offices.","They are recorded.","They last for one year."],"answer":2,"exp":"ผู้พูดบอกว่า every session is also recorded ทำให้ดูย้อนหลังออนไลน์ได้ ตัวเลือกอื่นไม่ได้กล่าวถึง"},{"q":"How can listeners receive a discount?","opts":["By paying in advance","By referring a colleague","By registering online","By signing up for more than one course"],"answer":3,"exp":"This month only, anyone who registers for two courses จะได้คอร์สที่สองราคาครึ่งหนึ่ง คือต้องสมัครมากกว่าหนึ่งคอร์ส ส่วน online เป็นตัวลวงจากคำว่า visit kingsleytraining.com"}]},{"kind":"talk","sp":"M","graphic":null,"t":"Thanks for joining this update on the beta test of our scheduling software, PlanRight. Over the past three weeks, about two hundred small businesses have been using the beta version, and the feedback has been very encouraging. Users especially like how quickly they can set up staff shifts. However, many testers said they had trouble finding the reporting tools, which are currently hidden in the settings menu. Our design team has already moved them to the main dashboard. Now, the original plan was to launch the full version on June first. Marketing has asked if we can move that up to mid-May to coincide with a trade show. Well, the code isn't finished. So, for now, we're keeping the June date. Next, Hannah from customer support will explain how we're preparing the help center for launch.","qs":[{"q":"What kind of product is being discussed?","opts":["A reporting service","A marketing plan","A trade show booth","Scheduling software"],"answer":3,"exp":"ผู้พูดพูดถึง beta test of our scheduling software, PlanRight ส่วน reporting เป็นตัวลวงเพราะเป็นเพียงฟังก์ชันหนึ่งในซอฟต์แวร์"},{"q":"Why does the speaker say, \"Well, the code isn't finished\"?","opts":["To ask for more programmers","To explain why a request cannot be accepted","To apologize for a mistake","To suggest canceling a trade show"],"answer":1,"exp":"ฝ่ายการตลาดขอให้เลื่อนการเปิดตัวมาเร็วขึ้น ผู้พูดตอบว่าโค้ดยังไม่เสร็จ แล้วบอกว่า we're keeping the June date จึงเป็นการอธิบายว่ารับคำขอไม่ได้"},{"q":"What will Hannah talk about?","opts":["Preparations for customer support","Results of a user survey","Changes to the dashboard","Plans for a trade show"],"answer":0,"exp":"ผู้พูดบอกว่า Hannah from customer support will explain how we're preparing the help center คือการเตรียมงานบริการลูกค้า ส่วน dashboard เป็นเรื่องที่ทีมออกแบบทำไปแล้ว"}]},{"kind":"talk","sp":"W","graphic":{"title":"St. Agnes Hospital - Directory","rows":[["Floor","Department"],["1","Emergency / Main Reception"],["2","Radiology"],["3","Pediatrics"],["4","Cardiology"]]},"t":"Good morning, and welcome to your first day as volunteers at St. Agnes Hospital. We're so grateful that you've chosen to give your time to help our patients and their families. Most of you will be working at the information desks, helping visitors find their way around the building. As you can see from the directory, each floor has a different department. Now, one important change: the children's ward is currently being renovated, so for the next two months, pediatric patients are being treated on the same floor as Radiology. Please make sure you send families to the right place. Your main volunteer station will be on the floor directly above the children's ward's usual location, next to the heart clinic's waiting area. Before you start, each of you needs to pick up an identification badge from the security office. After that, we'll have a short tour of the building.","qs":[{"q":"Who most likely are the listeners?","opts":["Hospital doctors","Patients' family members","Security guards","New volunteers"],"answer":3,"exp":"ผู้พูดกล่าว welcome to your first day as volunteers จึงเป็นอาสาสมัครใหม่ ส่วน family เป็นตัวลวงเพราะเป็นผู้ที่อาสาสมัครจะช่วยเหลือ"},{"q":"Look at the graphic. On which floor will the listeners' main station be located?","opts":["Floor 2","Floor 3","Floor 4","Floor 1"],"answer":2,"exp":"ตามผัง แผนกเด็ก (Pediatrics) ปกติอยู่ชั้น 3 และสถานีอาสาสมัครอยู่ชั้นที่อยู่เหนือขึ้นไปหนึ่งชั้น ข้างแผนกหัวใจ (Cardiology) คือชั้น 4 ชั้น 2 เป็นตัวลวงเพราะเป็นที่ที่ผู้ป่วยเด็กถูกย้ายไปชั่วคราว"},{"q":"What should the listeners do before they start?","opts":["Collect a badge","Fill out a form","Watch a video","Meet with a doctor"],"answer":0,"exp":"ผู้พูดบอกว่า each of you needs to pick up an identification badge from the security office คือการรับบัตร (collect a badge) ก่อนเริ่มงาน"}]},{"kind":"meeting excerpt","sp":"M","graphic":{"title":"Support Tickets by Category - Last Quarter","rows":[["Category","Tickets"],["Password resets","420"],["Billing questions","310"],["Data import errors","265"],["Mobile app crashes","180"]]},"t":"Okay, let's look at last quarter's support tickets for our accounting platform. As this chart shows, password resets were again the most common issue. The good news is that our new self-service reset tool goes live next week, so we expect that number to drop sharply. What I'd really like us to focus on today is the category with the third-highest number of tickets. Those problems take our support staff the longest to solve, often more than an hour per case, because the agents have to go through each customer's file manually. I'd like to form a small team to write a step-by-step troubleshooting guide for that issue. Ideally, I'd like one person from engineering and two from customer support. If you're interested, please let me know by the end of the day. I'll also be asking our trainers to schedule a workshop on the guide once it's ready.","qs":[{"q":"What will happen next week?","opts":["A new tool will become available.","A mobile app will be updated.","A billing policy will change.","A support team will be hired."],"answer":0,"exp":"ผู้พูดบอกว่า our new self-service reset tool goes live next week คือเครื่องมือใหม่จะเปิดใช้ ส่วน mobile app เป็นตัวลวงจากชื่อหมวดในตาราง"},{"q":"Look at the graphic. Which category does the speaker want to focus on?","opts":["Password resets","Data import errors","Billing questions","Mobile app crashes"],"answer":1,"exp":"ผู้พูดต้องการเน้นหมวดที่มีจำนวนตั๋วมากเป็นอันดับสาม ซึ่งตามตารางคือ Data import errors (265) ส่วน Password resets มีมากที่สุดแต่จะลดลงด้วยเครื่องมือใหม่"},{"q":"What does the speaker ask the listeners to do?","opts":["Attend a training workshop","Review customer files","Volunteer for a project team","Submit a report"],"answer":2,"exp":"ผู้พูดต้องการตั้งทีมเขียนคู่มือแก้ปัญหา และบอกว่า If you're interested, please let me know คือขอให้อาสาเข้าร่วมทีม ส่วน workshop เป็นสิ่งที่จะจัดภายหลังเมื่อคู่มือเสร็จ"}]}],"p5":[{"q":"The clinic's new online appointment system has made scheduling far more ------- for patients.","opts":["convenience","conveniently","convenient","convene"],"answer":2,"exp":"หลัง far more และเป็นส่วนเติมเต็มของกริยา made (make + กรรม + adjective) ต้องใช้คำคุณศัพท์ convenient (สะดวก) ส่วน conveniently เป็น adverb ใช้ขยายคำนามหรือเป็นส่วนเติมเต็มกรรมไม่ได้"},{"q":"Dr. Alvarez responded ------- to the patient's concerns about the side effects of the medication.","opts":["thoughtful","thoughtfully","thoughtfulness","thought"],"answer":1,"exp":"ตำแหน่งหลังกริยา responded ต้องใช้คำวิเศษณ์ (adverb) ขยายกริยา คือ thoughtfully (อย่างรอบคอบ ใส่ใจ) ส่วน thoughtful เป็น adjective ขยายกริยาไม่ได้"},{"q":"Guests who require ------- of their reservation should contact the front desk at least 48 hours in advance.","opts":["confirm","confirmed","confirmation","confirming"],"answer":2,"exp":"หลังกริยา require และหน้า of ต้องใช้คำนาม confirmation (การยืนยัน) ส่วน confirm เป็นกริยา และ confirming ไม่เหมาะเพราะต้องตามด้วยกรรมโดยตรงไม่ใช่ of"},{"q":"Feedback forms will be distributed to all ------- at the end of the three-day training course.","opts":["participation","participants","participate","participated"],"answer":1,"exp":"หลัง all และเป็นผู้รับแบบฟอร์ม ต้องใช้คำนามที่หมายถึงคน คือ participants (ผู้เข้าร่วม) ส่วน participation เป็นคำนามนามธรรม (การมีส่วนร่วม) ไม่สามารถรับแบบฟอร์มได้"},{"q":"Several investors found the bank's quarterly results -------, given the difficult economic conditions.","opts":["encouraging","encouraged","encourage","encouragement"],"answer":0,"exp":"โครงสร้าง find + กรรม + adjective โดยกรรมคือ results ซึ่งเป็นสิ่งที่ทำให้รู้สึก จึงใช้ -ing คือ encouraging (น่าพอใจ ให้กำลังใจ) ส่วน encouraged ใช้กับคนที่รู้สึก"},{"q":"Production at the Wilmore plant has become significantly more ------- since robotic arms were installed on the assembly line.","opts":["efficiency","efficient","efficiently","efficiencies"],"answer":1,"exp":"หลัง become และ more ต้องใช้คำคุณศัพท์ efficient (มีประสิทธิภาพ) เป็นส่วนเติมเต็มประธาน ส่วน efficiently เป็น adverb ใช้ตามหลัง linking verb become ไม่ได้"},{"q":"The editorial team found the author's latest manuscript ------- engaging from start to finish.","opts":["remarkable","remark","remarked","remarkably"],"answer":3,"exp":"คำที่ขยายคำคุณศัพท์ engaging ต้องเป็นคำวิเศษณ์ remarkably (อย่างน่าทึ่ง) ส่วน remarkable เป็น adjective ขยาย adjective ด้วยกันไม่ได้"},{"q":"The software firm's ------- to data security has earned it several major government contracts.","opts":["committed","commit","commitment","commits"],"answer":2,"exp":"หลังคำแสดงความเป็นเจ้าของ firm's ต้องใช้คำนาม commitment (ความมุ่งมั่น) ซึ่งใช้คู่กับ to ส่วน committed เป็น adjective/กริยารูปที่ 3 ไม่ใช่คำนาม"},{"q":"All shipments of ------- goods must be labeled clearly and stored below four degrees Celsius.","opts":["perishable","perish","perishing","perished"],"answer":0,"exp":"หน้าคำนาม goods ต้องใช้คำคุณศัพท์ perishable (เน่าเสียง่าย) ซึ่งเป็นคำศัพท์ด้านโลจิสติกส์ ส่วน perished แปลว่าเสียไปแล้ว ไม่เหมาะกับสินค้าที่ต้องเก็บรักษา"},{"q":"Mr. Osei was praised for his ------- handling of the sudden increase in hotel bookings.","opts":["skill","skillfully","skillful","skills"],"answer":2,"exp":"หลัง his และหน้าคำนาม handling ต้องใช้คำคุณศัพท์ skillful (ชำนาญ) ขยายคำนาม ส่วน skillfully เป็น adverb ขยายคำนามไม่ได้"},{"q":"Since the merger last spring, Brightline Bank ------- twelve new branches across the province.","opts":["opens","opening","will be opened","has opened"],"answer":3,"exp":"Since + จุดเวลาในอดีต บอกการกระทำที่เริ่มในอดีตต่อเนื่องถึงปัจจุบัน จึงใช้ present perfect (has opened) ส่วน will be opened เป็นอนาคตและ passive ซึ่งไม่ถูกเพราะธนาคารเป็นผู้เปิด"},{"q":"The revised safety manual ------- to all factory supervisors before the inspection next week.","opts":["distributed","will be distributed","has distributed","distributing"],"answer":1,"exp":"คู่มือถูกแจก (passive) และเหตุการณ์เกิดก่อน next week ซึ่งเป็นอนาคต จึงใช้ will be distributed ส่วน has distributed เป็น active ทำให้คู่มือเป็นผู้แจกเอง"},{"q":"The nurse ------- the patient's records when the power outage occurred.","opts":["updates","has updated","will update","was updating"],"answer":3,"exp":"เหตุการณ์ที่กำลังดำเนินอยู่ในอดีตแล้วมีอีกเหตุการณ์แทรก (when ... occurred) ใช้ past continuous คือ was updating ส่วน has updated เป็น present perfect ไม่เข้ากับอดีต"},{"q":"The publishing house ------- its spring catalog at the book fair in Frankfurt next month.","opts":["unveiled","will unveil","has unveiled","unveiling"],"answer":1,"exp":"คำบอกเวลา next month แสดงอนาคต จึงใช้ will unveil (จะเปิดตัว) ส่วน unveiled และ has unveiled เป็นอดีต และ unveiling ไม่ใช่กริยาแท้"},{"q":"More than 2,000 employees ------- in the new compliance procedures so far this year.","opts":["have trained","are training","have been trained","trains"],"answer":2,"exp":"so far this year บ่งบอก present perfect และพนักงานเป็นผู้ถูกฝึกอบรม จึงต้องเป็น passive คือ have been trained ส่วน have trained เป็น active ซึ่งหมายถึงพนักงานเป็นผู้ฝึกคนอื่น"},{"q":"Standard rooms include breakfast only, ------- suites also offer access to the executive lounge.","opts":["despite","unless","so that","whereas"],"answer":3,"exp":"ต้องการคำสันธานเชื่อมสองอนุประโยคที่เปรียบเทียบความแตกต่าง จึงใช้ whereas (ในขณะที่) ส่วน despite เป็นบุพบทต้องตามด้วยคำนาม ไม่ใช่อนุประโยค"},{"q":"Patients should not stop taking the medication ------- instructed to do so by their physician.","opts":["whether","unless","despite","because"],"answer":1,"exp":"unless (เว้นแต่) + instructed (ย่อจาก unless they are instructed) ให้ความหมายว่าห้ามหยุดยาเว้นแต่แพทย์สั่ง ส่วน because ให้ความหมายขัดแย้งกัน"},{"q":"Trainees must complete the online safety module ------- attending the hands-on workshop.","opts":["in case","as soon as","prior to","so that"],"answer":2,"exp":"prior to (ก่อน) เป็นบุพบทจึงตามด้วย V-ing (attending) ได้ ส่วน in case, as soon as และ so that เป็นคำสันธานต้องตามด้วยอนุประโยคที่มีประธานและกริยา"},{"q":"The software update will be rolled out gradually ------- the month of June.","opts":["among","throughout","beside","upon"],"answer":1,"exp":"throughout (ตลอดช่วง) ใช้กับช่วงเวลา the month of June ส่วน among ใช้กับกลุ่มสิ่งของหรือคนตั้งแต่สามขึ้นไป ไม่ใช้กับเวลา"},{"q":"------- its small size, the Carrow logistics hub handles more than 10,000 parcels a day.","opts":["Despite","Although","Even","However"],"answer":0,"exp":"ตามด้วยคำนามวลี its small size จึงต้องใช้บุพบท Despite (แม้ว่า) ส่วน Although เป็นคำสันธานต้องตามด้วยอนุประโยค และ However เป็นคำเชื่อมที่ใช้ขึ้นต้นประโยคพร้อมจุลภาค"},{"q":"The bank's mobile application allows customers to transfer funds ------- accounts instantly.","opts":["onto","between","toward","against"],"answer":1,"exp":"transfer funds between accounts (โอนเงินระหว่างบัญชี) เป็นสำนวนทั่วไปในธนาคาร ส่วน toward และ against ไม่ให้ความหมายการโอนระหว่างสองสิ่ง"},{"q":"New employees at Daxton Software are encouraged to familiarize ------- with the company's coding standards.","opts":["them","their","themselves","they"],"answer":2,"exp":"familiarize oneself with (ทำความคุ้นเคยกับ) ต้องใช้สรรพนามสะท้อน (reflexive) ที่ตรงกับประธาน employees คือ themselves ส่วน them จะหมายถึงคนอื่นไม่ใช่ตัวพนักงานเอง"},{"q":"The author ------- novel won this year's Kessler Prize will give a reading at the Central Library.","opts":["who","whom","which","whose"],"answer":3,"exp":"ช่องว่างอยู่หน้าคำนาม novel และแสดงความเป็นเจ้าของ (นวนิยายของผู้เขียน) จึงใช้ relative pronoun whose ส่วน who ต้องตามด้วยกริยาทันที"},{"q":"Guests may request a late ------- of up to 2 P.M. at no extra charge.","opts":["arrival","admission","checkout","withdrawal"],"answer":2,"exp":"late checkout (การเช็กเอาต์ล่าช้า) เป็นบริการของโรงแรมที่สอดคล้องกับเวลา 2 P.M. ส่วน withdrawal หมายถึงการถอนเงิน ไม่เกี่ยวกับโรงแรม"},{"q":"The hospital plans to ------- its emergency department to accommodate the growing number of patients.","opts":["expand","increase","prolong","inflate"],"answer":0,"exp":"expand (ขยาย) ใช้กับขนาดของสถานที่หรือแผนก เพื่อรองรับผู้ป่วยมากขึ้น ส่วน increase ใช้กับจำนวนหรือปริมาณ ไม่ใช้กับแผนกโดยตรง และ prolong ใช้กับระยะเวลา"},{"q":"Please keep your receipt as ------- of payment in case you need to return the item.","opts":["mark","fact","idea","proof"],"answer":3,"exp":"proof of payment (หลักฐานการชำระเงิน) เป็นวลีที่ใช้บ่อย ส่วน fact หมายถึงข้อเท็จจริงทั่วไป ไม่ใช้กับใบเสร็จ"},{"q":"The factory's quality control team conducts ------- inspections to ensure that every product meets safety standards.","opts":["eventual","routine","former","absent"],"answer":1,"exp":"routine inspections (การตรวจสอบตามปกติเป็นประจำ) สอดคล้องกับการควบคุมคุณภาพ ส่วน eventual (ในที่สุด) และ former (อดีต) ไม่เข้ากับความหมาย"},{"q":"The publisher has agreed to ------- the release of the biography until the author completes her revisions.","opts":["prevent","recover","resign","postpone"],"answer":3,"exp":"postpone ... until (เลื่อนออกไปจนกว่า) เหมาะกับบริบทที่รอผู้เขียนแก้ไขต้นฉบับ ส่วน prevent (ป้องกัน) หมายถึงไม่ให้เกิดขึ้นเลย ไม่เข้ากับ until"},{"q":"Loan applications are typically ------- within five business days of submission.","opts":["processed","performed","operated","conducted"],"answer":0,"exp":"process an application (ดำเนินการพิจารณาใบสมัคร/คำขอ) เป็นการจับคู่คำที่ถูกต้อง ส่วน conducted ใช้กับ survey หรือ research และ performed ใช้กับงานหรือการแสดง"},{"q":"Ms. Haddad was chosen to lead the project because of her ------- knowledge of cloud computing.","opts":["spacious","lengthy","generous","extensive"],"answer":3,"exp":"extensive knowledge (ความรู้กว้างขวาง) เป็น collocation ที่ถูกต้อง ส่วน spacious ใช้กับพื้นที่ และ lengthy ใช้กับระยะเวลาหรือความยาวของเอกสาร"}],"p6":[{"kind":"e-mail","head":"To: All Guests\nFrom: Daniel Kerr, General Manager, Harborview Hotel\nDate: March 3\nSubject: Pool renovation","t":"Dear Guests,\n\nWe are writing to let you know that our indoor swimming pool will be closed from March 10 to March 24 while it [[1]]. During this period, guests are welcome to use the pool at the Westgate Fitness Club, located just two blocks from the hotel. Simply show your room key at the club's reception desk to receive [[2]] entry.\n\n[[3]] The upgraded facility will feature a heated whirlpool, improved lighting, and a separate area for children.\n\nWe apologize for any inconvenience and thank you for your [[4]].\n\nSincerely,\nDaniel Kerr","qs":[{"opts":["renovates","has renovated","renovating","is being renovated"],"answer":3,"exp":"สระว่ายน้ำถูกปรับปรุงในช่วงที่ปิด จึงต้องใช้ passive continuous คือ is being renovated ส่วน renovates เป็น active ทำให้สระเป็นผู้ปรับปรุงเอง และ renovating ไม่ใช่กริยาแท้"},{"opts":["complimentary","complimenting","compliment","complimented"],"answer":0,"exp":"หน้าคำนาม entry ต้องใช้คำคุณศัพท์ complimentary (ฟรี ไม่คิดค่าใช้จ่าย) ซึ่งพบบ่อยในบริบทโรงแรม ส่วน complimented แปลว่าถูกชม ไม่เข้ากับความหมาย"},{"opts":["We are confident that you will enjoy the results of this project.","The pool is open daily from 6 A.M. to 10 P.M.","Our restaurant has recently added a vegetarian menu.","Please return your room key at checkout."],"answer":0,"exp":"ประโยคนี้เชื่อมกับประโยคถัดไปที่บรรยายสระใหม่ (The upgraded facility...) โดย this project หมายถึงการปรับปรุงสระ ส่วนประโยคที่บอกว่าสระเปิดทุกวันขัดแย้งกับการปิดปรับปรุง"},{"opts":["understand","understanding","understood","understandably"],"answer":1,"exp":"หลัง your ต้องใช้คำนาม และ thank you for your understanding (ขอบคุณที่เข้าใจ) เป็นสำนวนมาตรฐาน ส่วน understandably เป็น adverb"}]},{"kind":"memo","head":"To: All Outpatient Staff\nFrom: Priya Raman, Operations Director\nDate: June 14\nSubject: Self-service check-in kiosks","t":"Beginning July 1, St. Brendan's Hospital will introduce self-service check-in kiosks in the main outpatient lobby. The kiosks will allow patients to confirm their appointments, update their contact details, and print a visit summary [[1]] waiting in line at the reception desk.\n\nFront-desk staff will receive a short training session on how to assist patients [[2]] the new machines. Sessions will be held on June 24 and June 26 in Conference Room B. [[3]]\n\nWe expect the kiosks to reduce waiting times [[4]]. Please direct any questions to the Operations Office at extension 4410.","qs":[{"opts":["instead","except","without","unless"],"answer":2,"exp":"without + V-ing (waiting) = โดยไม่ต้องรอคิว ซึ่งเป็นข้อดีของตู้ ส่วน instead ต้องใช้ instead of จึงตามด้วย V-ing ได้ และ unless เป็นคำสันธาน"},{"opts":["using","use","used","uses"],"answer":0,"exp":"assist patients using the machines (ช่วยผู้ป่วยที่กำลังใช้เครื่อง) เป็นการลดรูป relative clause แบบ active ด้วย V-ing ส่วน used จะเป็นความหมาย passive ซึ่งไม่ถูก"},{"opts":["Please sign up for one of these sessions through the staff portal by June 20.","Patients have praised the hospital's new cafeteria.","The reception desk will be permanently closed next month.","The kiosks were removed after only a few weeks."],"answer":0,"exp":"ประโยคนี้ต่อจากการแจ้งวันอบรมโดยตรง (these sessions) ส่วนประโยคที่บอกว่าตู้ถูกถอดออกแล้วขัดแย้งกับข้อความที่ว่าจะเริ่มใช้ในวันที่ 1 ก.ค."},{"opts":["considerable","consider","consideration","considerably"],"answer":3,"exp":"ตำแหน่งท้ายประโยคหลังกรรม waiting times ต้องใช้ adverb ขยายกริยา reduce คือ considerably (อย่างมาก) ส่วน considerable เป็น adjective ต้องอยู่หน้าคำนาม"}]},{"kind":"advertisement","head":"Lindqvist Professional Training Center","t":"Ready to take the next step in your career? The Lindqvist Professional Training Center offers evening and weekend courses in accounting, project management, and digital marketing. All of our instructors are [[1]] professionals with at least ten years of industry experience.\n\nClasses are kept small, so every student receives individual attention. [[2]], our flexible payment plans make it easy to spread the cost of tuition over several months.\n\n[[3]] Visit www.lindqvisttraining.com to view our full course schedule. Students who register before August 15 will receive a 15 percent discount [[4]] their first course.","qs":[{"opts":["experiencing","experiences","experience","experienced"],"answer":3,"exp":"หน้าคำนาม professionals ต้องใช้คำคุณศัพท์ experienced (มีประสบการณ์) ส่วน experiencing หมายถึงกำลังประสบ ซึ่งไม่เข้ากับความหมาย"},{"opts":["However","In addition","Otherwise","Instead"],"answer":1,"exp":"ประโยคนี้เพิ่มข้อดีอีกข้อ (แผนผ่อนชำระ) ต่อจากชั้นเรียนขนาดเล็ก จึงใช้ In addition (นอกจากนี้) ส่วน However ใช้แสดงความขัดแย้ง ซึ่งไม่มีในบริบทนี้"},{"opts":["New courses begin on the first Monday of every month.","Our office building was constructed in 1985.","Unfortunately, all of our courses are currently full.","Please submit your expense report to your manager."],"answer":0,"exp":"ข้อมูลวันเริ่มคอร์สสอดคล้องกับประโยคถัดไปที่ให้ดูตารางเรียน ส่วนประโยคที่บอกว่าคอร์สเต็มหมดขัดแย้งกับการเชิญชวนให้สมัครและให้ส่วนลด"},{"opts":["on","at","by","of"],"answer":0,"exp":"discount on + สินค้า/บริการ (ส่วนลดสำหรับ) เป็นการใช้บุพบทที่ถูกต้อง ส่วน discount of ใช้กับจำนวนส่วนลด เช่น a discount of 15 percent ไม่ใช้กับ course"}]},{"kind":"article","head":"Fennick Freight Expands Operations","t":"PORTSMOUTH (May 9) — Fennick Freight announced yesterday that it will open a new distribution center on the outskirts of Portsmouth. The 40,000-square-meter facility is expected to [[1]] operations early next year.\n\nAccording to company spokesperson Helen Marsh, the center will create approximately 300 jobs. [[2]] Most of these positions will be in warehouse management and vehicle maintenance.\n\nThe site was chosen [[3]] of its proximity to both the port and the main highway. \"This location will allow us to deliver goods to our clients much more [[4]],\" Ms. Marsh said.","qs":[{"opts":["beginning","began","begin","begun"],"answer":2,"exp":"is expected to + V1 (infinitive) จึงใช้ begin ส่วน began และ begun เป็นรูปอดีตและกริยาช่อง 3 ซึ่งใช้หลัง to ไม่ได้"},{"opts":["The company was founded by two brothers in Leeds.","Ms. Marsh declined to comment on the number of new jobs.","Hiring is scheduled to begin in the autumn.","Shipping prices have fallen sharply this year."],"answer":2,"exp":"ประโยคเรื่องการเริ่มรับสมัครงานเชื่อมกับตำแหน่งงาน 300 ตำแหน่งก่อนหน้าและ these positions ที่ตามมา ส่วนประโยคที่บอกว่าปฏิเสธให้ความเห็นเรื่องจำนวนงานขัดแย้งกับตัวเลข 300 ที่เพิ่งระบุ"},{"opts":["due","because","since","owing"],"answer":1,"exp":"because of + คำนาม (its proximity) = เนื่องจาก ส่วน due ต้องใช้ due to และ owing ต้องใช้ owing to จึงไม่ถูกเมื่อตามด้วย of"},{"opts":["quickly","quick","quicken","quickness"],"answer":0,"exp":"much more + adverb ขยายกริยา deliver จึงใช้ quickly (อย่างรวดเร็ว) ส่วน quick เป็น adjective ขยายกริยาไม่ได้"}]}],"p7":[{"passages":[{"kind":"text message chain","head":"","t":"Helen Park (7:42 A.M.): Good morning, Tom. Are you covering the front desk at the Eastgate Clinic today?\n\nTom Alvarez (7:44 A.M.): Yes, until 2:00. Is something wrong?\n\nHelen Park (7:45 A.M.): Dr. Nakamura's flight from the conference was delayed, so she won't be in until noon. Her morning patients will need to be moved.\n\nTom Alvarez (7:47 A.M.): There are only four of them. Leave it to me.\n\nHelen Park (7:48 A.M.): Thanks. Dr. Reyes has openings this afternoon if anyone would rather not wait until next week.\n\nTom Alvarez (7:50 A.M.): Good to know. I'll offer that first when I call them."}],"qs":[{"q":"What problem does Ms. Park mention?","opts":["A doctor will arrive late.","A clinic will close early.","A conference has been canceled.","A patient record is missing."],"answer":0,"exp":"Ms. Park เขียนว่าเที่ยวบินของ Dr. Nakamura ล่าช้า จะมาถึงตอนเที่ยง (won't be in until noon) จึงหมายถึงแพทย์มาสาย ตัวเลือก C ผิดเพราะการประชุม (conference) จบไปแล้ว ไม่ได้ถูกยกเลิก"},{"q":"At 7:47 A.M., what does Mr. Alvarez most likely mean when he writes, \"Leave it to me\"?","opts":["He will meet Dr. Nakamura at the airport.","He will contact the patients himself.","He wants Ms. Park to make the calls.","He is not sure he can finish the task."],"answer":1,"exp":"Mr. Alvarez ตอบหลังจาก Ms. Park บอกว่าต้องเลื่อนนัดผู้ป่วยช่วงเช้า \"Leave it to me\" แปลว่า \"ให้ผมจัดการเอง\" และต่อมาเขาบอกว่าจะโทรหาผู้ป่วย (when I call them) ตัวเลือก C กลับความหมาย"}]},{"passages":[{"kind":"notice","head":"Attention, Guests of the Corley Bay Hotel","t":"The rooftop swimming pool will be closed from Tuesday, August 5, through Friday, August 8, while new safety railings are installed. We apologize for any inconvenience.\n\nDuring this period, guests may use the pool at our sister property, the Corley Harbor Inn, free of charge. The inn is a five-minute walk from our main entrance, and a complimentary shuttle will run every 30 minutes between 8:00 A.M. and 8:00 P.M. Simply show your room key at the inn's front desk.\n\nThe fitness center on the second floor will remain open as usual."}],"qs":[{"q":"Why will the pool be closed?","opts":["It is being cleaned.","The water heater is broken.","Safety equipment is being added.","The hotel is hosting a private event."],"answer":2,"exp":"ประกาศระบุว่าสระปิด while new safety railings are installed คือกำลังติดตั้งราวกันตกเพื่อความปลอดภัย ตรงกับ safety equipment is being added ตัวเลือกอื่นไม่ได้กล่าวถึง"},{"q":"What must guests do to use the pool at the Corley Harbor Inn?","opts":["Pay a small fee","Reserve a time in advance","Take the shuttle","Present a room key"],"answer":3,"exp":"ประกาศบอกว่า Simply show your room key at the inn's front desk = แสดงคีย์การ์ดห้องพัก ตัวเลือก C ผิดเพราะรถรับส่ง (shuttle) เป็นทางเลือก ไม่ได้บังคับ และเดินไปได้ใน 5 นาที; A ผิดเพราะ free of charge"}]},{"passages":[{"kind":"advertisement","head":"Pinewood Professional Training Center","t":"Ready to take the next step in your career? Pinewood offers evening and weekend courses designed for working adults in project management, bookkeeping, and business writing.\n\nAll instructors have at least ten years of industry experience, and class sizes are limited to fifteen students so that everyone receives personal attention. Courses run for six weeks and include a certificate of completion.\n\nRegister before September 15 and receive 20 percent off any course. Companies that enroll five or more employees qualify for an additional group discount. Visit www.pinewoodtraining.com or call 555-0182 to learn more."}],"qs":[{"q":"For whom is the advertisement most likely intended?","opts":["University professors","People who have full-time jobs","Recent high school graduates","Company owners hiring instructors"],"answer":1,"exp":"โฆษณาระบุว่าคอร์สเปิดช่วงเย็นและวันหยุด designed for working adults = ผู้ใหญ่ที่ทำงานอยู่ ตรงกับคนที่มีงานประจำ ตัวเลือก D ผิดเพราะไม่ได้รับสมัครผู้สอน"},{"q":"What is NOT mentioned as a feature of the courses?","opts":["Small class sizes","Experienced instructors","A certificate","Online lessons"],"answer":3,"exp":"โฆษณากล่าวถึงชั้นเรียนไม่เกิน 15 คน ผู้สอนมีประสบการณ์ 10 ปี และ certificate of completion แต่ไม่ได้กล่าวถึงบทเรียนออนไลน์ (online lessons) ข้อนี้เป็นคำถามแบบ NOT"}]},{"passages":[{"kind":"form","head":"Fairmont Savings Bank\nChange of Contact Information Request","t":"Account holder: Lydia Okonjo\nAccount number: 4410-2287-09\n\nPrevious address: 58 Linden Road, Apt. 3, Kingsford\nNew address: 912 Maple Terrace, Kingsford\nEffective date: October 1\n\nNew mobile phone number: 555-0147 (unchanged)\nNew e-mail address: l.okonjo@quickmail.net\n\nPlease also send replacement checks with my new address: [X] Yes  [ ] No\n\nSignature: Lydia Okonjo    Date submitted: September 22\n\nFor bank use only: Received by B. Hollis, Kingsford branch. Replacement checks ordered September 23; allow 7-10 business days for delivery."}],"qs":[{"q":"What information did Ms. Okonjo NOT change?","opts":["Her street address","Her e-mail address","Her phone number","The address on her checks"],"answer":2,"exp":"ในแบบฟอร์ม หมายเลขโทรศัพท์มีวงเล็บว่า (unchanged) แปลว่าไม่ได้เปลี่ยน ส่วนที่อยู่ อีเมล และที่อยู่บนเช็คมีการเปลี่ยนทั้งหมด"},{"q":"What is indicated about the replacement checks?","opts":["They were ordered the day after the form was submitted.","They will be sent to her previous address.","Ms. Okonjo must pick them up at the branch.","They will arrive before October 1."],"answer":0,"exp":"ฟอร์มส่งวันที่ 22 กันยายน และธนาคารสั่งเช็คใหม่วันที่ 23 กันยายน คือวันถัดมา ตัวเลือก D ไม่แน่นอนเพราะต้องรอ 7-10 วันทำการ อาจไม่ถึงก่อน 1 ตุลาคม"}]},{"passages":[{"kind":"e-mail","head":"To: All Employees <staff@quantrixsoft.com>\nFrom: Arjun Mehta <amehta@quantrixsoft.com>\nDate: March 3\nSubject: Password policy update","t":"Dear team,\n\nAs part of our ongoing effort to protect client data, Quantrix Software is updating its password policy. [1] Beginning March 17, all passwords must contain at least twelve characters, including one number and one symbol. Passwords will also need to be changed every 90 days instead of every 180 days.\n\n[2] To make the transition easier, the IT department will hold two short information sessions next week, on Tuesday at 11:00 A.M. and Thursday at 3:00 P.M., in Meeting Room 4. [3] Attendance is optional, but we strongly encourage employees who work with client accounts to join one of them.\n\nIf you are unable to log in after changing your password, please submit a ticket through the help desk portal rather than e-mailing me directly. [4]\n\nThank you for your cooperation.\n\nArjun Mehta\nIT Security Manager"}],"qs":[{"q":"What is the purpose of the e-mail?","opts":["To announce new rules for passwords","To introduce a new IT manager","To report a security problem with a client","To request feedback on a software product"],"answer":0,"exp":"อีเมลแจ้งว่าบริษัทกำลัง updating its password policy และอธิบายกฎใหม่ จึงเป็นการประกาศกฎใหม่เรื่องรหัสผ่าน ตัวเลือก C เป็นกับดักเพราะพูดถึง client data แต่ไม่ได้มีปัญหาเกิดขึ้น"},{"q":"What will change on March 17?","opts":["Employees will receive new computers.","Passwords will need to be updated more often.","The help desk portal will be replaced.","Client accounts will be moved to a new system."],"answer":1,"exp":"อีเมลบอกว่าจะต้องเปลี่ยนรหัสผ่านทุก 90 วันแทน 180 วัน = เปลี่ยนบ่อยขึ้น (more often) ตัวเลือกอื่นไม่ได้กล่าวถึงในอีเมล"},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Each session will last approximately twenty minutes.\"","opts":["[1]","[2]","[3]","[4]"],"answer":2,"exp":"ประโยคนี้พูดถึง Each session จึงต้องอยู่หลังประโยคที่แนะนำ two short information sessions ซึ่งคือตำแหน่ง [3] ตำแหน่ง [2] อยู่ก่อนที่จะกล่าวถึง session จึงไม่เหมาะ"}]},{"passages":[{"kind":"memo","head":"MEMO\nTo: All Production Staff, Plant 2\nFrom: Gordon Tsai, Plant Manager\nDate: June 10\nRe: Visit from Harlow Motors","t":"Representatives from Harlow Motors, our largest customer, will tour Plant 2 on Thursday, June 19. They are considering placing a long-term order for our brake components, so it is important that we make a strong impression.\n\nPlease make sure your work areas are clean and that all tools are returned to their proper storage locations by the end of the shift on Wednesday, June 18. Safety glasses and hearing protection must be worn at all times on the production floor, including during the tour.\n\nThe visitors will arrive at 10:00 A.M. and observe Lines 3 and 4 before having lunch with the management team. Normal production will continue throughout the visit. Line supervisors should be prepared to answer questions about quality inspection procedures."}],"qs":[{"q":"Why is Harlow Motors visiting the plant?","opts":["To inspect a recent delivery","To consider a large purchase","To train new employees","To install new equipment"],"answer":1,"exp":"บันทึกบอกว่า Harlow Motors are considering placing a long-term order = กำลังพิจารณาสั่งซื้อระยะยาว จึงตรงกับการพิจารณาซื้อจำนวนมาก ตัวเลือก A เป็นกับดักเพราะพูดถึง quality inspection"},{"q":"What are employees asked to do by June 18?","opts":["Tidy their work areas","Submit a safety report","Prepare a presentation","Schedule extra shifts"],"answer":0,"exp":"memo ขอให้ make sure your work areas are clean และเก็บเครื่องมือเข้าที่ภายในสิ้นกะวันพุธที่ 18 มิถุนายน = tidy their work areas"},{"q":"What is suggested about the day of the visit?","opts":["Production lines 3 and 4 will be stopped.","Visitors will not need to wear safety equipment.","Employees will have lunch with the visitors.","Workers will continue their regular duties."],"answer":3,"exp":"memo ระบุว่า Normal production will continue throughout the visit พนักงานยังทำงานตามปกติ ตัวเลือก C ผิดเพราะผู้ที่ทานอาหารกลางวันกับแขกคือ management team ไม่ใช่พนักงานทุกคน"}]},{"passages":[{"kind":"web page","head":"www.swiftroutelogistics.com/services","t":"SwiftRoute Logistics — Shipping Services for Small Businesses\n\nStandard Freight: Delivery within 5-7 business days to any address in the country. Ideal for non-urgent orders. Tracking updates are provided once per day.\n\nPriority Freight: Delivery within 2-3 business days. Includes real-time tracking and a text message when the shipment is out for delivery.\n\nSame-Day Courier: Available within city limits only for packages under 20 kg. Orders must be placed by 11:00 A.M.\n\nNew customers who open a business account this month will receive free packaging materials for their first three shipments. All accounts include access to our online dashboard, where you can print shipping labels, schedule pickups, and view past invoices."}],"qs":[{"q":"What is indicated about Priority Freight?","opts":["It is the least expensive option.","It is available only within the city.","It includes notifications by text message.","It requires orders to be placed by 11:00 A.M."],"answer":2,"exp":"Priority Freight ระบุว่า Includes ... a text message when the shipment is out for delivery = มีการแจ้งเตือนทาง SMS ตัวเลือก B และ D เป็นเงื่อนไขของ Same-Day Courier"},{"q":"What restriction applies to the Same-Day Courier service?","opts":["It is not available on weekends.","It cannot be tracked online.","It requires a business account.","Packages must weigh less than 20 kg."],"answer":3,"exp":"Same-Day Courier ใช้ได้เฉพาะพัสดุที่หนักไม่เกิน 20 กิโลกรัม (under 20 kg) และในเขตเมืองเท่านั้น ตัวเลือกอื่นไม่ได้ระบุไว้"},{"q":"What is offered to new business customers this month?","opts":["Free packaging materials","A discount on Priority Freight","A free pickup service","An extended delivery guarantee"],"answer":0,"exp":"เว็บไซต์ระบุว่าลูกค้าใหม่ที่เปิดบัญชีธุรกิจเดือนนี้จะได้ free packaging materials สำหรับการส่ง 3 ครั้งแรก ตัวเลือก C เป็นกับดักเพราะ schedule pickups เป็นฟังก์ชันของ dashboard ไม่ใช่ข้อเสนอพิเศษ"}]},{"passages":[{"kind":"online chat","head":"","t":"Rachel Dunn (1:32 P.M.): Hi all. The printer needs the final files for the spring catalog by Friday. Where are we with the cover design?\n\nVictor Osei (1:34 P.M.): The design is done, but the author photo we received is too small to print clearly.\n\nRachel Dunn (1:35 P.M.): Can we ask the author for a larger version?\n\nVictor Osei (1:36 P.M.): I e-mailed her agent yesterday. No reply so far.\n\nMei Fujita (1:38 P.M.): I have the author's direct number from when we did the book launch last year. I'll give her a call this afternoon.\n\nRachel Dunn (1:39 P.M.): Perfect. Sam, how about the page proofs for chapters 4 through 6?\n\nSam Whitaker (1:41 P.M.): I finished chapters 4 and 5 this morning. Chapter 6 has a lot of tables, so it's taking longer, but I'll have it done by Thursday noon.\n\nRachel Dunn (1:42 P.M.): That works. Let's meet Thursday at 3:00 to review everything before we send it."}],"qs":[{"q":"What are the writers mainly discussing?","opts":["Hiring a new designer","Preparing materials for printing","Planning a book launch event","Choosing a new printing company"],"answer":1,"exp":"บทสนทนาเริ่มด้วย The printer needs the final files for the spring catalog by Friday แล้วทุกคนรายงานความคืบหน้า จึงเป็นการเตรียมงานส่งพิมพ์ ตัวเลือก C เป็นกับดักเพราะ book launch ถูกพูดถึงในฐานะเหตุการณ์ปีที่แล้ว"},{"q":"At 1:36 P.M., what does Mr. Osei most likely mean when he writes, \"No reply so far\"?","opts":["He has not received a larger photo yet.","He forgot to send the e-mail.","The agent declined the request.","The printer has not confirmed the deadline."],"answer":0,"exp":"Mr. Osei บอกว่าส่งอีเมลถึง agent เมื่อวานเพื่อขอรูปใหญ่ขึ้น \"No reply so far\" = ยังไม่ได้รับคำตอบ จึงยังไม่ได้รูป ตัวเลือก C ผิดเพราะ agent ยังไม่ได้ตอบเลย ไม่ใช่ปฏิเสธ"},{"q":"What will Ms. Fujita most likely do next?","opts":["Redesign the catalog cover","Take a new photograph","Telephone the author","E-mail the printer"],"answer":2,"exp":"Ms. Fujita บอกว่ามีเบอร์โทรตรงของผู้เขียนและ I'll give her a call this afternoon = จะโทรหาผู้เขียน"},{"q":"Why is Mr. Whitaker's task taking extra time?","opts":["He is working on another project.","He is waiting for the author's comments.","Some pages were lost.","A chapter contains many tables."],"answer":3,"exp":"Mr. Whitaker เขียนว่า Chapter 6 has a lot of tables, so it's taking longer = บทที่ 6 มีตารางจำนวนมากจึงใช้เวลามากกว่า"}]},{"passages":[{"kind":"article","head":"Medical Group Opens Third Location\nBy Fiona Grant, Delmar Valley Times","t":"DELMAR (May 14) — Brookside Family Health will open its third clinic on June 2 in the Westfield Shopping Plaza. [1] The new location will offer general checkups, vaccinations, and physical therapy, as well as a small on-site pharmacy.\n\nAccording to clinic director Samuel Obi, the decision was driven by long wait times at the group's two existing clinics. \"Many of our patients were waiting three weeks or more for a routine appointment,\" Mr. Obi said. [2] \"With the new facility, we expect to reduce that to about one week.\"\n\nThe Westfield clinic will employ six physicians and twelve nurses, most of whom have been hired from the local area. [3] It will also be the group's first location to stay open until 8:00 P.M. on weekdays, a feature Mr. Obi hopes will appeal to people who cannot leave work during the day.\n\nPatients can begin booking appointments at the new clinic online starting May 20. [4]"}],"qs":[{"q":"What is the article mainly about?","opts":["The retirement of a clinic director","The opening of a new medical facility","A shortage of nurses in the region","Changes to a shopping center"],"answer":1,"exp":"บทความรายงานว่า Brookside Family Health จะเปิดคลินิกแห่งที่สามในวันที่ 2 มิถุนายน และอธิบายรายละเอียด จึงเป็นเรื่องการเปิดสถานพยาบาลใหม่ ตัวเลือก D เป็นกับดักเพราะคลินิกอยู่ใน shopping plaza"},{"q":"Why did Brookside Family Health decide to open the new clinic?","opts":["To serve patients who live far away","To offer specialized surgery","To shorten the time patients wait for appointments","To replace an older building"],"answer":2,"exp":"Mr. Obi บอกว่าการตัดสินใจเกิดจาก long wait times และคาดว่าจะลดเวลารอจาก 3 สัปดาห์เหลือ 1 สัปดาห์ = ลดระยะเวลารอคอยนัดหมาย"},{"q":"In paragraph 2, line 1, the word \"driven\" is closest in meaning to","opts":["transported","caused","operated","delayed"],"answer":1,"exp":"ในบริบท the decision was driven by long wait times หมายความว่าการตัดสินใจ \"เกิดจาก/มีสาเหตุมาจาก\" ระยะเวลารอนาน จึงใกล้เคียงกับ caused ส่วน transported และ operated เป็นความหมายของ drive ในเรื่องการขับขี่ซึ่งไม่เข้ากับบริบท"},{"q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? \"Walk-in visits will also be accepted on the opening day.\"","opts":["[1]","[2]","[3]","[4]"],"answer":3,"exp":"ประโยคนี้พูดถึงการเข้ารับบริการโดยไม่นัด (walk-in) ซึ่งเชื่อมโยงกับประโยคเรื่องการจองนัดหมายออนไลน์ในย่อหน้าสุดท้าย คำว่า also แสดงว่าเป็นทางเลือกเพิ่มเติมจากการจองนัด จึงเหมาะกับตำแหน่ง [4]"}]},{"passages":[{"kind":"letter","head":"Grandview Riverside Hotel\n400 Wharf Street\nCedar Falls, IA 50613\n\nApril 4\n\nMs. Teresa Lindqvist\nEvent Coordinator, Norbeck Pharmaceuticals\n27 Elm Court\nWaterloo, IA 50701","t":"Dear Ms. Lindqvist,\n\nThank you for choosing the Grandview Riverside Hotel for Norbeck Pharmaceuticals' regional sales conference on May 12 and 13. I am writing to confirm the arrangements we discussed by phone on April 2.\n\nWe have reserved the Riverside Ballroom for both days, along with 35 guest rooms for the nights of May 11 and 12. Breakfast and lunch will be served in the ballroom each day, and our audiovisual team will provide two projectors, a sound system, and wireless microphones.\n\nAs requested, we have also arranged a dinner on the terrace on the evening of May 12. Please note that if weather conditions are poor, the dinner will be moved to the Willow Room on the ground floor.\n\nTo secure the booking, a deposit of 25 percent of the total cost is required by April 18. Final guest numbers for meals should be provided no later than May 5. If you have any questions, please contact me directly at 555-0163.\n\nSincerely,\n\nOwen Brackett\nSales Manager"}],"qs":[{"q":"Why did Mr. Brackett write to Ms. Lindqvist?","opts":["To confirm details of an event booking","To apologize for a scheduling error","To advertise a newly renovated ballroom","To request payment for a past event"],"answer":0,"exp":"จดหมายบอกว่า I am writing to confirm the arrangements we discussed by phone = ยืนยันรายละเอียดการจองงานประชุม ตัวเลือก D ผิดเพราะงานยังไม่เกิดขึ้น เป็นการขอเงินมัดจำล่วงหน้า"},{"q":"What is NOT included in the arrangements?","opts":["Meeting space","Overnight accommodations","Audiovisual equipment","Airport transportation"],"answer":3,"exp":"จดหมายกล่าวถึง Riverside Ballroom (ห้องประชุม), ห้องพัก 35 ห้อง และอุปกรณ์ audiovisual แต่ไม่ได้กล่าวถึงรถรับส่งสนามบิน"},{"q":"According to the letter, what might change depending on the weather?","opts":["The date of the conference","The location of a dinner","The number of guest rooms","The time breakfast is served"],"answer":1,"exp":"จดหมายระบุว่าหากสภาพอากาศไม่ดี dinner will be moved to the Willow Room = สถานที่จัดมื้อค่ำอาจเปลี่ยน"},{"q":"What must Ms. Lindqvist do by May 5?","opts":["Pay a deposit","Sign a contract","Provide the final number of meal guests","Choose a dinner menu"],"answer":2,"exp":"จดหมายบอกว่า Final guest numbers for meals should be provided no later than May 5 ส่วนเงินมัดจำ (A) ต้องจ่ายภายใน 18 เมษายน จึงเป็นกับดักเรื่องวันที่"}]},{"passages":[{"kind":"web page","head":"www.riversidefamilyhealth.com/visit\nRiverside Family Health Clinic — Hours and Services","t":"Riverside Family Health Clinic is open Monday through Friday from 8:00 A.M. to 7:00 P.M. and on Saturdays from 9:00 A.M. to 1:00 P.M. We are closed on Sundays and public holidays.\n\nGeneral checkups — by appointment\nVaccinations (including seasonal flu shots) — walk-in only, Tuesdays and Thursdays\nLaboratory tests — by appointment; patients who need a blood test should not eat for ten hours beforehand and should arrive before 10:00 A.M.\nPhysical therapy — with Dr. Anna Lindqvist; a referral from one of our physicians is required\n\nNew patients must complete the online registration form at least 48 hours before their first appointment. Please bring your insurance card to every visit. Parking in the adjacent garage is free for up to two hours when you have your ticket stamped at the reception desk."},{"kind":"e-mail","head":"To: appointments@riversidefamilyhealth.com\nFrom: Gregory Tan <gtan@castellbank.com>\nDate: Monday, June 9\nSubject: New patient appointment","t":"Hello,\n\nI recently moved to the area to take up a position at the Castell Bank branch on Harbor Street, and I would like to become a patient at your clinic. I completed your online registration form this morning.\n\nI would like to schedule a general checkup and a blood test for this Saturday, June 14, if possible. Because of my working hours, weekday visits are difficult for me. While I am there, I would also like to get a flu shot, since my previous doctor recommended one before the autumn.\n\nCould you also let me know whether I need to bring anything other than my insurance card?\n\nThank you,\nGregory Tan"}],"qs":[{"q":"What is indicated about Riverside Family Health Clinic?","opts":["It is open every day of the week.","It offers free parking for an unlimited time.","Its physical therapy service requires a referral.","It accepts walk-in patients for blood tests."],"answer":2,"exp":"เว็บไซต์ระบุว่า Physical therapy ... a referral from one of our physicians is required จึงตอบ C ส่วน B ผิดเพราะจอดฟรีได้เพียง up to two hours และ D ผิดเพราะ Laboratory tests ต้อง by appointment"},{"q":"Why did Mr. Tan write the e-mail?","opts":["To request an appointment","To change his insurance information","To ask for a referral to a specialist","To recommend a doctor to a colleague"],"answer":0,"exp":"Mr. Tan เขียนว่า I would like to schedule a general checkup and a blood test for this Saturday คือขอนัดหมาย จึงตอบ A คำว่า schedule = จัดตารางนัด ส่วน C เป็นกับดักจากคำว่า referral ในเว็บไซต์"},{"q":"What problem will Mr. Tan most likely have on June 14?","opts":["The clinic will be closed for a holiday.","He will arrive after the laboratory closes.","His registration form will not be processed in time.","He will not be able to receive a vaccination."],"answer":3,"exp":"ต้องเชื่อมสองข้อความ: อีเมลบอกว่าเขาอยากฉีดวัคซีนไข้หวัดในวันเสาร์ แต่เว็บไซต์ระบุว่า Vaccinations ... walk-in only, Tuesdays and Thursdays จึงฉีดในวันเสาร์ไม่ได้ ตอบ D ส่วน C ผิดเพราะเขาลงทะเบียนวันจันทร์ ซึ่งเกิน 48 ชั่วโมงก่อนวันเสาร์แล้ว"},{"q":"What should Mr. Tan do before his visit?","opts":["Pick up a parking ticket in advance","Avoid eating for ten hours","Call his previous doctor","Submit a copy of his contract"],"answer":1,"exp":"เขาจะตรวจเลือด (blood test) และเว็บไซต์ระบุว่า patients who need a blood test should not eat for ten hours beforehand จึงตอบ B ต้องเชื่อมข้อมูลจากทั้งสองข้อความ"},{"q":"What is true about Mr. Tan?","opts":["He works at a medical clinic.","He was referred by Dr. Lindqvist.","He has recently relocated.","He prefers appointments on weekday evenings."],"answer":2,"exp":"Mr. Tan เขียนว่า I recently moved to the area จึงตอบ C (relocate = ย้ายที่อยู่) ส่วน A ผิดเพราะเขาทำงานที่ธนาคาร Castell Bank และ D ผิดเพราะเขาบอกว่า weekday visits are difficult"}]},{"passages":[{"kind":"letter","head":"Grand Solano Hotel\n1200 Bayfront Avenue, San Marcos\n\nFebruary 3\n\nDear Valued Corporate Client,","t":"We are writing to let you know that the east wing of the Grand Solano Hotel will be renovated from March 3 to April 18. During this period, the guest rooms and the four meeting rooms in the east wing — the Juniper, Cedar, Willow, and Aspen Rooms — will be unavailable. Our west wing, restaurant, and fitness center will remain open as usual, and the business center will temporarily move to the lobby level.\n\nWe understand that construction may be inconvenient. To thank you for your patience, corporate clients who book a stay of three nights or longer during the renovation period will receive 15 percent off our standard corporate rate. In addition, our complimentary airport shuttle will continue to run every 30 minutes.\n\nWhen the work is complete, guests will enjoy redesigned rooms with larger desks and improved soundproofing. If you have any questions about an upcoming reservation, please contact our sales office at sales@grandsolano.com.\n\nSincerely,\nVictor Almeida\nGeneral Manager"},{"kind":"e-mail","head":"To: sales@grandsolano.com\nFrom: Ruth Adeyemi <radeyemi@kellermaneng.com>\nDate: February 6\nSubject: Reservation KE-2291","t":"Dear Sales Team,\n\nThank you for the letter about your renovation. I coordinate travel for Kellerman Engineering, and we have a reservation for six of our engineers from March 10 to March 13 (three nights).\n\nWhen I made the booking last month, I also reserved the Juniper Room for a full-day project meeting on March 11. Since that room will not be available, could you suggest another space in the hotel that can hold six to eight people and has a screen for presentations? If nothing suitable is available on site, please let me know as soon as possible so that I can make other arrangements.\n\nI would also appreciate it if you could confirm that the adjusted room rate will be applied to our booking.\n\nRegards,\nRuth Adeyemi"}],"qs":[{"q":"What is the purpose of the letter?","opts":["To announce construction work at the hotel","To advertise the opening of a new hotel","To apologize for a billing error","To introduce a new general manager"],"answer":0,"exp":"จดหมายเริ่มด้วย the east wing ... will be renovated from March 3 to April 18 จึงเป็นการแจ้งงานปรับปรุงก่อสร้าง ตอบ A ส่วน D ผิดเพราะ Victor Almeida เพียงลงชื่อในฐานะผู้จัดการ ไม่ได้ถูกแนะนำว่าเป็นผู้จัดการคนใหม่"},{"q":"According to the letter, what will NOT be available during the renovation?","opts":["The airport shuttle","The restaurant","The fitness center","The Aspen Room"],"answer":3,"exp":"Aspen Room เป็นหนึ่งในห้องประชุมของ east wing ที่ will be unavailable จึงตอบ D ส่วน shuttle, restaurant และ fitness center ยังเปิดให้บริการตามปกติ คำถามแบบ NOT ต้องตรวจทีละตัวเลือก"},{"q":"What is suggested about Kellerman Engineering's reservation?","opts":["It was made through a travel agency.","It qualifies for a discount.","It includes a stay in the west wing only for one night.","It will have to be canceled."],"answer":1,"exp":"อีเมลระบุว่าจองสามคืน (three nights) ช่วง March 10–13 ซึ่งอยู่ในช่วงปรับปรุง และจดหมายบอกว่าการจอง three nights or longer จะได้ส่วนลด 15 percent จึงตอบ B ต้องเชื่อมข้อมูลจากทั้งสองข้อความ"},{"q":"Why must Ms. Adeyemi change her plans?","opts":["Her engineers will arrive later than expected.","The hotel's business center has closed permanently.","The meeting room she booked is in the east wing.","The number of meeting participants has increased."],"answer":2,"exp":"เธอจอง Juniper Room ไว้ และจดหมายระบุว่า Juniper Room อยู่ใน east wing ที่ปิดปรับปรุง จึงตอบ C ส่วน B ผิดเพราะ business center เพียง temporarily move ไปที่ lobby level"},{"q":"What does Ms. Adeyemi ask the hotel to do?","opts":["Recommend an alternative meeting space","Extend her team's stay by one night","Arrange transportation from the airport","Send her a copy of the renovation plans"],"answer":0,"exp":"เธอเขียนว่า could you suggest another space in the hotel that can hold six to eight people จึงตอบ A (alternative = ทางเลือกอื่น) ส่วน C เป็นกับดักเพราะ shuttle ถูกกล่าวถึงในจดหมาย ไม่ใช่สิ่งที่เธอขอ"}]},{"passages":[{"kind":"notice","head":"Halvorsen Savings Bank\nIntroducing the New Halvorsen Mobile App","t":"Beginning October 15, Halvorsen Savings Bank customers can download our redesigned Halvorsen Mobile app. The app allows customers to transfer funds instantly, set up account alerts, and deposit checks by taking a photo of them. Mobile check deposits are limited to $5,000 per day for personal accounts and $10,000 per day for business accounts.\n\nPersonal account holders can register directly in the app. Business account holders, however, must first visit a branch so that a staff member can verify their documents and set up the authorized users for the account.\n\nOur current app will stop working on November 30. To help customers make the switch, all branches will open on Saturdays from 9:00 A.M. to 3:00 P.M. throughout November."},{"kind":"e-mail","head":"To: customerservice@halvorsenbank.com\nFrom: Marisol Vega <marisol@vegaflowers.com>\nDate: November 3\nSubject: Problem with new app","t":"Hello,\n\nI own Vega Flowers, a small florist on Linden Avenue, and I have both a personal and a business account with your bank. Yesterday I downloaded the new app. I was able to register my personal account without any trouble, but when I tried to add my business account, I received a message saying that registration could not be completed.\n\nThis is inconvenient because I just received a check for $7,500 from a client for flowers we provided at a corporate banquet, and I was hoping to deposit it without going to the bank. My shop is open on weekdays, so it is hard for me to get away. Is there another way to solve this?\n\nMarisol Vega"},{"kind":"e-mail","head":"To: Marisol Vega <marisol@vegaflowers.com>\nFrom: Thomas Brandt <tbrandt@halvorsenbank.com>\nDate: November 4\nSubject: RE: Problem with new app","t":"Dear Ms. Vega,\n\nThank you for contacting us. I am the manager of our Linden Avenue branch, and I would be glad to accommodate you on a Saturday this month, when we have extended hours. The process takes about twenty minutes.\n\nPlease bring a photo ID and your business registration certificate. Once your business account has been set up, you will be able to deposit the check you mentioned through the app right away.\n\nSincerely,\nThomas Brandt\nBranch Manager"}],"qs":[{"q":"What is the main purpose of the notice?","opts":["To announce a change in branch locations","To explain new fees for business accounts","To describe a new banking application","To recruit staff for weekend shifts"],"answer":2,"exp":"ประกาศเริ่มด้วย customers can download our redesigned Halvorsen Mobile app และอธิบายคุณสมบัติของแอป จึงตอบ C ส่วน D ผิดเพราะการเปิดวันเสาร์เป็นเพียงรายละเอียดเพื่อช่วยลูกค้า ไม่ใช่การรับสมัครพนักงาน"},{"q":"Why was Ms. Vega most likely unable to register her business account?","opts":["She entered an incorrect password.","She had not yet visited a branch.","Her account had been closed.","The app was not yet available."],"answer":1,"exp":"ประกาศระบุว่า Business account holders ... must first visit a branch ก่อนลงทะเบียน ส่วน Ms. Vega พยายามลงทะเบียนบัญชีธุรกิจทางแอปโดยตรง จึงตอบ B ต้องเชื่อมข้อความที่ 1 และ 2; D ผิดเพราะแอปเปิดตั้งแต่ October 15 แล้ว"},{"q":"What is suggested about the check Ms. Vega received?","opts":["Its amount is within the daily limit for her account type.","It must be deposited before November 30.","It was sent by another florist.","It was written for an incorrect amount."],"answer":0,"exp":"เช็คมีมูลค่า $7,500 ซึ่งเกินวงเงินบัญชีส่วนตัว ($5,000) แต่ไม่เกินวงเงินบัญชีธุรกิจ ($10,000) และ Mr. Brandt ยืนยันว่าฝากผ่านแอปได้ right away จึงตอบ A ต้องเชื่อมทั้งสามข้อความ; C ผิดเพราะเช็คมาจาก client งาน corporate banquet"},{"q":"When will Ms. Vega most likely visit the bank?","opts":["On a weekday morning","On a Sunday afternoon","On a Saturday in November","On October 15"],"answer":2,"exp":"Ms. Vega บอกว่าวันธรรมดาไม่สะดวก และ Mr. Brandt เสนอให้มา on a Saturday this month ซึ่งประกาศระบุว่าสาขาเปิดวันเสาร์ throughout November และอีเมลลงวันที่ November 4 จึงตอบ C"},{"q":"In the second e-mail, paragraph 1, line 2, the word \"accommodate\" is closest in meaning to","opts":["contain","adjust","house","serve"],"answer":3,"exp":"ในบริบท I would be glad to accommodate you หมายถึงยินดีให้บริการหรือช่วยเหลือลูกค้า จึงตอบ D serve ส่วน contain และ house เป็นความหมายของ accommodate ในแง่ 'จุคน/ที่พัก' ซึ่งไม่เข้ากับบริบทนี้"}]},{"passages":[{"kind":"memo","head":"MEMO\nTo: All Production Staff, Dunmore Plastics — Ashford Plant\nFrom: Linda Okafor, Plant Operations Manager\nDate: May 5\nSubject: Equipment maintenance week","t":"From May 19 to May 23, each production line at the Ashford Plant will be shut down for one full day so that our equipment can be inspected and serviced. The schedule is attached.\n\nOn the day their line is out of service, employees assigned to that line will not report to the production floor. Instead, they will attend a mandatory safety refresher course in Training Room B during their usual shift hours. The course will be led by instructors from SafeCore Solutions, the firm that conducted last year's certification program.\n\nPlease note that our order for Brennan Automotive must be shipped by May 23. Supervisors should plan their teams' work accordingly. Any requests to change the schedule must be sent to me by May 12."},{"kind":"schedule","head":"Ashford Plant — Maintenance Schedule, May 19–23","t":"Monday, May 19 — Line 1 (Injection molding)\nTuesday, May 20 — Line 2 (Injection molding)\nWednesday, May 21 — Line 3 (Component assembly)\nThursday, May 22 — Line 4 (Packaging)\nFriday, May 23 — Line 5 (Quality testing equipment)\n\nTechnicians will begin work at 6:00 A.M. each day. Lines will restart the following morning."},{"kind":"e-mail","head":"To: Linda Okafor <lokafor@dunmoreplastics.com>\nFrom: Raj Patel <rpatel@dunmoreplastics.com>\nDate: May 9\nSubject: Maintenance schedule request","t":"Hi Linda,\n\nMy team is currently assembling the parts for the Brennan Automotive order. If our line is shut down in the middle of the week as planned, we will lose a full day of production at the most critical point, and I am not confident we can finish on time.\n\nI have spoken with Carla Ruiz, and she has agreed to swap days with us. Her team could have its equipment serviced on Wednesday, and ours could be serviced on Friday, after the final units have been packed. Her team has a light workload that week, so this change should not cause problems for them.\n\nPlease let me know if this would be acceptable.\n\nBest,\nRaj"}],"qs":[{"q":"According to the memo, what will employees do on the day their line is serviced?","opts":["Help technicians repair machines","Take part in a training session","Work on a different production line","Take a paid day off"],"answer":1,"exp":"memo ระบุว่า they will attend a mandatory safety refresher course in Training Room B จึงตอบ B (training session = การอบรม) ส่วน A ผิดเพราะช่างเทคนิคเป็นผู้ซ่อมบำรุง พนักงานไม่ได้ช่วย"},{"q":"What is indicated about SafeCore Solutions?","opts":["It manufactures plastic components.","It recently hired Ms. Okafor.","It has worked with Dunmore Plastics before.","It will inspect the equipment at the plant."],"answer":2,"exp":"memo บอกว่า SafeCore Solutions คือ the firm that conducted last year's certification program แสดงว่าเคยทำงานร่วมกับบริษัทมาก่อน ตอบ C ส่วน D เป็นกับดักเพราะ SafeCore เป็นผู้สอนหลักสูตร ไม่ใช่ผู้ตรวจเครื่องจักร"},{"q":"Which line does Mr. Patel most likely supervise?","opts":["Line 3","Line 1","Line 4","Line 5"],"answer":0,"exp":"Mr. Patel บอกว่าทีมของเขา assembling the parts และไลน์จะปิด in the middle of the week ตารางระบุว่า Line 3 (Component assembly) ปิดวันพุธ จึงตอบ A ต้องเชื่อมอีเมลกับตาราง"},{"q":"Why is Mr. Patel concerned about the schedule?","opts":["His team has not completed the safety course.","Some technicians will arrive late.","Training Room B is too small for his team.","A shipment deadline falls during maintenance week."],"answer":3,"exp":"memo ระบุว่าคำสั่งซื้อของ Brennan Automotive must be shipped by May 23 และ Mr. Patel กลัวว่าการปิดไลน์จะทำให้ไม่เสร็จทันเวลา (finish on time) จึงตอบ D"},{"q":"What is suggested about Ms. Ruiz?","opts":["She will be on vacation during maintenance week.","Her team works with quality testing equipment.","She must approve all schedule changes.","Her team assembles parts for Brennan Automotive."],"answer":1,"exp":"Ms. Ruiz ตกลงสลับวันให้ทีมของ Mr. Patel ได้วันศุกร์ ซึ่งตามตารางเป็นวันของ Line 5 (Quality testing equipment) จึงตอบ B ต้องเชื่อมทั้งสามข้อความ; C ผิดเพราะผู้อนุมัติคือ Ms. Okafor"}]},{"passages":[{"kind":"web page","head":"www.northgatepress.com/submissions\nNorthgate Press — Call for Proposals: Practical Leadership Series","t":"Northgate Press is seeking proposals for its Practical Leadership series, a collection of concise, accessible books for managers. Manuscripts should be between 40,000 and 60,000 words.\n\nTo be considered, please submit (1) a detailed chapter outline, (2) two sample chapters, and (3) a short author biography. Proposals will be accepted from January 1 to March 31. Our editorial board will notify all applicants of its decision within ten weeks of the closing date.\n\nSelected authors will receive an advance of $4,000, paid in two equal installments: the first upon signing the contract and the second upon delivery of the final manuscript. Authors who have not previously published a book with Northgate Press are required to attend a two-day author orientation at our Boston office in June."},{"kind":"e-mail","head":"To: submissions@northgatepress.com\nFrom: Dev Malhotra <dmalhotra@brightlinemail.com>\nDate: March 28\nSubject: Proposal — Leading Remote Teams","t":"Dear Editorial Board,\n\nPlease find attached my proposal for a book titled Leading Remote Teams, along with my chapter outline and author biography. Over the past twelve years, I have managed distributed software teams across four continents, and I have written two articles on the subject for your quarterly magazine, Management Today. This would, however, be my first book.\n\nI estimate that the completed manuscript will be about 75,000 words. I have attached my first sample chapter; the second is nearly finished, and I will send it by April 10.\n\nThank you for your consideration.\n\nDev Malhotra"},{"kind":"e-mail","head":"To: Dev Malhotra <dmalhotra@brightlinemail.com>\nFrom: Sophie Laurent <slaurent@northgatepress.com>\nDate: June 2\nSubject: Your proposal","t":"Dear Mr. Malhotra,\n\nI am pleased to inform you that the editorial board has accepted Leading Remote Teams for the Practical Leadership series. The board was especially impressed by your second sample chapter, which offered practical advice that readers can apply immediately.\n\nWe do have one request. Please plan the book so that it fits within the length guidelines for the series; I would be happy to discuss which sections might be combined. Your contract is attached, and we look forward to seeing you at the orientation on June 20 and 21.\n\nWarm regards,\nSophie Laurent\nSenior Editor"}],"qs":[{"q":"According to the web page, what is NOT required for a proposal?","opts":["A chapter outline","Sample chapters","A letter of recommendation","An author biography"],"answer":2,"exp":"เว็บไซต์ระบุสิ่งที่ต้องส่ง 3 อย่างคือ chapter outline, two sample chapters และ author biography ไม่มีการพูดถึง letter of recommendation จึงตอบ C"},{"q":"What did Mr. Malhotra fail to include with his original submission?","opts":["A sample chapter","His contact information","A chapter outline","His author biography"],"answer":0,"exp":"เว็บไซต์กำหนดให้ส่ง two sample chapters แต่ Mr. Malhotra แนบมาเพียงบทแรก และบอกว่าจะส่งบทที่สองภายหลัง จึงตอบ A ต้องเชื่อมข้อความที่ 1 และ 2"},{"q":"Why does Ms. Laurent ask Mr. Malhotra to adjust his plans?","opts":["His proposal was submitted after the deadline.","His sample chapter was too technical.","His book's topic overlaps with another title.","His manuscript would exceed the maximum length."],"answer":3,"exp":"Mr. Malhotra ประเมินว่าต้นฉบับจะยาว 75,000 words แต่เว็บไซต์กำหนดไว้ไม่เกิน 60,000 words และ Ms. Laurent ขอให้ fits within the length guidelines จึงตอบ D; A ผิดเพราะเขาส่งวันที่ March 28 ก่อนปิดรับ March 31"},{"q":"Why will Mr. Malhotra travel to Boston in June?","opts":["He will give a lecture at a conference.","He has not published a book with Northgate Press before.","He needs to sign his contract in person.","He will meet the editors of Management Today."],"answer":1,"exp":"เว็บไซต์ระบุว่าผู้เขียนที่ have not previously published a book with Northgate Press ต้องเข้า orientation ที่ Boston และ Mr. Malhotra บอกว่า This would ... be my first book (เคยเขียนแค่บทความ) จึงตอบ B"},{"q":"How much will Mr. Malhotra most likely receive when he delivers his final manuscript?","opts":["$2,000","$4,000","$1,000","$6,000"],"answer":0,"exp":"เงินล่วงหน้า $4,000 แบ่งจ่าย two equal installments งวดที่สองจ่ายเมื่อส่งต้นฉบับฉบับสมบูรณ์ จึงได้ $2,000 ตอบ A ส่วน B เป็นกับดักเพราะเป็นยอดรวมทั้งหมด"}]}]},{"p1":[{"scene":"A bank teller is counting banknotes behind a glass partition while a customer waits on the other side of the counter.","svg":"office","opts":["A customer is signing a form at the counter.","A teller is opening a safe.","Some money is being counted.","A glass partition is being cleaned."],"answer":2,"exp":"พนักงานธนาคารกำลังนับธนบัตร จึงตรงกับ passive 'Some money is being counted' ตัวลวง D ใช้คำว่า glass partition ที่เห็นในภาพแต่ไม่มีใครเช็ด และ A ผิดเพราะลูกค้าแค่ยืนรอ ไม่ได้เซ็นเอกสาร"},{"scene":"A clinic waiting area is empty. Rows of chairs face a reception window, and some magazines are spread out on a low table.","svg":"office","opts":["Some reading materials have been left on a table.","Patients are lining up at the window.","A receptionist is filling out a chart.","Chairs are being arranged in a circle."],"answer":0,"exp":"ห้องรอว่างไม่มีคน และมีนิตยสารวางอยู่บนโต๊ะ reading materials เป็นคำถอดความของ magazines จึงตอบ A ตัวลวง B และ C ต้องมีคนอยู่ในภาพ ส่วน D ผิดเพราะเก้าอี้เรียงเป็นแถว ไม่ใช่วงกลม"},{"scene":"At a software company, two colleagues are looking at the same monitor. One of them is pointing at lines of code on the screen.","svg":"office","opts":["They're unplugging a monitor.","One of them is typing on a phone.","They're carrying a computer to a desk.","One of them is gesturing toward a screen."],"answer":3,"exp":"คนหนึ่งกำลังชี้ไปที่หน้าจอ gesturing toward = pointing at จึงตอบ D ตัวลวง A ใช้คำว่า monitor ซ้ำแต่ไม่มีใครถอดปลั๊ก และ C ผิดเพราะคอมพิวเตอร์ตั้งอยู่บนโต๊ะแล้ว"},{"scene":"A housekeeping cart stocked with towels and cleaning supplies is parked in a hotel corridor outside an open guest room door.","svg":"office","opts":["A housekeeper is vacuuming the hallway.","A cart has been left outside a room.","Towels are hanging on a balcony rail.","A door is being locked by a guest."],"answer":1,"exp":"ภาพมีรถเข็นแม่บ้านจอดอยู่หน้าห้องที่เปิดประตู โดยไม่มีคน จึงใช้ 'has been left' ได้ ตัวลวง C ใช้คำว่า
