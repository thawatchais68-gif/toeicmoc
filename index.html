<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TOEIC Mock Test 200</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: test-booklet pages on a cool desk; answer sheet printed in OMR pink, marks in graphite. */
:root{
  --desk:#eef1f5; --paper:#ffffff; --ink:#18202b; --muted:#5a6575; --line:#d8dee7;
  --omr:#c4335f; --omr-soft:#fbe9ef; --graphite:#2a2e35; --ok:#1e7a4b; --ok-soft:#e3f4ea; --bad:#b42318; --bad-soft:#fdecea; --warn:#a15c00;
  --f-ui:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#11151b; --paper:#1a2029; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2e3744;
  --omr:#f0729a; --omr-soft:#3a1d28; --graphite:#e7ebf1; --ok:#5fd39a; --ok-soft:#173326; --bad:#ff8a7a; --bad-soft:#3a1c19; --warn:#f2b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#11151b; --paper:#1a2029; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2e3744;
  --omr:#f0729a; --omr-soft:#3a1d28; --graphite:#e7ebf1; --ok:#5fd39a; --ok-soft:#173326; --bad:#ff8a7a; --bad-soft:#3a1c19; --warn:#f2b45a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--omr);border-color:var(--omr);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- start screen ---------- */
.start{padding-block:40px 64px;display:grid;gap:28px}
.cover{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:860px){.cover{grid-template-columns:1fr}}
.cover h1{font-size:clamp(28px,4.4vw,44px);font-weight:700;letter-spacing:-.01em}
.cover h1 em{font-style:normal;color:var(--omr)}
.lede{color:var(--muted);max-width:60ch;margin:12px 0 0}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:22px}
.facts div{display:grid}
.facts b{font-family:var(--f-mono);font-size:22px;font-weight:600}
.facts span{font-size:13px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.setup{display:grid;gap:18px}
.field{display:grid;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--omr);background:var(--omr-soft);color:var(--ink);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--omr)}
.hint{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.structure{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
table.t td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.notice{border-left:3px solid var(--warn);padding:8px 12px;background:var(--paper);border-radius:0 8px 8px 0;font-size:14px}

/* ---------- exam ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.bar .sec{font-weight:700}
.bar .part{color:var(--muted);font-size:14px}
.bar .grow{flex:1}
.timer{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:6px}
.timer.low{color:var(--bad);background:var(--bad-soft)}
.exam{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding-block:20px 90px}
@media(min-width:1120px){.exam{grid-template-columns:minmax(0,1fr) 250px}}
.page{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0}
@media(max-width:600px){.page{padding:16px}}
.dirs{background:var(--desk);border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:20px}
.dirs b{display:block;margin-bottom:2px}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.passages{display:grid;gap:18px;min-width:0}
.psg{border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-family:var(--f-read);font-size:16px;line-height:1.65;min-width:0}
.psg .kind{font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.psg .head{font-family:var(--f-ui);font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:10px;white-space:pre-wrap}
.psg p{margin:0 0 .8em}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);text-align:center;font-family:var(--f-mono);font-size:13px;font-weight:600;padding:0 4px;line-height:1.3}
.blank.cur{color:var(--omr);border-color:var(--omr)}
.pos{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--omr)}
.qs{display:grid;gap:22px;align-content:start;min-width:0}
.q{display:grid;gap:8px;scroll-margin-top:80px}
.q .stem{display:flex;gap:10px;align-items:baseline}
.q .no{font-family:var(--f-mono);font-weight:600;min-width:2.4em}
.q .txt{flex:1;min-width:0}
.q.cur .no{color:var(--omr)}
.q.cur{background:var(--omr-soft);border-radius:8px;padding:8px;margin:-8px}
.opts{display:grid;gap:6px;padding-left:2.9em}
@media(max-width:600px){.opts{padding-left:0}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;width:100%}
.opt:hover{border-color:var(--muted)}
.opt .b{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--omr);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--omr);font-family:var(--f-mono);margin-top:1px}
.opt.sel{border-color:var(--graphite)}
.opt.sel .b{background:var(--graphite);border-color:var(--graphite);color:var(--paper)}
.opts.only{display:flex;gap:10px;flex-wrap:wrap}
.opts.only .opt{width:auto;padding:10px 18px}
.flag{border:none;background:none;color:var(--muted);font-size:13px;padding:2px 6px;border-radius:6px}
.flag.on{color:var(--warn);font-weight:600}
.photo{aspect-ratio:4/3;max-width:100%;width:440px;border-radius:8px;background:linear-gradient(160deg,var(--desk),var(--line));display:grid;place-items:center;padding:28px;text-align:center;border:1px solid var(--line)}
.photo .cap{font-family:var(--f-read);font-style:italic;font-size:17px;max-width:36ch}
.photo .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
.graphic{overflow-x:auto;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:6px}
.graphic h4{margin:0 0 8px;font-size:15px}
.mark{font-size:18px;color:var(--muted);font-style:italic;font-family:var(--f-read)}
.audio-st{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.eq{display:flex;gap:3px;height:18px;align-items:flex-end}
.eq i{width:4px;background:var(--omr);border-radius:2px;height:30%}
.eq.on i{animation:eq .9s ease-in-out infinite}
.eq.on i:nth-child(2){animation-delay:.15s}.eq.on i:nth-child(3){animation-delay:.3s}.eq.on i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
@media(prefers-reduced-motion:reduce){.eq.on i{animation:none;height:70%}}
.script{margin-top:20px;border-top:1px dashed var(--line);padding-top:12px;font-family:var(--f-read);font-size:15px;color:var(--muted);max-height:220px;overflow:auto}
.script .now{color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}

/* answer sheet */
.sheet{background:var(--paper);border:1.5px solid var(--omr);border-radius:var(--r);padding:12px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
.sheet h3{font-size:13px;color:var(--omr);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between}
.sheet .legend{font-size:12px;color:var(--muted);margin-bottom:8px}
.srow{display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:5px;cursor:pointer;border:none;background:none;width:100%}
.srow:hover{background:var(--omr-soft)}
.srow .n{font-family:var(--f-mono);font-size:12px;width:30px;text-align:right;color:var(--omr);font-weight:600}
.srow .bb{width:17px;height:17px;border-radius:50%;border:1.2px solid var(--omr);font-size:9px;display:grid;place-items:center;color:var(--omr);font-family:var(--f-mono)}
.srow .bb.f{background:var(--graphite);border-color:var(--graphite);color:transparent}
.srow .fl{width:10px;color:var(--warn);font-size:11px}
.srow.here{background:var(--omr-soft)}
@media(max-width:1119px){
  .sheet{position:fixed;top:0;bottom:0;right:0;width:min(280px,86vw);max-height:none;z-index:40;border-radius:0;border-width:0 0 0 1.5px;transform:translateX(105%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .sheet.open{transform:none;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
}
@media(min-width:1120px){.sheet-toggle{display:none}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,14,20,.5);padding:16px}
.modal .card{max-width:440px;width:100%;display:grid;gap:14px}

/* results */
.res{padding-block:32px 72px;display:grid;gap:24px}
.score{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
@media(max-width:700px){.score{grid-template-columns:1fr}}
.total b{font-family:var(--f-mono);font-size:64px;font-weight:600;line-height:1;display:block}
.total span{color:var(--muted)}
.halves{display:flex;flex-wrap:wrap;gap:12px}
.half{border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:170px;flex:1}
.half b{font-family:var(--f-mono);font-size:30px;font-weight:600}
.half small{color:var(--muted);display:block}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:14px}
@media(max-width:560px){.brow{grid-template-columns:96px minmax(0,1fr) 56px;font-size:13px}}
.track{height:12px;background:var(--desk);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--omr);border-radius:6px}
.brow .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.rv{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px;background:var(--paper)}
.rv .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:1px 10px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.no{background:var(--desk);color:var(--muted)}
.rv .o{font-size:14px;padding:3px 8px;border-radius:6px}
.rv .o.right{background:var(--ok-soft);color:var(--ok);font-weight:600}
.rv .o.wrong{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.rv .exp{background:var(--desk);border-radius:6px;padding:8px 12px;font-size:14px}
.rv details{font-size:14px}
.rv details summary{cursor:pointer;color:var(--muted)}
.rv .ctx{font-family:var(--f-read);font-size:15px;margin-top:8px;white-space:pre-wrap;max-height:320px;overflow:auto;border-left:2px solid var(--line);padding-left:12px}
</style>

</head>

<script type="application/json" id="data">[{"p1":[{"scene":"A woman is seated at a desk in an office, typing on a laptop. A stack of folders sits beside her and a lamp is switched on.","svg":"office","opts":["She's filing some folders in a cabinet.","She's turning off a desk lamp.","She's working on a laptop computer.","She's hanging a picture on the wall."],"answer":2,"exp":"ภาพแสดงผู้หญิงกำลังพิมพ์งานบนแล็ปท็อป จึงตรงกับ 'working on a laptop computer' ตัวลวง A ใช้คำว่า folders ที่เห็นในภาพแต่เธอไม่ได้กำลังจัดเก็บเข้าตู้ และ B ผิดเพราะโคมไฟเปิดอยู่"},{"scene":"Several cardboard boxes are stacked on wooden pallets in a warehouse aisle. A forklift is parked next to the shelves with no one in it.","svg":"warehouse","opts":["Boxes have been stacked on some pallets.","A worker is driving a forklift.","Some shelves are being assembled.","Packages are being loaded onto a truck."],"answer":0,"exp":"กล่องถูกวางซ้อนบนพาเลทแล้ว ใช้ present perfect passive 'have been stacked' บรรยายสภาพที่เห็น ตัวลวง B ผิดเพราะรถยกจอดอยู่โดยไม่มีคนขับ ส่วน C และ D ใช้ being + V3 ซึ่งหมายถึงมีคนกำลังทำอยู่ ไม่ปรากฏในภาพ"},{"scene":"Two men in hard hats are standing at a construction site, looking at a large blueprint that one of them is holding open.","svg":"construction","opts":["They're climbing a ladder.","They're pouring concrete into a frame.","One of the men is removing his helmet.","They're examining a set of plans."],"answer":3,"exp":"ทั้งสองคนกำลังดูแบบแปลน (blueprint) ซึ่ง paraphrase เป็น 'examining a set of plans' ตัวลวง C ผิดเพราะทั้งคู่ยังสวมหมวกนิรภัยอยู่ ไม่ได้กำลังถอด (removing)"},{"scene":"Passengers are waiting in a row of seats at an airport gate. A large window behind them shows an airplane parked on the tarmac.","svg":"airport","opts":["Passengers are boarding an airplane.","Some people are seated near a window.","A plane is taking off from a runway.","Luggage is being weighed at a counter."],"answer":1,"exp":"ผู้โดยสารนั่งรออยู่ใกล้หน้าต่าง จึงตรงกับ 'seated near a window' ตัวลวง A ผิดเพราะยังไม่มีใครขึ้นเครื่อง และ C ผิดเพราะเครื่องบินจอดอยู่ ไม่ได้กำลังขึ้นบิน (taking off)"},{"scene":"A man is reaching up to take a jar from a high shelf in a grocery store. A shopping basket is on the floor by his feet.","svg":"store","opts":["He's pushing a shopping cart down an aisle.","He's paying for some items at a register.","He's reaching for an item on a shelf.","He's stocking jars on the bottom shelf."],"answer":2,"exp":"ผู้ชายกำลังเอื้อมหยิบขวดโหลจากชั้นบน จึงตรงกับ 'reaching for an item on a shelf' ตัวลวง D ใช้คำ jars และ shelf ที่เห็นในภาพ แต่เขาไม่ได้กำลังจัดของเข้าชั้น (stocking) และไม่ใช่ชั้นล่าง ส่วน A ผิดเพราะเป็นตะกร้าวางอยู่บนพื้น ไม่ใช่รถเข็น"},{"scene":"Boats are tied up along a wooden dock. Coiled ropes lie on the planks, and there are no people in the picture.","svg":"dock","opts":["A sailor is untying a rope.","Some boats are docked side by side.","People are swimming near a pier.","A boat is sailing out to sea."],"answer":1,"exp":"เรือหลายลำจอดเรียงกันอยู่ที่ท่าเรือ ตรงกับ 'docked side by side' ภาพไม่มีคน ดังนั้น A และ C ที่บรรยายการกระทำของคนจึงผิดทันที ส่วน D ผิดเพราะเรือจอดนิ่งอยู่ ไม่ได้แล่นออกไป"}],"p2":[{"q":"Where should I put these spare printer cartridges?","opts":["Yes, the printer is out of ink.","In the supply cabinet by the door.","About twenty pages per minute."],"answer":1,"exp":"คำถาม Where ถามสถานที่ คำตอบ B บอกที่วางคือตู้เก็บอุปกรณ์ข้างประตู ตัวลวง A ตอบ Yes ซึ่งใช้กับคำถาม WH ไม่ได้ และซ้ำคำว่า printer เพื่อหลอก"},{"q":"Who's leading the training session on Thursday?","opts":["Ms. Okafor from Human Resources.","It starts at nine o'clock.","The train was delayed again."],"answer":0,"exp":"คำถาม Who ต้องการชื่อบุคคล คำตอบ A ระบุ Ms. Okafor ตัวลวง B ตอบเรื่องเวลา และ C ใช้คำเสียงคล้าย train/training เป็นกับดัก"},{"q":"Haven't the new brochures arrived from the printer yet?","opts":["I'd prefer the blue cover.","Print two copies, please.","They're scheduled for delivery this afternoon."],"answer":2,"exp":"คำถามปฏิเสธถามว่าโบรชัวร์มาถึงหรือยัง C ตอบโดยอ้อมว่ากำหนดส่งบ่ายนี้ (แปลว่ายังไม่มา) ตัวลวง B ใช้คำว่า print ที่เสียงใกล้ printer"},{"q":"Would you like to review the contract now or after lunch?","opts":["Yes, it was a long contract.","The restaurant on Fifth Street.","Let's do it right away."],"answer":2,"exp":"คำถามแบบเลือก (A or B) คำตอบ C 'right away' เท่ากับเลือก now ตัวลวง A ตอบ Yes ซึ่งไม่เหมาะกับคำถามแบบให้เลือก และ B ลวงด้วยเรื่อง lunch"},{"q":"When is the quarterly budget report due?","opts":["By the end of next week.","It's about forty pages long.","In the finance department."],"answer":0,"exp":"คำถาม When ถามเวลา คำตอบ A 'By the end of next week' บอกกำหนดส่ง ตัวลวง C ตอบสถานที่ซึ่งตอบคำถาม Where"},{"q":"Why was the client meeting moved to Room 4B?","opts":["Around three o'clock.","The projector in our usual room is broken.","I moved here from Toronto."],"answer":1,"exp":"คำถาม Why ต้องการเหตุผล B อธิบายว่าโปรเจกเตอร์ในห้องเดิมเสีย ตัวลวง C ซ้ำคำว่า moved แต่คนละความหมาย (ย้ายบ้าน)"},{"q":"You've already submitted your travel expenses, haven't you?","opts":["A round-trip ticket to Seoul.","Yes, the hotel was quite expensive.","I'm still waiting for one receipt."],"answer":2,"exp":"Tag question ถามว่าส่งค่าใช้จ่ายเดินทางแล้วใช่ไหม C ตอบโดยอ้อมว่ายังรอใบเสร็จอยู่หนึ่งใบ (แปลว่ายังไม่ได้ส่ง) ตัวลวง B ใช้ expensive ที่เสียงคล้าย expenses"},{"q":"Could you help me set up the chairs for the seminar?","opts":["Sure, I'll be there in five minutes.","The seminar was very informative.","No, I sat in the back row."],"answer":0,"exp":"เป็นคำขอร้อง (request) คำตอบ A 'Sure' ตอบรับและบอกว่าจะไปช่วยใน 5 นาที ตัวลวง B ซ้ำคำ seminar และ C ใช้ sat ที่เกี่ยวกับ chairs เป็นกับดัก"},{"q":"How many people have signed up for the product launch?","opts":["At the convention center.","Sophie has the latest numbers.","Yes, I signed the form."],"answer":1,"exp":"คำถาม How many ถามจำนวน B เป็นคำตอบอ้อมว่า Sophie มีตัวเลขล่าสุด (ผู้พูดไม่รู้เอง) ตัวลวง C ใช้ signed ซ้ำกับ signed up แต่ความหมายต่างกัน"},{"q":"The shipment from our supplier in Milan has been delayed.","opts":["I shipped it last Tuesday.","Then we'll need to notify our customers.","Milan is a beautiful city."],"answer":1,"exp":"ประโยคบอกเล่าแจ้งปัญหา B ตอบสนองอย่างเหมาะสมว่าต้องแจ้งลูกค้า ตัวลวง A ใช้ shipped ซ้ำรากคำ shipment และ C ซ้ำคำ Milan แต่ไม่เกี่ยวกับปัญหา"},{"q":"Which vendor did we choose for the catering?","opts":["Mostly sandwiches and salads.","About a hundred guests.","The committee hasn't decided yet."],"answer":2,"exp":"คำถาม Which ถามว่าเลือกผู้ให้บริการรายใด C ตอบอ้อมว่าคณะกรรมการยังไม่ได้ตัดสินใจ ตัวลวง A เกี่ยวกับอาหาร (catering) แต่ไม่ได้ตอบว่าเลือกเจ้าไหน"},{"q":"Is the parking garage open on weekends?","opts":["Only on Saturday mornings.","I parked on level three.","It opens a new account."],"answer":0,"exp":"Yes/No question คำตอบ A ให้ข้อมูลเจาะจงว่าเปิดเฉพาะเช้าวันเสาร์ ตัวลวง B ซ้ำรากคำ park และ C ซ้ำคำ open ในความหมายอื่น"},{"q":"Why don't we ask Daniel to present the sales figures?","opts":["The figures were higher than expected.","That's a good idea; he knows them best.","Because the sale ends on Friday."],"answer":1,"exp":"'Why don't we...?' เป็นการเสนอแนะ ไม่ใช่ถามเหตุผล B ตอบรับข้อเสนอ ตัวลวง C ขึ้นต้นด้วย Because เพื่อหลอกให้คิดว่าเป็นคำถาม Why ทั่วไป"},{"q":"What time does the flight to Singapore depart?","opts":["Let me check the itinerary.","Gate twelve, I think.","A window seat, please."],"answer":0,"exp":"คำถาม What time ถามเวลา A เป็นคำตอบอ้อมว่าจะตรวจดูกำหนดการเดินทาง ตัวลวง B ตอบเรื่องประตูขึ้นเครื่อง และ C ตอบเรื่องที่นั่ง ซึ่งเกี่ยวกับการบินแต่ไม่ตรงคำถาม"},{"q":"Did you remember to back up the files on the shared drive?","opts":["It's a long drive to the office.","Please step back from the door.","I did it before I left yesterday."],"answer":2,"exp":"Yes/No question ถามว่าสำรองไฟล์แล้วหรือยัง C ตอบว่าทำแล้วก่อนกลับเมื่อวาน ตัวลวง A ใช้ drive ในความหมายขับรถ และ B ใช้ back ในความหมายถอยหลัง"},{"q":"Who's responsible for ordering office supplies?","opts":["Twice a month.","That changed when Paul retired.","Pens and sticky notes."],"answer":1,"exp":"คำถาม Who ถามผู้รับผิดชอบ B เป็นคำตอบอ้อมที่บอกว่าหน้าที่เปลี่ยนไปหลัง Paul เกษียณ (สื่อว่าไม่แน่ใจว่าใครทำตอนนี้) ซึ่งเป็นรูปแบบคำตอบที่พบบ่อยใน TOEIC ตัวลวง A ตอบความถี่ และ C ตอบชนิดของอุปกรณ์"},{"q":"Should I send the invoice by e-mail or by regular mail?","opts":["E-mail is faster.","Yes, I received it.","A total of three hundred dollars."],"answer":0,"exp":"คำถามแบบเลือก A ตอบว่า e-mail เร็วกว่า คือเลือก e-mail ตัวลวง B ตอบ Yes ซึ่งใช้กับคำถามเลือกไม่ได้ และ C เกี่ยวกับยอดเงินในใบแจ้งหนี้แต่ไม่ตอบคำถาม"},{"q":"I can't find the minutes from last week's board meeting.","opts":["The meeting lasted forty minutes.","Yes, it was on the board.","They're posted on the company intranet."],"answer":2,"exp":"ประโยคบอกเล่าว่าหาบันทึกการประชุม (minutes) ไม่เจอ C บอกว่าอยู่บนอินทราเน็ต ตัวลวง A ใช้ minutes ในความหมายนาที และ B ใช้ board ในความหมายกระดาน"},{"q":"How do I get to the regional office from the train station?","opts":["Take the number 9 bus to Elm Street.","It's a regional holiday.","I'll be in the office tomorrow."],"answer":0,"exp":"คำถาม How ถามวิธีการเดินทาง A บอกให้ขึ้นรถเมล์สาย 9 ตัวลวง B ซ้ำคำ regional และ C ซ้ำคำ office"},{"q":"Aren't you attending the marketing conference in Chicago?","opts":["The market opens at eight.","My manager asked me to stay and cover the front desk.","It was held in a large hall."],"answer":1,"exp":"คำถามปฏิเสธถามว่าจะไปประชุมหรือไม่ B ตอบอ้อมว่าหัวหน้าขอให้อยู่ดูแลเคาน์เตอร์ (แปลว่าไม่ได้ไป) ตัวลวง A ใช้ market ที่เสียงคล้าย marketing"},{"q":"Where can I find the updated safety guidelines?","opts":["Safety is our top priority.","They were updated in March.","They were e-mailed to everyone this morning."],"answer":2,"exp":"คำถาม Where C ตอบอ้อมว่าส่งอีเมลให้ทุกคนแล้วเมื่อเช้า (คือหาได้ในอีเมล) ตัวลวง B ซ้ำคำ updated แต่ตอบเรื่องเวลา และ A ซ้ำคำ safety"},{"q":"Let's reserve a larger room for the workshop.","opts":["The reservation number is on the screen.","How many people are we expecting?","I worked there for three years."],"answer":1,"exp":"ประโยคเสนอแนะ B ตอบด้วยคำถามกลับว่าคาดว่าจะมีคนกี่คน ซึ่งเป็นการตอบสนองที่สมเหตุสมผลก่อนตัดสินใจ ตัวลวง A ใช้ reservation ซ้ำรากคำ reserve และ C ใช้ worked ที่เสียงคล้าย workshop"},{"q":"This software update will fix the login problem, won't it?","opts":["That's what the IT team told me.","Please log off before you leave.","It was a soft drink."],"answer":0,"exp":"Tag question ถามว่าอัปเดตจะแก้ปัญหาได้ใช่ไหม A ตอบอ้อมว่าทีม IT บอกอย่างนั้น ตัวลวง B ใช้ log off ใกล้กับ login และ C ใช้ soft ที่เสียงคล้าย software"},{"q":"How long will the renovations to the lobby take?","opts":["The lobby is on the ground floor.","A new reception desk.","The contractor estimated about six weeks."],"answer":2,"exp":"คำถาม How long ถามระยะเวลา C บอกว่าผู้รับเหมาประเมินไว้ราวหกสัปดาห์ ตัวลวง A ซ้ำคำ lobby และ B บอกสิ่งที่จะปรับปรุง ไม่ใช่ระยะเวลา"},{"q":"Would you mind proofreading this press release before I send it out?","opts":["The press conference is at noon.","Not at all; leave it on my desk.","I already sent you the proof of purchase."],"answer":1,"exp":"'Would you mind...?' เป็นคำขอร้อง การตอบรับต้องใช้ 'Not at all' (ไม่รังเกียจ) B จึงถูก ตัวลวง A ซ้ำคำ press และ C ใช้ proof และ sent ซ้ำจากคำถาม"}],"p3":[{"lines":[{"sp":"W","t":"Hi, Daniel. Have you had a chance to look at the résumés for the marketing coordinator position?"},{"sp":"M","t":"I have. There are three candidates I'd like to interview, but one of them, Ms. Alvarez, lives in Toronto."},{"sp":"W","t":"That shouldn't be a problem. We can do her first interview by video call and only bring her in if she makes the final round."},{"sp":"M","t":"Good idea. That would save us on travel costs, too."},{"sp":"W","t":"Exactly. When were you hoping to schedule the interviews?"},{"sp":"M","t":"Sometime next week, ideally Tuesday or Wednesday. The department head wants someone in place before the spring campaign starts."},{"sp":"W","t":"All right. I'll send the candidates an e-mail this afternoon asking about their availability."},{"sp":"M","t":"Thanks. And please attach the job description so they know what to expect."}],"graphic":null,"qs":[{"q":"What are the speakers mainly discussing?","opts":["Planning a marketing campaign","Interviewing job applicants","Relocating to a new office","Reducing travel expenses"],"answer":1,"exp":"ผู้พูดคุยเรื่อง résumés และการนัดสัมภาษณ์ผู้สมัครตำแหน่ง marketing coordinator จึงตอบ (B) ส่วน (A) เป็นคำที่ได้ยินในบทสนทนา (spring campaign) แต่ไม่ใช่หัวข้อหลัก"},{"q":"What does the woman suggest doing for one candidate?","opts":["Offering her the job immediately","Paying for her flight","Asking her to move to a different branch","Interviewing her online first"],"answer":3,"exp":"ผู้หญิงเสนอว่า \"do her first interview by video call\" ซึ่งถอดความเป็น interviewing her online first (D) ส่วน (B) ผิดเพราะการทำแบบนี้จะช่วยประหยัดค่าเดินทาง ไม่ใช่จ่ายค่าเครื่องบิน"},{"q":"What will the woman do this afternoon?","opts":["Contact some candidates","Revise a job description","Meet with a department head","Book a conference room"],"answer":0,"exp":"ผู้หญิงพูดว่า \"I'll send the candidates an e-mail this afternoon\" = ติดต่อผู้สมัคร (A) ส่วน job description ผู้ชายแค่ขอให้แนบไปด้วย ไม่ได้ให้แก้ไข (B ผิด)"}]},{"lines":[{"sp":"M","t":"Good morning, Harper Office Supplies. How can I help you?"},{"sp":"W","t":"Hi, this is Rachel Kim from Linwood Dental. We ordered printer paper and toner cartridges last Monday, and they still haven't arrived."},{"sp":"M","t":"I'm sorry about that, Ms. Kim. Let me check your order... It looks like the toner is on back order from the manufacturer, so the whole shipment was held."},{"sp":"W","t":"Oh, I see. The thing is, we're almost out of paper. Could you send that part separately?"},{"sp":"M","t":"Certainly. I can ship the paper today, and it should reach you by tomorrow morning. The toner should follow by Friday."},{"sp":"W","t":"That would be great. Will there be an extra charge for the second delivery?"},{"sp":"M","t":"No, we'll cover the shipping. And I'll apply a ten percent discount to your order for the inconvenience."}],"graphic":null,"qs":[{"q":"Why is the woman calling?","opts":["To place a new order","To change a delivery address","To ask about a late shipment","To return damaged items"],"answer":2,"exp":"ผู้หญิงโทรมาเพราะสินค้าที่สั่ง \"still haven't arrived\" = สอบถามเรื่องการจัดส่งล่าช้า (C) ไม่ได้สั่งของใหม่ (A) และไม่ได้กล่าวถึงของเสียหาย (D)"},{"q":"What does the woman ask the man to do?","opts":["Send part of an order separately","Cancel the toner cartridges","Recommend a different brand","Deliver the items to another office"],"answer":0,"exp":"ผู้หญิงขอ \"Could you send that part separately?\" หมายถึงส่งกระดาษแยกก่อน (A) ตัวลวง (B) ผิดเพราะเธอไม่ได้ยกเลิก toner เพียงแต่รอรับทีหลัง"},{"q":"What does the man offer the woman?","opts":["A free box of paper","A store gift card","An upgraded printer","A reduced price"],"answer":3,"exp":"ผู้ชายบอกว่า \"I'll apply a ten percent discount\" = ราคาที่ลดลง (D) คำว่า discount ถูกถอดความเป็น reduced price ส่วน (A) ใช้คำว่า paper จากบทสนทนาเป็นกับดัก"}]},{"lines":[{"sp":"W","t":"Martin, I just heard from the Bayview Hotel. They said the main ballroom isn't available for our sales conference in May."},{"sp":"M","t":"Really? We booked it back in January."},{"sp":"W","t":"Apparently there was a mix-up with their reservation system. They're offering us two smaller rooms on the second floor instead, at no extra cost."},{"sp":"M","t":"Hmm. We're expecting over two hundred people, though."},{"sp":"W","t":"I know. I'm worried we'd have to split the keynote session between the rooms."},{"sp":"M","t":"Why don't you call the Grandview Center? They hosted the regional meeting last year, and it went smoothly."},{"sp":"W","t":"Good thinking. I'll ask whether they have anything open for the same dates. If they do, I'll cancel with Bayview."}],"graphic":null,"qs":[{"q":"What problem does the woman report?","opts":["A hotel has raised its prices.","A reserved room is no longer available.","A keynote speaker has canceled.","Some registration forms were lost."],"answer":1,"exp":"ผู้หญิงแจ้งว่า \"the main ballroom isn't available\" ทั้งที่จองไว้แล้ว จึงตอบ (B) ส่วน (A) ผิดเพราะโรงแรมเสนอห้องใหม่ \"at no extra cost\""},{"q":"What does the man mean when he says, \"We're expecting over two hundred people, though\"?","opts":["He is pleased with the number of registrations.","He thinks more food should be ordered.","He doubts the proposed rooms are suitable.","He wants to limit the number of attendees."],"answer":2,"exp":"ผู้ชายพูดประโยคนี้หลังได้ยินว่าโรงแรมเสนอ \"two smaller rooms\" จึงสื่อว่าห้องเล็กอาจไม่เหมาะกับคนจำนวนมาก (C) คำว่า though แสดงความขัดแย้ง ไม่ใช่ความพอใจ (A)"},{"q":"What will the woman probably do next?","opts":["Contact another venue","Visit the Bayview Hotel","Reschedule the conference","Send an e-mail to attendees"],"answer":0,"exp":"ผู้ชายแนะนำให้โทรหา Grandview Center และผู้หญิงตอบว่า \"I'll ask whether they have anything open\" = ติดต่อสถานที่อื่น (A) เธอจะยกเลิก Bayview ต่อเมื่อได้ที่ใหม่ ไม่ได้ไปเยี่ยม (B)"}]},{"lines":[{"sp":"M","t":"Excuse me, Priya, is your computer connecting to the shared drive? Mine keeps showing an error message."},{"sp":"W","t":"No, mine isn't either. I couldn't open the quarterly report this morning."},{"sp":"M2","t":"Hi, I'm Tom from IT. We've had several calls about this. We installed a security update on the server last night, and it's affecting access for some departments."},{"sp":"W","t":"Do you know how long it'll take to fix? I need to send that report to the finance director by three o'clock."},{"sp":"M2","t":"We're hoping to have it working within the hour. In the meantime, if you have a copy saved on your laptop, you can upload it to the cloud folder instead."},{"sp":"M","t":"I think I saved a draft on my desktop yesterday."},{"sp":"W","t":"Great, could you forward it to me? I can finish the last section while we wait."}],"graphic":null,"qs":[{"q":"What is the speakers' problem?","opts":["A printer is out of order.","A password has expired.","A report contains errors.","They cannot access some files."],"answer":3,"exp":"ทั้งสองคนเชื่อมต่อ shared drive ไม่ได้และเปิดรายงานไม่ได้ = เข้าถึงไฟล์ไม่ได้ (D) ตัวลวง (C) ใช้คำว่า report แต่ปัญหาไม่ได้อยู่ที่เนื้อหารายงาน"},{"q":"According to Tom, what caused the problem?","opts":["A power outage","A recent software update","A damaged cable","An increase in users"],"answer":1,"exp":"Tom บอกว่า \"We installed a security update on the server last night\" ซึ่งทำให้เกิดปัญหา = recent software update (B) ไม่มีการพูดถึงไฟดับหรือสายเสีย"},{"q":"What does the woman ask the man to do?","opts":["Call the finance director","Restart his computer","Send her a document","Postpone a deadline"],"answer":2,"exp":"ผู้หญิงขอ \"could you forward it to me?\" หมายถึงส่งไฟล์ draft ให้เธอ (C) ส่วน (D) ผิดเพราะเธอยังตั้งใจส่งให้ทันบ่ายสามโมง"}]},{"lines":[{"sp":"W","t":"Hello, I bought this blender here last week, but the lid doesn't fit properly. It leaks every time I use it."},{"sp":"M","t":"I'm sorry to hear that. Do you have your receipt with you?"},{"sp":"W","t":"Yes, here it is. I'd like to exchange it for the same model if possible."},{"sp":"M","t":"Let me check... Unfortunately, we've sold out of that model. But we have the newer version, which has a larger container and a stronger motor."},{"sp":"W","t":"How much more does that one cost?"},{"sp":"M","t":"It's normally twenty dollars more, but since this is our mistake, I'll give it to you at the same price."},{"sp":"W","t":"That's very kind. I'll take it."},{"sp":"M","t":"Wonderful. I'll just need you to fill out this short exchange form."}],"graphic":null,"qs":[{"q":"What is wrong with the woman's blender?","opts":["Part of it does not fit correctly.","It was missing from the box.","Its motor is too loud.","It was the wrong color."],"answer":0,"exp":"ผู้หญิงบอกว่า \"the lid doesn't fit properly\" = ชิ้นส่วนหนึ่งใส่ไม่พอดี (A) ส่วน (C) ใช้คำว่า motor จากบทสนทนาเป็นกับดัก"},{"q":"Why can't the woman get the same model?","opts":["It has been discontinued.","It is only sold online.","It is more expensive now.","It is out of stock."],"answer":3,"exp":"ผู้ชายพูดว่า \"we've sold out of that model\" = สินค้าหมด (D) คำว่า sold out ≠ discontinued (A) ซึ่งหมายถึงเลิกผลิต เป็นตัวลวงที่พบบ่อย"},{"q":"What does the man ask the woman to do?","opts":["Show a membership card","Complete a form","Come back another day","Pay a small fee"],"answer":1,"exp":"ผู้ชายบอก \"I'll just need you to fill out this short exchange form\" = กรอกแบบฟอร์ม (B) ส่วน (D) ผิดเพราะเขาให้ราคาเดิมโดยไม่คิดเงินเพิ่ม"}]},{"lines":[{"sp":"M","t":"Hi, I'm booked on the 4:15 flight to Singapore, but the board says it's been delayed."},{"sp":"W","t":"Yes, sir. There's a mechanical issue, and the new departure time is 7:30."},{"sp":"M","t":"That's a problem. I have a connecting flight to Jakarta that leaves Singapore at eleven. I'm going to miss it."},{"sp":"W","t":"Let me see what I can do. There's another airline with a direct flight to Jakarta at 5:50. I can transfer you to that one at no cost."},{"sp":"M","t":"Direct? That would actually get me there earlier. Please do that."},{"sp":"W","t":"All set. Here's your new boarding pass. You'll need to go to Terminal 2, and you can take the shuttle train just past security."},{"sp":"M","t":"Thanks. What about my checked suitcase?"},{"sp":"W","t":"We'll have it transferred automatically, so you can collect it in Jakarta."}],"graphic":null,"qs":[{"q":"Where most likely are the speakers?","opts":["At a train station","At a travel agency","At an airport","At a hotel front desk"],"answer":2,"exp":"บทสนทนาเกี่ยวกับเที่ยวบิน boarding pass และ security จึงอยู่ที่สนามบิน (C) ตัวลวง (A) มาจากคำว่า shuttle train"},{"q":"Why is the man concerned?","opts":["He might miss a connection.","He lost his boarding pass.","His seat assignment is wrong.","His luggage is too heavy."],"answer":0,"exp":"ผู้ชายบอก \"I'm going to miss it\" หมายถึงเที่ยวบินต่อไป Jakarta จึงตอบ (A) ไม่มีการพูดถึงน้ำหนักกระเป๋า (D)"},{"q":"What does the woman say about the man's suitcase?","opts":["It must be checked again.","It has been sent to Singapore.","It will be delivered to his hotel.","It will be moved to his new flight."],"answer":3,"exp":"ผู้หญิงบอก \"We'll have it transferred automatically\" และไปรับที่ Jakarta = ย้ายไปเที่ยวบินใหม่ (D) ส่วน (B) ผิดเพราะเขาไม่ได้ไป Singapore แล้ว"}]},{"lines":[{"sp":"W","t":"Mr. Okafor, thanks for meeting me at the property. As you can see, the space is on the ground floor with large front windows."},{"sp":"M","t":"It's nice and bright. I'm looking for a location for my second bakery, so foot traffic is important."},{"sp":"W","t":"Then you'll love this street. There's a subway entrance on the corner and two office towers across the road."},{"sp":"M","t":"What's the monthly rent?"},{"sp":"W","t":"It's forty-two hundred dollars, which includes water. The owner also asks for a two-year lease."},{"sp":"M","t":"I was hoping for something closer to thirty-five hundred."},{"sp":"W","t":"I understand. The owner might be flexible if you agree to a longer lease. Would you like me to ask?"},{"sp":"M","t":"Yes, please. And could you send me the floor plan so I can show my contractor?"}],"graphic":null,"qs":[{"q":"Why is the man interested in the property?","opts":["He is moving his family to the area.","He wants to open another business location.","He needs storage space for equipment.","He plans to rent it to an office tenant."],"answer":1,"exp":"ผู้ชายบอกว่า \"I'm looking for a location for my second bakery\" = ต้องการเปิดสาขาที่สอง (B) ส่วน (D) เป็นกับดักจากคำว่า office towers ที่นายหน้าพูดถึง"},{"q":"What does the man mean when he says, \"I was hoping for something closer to thirty-five hundred\"?","opts":["He would like a larger space.","He is ready to sign the lease today.","He thinks the rent is too high.","He has found a cheaper property."],"answer":2,"exp":"ผู้ชายพูดหลังได้ยินว่าค่าเช่า 4,200 ดอลลาร์ แสดงว่าเขาคิดว่าแพงเกินไป (C) นายหน้าจึงเสนอจะถามเจ้าของเรื่องความยืดหยุ่น ส่วน (D) ไม่มีข้อมูลว่าเขาเจอที่ถูกกว่า"},{"q":"What does the man ask the woman to send him?","opts":["A floor plan","A copy of the lease","A list of nearby properties","A contractor's estimate"],"answer":0,"exp":"ผู้ชายขอ \"could you send me the floor plan\" (A) ส่วน (D) ผิดเพราะเขาจะเอาแปลนไปให้ contractor ดูเอง ไม่ได้ขอใบประเมินราคา"}]},{"lines":[{"sp":"W","t":"Thanks for coming in, both of you. I'm Lena, the event manager here at Saffron Catering."},{"sp":"M","t":"Nice to meet you. I'm Kevin, and this is my colleague, Joanna. We're organizing a retirement lunch for our CEO next month."},{"sp":"W2","t":"We'll have about sixty guests, and we'd like a buffet rather than a seated meal."},{"sp":"W","t":"Of course. Our buffet package includes three main dishes, two salads, and dessert. Are there any dietary requirements?"},{"sp":"W2","t":"Yes, at least ten guests are vegetarian, and a few need gluten-free options."},{"sp":"W","t":"No problem. Our chef can prepare a vegetarian lasagna and a gluten-free dessert. Would you like to try some samples before you decide?"},{"sp":"M","t":"That would be helpful. Are you free on Thursday afternoon?"},{"sp":"W","t":"Thursday works. I'll have the kitchen prepare a tasting for two o'clock."}],"graphic":null,"qs":[{"q":"What event are the speakers discussing?","opts":["A product launch","A company anniversary","An awards dinner","A retirement celebration"],"answer":3,"exp":"Kevin บอกว่า \"We're organizing a retirement lunch for our CEO\" = งานเลี้ยงเกษียณ (D) ตัวเลือกอื่นเป็นงานบริษัทที่ฟังดูเป็นไปได้แต่ไม่ได้กล่าวถึง"},{"q":"What does Joanna mention about some guests?","opts":["They will arrive late.","They have special dietary needs.","They prefer a seated meal.","They are coming from overseas."],"answer":1,"exp":"Joanna บอกว่ามีแขกเป็น vegetarian และต้องการ gluten-free = ความต้องการด้านอาหารพิเศษ (B) ส่วน (C) ผิดเพราะเธอบอกว่าต้องการ buffet \"rather than a seated meal\""},{"q":"What will happen on Thursday?","opts":["A contract will be signed.","A deposit will be paid.","A food tasting will take place.","A menu will be printed."],"answer":2,"exp":"Lena บอก \"I'll have the kitchen prepare a tasting for two o'clock\" ในวันพฤหัสบดี = ชิมอาหาร (C) ไม่มีการพูดถึงสัญญาหรือมัดจำ"}]},{"lines":[{"sp":"M","t":"Sandra, have you finished reviewing next year's budget proposal for our department?"},{"sp":"W","t":"Almost. The main issue is that our training costs went up by almost fifteen percent this year."},{"sp":"M","t":"That's mostly because we sent staff to those workshops in Chicago. The airfare and hotels added up quickly."},{"sp":"W","t":"Right. I was thinking we could switch to online training courses. Several providers offer the same certifications for much less."},{"sp":"M","t":"That makes sense, though some employees really value meeting people at those events."},{"sp":"W","t":"True. Maybe we could keep one in-person workshop a year for senior staff and move everything else online."},{"sp":"M","t":"I like that compromise. Can you put together a cost comparison before Friday's management meeting?"},{"sp":"W","t":"Sure, I'll have it ready by Thursday."}],"graphic":null,"qs":[{"q":"What are the speakers mainly discussing?","opts":["Departmental spending","A hiring freeze","A new travel policy","Employee performance reviews"],"answer":0,"exp":"ทั้งสองพูดถึง budget proposal และค่าใช้จ่ายด้านการอบรม = การใช้จ่ายของแผนก (A) ส่วน (C) เป็นกับดักจากคำว่า airfare และ hotels"},{"q":"What does the woman suggest?","opts":["Hiring an outside consultant","Canceling all workshops","Holding training in Chicago","Using online courses"],"answer":3,"exp":"ผู้หญิงเสนอ \"switch to online training courses\" (D) ส่วน (B) ผิดเพราะเธอเสนอให้คงไว้หนึ่งงาน in-person ต่อปี"},{"q":"What does the man ask the woman to prepare?","opts":["A list of training providers","A cost comparison","A presentation for new staff","A workshop schedule"],"answer":1,"exp":"ผู้ชายขอ \"Can you put together a cost comparison\" = เตรียมการเปรียบเทียบค่าใช้จ่าย (B) วลี put together แปลว่า จัดทำ/รวบรวม"}]},{"lines":[{"sp":"W","t":"Okay, Raj, we're two weeks away from launching the new SmartBrew coffee maker. How are the preparations going?"},{"sp":"M","t":"Mostly on track. The promotional videos are finished, and the retailers have confirmed their orders."},{"sp":"W","t":"That's great. What about the packaging?"},{"sp":"M","t":"That's my one concern. The printer found a spelling mistake on the box, so they need to reprint about five thousand units."},{"sp":"W","t":"Will that delay the launch?"},{"sp":"M","t":"They've promised to finish by next Wednesday, which still gives us a few days before shipping."},{"sp":"W","t":"Good. Let's not take any chances, though. Could you visit the printing plant on Monday and check the new boxes yourself?"},{"sp":"M","t":"Sure. I'll take some photos and send them to the design team, too."}],"graphic":null,"qs":[{"q":"What product are the speakers discussing?","opts":["A video camera","A printer","A kitchen appliance","A mobile phone"],"answer":2,"exp":"สินค้าคือ SmartBrew coffee maker ซึ่งเป็นเครื่องใช้ในครัว (C) ตัวลวง (B) ใช้คำว่า printer ที่หมายถึงโรงพิมพ์กล่อง"},{"q":"What problem does the man mention?","opts":["Some packaging contains an error.","A retailer canceled an order.","A video needs to be reshot.","Shipping costs have increased."],"answer":0,"exp":"ผู้ชายบอกว่า \"The printer found a spelling mistake on the box\" = บรรจุภัณฑ์มีข้อผิดพลาด (A) ส่วน (B) ผิดเพราะ retailers ยืนยันคำสั่งซื้อแล้ว"},{"q":"What does the woman ask the man to do on Monday?","opts":["Contact some retailers","Revise a launch date","Meet with the design team","Inspect some products in person"],"answer":3,"exp":"ผู้หญิงขอให้ \"visit the printing plant on Monday and check the new boxes yourself\" = ไปตรวจด้วยตัวเอง (D) ส่วน (C) ผิดเพราะเขาแค่จะส่งรูปให้ทีมออกแบบ ไม่ได้ประชุม"}]},{"lines":[{"sp":"M","t":"Hi, I'd like to order some business cards for our new sales staff."},{"sp":"W","t":"Sure. How many cards does each person need?"},{"sp":"M","t":"Well, there are four new employees, and I think 250 cards each should be enough."},{"sp":"W","t":"Okay, so that's a thousand cards in total. Do you want standard or premium paper?"},{"sp":"M","t":"Standard is fine. We're trying to keep costs down this quarter."},{"sp":"W","t":"No problem. They'll be ready by Thursday. Would you like us to deliver them, or will you pick them up?"},{"sp":"M","t":"Delivery, please. Our office is just two blocks away, on Elm Street."},{"sp":"W","t":"Great. Then I just need you to e-mail me the names and job titles so I can set up the design."}],"graphic":{"title":"Business Card Prices (Standard Paper)","rows":[["Quantity","Price"],["250 cards","$30"],["500 cards","$50"],["1,000 cards","$85"],["2,000 cards","$150"]]},"qs":[{"q":"Who will the business cards be for?","opts":["Clients","New employees","Board members","Event guests"],"answer":1,"exp":"ผู้ชายสั่งนามบัตรให้ \"new sales staff\" และ \"four new employees\" (B) ส่วน (A) ไม่เกี่ยวเพราะนามบัตรเป็นของพนักงาน ไม่ใช่ลูกค้า"},{"q":"Look at the graphic. How much will the man most likely pay?","opts":["$30","$50","$85","$150"],"answer":2,"exp":"พนักงาน 4 คน คนละ 250 ใบ รวม 1,000 ใบ ตามตารางราคา $85 (C) ตัวลวง (A) คือราคา 250 ใบ ซึ่งเป็นจำนวนต่อคนเท่านั้น"},{"q":"What does the woman ask the man to send?","opts":["Employee information","A company logo","A delivery address","A payment receipt"],"answer":0,"exp":"ผู้หญิงขอให้ \"e-mail me the names and job titles\" = ข้อมูลพนักงาน (A) ส่วน (C) ผิดเพราะผู้ชายบอกที่อยู่ไปแล้วว่าอยู่ Elm Street"}]},{"lines":[{"sp":"W","t":"Excuse me, I'm here for a job interview at Kestrel Financial. Could you tell me which floor they're on?"},{"sp":"M","t":"Kestrel Financial? They used to be on the fourth floor, but they moved last month."},{"sp":"W","t":"Oh, really? The e-mail I got said the fourth floor."},{"sp":"M","t":"It must be an old template. They're now one floor above Brightline Legal. The directory hasn't been updated yet, sorry about that."},{"sp":"W","t":"No problem. Is there an elevator nearby?"},{"sp":"M","t":"Yes, just around the corner to your left. But you'll need a visitor's pass first. Could I see some photo identification?"},{"sp":"W","t":"Of course. Here's my driver's license."},{"sp":"M","t":"Thank you. Here's your pass. Please return it to this desk when you leave."}],"graphic":{"title":"Building Directory","rows":[["Floor","Tenant"],["2","Brightline Legal"],["3","Orchid Design Studio"],["4","Kestrel Financial"],["5","Pacific Health Clinic"]]},"qs":[{"q":"Why is the woman visiting the building?","opts":["To deliver a package","To see a doctor","To meet a client","To attend an interview"],"answer":3,"exp":"ผู้หญิงบอกว่า \"I'm here for a job interview\" (D) ส่วน (B) เป็นกับดักจาก Pacific Health Clinic ในป้ายรายชื่อ"},{"q":"Look at the graphic. Which floor will the woman go to?","opts":["Floor 3","Floor 2","Floor 4","Floor 5"],"answer":0,"exp":"ผู้ชายบอกว่า Kestrel ย้ายไปอยู่ \"one floor above Brightline Legal\" ซึ่งอยู่ชั้น 2 จึงเป็นชั้น 3 (A) ส่วนชั้น 4 (C) เป็นข้อมูลเก่าในป้ายที่ยังไม่อัปเดต"},{"q":"What does the man ask the woman for?","opts":["A business card","An appointment time","Photo identification","A visitor's signature"],"answer":2,"exp":"ผู้ชายขอ \"Could I see some photo identification?\" ซึ่งผู้หญิงยื่นใบขับขี่ให้ (C) ส่วน (D) ไม่มีการขอลายเซ็น"}]},{"lines":[{"sp":"M","t":"Amy, I'm finalizing the schedule for Saturday's training day for new store managers. Do you have a minute?"},{"sp":"W","t":"Sure. Is there a problem?"},{"sp":"M","t":"Kenji Watanabe just called. His flight from Osaka was rescheduled, so he can't arrive in time for his morning session."},{"sp":"W","t":"Can he switch with someone in the afternoon?"},{"sp":"M","t":"That's what I was thinking. Maria said she could move her session to the morning, so they'd just swap time slots."},{"sp":"W","t":"That should work. But we'll need to tell the participants. They already received the printed schedule."},{"sp":"M","t":"Right. I'll send an updated version by e-mail this evening."},{"sp":"W","t":"Good. And I'll ask the front desk to post a notice at the entrance on Saturday morning."}],"graphic":{"title":"Manager Training Day - Saturday","rows":[["Time","Session","Presenter"],["9:00 A.M.","Inventory Control","Kenji Watanabe"],["10:30 A.M.","Customer Service","David Chen"],["1:00 P.M.","Staff Scheduling","Maria Lopez"],["2:30 P.M.","Sales Reporting","Hannah Brooks"]]},"qs":[{"q":"Why is Mr. Watanabe unable to attend his session?","opts":["He is feeling unwell.","He has another meeting.","He forgot about the event.","His travel plans have changed."],"answer":3,"exp":"ผู้ชายบอกว่า \"His flight from Osaka was rescheduled\" = แผนการเดินทางเปลี่ยน (D) ส่วน (B) ผิดเพราะไม่ได้มีประชุมอื่น ปัญหาคือเที่ยวบินถูกเลื่อน"},{"q":"Look at the graphic. What time will the Inventory Control session most likely begin?","opts":["9:00 A.M.","10:30 A.M.","1:00 P.M.","2:30 P.M."],"answer":2,"exp":"Kenji (Inventory Control 9:00) จะสลับเวลากับ Maria ซึ่งเดิมสอน 1:00 P.M. ดังนั้นเซสชันของ Kenji จะเริ่ม 1:00 P.M. (C) ตัวลวง (A) คือเวลาเดิมก่อนสลับ"},{"q":"What will the woman do?","opts":["Print new schedules","Arrange for a notice to be displayed","Call the participants","Contact Ms. Lopez"],"answer":1,"exp":"ผู้หญิงบอก \"I'll ask the front desk to post a notice at the entrance\" = จัดให้มีการติดประกาศ (C) ส่วนการส่งตารางใหม่ทางอีเมลเป็นหน้าที่ของผู้ชาย"}]}],"p4":[{"kind":"telephone message","sp":"W","graphic":null,"t":"Hi, Mr. Patel, this is Linda Cho from Brightway Office Interiors. I'm calling about the conference room furniture you ordered last week. Unfortunately, our supplier has informed us that the walnut finish you selected for the table is temporarily out of stock, and it won't be available again until the end of next month. I know you wanted everything in place before your new staff arrive on the fifteenth, so I'd like to suggest an alternative. We do have the same table in a dark oak finish, which looks very similar, and we could deliver it this Friday. If you choose that option, we'll also take ten percent off the total price for the inconvenience. Could you call me back at 555-0182 by tomorrow afternoon to let me know what you'd like to do? Thanks.","qs":[{"q":"Why is the speaker calling?","opts":["To confirm a delivery address","To report a problem with an order","To request payment for an invoice","To schedule a furniture installation"],"answer":1,"exp":"ผู้พูดโทรมาแจ้งว่าสีไม้ walnut ที่สั่งไว้ out of stock จึงเป็นการแจ้งปัญหาของคำสั่งซื้อ ตัวเลือก D มีคำว่า furniture ซ้ำจากบทพูดแต่ไม่ใช่จุดประสงค์หลัก"},{"q":"What does the speaker offer?","opts":["Free assembly service","An extended warranty","A larger table","A discount"],"answer":3,"exp":"ผู้พูดบอกว่า we'll also take ten percent off the total price ซึ่งก็คือส่วนลด (discount) ตัวเลือกอื่นไม่ได้กล่าวถึง"},{"q":"What does the speaker ask the listener to do?","opts":["Return a call","Visit a showroom","Send a floor plan","Sign a contract"],"answer":0,"exp":"ท้ายข้อความขอให้ Could you call me back ... by tomorrow afternoon คือให้โทรกลับ (return a call) ส่วน showroom ไม่ได้กล่าวถึง"}]},{"kind":"announcement","sp":"M","graphic":null,"t":"Attention, Greenleaf Market shoppers. Thank you for shopping with us this evening. We'd like to remind you that our store will be closing in thirty minutes, at nine o'clock. Please bring your final selections to the front registers. If you're in a hurry, our self-checkout lanes near the bakery are open and currently have no waiting. Also, starting this Saturday, Greenleaf Market will be extending its weekend hours. We'll open at seven A.M. instead of eight on both Saturdays and Sundays, so you can pick up fresh bread and coffee before your weekend activities. And don't forget to download the Greenleaf app. Members who sign up this month receive a coupon for five dollars off their next purchase of twenty-five dollars or more. Thank you, and have a good night.","qs":[{"q":"Where is the announcement being made?","opts":["At a bakery","At a coffee shop","At a grocery store","At a shopping mall"],"answer":2,"exp":"คำว่า Greenleaf Market shoppers และ registers บ่งบอกว่าเป็นซูเปอร์มาร์เก็ต/ร้านขายของชำ ตัวเลือก A เป็นกับดักเพราะได้ยินคำว่า bakery แต่เป็นเพียงจุดหนึ่งในร้าน"},{"q":"What will change this weekend?","opts":["The opening time","The location of the registers","The price of coffee","The store's name"],"answer":0,"exp":"ผู้พูดบอกว่า We'll open at seven A.M. instead of eight คือเวลาเปิดร้านเปลี่ยน ส่วน coffee เป็นคำซ้ำที่ใช้หลอก"},{"q":"According to the speaker, how can listeners receive a coupon?","opts":["By spending over fifty dollars","By completing a survey","By using a self-checkout lane","By registering through an app"],"answer":3,"exp":"Members who sign up (ลงทะเบียน) for the app this month จะได้คูปอง 5 ดอลลาร์ ตัวเลือก A ผิดเพราะยอดที่กล่าวถึงคือ 25 ดอลลาร์และเป็นเงื่อนไขการใช้คูปอง ไม่ใช่การได้รับ"}]},{"kind":"meeting excerpt","sp":"W","graphic":null,"t":"Before we finish, I want to talk about the customer feedback from our new online booking system. Overall, the response has been positive. Clients like being able to schedule appointments at any time of day. However, a number of users have told us the confirmation e-mails are going to their spam folders, so they're not sure whether their bookings went through. As a result, our receptionists have been getting a lot of calls just to check reservations. The IT team says they can fix the e-mail issue, but it'll take about two weeks. Two weeks is a long time. In the meantime, I'd like each of you to mention the spam folder issue when you speak to clients, and remind them that they can also view their bookings by logging in to their account on our Web site. I'll send out a short script you can use.","qs":[{"q":"What has the business recently introduced?","opts":["A customer loyalty program","An online booking system","A new reception area","An updated price list"],"answer":1,"exp":"ผู้พูดกล่าวถึง feedback from our new online booking system ดังนั้นสิ่งที่เพิ่งนำมาใช้คือระบบจองออนไลน์ ตัวเลือก C ใช้คำว่า reception หลอกจาก receptionists"},{"q":"What does the speaker imply when she says, \"Two weeks is a long time\"?","opts":["She thinks the IT team should hire more staff.","She is pleased with the team's progress.","She wants to address the problem before it is fixed.","She plans to postpone a product launch."],"answer":2,"exp":"หลังพูดประโยคนี้ เธอขอให้พนักงานแจ้งลูกค้าเรื่อง spam folder ระหว่างรอ (In the meantime) แสดงว่าต้องการรับมือปัญหาก่อนที่ IT จะแก้เสร็จ ไม่ได้พอใจกับความคืบหน้า (B)"},{"q":"What will the speaker send to the listeners?","opts":["A script","A schedule","A survey","A password"],"answer":0,"exp":"ประโยคสุดท้าย I'll send out a short script you can use คือจะส่งบทพูด (script) ให้ ส่วน password เป็นกับดักจากคำว่า logging in"}]},{"kind":"radio broadcast","sp":"M","graphic":null,"t":"You're listening to Business Hour on WKRT Radio. In local news, Harborview Shipyards has announced plans to build a second facility on the east side of the city. The company, which builds and repairs small passenger ferries, says demand for its services has grown steadily over the past three years, mainly because of new ferry routes along the coast. The new facility is expected to create around three hundred jobs, and construction should begin early next spring. Not everyone is enthusiastic, however. Some residents near the proposed site have raised concerns about increased truck traffic in the area. To address these concerns, the city council will hold a public meeting next Thursday evening at the community center. After the break, we'll hear from Harborview's chief executive, Monica Reyes, who joins us in the studio.","qs":[{"q":"What is the broadcast mainly about?","opts":["A new ferry route","A change in city leadership","The opening of a community center","A company's expansion plans"],"answer":3,"exp":"เนื้อหาหลักคือ Harborview Shipyards ประกาศสร้างโรงงานแห่งที่สอง ซึ่งเป็นการขยายกิจการ (expansion) ตัวเลือก A เป็นเพียงสาเหตุที่ความต้องการเพิ่มขึ้น ไม่ใช่หัวข้อหลัก"},{"q":"What concern have some residents expressed?","opts":["Rising housing costs","Increased traffic","Loss of parkland","Noise from construction"],"answer":1,"exp":"ผู้อยู่อาศัยกังวลเรื่อง increased truck traffic ตัวเลือก D ฟังดูเป็นไปได้แต่ไม่ได้ถูกกล่าวถึง"},{"q":"What will happen after the break?","opts":["A weather report will be given.","Listeners will call in with questions.","An executive will be interviewed.","A council meeting will be broadcast."],"answer":2,"exp":"After the break, we'll hear from Harborview's chief executive ... who joins us in the studio คือจะสัมภาษณ์ผู้บริหาร ส่วน council meeting จะจัดวันพฤหัสหน้า ไม่ใช่หลังเบรก"}]},{"kind":"tour information","sp":"W","graphic":null,"t":"Good morning, everyone, and welcome to the Calloway Chocolate Factory. My name is Grace, and I'll be guiding you through our production area today. The tour will last about an hour. We'll begin in the roasting room, where cocoa beans from Ghana and Ecuador are roasted at carefully controlled temperatures. Then we'll move on to the molding line, which produces around forty thousand chocolate bars every day. For safety and hygiene reasons, I'll need everyone to put on one of the hairnets in the basket next to me before we enter. Also, please keep your phones in your pockets, because photography isn't permitted inside the production area. At the end of the tour, we'll stop by our tasting room, where you'll be able to sample several of our new seasonal flavors, and you'll each receive a voucher for our gift shop.","qs":[{"q":"Who most likely is the speaker?","opts":["A tour guide","A factory engineer","A shop cashier","A food inspector"],"answer":0,"exp":"ผู้พูดบอกว่า I'll be guiding you through our production area จึงเป็นไกด์นำเที่ยว ตัวเลือก D เป็นกับดักเพราะมีการพูดถึง hygiene"},{"q":"What are the listeners asked to do before entering?","opts":["Turn off their phones","Sign a safety form","Wash their hands","Put on hairnets"],"answer":3,"exp":"ผู้พูดขอให้ put on one of the hairnets ก่อนเข้า ตัวเลือก A ผิดเพราะให้เก็บโทรศัพท์ไว้ในกระเป๋า (keep in pockets) ไม่ได้ให้ปิดเครื่อง"},{"q":"What will the listeners receive at the end of the tour?","opts":["A box of chocolates","A gift shop voucher","A product catalog","A discount on a future tour"],"answer":1,"exp":"you'll each receive a voucher for our gift shop คือได้คูปองร้านของที่ระลึก ส่วนช็อกโกแลตเป็นแค่การชิม (sample) ไม่ได้ให้เป็นกล่อง"}]},{"kind":"instructions","sp":"M","graphic":null,"t":"Okay, everyone, thanks for coming in early for this training session. As you know, starting Monday, all expense reports will be submitted through the new Expensa software instead of on paper forms. I'll walk you through the basic steps now. First, take a photo of each receipt with your phone using the Expensa mobile app. The app automatically reads the amount and date, so you don't have to type them in. Then, choose a category, such as travel or client entertainment, and press submit. Your manager will get a notification right away. Now, I know some of you have been asking whether the old forms will still be accepted for trips taken this month. Accounting closes the books on the thirtieth. So please don't wait. If you have any trouble installing the app, Ken from the help desk will be at the front table after this session.","qs":[{"q":"What is the purpose of the talk?","opts":["To announce a change in travel policy","To introduce a new accounting manager","To explain how to use some software","To review a department budget"],"answer":2,"exp":"ผู้พูดอธิบายขั้นตอนการใช้ซอฟต์แวร์ Expensa สำหรับเบิกค่าใช้จ่าย ตัวเลือก A เป็นกับดักเพราะมีคำว่า travel แต่ไม่ได้เปลี่ยนนโยบายการเดินทาง"},{"q":"Why does the speaker say, \"Accounting closes the books on the thirtieth\"?","opts":["To encourage listeners to submit expenses soon","To explain why a meeting was rescheduled","To correct an error in a report","To announce a new holiday schedule"],"answer":0,"exp":"ประโยคนี้ตอบคำถามเรื่องการใช้ฟอร์มเก่า และตามด้วย So please don't wait แปลว่าต้องการให้ส่งค่าใช้จ่ายโดยเร็วก่อนปิดบัญชีวันที่ 30 (close the books = ปิดงบบัญชี)"},{"q":"According to the speaker, what will Ken do?","opts":["Approve expense reports","Help with app installation","Collect paper forms","Lead the next training session"],"answer":1,"exp":"If you have any trouble installing the app, Ken from the help desk will be at the front table แปลว่า Ken จะช่วยเรื่องติดตั้งแอป ส่วนการอนุมัติเป็นหน้าที่ของ manager"}]},{"kind":"advertisement","sp":"W","graphic":null,"t":"Is your small business ready to grow, but your office space isn't? At Northgate Workspace, we offer fully furnished private offices and shared desks on flexible monthly terms, so you never have to commit to a long-term lease. Every membership includes high-speed Internet, printing services, and access to our modern meeting rooms, which can be reserved online at any hour. Our building is just a two-minute walk from Central Station, making it easy for your staff and clients to reach us. And unlike many other providers, we have a staffed front desk to receive your mail and greet your visitors. This month only, new members who sign a six-month agreement will get their first month free. To arrange a tour, visit northgateworkspace.com or stop by our location on Fenwick Street.","qs":[{"q":"What is being advertised?","opts":["A moving company","An office furniture store","A printing service","Rental workspaces"],"answer":3,"exp":"โฆษณาเสนอ private offices and shared desks on flexible monthly terms คือพื้นที่ทำงานให้เช่า ตัวเลือก B และ C เป็นคำที่ได้ยิน (furnished, printing) แต่เป็นเพียงบริการเสริม"},{"q":"What does the speaker say makes the business different from competitors?","opts":["Its low prices","Its 24-hour security","Its front desk staff","Its free parking"],"answer":2,"exp":"unlike many other providers, we have a staffed front desk คือจุดต่างจากคู่แข่ง (unlike = ไม่เหมือน) ส่วนการจองห้องตลอดเวลาไม่ใช่ 24-hour security"},{"q":"How can listeners receive a free month?","opts":["By signing a six-month agreement","By referring a new member","By booking a tour online","By paying for a full year"],"answer":0,"exp":"new members who sign a six-month agreement will get their first month free ตัวเลือก C เป็นกับดักเพราะการนัดชมสถานที่ไม่ได้ทำให้ได้เดือนฟรี"}]},{"kind":"introduction","sp":"M","graphic":null,"t":"Good evening, and thank you all for attending the annual awards dinner of the Regional Architects' Association. It's my pleasure to introduce our keynote speaker, Dr. Helena Fischer. Dr. Fischer is a professor of urban design at Westbrook University and the author of the best-selling book Cities for People. Over the past decade, she has advised more than twenty city governments on how to make public spaces more accessible and environmentally friendly. Most recently, she led the redesign of Portside Square, which won this year's National Design Award. Tonight, she'll be sharing some lessons from that project. After her talk, Dr. Fischer has kindly agreed to sign copies of her book, which are available for purchase at the table near the entrance. Please join me in welcoming Dr. Fischer.","qs":[{"q":"Where most likely are the listeners?","opts":["At a university lecture","At an awards dinner","At a city council meeting","At a book launch"],"answer":1,"exp":"ประโยคแรกกล่าวว่า thank you all for attending the annual awards dinner ตัวเลือก D เป็นกับดักเพราะมีการเซ็นหนังสือหลังพูด แต่ไม่ใช่งานเปิดตัวหนังสือ"},{"q":"What recent accomplishment of Dr. Fischer does the speaker mention?","opts":["She was promoted to department head.","She opened her own architecture firm.","She published a second book.","She led an award-winning project."],"answer":3,"exp":"Most recently, she led the redesign of Portside Square, which won this year's National Design Award คือโครงการที่ได้รับรางวัล ตัวเลือก C ผิดเพราะกล่าวถึงหนังสือเล่มเดียว"},{"q":"According to the speaker, what will Dr. Fischer do after her talk?","opts":["Answer questions from the audience","Present an award","Sign books","Lead a tour of a square"],"answer":2,"exp":"Dr. Fischer has kindly agreed to sign copies of her book จึงจะเซ็นหนังสือ ส่วนการตอบคำถามไม่ได้ถูกกล่าวถึง"}]},{"kind":"announcement","sp":"W","graphic":{"title":"Departures - Platform Information","rows":[["Destination","Departure","Platform"],["Lakeside","10:15","2"],["Millbrook","10:30","4"],["Ashford","10:45","5"],["Carlton Bay","11:00","7"]]},"t":"Good morning, passengers. This is an announcement for those traveling on the ten forty-five service to Ashford. Due to signal repairs on the line, this train will now depart from platform seven instead of its usual platform. Please note that the departure time has not changed. We apologize for any inconvenience. Passengers who need assistance with heavy luggage or who require step-free access to platform seven may ask any staff member wearing a green vest, and they'll be glad to help. Also, because of the ongoing repair work, there will be a short delay on all services to Carlton Bay this morning. Those trains are expected to leave about fifteen minutes later than scheduled. Updated times will be displayed on the screens throughout the station. Please also remember that the station café is now located next to the main ticket office.","qs":[{"q":"What has caused the change?","opts":["Repair work","Bad weather","A staff shortage","A special event"],"answer":0,"exp":"ผู้พูดกล่าวว่า Due to signal repairs on the line จึงเป็นงานซ่อมแซม ตัวเลือกอื่นไม่ได้กล่าวถึง"},{"q":"Look at the graphic. Which platform information is no longer correct?","opts":["Platform 2","Platform 4","Platform 5","Platform 7"],"answer":2,"exp":"รถไฟไป Ashford เวลา 10:45 ตามตารางคือ platform 5 แต่ประกาศว่าเปลี่ยนเป็น platform 7 ดังนั้นข้อมูล platform 5 ไม่ถูกต้องแล้ว ตัวเลือก D เป็นกับดักเพราะเป็นชานชาลาใหม่ที่ได้ยินในประกาศ"},{"q":"What are listeners who need help told to do?","opts":["Go to the ticket office","Call a help line","Check the station screens","Speak to a staff member"],"answer":3,"exp":"ผู้ที่ต้องการความช่วยเหลือให้ ask any staff member wearing a green vest ส่วน ticket office เป็นกับดักที่ได้ยินในประโยคเรื่องคาเฟ่"}]},{"kind":"talk","sp":"M","graphic":{"title":"Catering Options - Per Person","rows":[["Package","Price"],["Basic Breakfast","$12"],["Continental Plus","$18"],["Deluxe Lunch","$25"],["Executive Buffet","$32"]]},"t":"Okay, team, let's go over the plans for next month's sales conference. As you know, we've reserved the main hall at the Riverside Hotel for two days, and we're expecting about one hundred and twenty participants. I've just received the catering menu from the hotel. Last year, attendees complained that the breakfast was too light, so I've decided against the cheapest option. However, our budget is limited, so we can't go for the lunch packages either. I'll be booking the package that's next in price above the basic breakfast. Now, the other thing we need is people to staff the registration table on both mornings. I'll need two volunteers each day. Please send me an e-mail by Wednesday if you're available. Finally, Rachel is designing the conference program, so if you have anything you'd like included, contact her directly.","qs":[{"q":"What event is the speaker discussing?","opts":["A product launch","A sales conference","A hotel opening","A training workshop"],"answer":1,"exp":"ผู้พูดเริ่มด้วย let's go over the plans for next month's sales conference ตัวเลือก C เป็นกับดักเพราะงานจัดที่โรงแรมแต่ไม่ใช่การเปิดโรงแรม"},{"q":"Look at the graphic. How much per person will the speaker most likely pay for catering?","opts":["$18","$12","$25","$32"],"answer":0,"exp":"ผู้พูดไม่เลือกแพ็กเกจถูกสุด (Basic Breakfast $12) และไม่เลือกแพ็กเกจมื้อกลางวัน แต่จะจองแพ็กเกจที่ราคาถัดจาก basic breakfast คือ Continental Plus $18 ตัวเลือก B คือราคาที่ถูกปฏิเสธ"},{"q":"Why should listeners contact Rachel?","opts":["To volunteer at the registration table","To request a hotel room","To change a catering order","To suggest content for a program"],"answer":3,"exp":"Rachel is designing the conference program, so if you have anything you'd like included, contact her คือให้เสนอเนื้อหาสำหรับกำหนดการ ตัวเลือก A ผิดเพราะการอาสาต้องส่งอีเมลถึงผู้พูด"}]}],"p5":[{"q":"Ms. Tanaka gave a very ------- presentation on the company's new marketing strategy.","opts":["persuade","persuasive","persuasively","persuasion"],"answer":1,"exp":"หลัง very และหน้าคำนาม presentation ต้องใช้คำคุณศัพท์ (adjective) จึงตอบ persuasive (โน้มน้าวใจ) ส่วน persuasively เป็น adverb ขยายคำนามไม่ได้"},{"q":"By the time the new CEO arrives next month, the company ------- its headquarters to Denver.","opts":["relocates","relocated","will have relocated","has been relocating"],"answer":2,"exp":"By the time + present simple (arrives) บอกเหตุการณ์อนาคต จึงใช้ future perfect (will have relocated) เพื่อบอกว่าการย้ายจะเสร็จก่อนเวลานั้น"},{"q":"All employees must submit their expense reports ------- Friday at 5 P.M.","opts":["by","until","within","among"],"answer":0,"exp":"by + เวลา = ภายใน/ไม่เกินเวลานั้น ใช้กับการกระทำที่เกิดครั้งเดียวอย่าง submit ส่วน until ใช้กับการกระทำต่อเนื่อง (เช่น wait until) จึงเป็นตัวลวง"},{"q":"Because of the heavy snowfall, the outdoor company picnic has been ------- until next Saturday.","opts":["prevented","retained","excluded","postponed"],"answer":3,"exp":"postpone ... until = เลื่อนออกไปจนถึง เข้ากับบริบทหิมะตกหนัก คำอื่น prevented (ป้องกัน), retained (คงไว้), excluded (ยกเว้น) ไม่เข้ากับ until next Saturday"},{"q":"Mr. Patel asked that the files be sent directly to ------- rather than to his assistant.","opts":["him","his","himself","he"],"answer":0,"exp":"หลังบุพบท to ต้องใช้สรรพนามกรรม (object pronoun) him ส่วน himself ใช้เมื่อประธานและกรรมเป็นคนเดียวกันในอนุประโยคเดียวกัน ซึ่งที่นี่ประธานของ be sent คือ the files"},{"q":"The new software has significantly improved the ------- of our customer service team.","opts":["efficient","efficiently","efficiency","more efficient"],"answer":2,"exp":"หลัง the และหน้า of ต้องใช้คำนาม efficiency (ประสิทธิภาพ) ส่วน efficient เป็นคุณศัพท์และ efficiently เป็นกริยาวิเศษณ์"},{"q":"------- the budget was approved late, the project was completed on schedule.","opts":["Despite","Although","Because","Unless"],"answer":1,"exp":"ช่องว่างตามด้วยอนุประโยคเต็ม (the budget was approved) จึงต้องใช้คำสันธาน Although (แม้ว่า) ซึ่งแสดงความขัดแย้ง ส่วน Despite เป็นบุพบทต้องตามด้วยคำนาม จึงเป็นตัวลวง"},{"q":"The quarterly sales figures ------- to all regional managers yesterday afternoon.","opts":["distributed","were distributing","have distributed","were distributed"],"answer":3,"exp":"ตัวเลขยอดขายถูกแจกจ่าย จึงต้องใช้ passive voice และมี yesterday afternoon จึงใช้ past simple passive คือ were distributed ส่วน distributed (active) ผิดเพราะตัวเลขแจกจ่ายเองไม่ได้"},{"q":"Applicants for the position should have at least five years of ------- experience in project management.","opts":["reliable","relative","relevant","resolved"],"answer":2,"exp":"relevant experience = ประสบการณ์ที่เกี่ยวข้อง เป็นสำนวนที่พบบ่อยในประกาศรับสมัครงาน ส่วน relative (สัมพัทธ์/ญาติ) สะกดคล้ายจึงเป็นตัวลวง"},{"q":"Sales of the compact model have increased ------- since the price reduction in March.","opts":["steadily","steady","steadiness","steadied"],"answer":0,"exp":"ช่องว่างขยายกริยา increased จึงต้องใช้ adverb คือ steadily (อย่างสม่ำเสมอ) ส่วน steady เป็นคุณศัพท์"},{"q":"The conference room on the third floor is available ------- 2 P.M. and 4 P.M. on Thursday.","opts":["among","through","from","between"],"answer":3,"exp":"โครงสร้าง between A and B = ระหว่าง A กับ B ส่วน from ต้องคู่กับ to (from 2 P.M. to 4 P.M.) จึงใช้กับ and ไม่ได้"},{"q":"Ms. Ruiz was ------- to the position of regional director after ten years with the firm.","opts":["advanced","promoted","proceeded","raised"],"answer":1,"exp":"be promoted to + ตำแหน่ง = ได้รับการเลื่อนตำแหน่ง ส่วน proceeded เป็นกริยาที่ไม่มีกรรม ใช้รูป passive ไม่ได้ และ raised ใช้กับเงินเดือน (a raise) มากกว่าตำแหน่ง"},{"q":"Each ------- will receive a confirmation e-mail within 24 hours of registering.","opts":["participate","participation","participant","participatory"],"answer":2,"exp":"หลัง Each ต้องใช้คำนามนับได้เอกพจน์ที่เป็นบุคคลซึ่งรับอีเมลได้ คือ participant (ผู้เข้าร่วม) ส่วน participation เป็นคำนามนามธรรม (การมีส่วนร่วม)"},{"q":"Mr. Chen ------- for Halvorsen Logistics since he graduated from university in 2015.","opts":["has worked","works","worked","is working"],"answer":0,"exp":"since + จุดเวลาในอดีต บอกการกระทำที่เริ่มในอดีตและต่อเนื่องถึงปัจจุบัน จึงใช้ present perfect (has worked) ส่วน worked (past simple) ใช้กับ since ในประโยคหลักไม่ได้"},{"q":"The shipment will be delayed ------- the supplier can resolve the problem with its packaging equipment.","opts":["while","so that","even if","unless"],"answer":3,"exp":"unless = เว้นแต่/ถ้าไม่ ความหมายคือสินค้าจะล่าช้าหากผู้ผลิตแก้ปัญหาไม่ได้ ส่วน so that (เพื่อที่จะ) และ even if (แม้ว่า) ทำให้ความหมายไม่สมเหตุสมผล"},{"q":"The marketing team completed the campaign proposal by ------- without help from outside consultants.","opts":["them","themselves","their","they"],"answer":1,"exp":"by + reflexive pronoun (by themselves) = ด้วยตัวเอง/โดยลำพัง ซึ่งเข้ากับ without help ส่วน them เป็นสรรพนามกรรมธรรมดาที่ไม่ได้ให้ความหมายว่าทำเอง"},{"q":"To ------- that all orders are processed promptly, we have hired three additional warehouse staff.","opts":["assure","insure","ensure","confirm"],"answer":2,"exp":"ensure that = ทำให้แน่ใจว่า ใช้กับผลลัพธ์ที่ต้องการ ส่วน assure ต้องตามด้วยบุคคล (assure someone that) และ insure หมายถึงทำประกัน จึงเป็นตัวลวง"},{"q":"The museum's new wing is ------- larger than the original building.","opts":["considerably","considerable","consideration","considerate"],"answer":0,"exp":"ช่องว่างขยายคุณศัพท์ขั้นกว่า larger จึงต้องใช้ adverb คือ considerably (อย่างมาก) ส่วน considerate แปลว่าเกรงใจผู้อื่น"},{"q":"Please direct all inquiries regarding the job opening ------- Ms. Olsen in Human Resources.","opts":["at","for","with","to"],"answer":3,"exp":"direct something to someone = ส่งเรื่องไปยังบุคคลใด จึงใช้ to ส่วน at ใช้กับ direct ในความหมายเล็งไปที่ ไม่ใช่การส่งคำถามให้บุคคล"},{"q":"The new parking regulations ------- into effect on the first of next month.","opts":["came","will come","have come","coming"],"answer":1,"exp":"on the first of next month เป็นเวลาในอนาคต จึงใช้ will come (come into effect = มีผลบังคับใช้) ส่วน came และ have come เป็นอดีต ส่วน coming ไม่ใช่กริยาแท้"},{"q":"Ticket holders should arrive early, as seating in the auditorium is ------- limited.","opts":["extreme","extremity","extremely","extremes"],"answer":2,"exp":"ช่องว่างขยายคุณศัพท์ limited จึงต้องใช้ adverb คือ extremely (อย่างยิ่ง) ส่วน extreme เป็นคุณศัพท์ ขยายคุณศัพท์ด้วยกันไม่ได้"},{"q":"The company's annual report provides a detailed ------- of its financial performance over the past year.","opts":["overview","outlook","overtime","outcome"],"answer":0,"exp":"a detailed overview of = ภาพรวมโดยละเอียดของ เข้ากับรายงานประจำปี ส่วน outlook หมายถึงแนวโน้มในอนาคต ซึ่งไม่เข้ากับ over the past year"},{"q":"Visitors may use the fitness center ------- they present a valid room key at the front desk.","opts":["in case","whereas","unless","provided that"],"answer":3,"exp":"provided that = โดยมีเงื่อนไขว่า ใช้บอกเงื่อนไขในการใช้บริการ ส่วน unless ให้ความหมายตรงข้าม (ใช้ได้ถ้าไม่แสดงกุญแจ) และ in case หมายถึงเผื่อในกรณีที่"},{"q":"Mr. Kim's ------- to detail made him the ideal candidate for the auditing position.","opts":["attentive","attention","attend","attentively"],"answer":1,"exp":"หลังคำแสดงความเป็นเจ้าของ Mr. Kim's ต้องใช้คำนาม และสำนวน attention to detail = ความใส่ใจในรายละเอียด ส่วน attentive เป็นคุณศัพท์"},{"q":"Due to ------- demand, the bakery has extended its opening hours on weekends.","opts":["overwhelming","overwhelmed","overflowing","overcoming"],"answer":0,"exp":"overwhelming demand = ความต้องการล้นหลาม ใช้ -ing เพราะความต้องการเป็นสิ่งที่ก่อให้เกิดความรู้สึก ส่วน overwhelmed (-ed) ใช้กับคนที่รู้สึกท่วมท้น"},{"q":"If the shipment had arrived on time, we ------- the display before the store opening.","opts":["would set up","set up","would have set up","had set up"],"answer":2,"exp":"If + past perfect (had arrived) เป็นเงื่อนไขแบบที่ 3 สมมติตรงข้ามกับอดีต ประโยคหลักต้องใช้ would have + V3 คือ would have set up ส่วน would set up ใช้กับเงื่อนไขแบบที่ 2"},{"q":"The board will vote on the proposal after a ------- review of the costs involved.","opts":["thoroughly","thoroughness","more thoroughly","thorough"],"answer":3,"exp":"หลัง a และหน้าคำนาม review ต้องใช้คุณศัพท์ thorough (ละเอียดถี่ถ้วน) ส่วน thoroughly เป็น adverb ขยายคำนามไม่ได้"},{"q":"Customers who are not fully satisfied with their purchase may return it for a full ------- within 30 days.","opts":["receipt","refund","reward","rebate"],"answer":1,"exp":"return it for a full refund = คืนสินค้าเพื่อรับเงินคืนเต็มจำนวน ส่วน rebate หมายถึงส่วนลดคืนบางส่วนหลังซื้อ ไม่ใช้กับ full และการคืนสินค้า"},{"q":"------- the merger with Delmont Industries, Pallas Corp. has become the largest supplier of steel in the region.","opts":["Except for","In spite of","Following","Instead of"],"answer":2,"exp":"Following = หลังจาก ใช้เป็นบุพบทบอกเหตุการณ์ที่เกิดก่อน ทำให้กลายเป็นผู้จัดหาเหล็กรายใหญ่ที่สุด ส่วน In spite of (แม้ว่า) ให้ความหมายขัดแย้งที่ไม่สมเหตุสมผล"},{"q":"Ms. Abara has worked ------- with the design team to finalize the product's packaging.","opts":["closely","close","closed","closing"],"answer":0,"exp":"work closely with = ทำงานอย่างใกล้ชิดกับ ต้องใช้ adverb closely ส่วน close แม้เป็น adverb ได้ แต่หมายถึงใกล้ในเชิงระยะทาง จึงเป็นตัวลวง"}],"p6":[{"kind":"e-mail","head":"To: Gregory Hall <ghall@hallarchitects.com>\nFrom: Lena Ortiz <lortiz@bristowsupplies.com>\nDate: October 6\nSubject: Your recent order","t":"Dear Mr. Hall,\n\nThank you for your order of 40 ergonomic office chairs, placed on October 2. Unfortunately, the model you selected is temporarily out of stock [[1]] unexpectedly high demand this season. We expect to receive a new [[2]] from the manufacturer by October 20.\n\nIn the meantime, we would like to offer you two options. You may wait for the original model, or you may choose the Comfort Plus chair, which is similar in design and price. [[3]]\n\nPlease let me know which option you prefer by replying to this e-mail. We [[4]] your patience and apologize for any inconvenience.\n\nSincerely,\nLena Ortiz\nCustomer Service, Bristow Office Supplies","qs":[{"opts":["in addition to","as long as","because of","in order to"],"answer":2,"exp":"because of + คำนาม (unexpectedly high demand) = เนื่องจาก ใช้บอกสาเหตุที่สินค้าหมด ส่วน as long as เป็นคำสันธานต้องตามด้วยอนุประโยค"},{"opts":["shipment","shipped","shipping","shipper"],"answer":0,"exp":"หลัง a new ต้องใช้คำนามนับได้ shipment (สินค้าที่จัดส่งมาหนึ่งล็อต) ซึ่งรับจากผู้ผลิตได้ ส่วน shipper หมายถึงผู้ส่งสินค้า ไม่เข้ากับความหมาย"},{"opts":["Our store is open from 9 A.M. to 6 P.M. on weekdays.","The chairs were delivered to your office yesterday.","We have recently hired several new sales representatives.","Either way, we will cover the cost of delivery."],"answer":3,"exp":"ประโยค Either way (ไม่ว่าเลือกทางไหน) เชื่อมกับทางเลือกสองทางที่เพิ่งเสนอ ส่วน The chairs were delivered ขัดกับข้อความที่ว่าสินค้าหมด"},{"opts":["appreciated","appreciate","appreciating","to appreciate"],"answer":1,"exp":"ประธาน We ต้องตามด้วยกริยาแท้ และเป็นการขอบคุณในขณะนี้ จึงใช้ present simple คือ appreciate ส่วน appreciating และ to appreciate ไม่ใช่กริยาแท้"}]},{"kind":"memo","head":"To: All Staff\nFrom: Daniel Wu, Facilities Manager\nDate: March 14\nSub
